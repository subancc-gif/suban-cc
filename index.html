    <p className="hint" style={{ marginTop: 16, borderTop: '1px solid var(--line)', paddingTop: 12 }}>
      ☁️ เชื่อมต่อกับ Google Sheets <span className="num">{sheetLabel(rs.remote.url)}</span> ·{' '}
      <button type="button" className="linkbtn small" onClick={rs.disconnect}>ใช้ข้อมูลในเครื่องนี้แทน</button>
    </p>
  );
  const check = async () => {
    const u = url.trim();
    if (!SHEET_URL_RE.test(u)) return setMsg('วาง Web app URL ที่ขึ้นต้นด้วย https://script.google.com/ และลงท้ายด้วย /exec');
    setBusy(true); setMsg('');
    try {
      const r = await callSheet(u, 'ping');
      if (!r.ready) setMsg('ชีตนี้ยังไม่ได้เริ่มใช้งาน ให้ Staff office สร้างบัญชีในเครื่อง แล้วเชื่อมต่อจากหน้า ตั้งค่า → Google Sheets ก่อน');
      else rs.useSheet(u);
    } catch (x) { setMsg(x.message); }
    setBusy(false);
  };
  return (
    <div style={{ marginTop: 16, borderTop: '1px solid var(--line)', paddingTop: 12 }}>
      {!open ? <button type="button" className="linkbtn small" onClick={() => setOpen(true)}>บริษัทใช้ Google Sheets? เชื่อมต่อเครื่องนี้</button> : (
        <div className="stack">
          <label className="field"><span>Web app URL ที่ได้จาก Staff office</span><input id="ss-url" value={url} placeholder="https://script.google.com/macros/s/…/exec" onChange={e => { setMsg(''); setUrl(e.target.value); }} /></label>
          {msg && <p className="hint bad" role="alert">{msg}</p>}
          <div className="actions"><button type="button" className="btn" disabled={busy || !url.trim()} onClick={check}>{busy ? 'กำลังตรวจ…' : 'เชื่อมต่อ'}</button><button type="button" className="btn btn-ghost" onClick={() => setOpen(false)}>ยกเลิก</button></div>
          <p className="hint">หรือเปิดลิงก์สำหรับพนักงานที่ Staff office ส่งให้ แอปจะเชื่อมต่อให้เอง</p>
        </div>
      )}
    </div>
  );
}

function FirstSetup({ onDone }) {
  const { mut } = useApp();
  const [f, setF] = useState({ name: '', user: '', pw: '', pw2: '' });
  const [err, setErr] = useState('');
  const submit = e => {
    e.preventDefault();
    if (!f.name.trim()) return setErr('กรอกชื่อ-สกุล');
    if (!/^[a-z0-9._-]{3,}$/.test(normUser(f.user))) return setErr('ชื่อผู้ใช้ใช้ a-z 0-9 . _ - อย่างน้อย 3 ตัว');
    const p = pwProblem(f.pw, f.pw2); if (p) return setErr(p);
    const u = { id: uid(), name: f.name.trim(), username: normUser(f.user), access: 'office', role: 'owner', staffId: '', active: true, createdAt: new Date().toISOString() };
    setPw(u, f.pw);
    if (mut(d => { d.users = [u]; }, 'สร้างบัญชี Staff office แล้ว')) onDone(u);
  };
  return (
    <AuthShell title="ตั้งค่าผู้ดูแลระบบครั้งแรก" sub="ยังไม่มีผู้ใช้ในระบบ สร้างบัญชี Staff office คนแรกเพื่อเพิ่มพนักงานคนอื่นต่อ">
      <form className="stack" onSubmit={submit}>
        <label className="field"><span>ชื่อ-สกุล</span><input id="fs-name" value={f.name} autoFocus onChange={e => setF({ ...f, name: e.target.value })} /></label>
        <label className="field"><span>ชื่อผู้ใช้ (ภาษาอังกฤษ)</span><input id="fs-user" value={f.user} autoComplete="username" autoCapitalize="none" placeholder="เช่น office" onChange={e => setF({ ...f, user: e.target.value })} /></label>
        <PwInput id="fs-pw" label={`รหัสผ่าน (อย่างน้อย ${MIN_PW} ตัว)`} value={f.pw} autoComplete="new-password" onChange={v => setF({ ...f, pw: v })} />
        <PwInput id="fs-pw2" label="ยืนยันรหัสผ่าน" value={f.pw2} autoComplete="new-password" onChange={v => setF({ ...f, pw2: v })} />
        {err && <p className="hint bad" role="alert">{err}</p>}
        <button className="btn btn-primary" type="submit" style={{ justifyContent: 'center' }}>สร้างบัญชีและเข้าสู่ระบบ</button>
      </form>
      <SheetSwitch />
    </AuthShell>
  );
}

function ChangePassword({ forced, onClose, onLogout }) {
  const { me, ua } = useApp();
  const [f, setF] = useState({ cur: '', pw: '', pw2: '' });
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async e => {
    e.preventDefault();
    const p = pwProblem(f.pw, f.pw2); if (p) return setErr(p);
    if (!forced && !f.cur) return setErr('กรอกรหัสผ่านปัจจุบัน');
    setBusy(true);
    const ok = await ua.changeOwn(f.cur, f.pw, forced);
    setBusy(false);
    if (ok) onClose();
  };
  return (
    <div className="overlay" onClick={forced ? undefined : onClose}>
      <form className="dialog" role="dialog" aria-modal="true" onClick={e => e.stopPropagation()} onSubmit={submit}>
        <h2>{forced ? 'ตั้งรหัสผ่านใหม่ก่อนใช้งาน' : 'เปลี่ยนรหัสผ่าน'}</h2>
        <p className="hint">{forced ? 'รหัสนี้ Staff office ตั้งให้ชั่วคราว ตั้งรหัสของคุณเองที่จำได้ คนอื่นจะไม่เห็นรหัสนี้' : `${me.name} (@${me.username})`}</p>
        {!forced && <PwInput id="cp-cur" label="รหัสผ่านปัจจุบัน" value={f.cur} autoComplete="current-password" autoFocus onChange={v => setF({ ...f, cur: v })} />}
        <PwInput id="cp-pw" label={`รหัสผ่านใหม่ (อย่างน้อย ${MIN_PW} ตัว)`} value={f.pw} autoComplete="new-password" autoFocus={forced} onChange={v => setF({ ...f, pw: v })} />
        <PwInput id="cp-pw2" label="ยืนยันรหัสผ่านใหม่" value={f.pw2} autoComplete="new-password" onChange={v => setF({ ...f, pw2: v })} />
        {err && <p className="hint bad" role="alert">{err}</p>}
        <div className="actions" style={{ justifyContent: 'flex-end' }}>
          {forced ? <button type="button" className="btn btn-ghost" onClick={onLogout}>ออกจากระบบ</button> : <button type="button" className="btn btn-ghost" onClick={onClose}>ยกเลิก</button>}
          <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? 'กำลังบันทึก…' : 'บันทึกรหัสใหม่'}</button>
        </div>
      </form>
    </div>
  );
}

function SyncChip() {
  const { rs } = useApp();
  if (!rs.remote) return null;
  const st = rs.sync.st, n = rs.pendingCount;
  const [icon, label] = st === 'saving' ? ['⏳', 'กำลังบันทึก…'] : st === 'offline' ? ['⚠️', n ? `ออฟไลน์ · รอส่ง ${n}` : 'ออฟไลน์'] : st === 'error' ? ['⚠️', 'ซิงก์ไม่สำเร็จ'] : n ? ['⏳', 'รอส่ง'] : ['☁️', 'บันทึกแล้ว'];
  const tip = rs.sync.msg || `ข้อมูลเก็บใน Google Sheets${rs.lastOk ? ' · ซิงก์ล่าสุด ' + new Date(rs.lastOk).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : ''} · กดเพื่อซิงก์ตอนนี้`;
  return <button className={'btn btn-ghost syncchip ' + st} title={tip} aria-label={`${label} ${tip}`} onClick={rs.syncNow}><span aria-hidden="true">{icon}</span><span className="lbl">{label}</span></button>;
}

function App() {
  // โหมด: remote = ใช้ฐานข้อมูลกลางบน Google Sheets · ไม่มี remote = เก็บในเครื่องนี้อย่างเดียว
  const [remote, setRemoteS] = useState(loadRemote);
  const remoteRef = useRef(remote);
  const setRemote = r => { remoteRef.current = r; setRemoteS(r); saveJSON(REMOTE_KEY, r); };
  const eng = useRef(null);
  if (!eng.current) {
    const c = remote && remote.token ? loadBase(remote) : null;
    eng.current = { base: c ? c.base : null, since: c ? c.since : 0, pending: c && c.pend.length ? [{ changes: c.pend }] : [], busy: false, timer: null, fails: 0, lastOk: 0 };
  }
  const E = eng.current;
  const [s, setS] = useState(() => {
    if (!remote) return load();
    if (!remote.token || !E.base) return skeleton();
    const d = implode(E.base, roleOf(remote.me));
    return E.pending.length ? applyChangesTo(d, E.pending[0].changes) : d;
  });
  const ref = useRef(s);
  const [loaded, setLoaded] = useState(() => !!E.base);
  const [sync, setSync] = useState({ st: 'ok', msg: '' });
  const [usersList, setUsersList] = useState([]);
  const [view, setView] = useState(() => { const h = (location.hash || '').slice(1); return TABS.some(t => t[0] === h) ? h : 'dash'; });
  const [toast, setToast] = useState(null);
  const [dialog, setDialog] = useState(null);
  const [photo, setPhoto] = useState(null);
  const [bellOpen, setBellOpen] = useState(false);
  const [userOpen, setUserOpen] = useState(false);
  const [pwOpen, setPwOpen] = useState(false);
  const [session, setSession] = useState(loadSession);
  const me = remote ? (remote.token ? remote.me : null) : (s.users || []).find(u => u.id === session && u.active !== false) || null;
  const tabs = tabsFor(me);
  const timer = useRef(null);

  const notify = (msg, tone = 'ok') => {
    setToast({ msg, tone });
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setToast(null), tone === 'bad' ? 5000 : 3200);
  };
  const put = d => { ref.current = d; setS(d); };
  const mut = (fn, okMsg) => {
    const d = structuredClone(ref.current);
    const r = fn(d);
    if (typeof r === 'string') { notify(r, 'bad'); return false; }
    put(d);
    if (okMsg) notify(okMsg);
    if (remoteRef.current && remoteRef.current.token) { E.pending.push({ fn }); scheduleFlush(); }
    return true;
  };
  // บทบาทอนุมัติเป็นของเครื่องนี้ ไม่ส่งขึ้นชีต
  const setRole = role => { if (ref.current.role !== role) put({ ...ref.current, role }); };
  const replaceAll = next => mut(d => { const role = d.role; Object.keys(d).forEach(k => { delete d[k]; }); Object.assign(d, structuredClone(next), { role }); });
  const ask = opts => setDialog(opts);

  /* ---------- ซิงก์กับ Google Sheets ---------- */
  // ข้อมูลที่เห็น = ข้อมูลล่าสุดจากชีต + สิ่งที่เครื่องนี้แก้แต่ยังส่งไม่สำเร็จ (ทำซ้ำบนข้อมูลใหม่ แบบ rebase)
  const rebuild = () => {
    let d = implode(E.base, ref.current.role);
    const keep = [];
    for (const p of E.pending) {
      if (p.changes) { d = applyChangesTo(d, p.changes); keep.push(p); continue; }
      const x = structuredClone(d);
      const r = p.fn(x);
      if (typeof r === 'string') { notify('มีคนแก้ข้อมูลเดียวกันก่อน รายการของคุณจึงไม่ถูกบันทึก: ' + r, 'bad'); continue; }
      d = x; keep.push(p);
    }
    E.pending = keep;
    put(d);
  };
  const resetEngine = () => { clearTimeout(E.timer); Object.assign(E, { base: null, since: 0, pending: [], fails: 0 }); clearRemoteCache(); };
  const dropSession = msg => {
    const r = remoteRef.current;
    resetEngine(); setLoaded(false); setUsersList([]);
    if (r) setRemote({ url: r.url });
    put(skeleton()); setPwOpen(false); setUserOpen(false); setBellOpen(false);
    if (msg) notify(msg, 'bad');
  };
  // Staff office แก้สิทธิ์หรือชื่อผู้เบิกของบัญชีนี้ → ข้อมูลที่เห็นต้องเปลี่ยนตาม โหลดใหม่ทั้งหมด
  const takeMe = fresh => {
    const r = remoteRef.current;
    if (!fresh || !r || !r.me || JSON.stringify(fresh) === JSON.stringify(r.me)) return false;
    const scope = fresh.access !== r.me.access || fresh.staffId !== r.me.staffId;
    setRemote({ ...r, me: fresh });
    setRole(roleOf(fresh));
    if (scope) { E.base = null; E.since = 0; clearRemoteCache(); }
    return scope;
  };
  const syncFail = (err, retry) => {
    if (err.code === 'auth') { dropSession(err.message); return false; }
    if (err.code === 'offline' || err.code === 'busy' || err.code === 'server' || err.code === 'bad_url') {
      E.fails++;
      setSync({ st: 'offline', msg: err.message });
      clearTimeout(E.timer);
      E.timer = setTimeout(retry, Math.min(60000, 3000 * 2 ** Math.min(E.fails, 5)));
      return false;
    }
    notify(err.message, 'bad');
    setSync({ st: 'error', msg: err.message });
    return true;
  };
  const flush = async (round = 0) => {
    const r = remoteRef.current;
    if (!r || !r.token || E.busy) return;
    if (!E.base) return pull(true);
    const changes = diffRecs(E.base, explode(ref.current));
    if (!changes.length) { E.pending = []; saveJSON(RPEND_KEY, null); setSync({ st: 'ok', msg: '' }); return; }
    const n = E.pending.length;
    E.busy = true; setSync({ st: 'saving', msg: '' });
    let again = false;
    try {
      const res = await callSheet(r.url, 'push', { token: r.token, since: E.since, changes });
      if (res.conflict) {
        applyRecs(E.base, res.recs); E.since = res.rev;
        rebuild();
        again = round < 4;
        if (!again) setSync({ st: 'error', msg: 'มีคนแก้ข้อมูลพร้อมกันหลายครั้ง กดซิงก์อีกครั้ง' });
      } else {
        applyRecs(applyRecs(E.base, changes), res.recs); E.since = res.rev; E.fails = 0; E.lastOk = Date.now();
        E.pending = E.pending.slice(n);
        saveBase(r, E);
        rebuild();
        if (takeMe(res.me)) again = true;
        setSync({ st: 'ok', msg: '' });
        if (E.pending.length) again = true;
      }
    } catch (err) {
      // ข้อมูลที่ส่งไม่ผ่านกติกา (เช่น สิทธิ์ไม่พอ) → ทิ้งรายการที่ค้าง กลับไปใช้ข้อมูลในชีต
      if (syncFail(err, () => flush())) { E.pending = []; saveJSON(RPEND_KEY, null); if (E.base) rebuild(); }
    } finally { E.busy = false; }
    if (again) flush(round + 1);
  };
  const pull = async full => {
    const r = remoteRef.current;
    if (!r || !r.token || E.busy) return;
    if (!full && E.base && E.pending.length) return flush();
    E.busy = true;
    let again = false;
    try {
      const res = await callSheet(r.url, 'pull', { token: r.token, since: full || !E.base ? 0 : E.since });
      if (takeMe(res.me) && !full) again = true;
      else {
        if (full || !E.base) E.base = new Map();
        applyRecs(E.base, res.recs);
        E.since = res.rev; E.fails = 0; E.lastOk = Date.now();
        if (full || res.recs.length) { saveBase(r, E); rebuild(); }
        setLoaded(true); setSync({ st: 'ok', msg: '' });
        if (E.pending.length) again = true;
      }
    } catch (err) { syncFail(err, () => pull(full)); }
    finally { E.busy = false; }
    if (again) E.base ? flush() : pull(true);
  };
  const scheduleFlush = (ms = 700) => { clearTimeout(E.timer); E.timer = setTimeout(() => flush(), ms); };
  const syncNow = () => { E.fails = 0; E.pending.length ? flush() : pull(false); };

  useEffect(() => {
    if (!remote || !remote.token) return;
    pull(!E.base);
    const tick = () => { if (document.visibilityState === 'visible' && !E.busy) syncNow(); };
    const iv = setInterval(tick, 20000);
    const unload = e => { if (E.pending.length || E.busy) { e.preventDefault(); e.returnValue = ''; } };
    document.addEventListener('visibilitychange', tick);
    window.addEventListener('online', tick);
    window.addEventListener('beforeunload', unload);
    return () => { clearInterval(iv); document.removeEventListener('visibilitychange', tick); window.removeEventListener('online', tick); window.removeEventListener('beforeunload', unload); };
  }, [remote && remote.url, remote && remote.token]);

  const warned = useRef(false);
  useEffect(() => {
    const r = remoteRef.current;
    if (r) { if (r.token && E.base) saveJSON(RPEND_KEY, E.pending.length ? diffRecs(E.base, explode(s)) : null); return; }
    try { localStorage.setItem(KEY, JSON.stringify(s)); warned.current = false; }
    catch (e) {
      if (warned.current) return;
      warned.current = true;
      notify(e && e.name === 'QuotaExceededError'
        ? 'พื้นที่เก็บข้อมูลในเครื่องเต็ม สำรองข้อมูลเป็นไฟล์ แล้วลบบิลเก่าที่มีรูป'
        : 'เบราว์เซอร์นี้ไม่ให้บันทึกข้อมูล ข้อมูลจะหายเมื่อปิดหน้า ใช้ปุ่มสำรองเป็นไฟล์ที่หน้าตั้งค่า', 'bad');
    }
  }, [s]);
  useEffect(() => { try { history.replaceState(null, '', '#' + view); } catch (e) {} window.scrollTo(0, 0); }, [view]);
  useEffect(() => {
    if (!bellOpen && !userOpen) return;
    const close = e => { if (!e.target.closest('.bellwrap')) { setBellOpen(false); setUserOpen(false); } };
    document.addEventListener('click', close);
    return () => document.removeEventListener('click', close);
  }, [bellOpen, userOpen]);
  // บังคับให้หน้าและบทบาทตรงกับสิทธิ์ของผู้ที่เข้าระบบอยู่
  useEffect(() => { if (me && !tabs.some(t => t[0] === view)) setView(tabs[0][0]); }, [me && me.id, me && me.access, view]);
  useEffect(() => {
    if (!me) return;
    if (!isOffice(me) && s.role !== 'staff') setRole('staff');
    if (isOffice(me) && s.role === 'staff') setRole(me.role || 'owner');
  }, [me && me.id, me && me.access, s.role]);

  const afterLogin = u => {
    const t = tabsFor(u); if (!t.some(x => x[0] === view)) setView(t[0][0]);
    if (u.mustChange) setPwOpen(true);
  };
  const login = u => {
    mut(d => { d.role = roleOf(u); const x = d.users.find(y => y.id === u.id); if (x) x.lastLogin = new Date().toISOString(); });
    saveSession(u.id); setSession(u.id);
    afterLogin(u);
  };
  const loginRemote = async (username, password) => {
    const r = remoteRef.current;
    const res = await callSheet(r.url, 'login', { username, password });
    resetEngine();
    put({ ...skeleton(), role: roleOf(res.me) });
    setLoaded(false);
    setRemote({ url: r.url, token: res.token, me: res.me });
    afterLogin(res.me);
  };
  const logout = () => {
    setUserOpen(false); setBellOpen(false); setPwOpen(false);
    const r = remoteRef.current;
    if (!r) { saveSession(''); setSession(''); return; }
    const go = () => { callSheet(r.url, 'logout', { token: r.token }).catch(() => {}); dropSession(); };
    if (E.pending.length) ask({ title: 'ยังมีรายการที่ยังไม่ได้ส่งขึ้น Google Sheets', body: 'ออกจากระบบตอนนี้ รายการที่ยังไม่ได้ส่งจะหายไป รอให้ขึ้น "บันทึกแล้ว" ก่อนดีกว่า', ok: 'ออกจากระบบเลย', danger: true, onOk: go });
    else go();
  };

  /* ---------- สลับโหมด ---------- */
  // เชื่อมต่อครั้งแรก: ส่งบัญชีผู้ใช้และข้อมูลในเครื่องนี้ (หรือเริ่มจากข้อมูลว่าง) ขึ้นชีต
  const connectSheet = async (url, code, upload) => {
    const src = upload ? ref.current : skeleton();
    const changes = diffRecs(new Map(), explode(src));
    const users = (ref.current.users || []).map(u => ({ ...u, staffName: u.staffId ? staffName(ref.current, u.staffId) : '' }));
    const res = await callSheet(url, 'bootstrap', { code, users, meId: me && me.id, changes });
    resetEngine();
    E.base = applyRecs(new Map(), changes); E.since = res.rev; E.lastOk = Date.now();
    const r = { url, token: res.token, me: res.me };
    setRemote(r); saveBase(r, E);
    put(implode(E.base, roleOf(res.me)));
    setLoaded(true);
  };
  const useSheet = url => { resetEngine(); setLoaded(false); setRemote({ url }); put(skeleton()); };
  const disconnect = () => {
    const r = remoteRef.current;
    if (r && r.token) callSheet(r.url, 'logout', { token: r.token }).catch(() => {});
    resetEngine(); setRemote(null); setUsersList([]); setLoaded(true);
    put(load());
  };

  /* ---------- จัดการผู้ใช้ (ในเครื่อง หรือผ่าน Google Sheets) ---------- */
  const remoteOp = async (op, body, okMsg) => {
    const r = remoteRef.current;
    try {
      const res = await callSheet(r.url, op, { token: r.token, ...body });
      if (res.users) setUsersList(res.users);
      // เปลี่ยนรหัสแล้ว token เก่าใช้ไม่ได้ เซิร์ฟเวอร์ส่ง token ใหม่ของเครื่องนี้มาให้
      if (res.token) setRemote({ ...remoteRef.current, token: res.token });
      if (res.me) takeMe(res.me);
      if (okMsg) notify(okMsg);
      return true;
    } catch (err) {
      if (err.code === 'auth') dropSession(err.message); else notify(err.message, 'bad');
      return false;
    }
  };
  const localUserEdit = (id, fn, msg) => mut(d => {
    const u = d.users.find(x => x.id === id);
    if (!u) return 'ไม่พบผู้ใช้นี้';
    const r = fn(u, d);
    if (typeof r === 'string') return r;
    if (id === me.id && (!isOffice(u) || u.active === false)) return 'ลดสิทธิ์หรือระงับบัญชีของตัวเองไม่ได้ ให้ Staff office คนอื่นทำแทน';
    if (!activeOffice(d).length) return 'ต้องมี Staff office ที่ใช้งานได้อย่างน้อย 1 คน';
  }, msg);
  const ua = remote ? {
    list: usersList,
    refresh: () => remoteOp('users', {}),
    add: async (f, okMsg) => {
      let staffId = f.access === 'field' ? f.staffId : '';
      if (f.access === 'field' && f.staffId === 'new') {
        if (ref.current.staff.some(x => x.name === f.name.trim())) { notify(`มีชื่อ ${f.name.trim()} ในรายชื่อผู้เบิกแล้ว เลือกผูกกับชื่อเดิมแทน`, 'bad'); return false; }
        if (!f.name.trim()) { notify('กรอกชื่อ-สกุล', 'bad'); return false; }
        staffId = uid();
        mut(d => { d.staff.push({ id: staffId, name: f.name.trim(), position: f.position.trim() }); });
      }
      return remoteOp('userAdd', { user: { name: f.name, username: f.username, password: f.pw, access: f.access, role: f.role, staffId, staffName: staffId ? staffName(ref.current, staffId) : '', mustChange: f.mustChange } }, okMsg);
    },
    update: (id, patch, okMsg) => remoteOp('userUpdate', { id, patch: 'staffId' in patch ? { ...patch, staffName: patch.staffId ? staffName(ref.current, patch.staffId) : '' } : patch }, okMsg),
    setPw: (id, pw, must) => remoteOp('userPw', { id, password: pw, mustChange: must }, 'ตั้งรหัสผ่านใหม่แล้ว'),
    remove: u => remoteOp('userRemove', { id: u.id }, `ลบผู้ใช้ ${u.name} แล้ว`),
    changeOwn: (cur, pw) => remoteOp('changePw', { current: cur, password: pw }, 'เปลี่ยนรหัสผ่านแล้ว'),
  } : {
    list: s.users || [],
    refresh: async () => true,
    add: async (f, okMsg) => mut(d => {
      const name = f.name.trim(), username = normUser(f.username);
      if (!name) return 'กรอกชื่อ-สกุล';
      if (!/^[a-z0-9._-]{3,}$/.test(username)) return 'ชื่อผู้ใช้ใช้ a-z 0-9 . _ - อย่างน้อย 3 ตัว';
      if ((d.users || []).some(u => u.username === username)) return 'ชื่อผู้ใช้นี้มีแล้ว';
      const p = pwProblem(f.pw); if (p) return p;
      let staffId = '';
      if (f.access === 'field') {
        if (f.staffId === 'new') {
          if (d.staff.some(x => x.name === name)) return `มีชื่อ ${name} ในรายชื่อผู้เบิกแล้ว เลือกผูกกับชื่อเดิมแทน`;
          staffId = uid(); d.staff.push({ id: staffId, name, position: f.position.trim() });
        } else {
          if (!f.staffId) return 'เลือกชื่อผู้เบิกที่จะผูกกับบัญชีนี้';
          if (d.users.some(u => u.staffId === f.staffId)) return 'ชื่อผู้เบิกนี้ผูกกับบัญชีอื่นแล้ว';
          staffId = f.staffId;
        }
      }
      const u = { id: uid(), name, username, access: f.access, role: f.access === 'office' ? f.role : '', staffId, active: true, mustChange: !!f.mustChange, createdAt: new Date().toISOString(), createdBy: me.id };
      setPw(u, f.pw);
      d.users.push(u);
    }, okMsg),
    update: async (id, patch, okMsg) => localUserEdit(id, (x, d) => {
      if (patch.staffId && d.users.some(y => y.id !== id && y.staffId === patch.staffId)) return 'ชื่อผู้เบิกนี้ผูกกับบัญชีอื่นแล้ว';
      Object.assign(x, patch);
      if (isOffice(x) && !x.role) x.role = 'owner';
    }, okMsg),
    setPw: async (id, pw, must) => localUserEdit(id, x => { const p = pwProblem(pw); if (p) return p; setPw(x, pw); x.mustChange = !!must; }, 'ตั้งรหัสผ่านใหม่แล้ว'),
    remove: async u => mut(d => {
      if (u.id === me.id) return 'ลบบัญชีของตัวเองไม่ได้';
      d.users = d.users.filter(x => x.id !== u.id);
      if (!activeOffice(d).length) return 'ต้องมี Staff office ที่ใช้งานได้อย่างน้อย 1 คน';
    }, `ลบผู้ใช้ ${u.name} แล้ว`),
    changeOwn: async (cur, pw, forced) => {
      if (!forced && !checkPw(me, cur)) { notify('รหัสผ่านปัจจุบันไม่ถูกต้อง', 'bad'); return false; }
      if (checkPw(me, pw)) { notify('รหัสใหม่ต้องไม่ซ้ำกับรหัสเดิม', 'bad'); return false; }
      return mut(d => { const u = d.users.find(x => x.id === me.id); setPw(u, pw); u.mustChange = false; u.pwChangedAt = new Date().toISOString(); }, 'เปลี่ยนรหัสผ่านแล้ว');
    },
  };
  const rs = { remote, sync, loaded, since: E.since, pendingCount: E.pending.length, lastOk: E.lastOk, syncNow, connectSheet, useSheet, disconnect };

  const toastEl = toast && <div className={'toast ' + (toast.tone === 'bad' ? 'bad' : '')} role="status" aria-live="polite">{toast.msg}</div>;
  const bare = { s, me, mut, notify, ask, ua, rs };
  if (!remote && (!s.users || !s.users.length)) return <Ctx.Provider value={bare}><FirstSetup onDone={login} />{toastEl}</Ctx.Provider>;
  if (!me) return <Ctx.Provider value={bare}><LoginScreen onLogin={login} onRemoteLogin={loginRemote} />{toastEl}</Ctx.Provider>;
  if (remote && !loaded) return <Ctx.Provider value={bare}>
    <AuthShell title="กำลังโหลดข้อมูลจาก Google Sheets…" sub={sync.st === 'offline' ? `${sync.msg} · จะลองใหม่อัตโนมัติ` : 'ครั้งแรกอาจใช้เวลาสักครู่ถ้ามีรูปใบเสร็จเยอะ'}>
      <div className="actions"><button className="btn" onClick={() => pull(true)}>ลองอีกครั้ง</button><button className="btn btn-ghost" onClick={logout}>ออกจากระบบ</button></div>
    </AuthShell>{toastEl}</Ctx.Provider>;

  const myBill = n => { const b = s.bills.find(x => x.id === n.billId); return !b || b.staffId === me.staffId; };
  const myNotes = s.notes.filter(n => n.to === s.role && (isOffice(me) || myBill(n))).slice().reverse();
  const unread = myNotes.filter(n => !n.read).length;
  const counts = { cash: s.bills.filter(b => canApprove(s, b)).length, stock: s.items.filter(i => stockStatus(i) !== 'ok').length };

  return (
    <Ctx.Provider value={{ s, me, mut, notify, ask, replaceAll, ua, rs, showPhoto: setPhoto, go: k => setView(tabs.some(t => t[0] === k) ? k : tabs[0][0]) }}>
      <header className="top">
        <div className="top-in">
          <div className="brand">
            <div className="logo" aria-hidden="true">S</div>
            <div><b>SUBAN CC</b><small>ระบบบริหารหน้างาน</small></div>
          </div>
          <nav className="tabs" aria-label="เมนูหลัก">
            {tabs.map(([k, label]) => (
              <button key={k} className="tab" aria-current={view === k ? 'page' : undefined} onClick={() => setView(k)}>
                {label}{counts[k] ? <span className="count">{counts[k]}</span> : null}
              </button>
            ))}
          </nav>
          <SyncChip />
          <div className="bellwrap">
            <button className="btn btn-ghost iconbtn bell" aria-label={`แจ้งเตือน ${unread} รายการใหม่`} aria-expanded={bellOpen} onClick={() => { setUserOpen(false); setBellOpen(o => !o); }}>
              <BellIcon />{unread > 0 && <span className="dotcount">{unread}</span>}
            </button>
            {bellOpen && (
              <div className="notif" role="dialog" aria-label="แจ้งเตือน">
                <div className="row between" style={{ padding: '12px 14px 8px' }}>
                  <b>แจ้งเตือนของ{ROLES[s.role]}</b>
                  {unread > 0 && <button className="linkbtn small" onClick={() => mut(d => { d.notes.forEach(n => { if (n.to === d.role) n.read = true; }); })}>อ่านทั้งหมด</button>}
                </div>
                {myNotes.length === 0 ? <p className="empty">ยังไม่มีแจ้งเตือน</p> : (
                  <ul>{myNotes.slice(0, 20).map(n => (
                    <li key={n.id}>
                      <button className={n.read ? '' : 'unread'} onClick={() => { mut(d => { const x = d.notes.find(y => y.id === n.id); if (x) x.read = true; }); setBellOpen(false); setView('cash'); }}>
                        <span>{n.text}</span>
                        <small>{new Date(n.at).toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</small>
                      </button>
                    </li>
                  ))}</ul>
                )}
              </div>
            )}
          </div>
          <div className="bellwrap">
            <button className="btn btn-ghost userbtn" aria-label={`ผู้ใช้ ${me.name}`} aria-expanded={userOpen} onClick={() => { setBellOpen(false); setUserOpen(o => !o); }}>
              <span className="avatar-s" aria-hidden="true">{me.name.trim().slice(0, 1)}</span>
              <span className="uname">{me.name}<small>{isOffice(me) ? ROLE_SHORT[s.role] : ACCESS.field}</small></span>
            </button>
            {userOpen && (
              <div className="notif usermenu" role="dialog" aria-label="บัญชีผู้ใช้">
                <div style={{ padding: '14px 14px 10px' }}>
                  <b>{me.name}</b>
                  <p className="hint">@{me.username} · <span className={'pill plain ' + (isOffice(me) ? 'gold' : '')}>{ACCESS[me.access]}</span></p>
                  <p className="hint" style={{ marginTop: 4 }}>{ACCESS_HINT[me.access]}{!isOffice(me) && me.staffId ? ` · ผู้เบิก: ${staffName(s, me.staffId)}` : ''}</p>
                  {isOffice(me) && <label className="field" style={{ marginTop: 10 }}><span>บทบาทอนุมัติขณะนี้</span>
                    <select id="role" value={s.role} onChange={e => setRole(e.target.value)}>
                      {OFFICE_ROLES.map(k => <option key={k} value={k}>{ROLES[k]}</option>)}
                    </select></label>}
                </div>
                <ul>
                  <li><button onClick={() => { setUserOpen(false); setPwOpen(true); }}><span>🔑 เปลี่ยนรหัสผ่าน</span></button></li>
                  {isOffice(me) && <li><button onClick={() => { setUserOpen(false); setView('setup'); setTimeout(() => { const el = document.getElementById('users'); el && el.scrollIntoView({ behavior: 'smooth' }); }, 60); }}><span>👥 จัดการผู้ใช้และสิทธิ์</span></button></li>}
                  <li><button onClick={logout}><span>🚪 ออกจากระบบ</span></button></li>
                </ul>
              </div>
            )}
          </div>
        </div>
      </header>
      {(pwOpen || me.mustChange) && <ChangePassword forced={!!me.mustChange} onClose={() => setPwOpen(false)} onLogout={logout} />}
      <main className="wrap" key={me.id}>
        {!tabs.some(t => t[0] === view) ? null : <>
        {view === 'dash' && <Dashboard />}
        {view === 'secretary' && <SecretaryView />}
        {view === 'cash' && <CashView />}
        {view === 'labor' && <LaborView />}
        {view === 'stock' && <StockView />}
        {view === 'journal' && <JournalView />}
        {view === 'setup' && <SetupView />}
        </>}
      </main>
      {toast && <div className={'toast ' + (toast.tone === 'bad' ? 'bad' : '')} role="status" aria-live="polite">{toast.msg}</div>}
      {dialog && (
        <div className="overlay" onClick={() => setDialog(null)}>
          <div className="dialog" role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>
            <h2>{dialog.title}</h2>
            {dialog.body && <div className="muted">{dialog.body}</div>}
            <div className="actions" style={{ justifyContent: 'flex-end' }}>
              <button className="btn btn-ghost" onClick={() => setDialog(null)}>ยกเลิก</button>
              {(dialog.options || [{ label: dialog.ok || 'ยืนยัน', onOk: dialog.onOk, danger: dialog.danger }]).map((o, i) => (
                <button key={i} className={'btn ' + (o.danger ? 'btn-bad' : 'btn-primary')} onClick={() => { setDialog(null); o.onOk(); }}>{o.label}</button>
              ))}
            </div>
          </div>
        </div>
      )}
      {photo && (
        <div className="overlay" onClick={() => setPhoto(null)}>
          <img className="photo" src={photo} alt="รูปเอกสาร" />
        </div>
      )}
    </Ctx.Provider>
  );
}

function WeekPicker({ week, setWeek }) {
  const now = weekOf(todayISO());
  return (
    <div className="week" role="group" aria-label="เลือกสัปดาห์">
      <button className="btn btn-ghost iconbtn" aria-label="สัปดาห์ก่อน" onClick={() => setWeek(addDays(week, -7))}>‹</button>
      <span className="lbl num">{weekLabel(week)}</span>
      <button className="btn btn-ghost iconbtn" aria-label="สัปดาห์ถัดไป" onClick={() => setWeek(addDays(week, 7))}>›</button>
      {week !== now && <button className="btn btn-sm btn-ghost" onClick={() => setWeek(now)}>สัปดาห์นี้</button>}
    </div>
  );
}

/* ---------- แดชบอร์ด ---------- */
function Dashboard() {
  const { s, go } = useApp();
  const costs = useMemo(() => projectCosts(s), [s]);
  const rows = s.projects.map(p => {
    const c = costs[p.id];
    const inSys = c.expense + c.labor + c.material;
    const total = (+p.openingCost || 0) + inSys;
    return { p, ...c, inSys, total, used: p.budget ? total / p.budget : 0 };
  });
  const act = rows.filter(r => r.p.status === 'active');
  const E = sum(act, r => r.expense), Lb = sum(act, r => r.labor), Mt = sum(act, r => r.material), All = E + Lb + Mt;

  const T = todayISO(), now = weekOf(T);
  const pending = s.bills.filter(b => b.status === 'pending');
  const mine = pending.filter(b => canApprove(s, b));
  const toPay = s.bills.filter(b => b.status === 'approved' && b.claimType === 'reimburse');
  const low = s.items.filter(i => stockStatus(i) !== 'ok').sort((a, b) => a.qty / a.min - b.qty / b.min);
  const bigBal = s.staff.map(st => ({ st, bal: staffBalance(s, st.id) })).filter(x => Math.abs(x.bal) >= 10000);
  const underMin = s.workers.filter(w => { const r = rateFor(s, w.id, T); return r != null && r < s.settings.minWage; });
  const openLabor = [...new Set(s.time.map(e => weekOf(e.date)))].filter(w => w < now && !s.laborWeeks.includes(w)).sort();
  const openCash = s.staff.flatMap(st => {
    const ws = new Set([...s.cash.filter(c => c.staffId === st.id).map(c => weekOf(c.date)), ...s.bills.filter(b => b.staffId === st.id && b.claimType === 'advance').map(b => b.weekStart)]);
    return [...ws].filter(w => w < now && !cashClosed(s, st.id, w)).map(w => ({ st, w }));
  });
  const cashOf = bs => baht(sum(bs, b => billTotals(s, b).cash));

  const todos = [];
  if (mine.length) todos.push({ sev: 'warn', title: `บิลรอคุณอนุมัติ ${mine.length} ใบ รวม ${cashOf(mine)}`, text: `ในบทบาท${ROLES[s.role]} · ทั้งระบบรออนุมัติ ${pending.length} ใบ`, to: 'cash' });
  else if (pending.length) todos.push({ sev: 'warn', title: `บิลรออนุมัติ ${pending.length} ใบ รวม ${cashOf(pending)}`, text: 'อยู่ในขั้นของผู้อนุมัติคนอื่น', to: 'cash' });
  if (toPay.length) todos.push({ sev: 'warn', title: `รอจ่ายเงินคืนพนักงาน ${toPay.length} รายการ รวม ${cashOf(toPay)}`, text: 'อนุมัติแล้ว ฝ่ายบัญชีบันทึกการโอนหรือจ่ายเงินสด', to: 'cash' });
  openCash.forEach(({ st, w }) => todos.push({ sev: 'warn', title: `ยังไม่ปิดสัปดาห์เงินทดรองของ ${st.name}`, text: weekLabel(w), to: 'cash' }));
  openLabor.forEach(w => todos.push({ sev: 'warn', title: 'ยังไม่ปิดงวดค่าแรง', text: `สัปดาห์ ${weekLabel(w)} ยอดยังเปลี่ยนได้ถ้าแก้เรท`, to: 'labor' }));
  low.forEach(i => todos.push({ sev: stockStatus(i), title: `${i.name} เหลือ ${num(i.qty)} ${i.unit}`, text: `จุดสั่งซื้อ ${num(i.min)} ${i.unit}`, to: 'stock' }));
  bigBal.forEach(({ st, bal }) => todos.push({ sev: 'warn', title: `${st.name} ${bal > 0 ? 'ถือเงินทดรอง' : 'รอบริษัทจ่ายคืน'} ${baht(Math.abs(bal))}`, text: 'ยอดคงค้างตั้งแต่ 10,000 บาท', to: 'cash' }));
  underMin.forEach(w => todos.push({ sev: 'bad', title: `เรทของ ${w.name} ต่ำกว่าค่าแรงขั้นต่ำ`, text: `${baht(rateFor(s, w.id, T))}/วัน · ขั้นต่ำที่ตั้งไว้ ${baht(s.settings.minWage)}`, to: 'setup' }));

  const sevColor = { ok: 'var(--ok)', warn: 'var(--warn)', bad: 'var(--bad)' };
  const meterColor = u => u > 1 ? 'var(--bad)' : u > 0.85 ? 'var(--warn)' : 'var(--ok)';
  const parts = [['ค่าใช้จ่ายตรง', E, 'var(--c-exp)'], ['ค่าแรงช่าง', Lb, 'var(--c-lab)'], ['วัสดุที่เบิกใช้', Mt, 'var(--c-mat)']];

  return (<>
    <div className="pagehead">
      <div>
        <h1>ต้นทุนโครงการ</h1>
        <p className="sub">ข้อมูล ณ {thDate(T)} · โครงการที่ดำเนินการ {act.length} โครงการ</p>
      </div>
      <div className="actions">
        <button className="btn btn-sm" onClick={() => exportToExcel(rows.map(r => ({ โครงการ: r.p.code, ชื่อ: r.p.name, ยอดประมาณ: r.p.budget, ใช้ไปแล้ว: r.total, เหลือ: r.p.budget - r.total })), 'Dashboard')}>📥 Excel</button>
        <button className="btn btn-sm" onClick={() => { const el = document.querySelector('.kpis'); el && exportToPDF(el, 'Dashboard'); }}>📄 PDF</button>
      </div>
    </div>
    <section className="kpis" aria-label="สรุปต้นทุนที่บันทึกในระบบ">
      <div className="kpi total">
        <span className="label">ต้นทุนที่บันทึกในระบบ</span>
        <span className="value">฿{num(All, 0)}</span>
        <div className="stackbar" aria-hidden="true">{parts.map(([l, v, c]) => <i key={l} style={{ width: (All ? v / All * 100 : 0) + '%', background: c }} />)}</div>
      </div>
      {parts.map(([l, v, c]) => (
        <div className="kpi" key={l}>
          <span className="label"><span className="dot" style={{ background: c }} />{l}</span>
          <span className="value">฿{num(v, 0)}</span>
          <span className="hint">{All ? Math.round(v / All * 100) : 0}% ของต้นทุนในระบบ</span>
        </div>
      ))}
    </section>
    <p className="hint">วัสดุนับเป็นต้นทุนตอนเบิกออกไปใช้เท่านั้น บิลที่ซื้อเข้าสต๊อกจึงไม่ถูกนับซ้ำในค่าใช้จ่ายตรง</p>

    <div className="cols">
      <section className="panel">
        <div className="panel-head"><h2>ต้นทุนเทียบงบรายโครงการ</h2><span className="hint">ยกมา = ต้นทุนก่อนเริ่มใช้ระบบ</span></div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr><th>โครงการ</th><th className="r">งบประมาณ</th><th className="r">ยกมา</th><th className="r">ค่าใช้จ่าย</th><th className="r">ค่าแรง</th><th className="r">วัสดุ</th><th className="r">รวม</th><th>ใช้งบ</th></tr></thead>
            <tbody>
              {rows.map(r => (
                <tr key={r.p.id}>
                  <td style={{ minWidth: 190 }}><b>{r.p.code}</b> {r.p.status === 'closed' && <span className="pill plain">ปิดงาน</span>}<span className="sub">{r.p.name}</span></td>
                  <td className="r num">{num(r.p.budget, 0)}</td>
                  <td className="r num muted">{num(r.p.openingCost, 0)}</td>
                  <td className="r num">{num(r.expense, 0)}</td>
                  <td className="r num">{num(r.labor, 0)}</td>
                  <td className="r num">{num(r.material, 0)}</td>
                  <td className="r num"><b>{num(r.total, 0)}</b></td>
                  <td style={{ minWidth: 120 }}>
                    <div className="row" style={{ flexWrap: 'nowrap' }}>
                      <div className="meter" style={{ flex: 1 }}><i style={{ width: Math.min(100, r.used * 100) + '%', background: meterColor(r.used) }} /></div>
                      <span className="num small" style={{ color: meterColor(r.used), fontWeight: 600 }}>{Math.round(r.used * 100)}%</span>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>
      <section className="panel">
        <div className="panel-head"><h2>ต้องดำเนินการ</h2><span className="pill gold plain">{todos.length} เรื่อง</span></div>
        {todos.length === 0 ? <p className="empty">ไม่มีงานค้าง</p> : (
          <ul className="todo">
            {todos.map((t, i) => (
              <li key={i}>
                <span className="sev" style={{ background: sevColor[t.sev] }} />
                <div className="body"><b>{t.title}</b><span>{t.text}</span></div>
                <button className="btn btn-sm" onClick={() => go(t.to)}>ไปดู</button>
              </li>
            ))}
          </ul>
        )}
      </section>
    </div>
  </>);
}

/* ---------- เบิก & เคลียร์บิล ---------- */
const CASH_KIND = { fuel: 'ค่าน้ำมัน', material: 'ค่าวัสดุ', other: 'อื่นๆ' };
const CASH_LABEL = { ...CASH_KIND, advance: 'จ่ายเงินทดรอง', return: 'พนักงานคืนเงิน', reimburse: 'บริษัทจ่ายคืน' };
function billState(b) {
  if (b.status === 'pending') return ['warn', `รอ${ROLE_SHORT[nextStep(b)]}อนุมัติ`];
  if (b.status === 'rejected') return ['bad', 'ตีกลับ'];
  if (b.status === 'paid') return ['ok', 'จ่ายเงินแล้ว'];
  return b.claimType === 'reimburse' ? ['gold', 'รอจ่ายเงิน'] : ['ok', 'เคลียร์แล้ว'];
}
const ORDER = { pending: 0, rejected: 1, approved: 2, paid: 3 };
/* หมวดค่าใช้จ่ายของบิล: หมวดตามผังบัญชี + ซื้อเข้าสต๊อก */
const BILL_CATS = [...CATS.map(c => ({ key: c.key, label: c.label })), { key: 'stock', label: 'ซื้อเข้าสต๊อก' }];
const BILL_CAT_ICON = { mat: '🧱', fuel: '⛽', freight: '🚚', tools: '🔧', ent: '🤝', meal: '🍱', travel: '🚗', util: '💡', misc: '📦', stock: '🏬' };
const lineCat = l => l.kind === 'stock' ? 'stock' : (CAT[l.cat] ? l.cat : 'misc');
const billHasCat = (b, k) => b.lines.some(l => lineCat(l) === k);

/* ---------- ตรวจบิลซ้ำ (กติกาเดียวกับ dupCheck ใน AppSync.gs) ---------- */
const normVendor = x => String(x || '').toLowerCase().replace(/[\s\-_.()"'“”]/g, '').replace(/^(ร้าน|บริษัท|บจก|หจก)/, '');
const billGross = b => r2(sum(b.lines, l => l.amount) + (+b.vat || 0));
function findDupBills(s, x) {
  return s.bills.filter(b => b.id !== x.id && b.status !== 'rejected').map(b => {
    const why = [];
    if ((x.photoHashes || []).some(h => h && (b.photoHashes || []).includes(h))) why.push('รูปใบเสร็จเดียวกัน');
    if (x.taxId && x.receiptNo && b.taxId === x.taxId && normVendor(b.receiptNo) === normVendor(x.receiptNo)) why.push('เลขผู้เสียภาษีและเลขที่ใบเสร็จเดียวกัน');
    else if (x.date && b.date === x.date && normVendor(b.vendor) && normVendor(b.vendor) === normVendor(x.vendor) && Math.abs(billGross(b) - (+x.total || 0)) <= 1) why.push('ร้าน วันที่ และยอดเดียวกัน');
    return why.length ? { id: b.id, no: b.no, why: why.join(' · '), staffId: b.staffId } : null;
  }).filter(Boolean).slice(0, 5);
}
const billDupKey = b => ({ id: b.id, taxId: b.taxId, receiptNo: b.receiptNo, vendor: b.vendor, date: b.date, total: billGross(b), photoHashes: b.photoHashes });

/* ---------- จับคู่ใบเบิกสำรองจ่าย (ADV) กับบิลที่นำมาเคลียร์ ---------- */
// หมวดของบิลที่ถือว่าตรงกับประเภทใบเบิก (อื่นๆ = ตรงได้ทุกหมวด)
const ADV_CATS = { fuel: ['fuel'], material: ['mat', 'stock', 'tools'] };
function advances(s, staffId) {
  return s.cash.filter(c => isAdvance(c) && (!staffId || c.staffId === staffId)).map(c => {
    const bills = s.bills.filter(b => b.advId === c.id && b.claimType === 'advance' && b.status !== 'rejected');
    const cleared = r2(sum(bills.filter(billDone), b => billTotals(s, b).cash));
    const pending = r2(sum(bills.filter(b => b.status === 'pending'), b => billTotals(s, b).cash));
    return { c, bills, cleared, pending, left: r2(c.amount - cleared - pending) };
  }).sort((a, b) => a.c.date.localeCompare(b.c.date));
}
const advLabel = c => `${c.no || 'เงินทดรอง'} · ${CASH_LABEL[c.kind] || ''} ${baht(c.amount)} (${thDate(c.date)})`;
// เลือกใบเบิกที่น่าจะเป็นของบิลนี้: ยังเหลือเงิน > โครงการตรง > ประเภทตรง > ยอดพอ > เบิกก่อนวันบิล > เก่าสุดก่อน
function suggestAdv(s, x) {
  const cats = new Set((x.lines || []).map(l => l.cat));
  const list = advances(s, x.staffId).map(a => {
    const own = a.bills.find(b => b.id === x.id);
    return own ? { ...a, left: r2(a.left + billTotals(s, own).cash) } : a;
  }).filter(a => a.left > 0.009);
  if (!list.length) return '';
  const score = a => (a.c.projectId && a.c.projectId === x.projectId ? 3 : 0)
    + (ADV_CATS[a.c.kind] ? (ADV_CATS[a.c.kind].some(k => cats.has(k)) ? 2 : -1) : 0)
    + (a.left + 1 >= (x.amount || 0) ? 2 : 0) + (a.c.date <= (x.date || '9999') ? 1 : 0);
  return list.map(a => ({ a, sc: score(a) })).sort((p, q) => q.sc - p.sc || p.a.c.date.localeCompare(q.a.c.date))[0].a.c.id;
}

function CashView() {
  const { s, me, mut, ask } = useApp();
  const own = !isOffice(me);
  const mineOnly = b => !own || b.staffId === me.staffId;
  const staffList = own ? s.staff.filter(x => x.id === me.staffId) : s.staff;
  const [week, setWeek] = useState(weekOf(todayISO()));
  const [form, setForm] = useState(null);
  const doc = useDocPdf();
  const editBill = id => { setForm('edit:' + id); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const editing = typeof form === 'string' && form.startsWith('edit:') ? s.bills.find(b => b.id === form.slice(5)) : null;
  const [sentId, setSentId] = useState(null);
  const sent = sentId && s.bills.find(b => b.id === sentId);
  const closeBill = id => { setForm(null); if (id) { setSentId(id); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
  const [panel, setPanel] = useState(null);   // 'recon' = จับคู่ใบเบิก · 'report' = รายงานค่าใช้จ่าย
  const togglePanel = k => setPanel(p => p === k ? null : k);
  const [filter, setFilter] = useState('all');
  const [cat, setCat] = useState('');
  const [q, setQ] = useState('');
  const now = weekOf(todayISO());
  const mine = s.bills.filter(b => canApprove(s, b));
  const toPay = s.bills.filter(b => b.status === 'approved' && b.claimType === 'reimburse' && mineOnly(b));
  const scope = filter === 'mine' ? mine : s.bills.filter(b => mineOnly(b) && b.weekStart === week && (filter === 'all' || b.claimType === filter));
  const kw = q.trim().toLowerCase();
  const matchQ = b => !kw || [b.no, b.vendor, staffName(s, b.staffId), projLabel(s, b.projectId), ...b.lines.map(l => l.descr)].join(' ').toLowerCase().includes(kw);
  const catStats = BILL_CATS.map(c => {
    const hit = scope.filter(b => matchQ(b) && billHasCat(b, c.key));
    return { ...c, n: hit.length, amt: sum(hit, b => sum(b.lines.filter(l => lineCat(l) === c.key), l => l.amount)) };
  }).filter(c => c.n > 0 || c.key === cat);
  let bills = scope.filter(b => matchQ(b) && (!cat || billHasCat(b, cat)));
  bills = bills.slice().sort((a, b) => ORDER[a.status] - ORDER[b.status] || b.date.localeCompare(a.date));

  const closeWeek = (st, info) => {
    const moveTxt = info.pending.length ? ` บิลรออนุมัติ ${info.pending.length} ใบจะย้ายไปสัปดาห์ถัดไป` : '';
    const opts = [{ label: 'ยกยอดไปสัปดาห์หน้า', onOk: () => mut(d => closeCashWeek(d, st.id, week, false), `ปิดสัปดาห์ของ ${st.name} แล้ว ยกยอด ${baht(info.closing)}`) }];
    if (info.closing !== 0) opts.push({ label: info.closing > 0 ? `รับเงินคืน ${baht(info.closing)}` : `จ่ายคืนพนักงาน ${baht(-info.closing)}`,
      onOk: () => mut(d => closeCashWeek(d, st.id, week, true), `ปิดสัปดาห์ของ ${st.name} และเคลียร์เงินสดแล้ว`) });
    ask({ title: `ปิดสัปดาห์ ${weekLabel(week)} ของ ${st.name}`, body: `ยอดคงค้าง ${baht(info.closing)} (${info.closing >= 0 ? 'พนักงานถือเงินบริษัท' : 'บริษัทค้างจ่ายพนักงาน'})${moveTxt} ปิดแล้วจะแก้รายการในสัปดาห์นี้ไม่ได้`, options: opts });
  };
  const FILTERS = [['all', 'ทั้งหมด'], ['mine', `รอฉันอนุมัติ${mine.length ? ` (${mine.length})` : ''}`], ['advance', 'เคลียร์สำรองจ่าย'], ['reimburse', 'เบิกคืนสำรองจ่าย']].filter(f => !own || f[0] !== 'mine');

  return (<>
    <div className="pagehead">
      <div><h1>เบิกและเคลียร์บิล</h1><p className="sub">{own ? `บิลและเงินสำรองจ่ายของ ${me.staffId ? staffName(s, me.staffId) : me.name} · ส่งบิล → รออนุมัติ → เคลียร์สำรองจ่ายหรือรอจ่ายเงิน` : 'ส่งบิล → อนุมัติตามสายงาน → เคลียร์สำรองจ่ายหรือรอจ่ายเงิน → ลงสมุดรายวันอัตโนมัติ'}</p></div>
      <div className="actions">
        {isManager(s) && <button className="btn" onClick={() => setForm(form === 'cash' ? null : 'cash')}>+ เบิกสำรองจ่าย</button>}
        {isLead(s) && <button className="btn" onClick={() => setForm(form === 'line' ? null : 'line')}>นำเข้าจาก LINE</button>}
        <button className="btn btn-primary" disabled={own && !me.staffId} onClick={() => { setSentId(null); setForm(form === 'bill' ? null : 'bill'); }}>+ เคลียร์สำรองจ่าย</button>
        <button className="btn" aria-pressed={panel === 'recon'} onClick={() => togglePanel('recon')}>🔗 จับคู่ใบเบิก</button>
        {!own && <button className="btn" aria-pressed={panel === 'report'} onClick={() => togglePanel('report')}>📊 รายงานค่าใช้จ่าย</button>}

        {isAllowed(s, 'export-data') && <button className="btn btn-sm" onClick={() => exportToExcel(prepareCashExportData(s, bills), 'Cash')}>Export Excel</button>}
        {isAllowed(s, 'export-data') && <button className="btn btn-sm" onClick={() => { const el = document.querySelector('.bills'); el && exportToPDF(el, 'Cash'); }}>Export PDF</button>}
      </div>
    </div>
    {own && !me.staffId && <div className="panel hint warn">บัญชีของคุณยังไม่ได้ผูกกับชื่อผู้เบิก จึงยังส่งบิลไม่ได้ แจ้ง Staff office ให้ผูกบัญชีที่หน้า ตั้งค่า → ผู้ใช้งานและสิทธิ์เข้าถึง</div>}
    {form === 'bill' && <BillForm onClose={closeBill} />}
    {editing && <BillForm key={editing.id} edit={editing} onClose={closeBill} />}
    {sent && !form && <SentBox b={sent} onClose={() => setSentId(null)} />}
    {panel === 'recon' && <ReconPanel staffList={staffList} onClose={() => setPanel(null)} onOpenBill={editBill} />}
    {panel === 'report' && <ExpenseReport onClose={() => setPanel(null)} />}
    {form === 'cash' && <CashForm onClose={() => setForm(null)} />}
    {form === 'line' && <LineImport onClose={() => setForm(null)} />}

    {toPay.length > 0 && (
      <section className="stack">
        <div className="section-title"><h2>รอจ่ายเงินคืนพนักงาน</h2><span className="hint">{toPay.length} รายการ · {baht(sum(toPay, b => billTotals(s, b).cash))}</span></div>
        <div className="bills">{toPay.map(b => <BillCard key={b.id} b={b} onEdit={editBill} />)}</div>
      </section>
    )}

    <section className="stack">
      <div className="section-title">
        <h2>{filter === 'mine' ? 'บิลที่รอคุณอนุมัติ' : `บิลสัปดาห์ ${weekLabel(week)}`}</h2>
        <div className="actions">
          <div className="seg" role="tablist" aria-label="กรองบิล">
            {FILTERS.map(([k, l]) => <button key={k} role="tab" aria-selected={filter === k} onClick={() => setFilter(k)}>{l}</button>)}
          </div>
          {filter !== 'mine' && <WeekPicker week={week} setWeek={setWeek} />}
        </div>
      </div>
      {scope.length > 0 && (
        <div className="panel" style={{ paddingBottom: 12 }}>
          <label className="field" style={{ marginBottom: 12 }}><span>🔍 ค้นหาบิล</span><input id="cb-q" type="search" placeholder="เลขที่ ร้าน พนักงาน โครงการ หรือรายการ" value={q} onChange={e => setQ(e.target.value)} /></label>
          <div className="section-title"><h3>กรองตามหมวดค่าใช้จ่าย</h3>{cat && <span className="hint">หมวดนี้รวม {baht((catStats.find(c => c.key === cat) || {}).amt || 0)}</span>}</div>
          <div className="chips">
            <button className={'chip ' + (!cat ? 'now' : '')} onClick={() => setCat('')} style={{ fontSize: '1rem' }}>📋 ทั้งหมด {scope.filter(matchQ).length}</button>
            {catStats.map(c => (
              <button key={c.key} className={'chip ' + (cat === c.key ? 'now' : '')} onClick={() => setCat(cat === c.key ? '' : c.key)} style={{ fontSize: '1rem' }} title={`รวม ${baht(c.amt)}`}>
                {BILL_CAT_ICON[c.key]} {c.label} {c.n}
              </button>
            ))}
          </div>
        </div>
      )}
      {bills.length === 0 ? <div className="panel empty">{scope.length && (cat || kw) ? 'ไม่พบบิลในหมวดหรือคำค้นนี้' : filter === 'mine' ? 'ไม่มีบิลรอคุณอนุมัติ' : 'ยังไม่มีบิลในสัปดาห์นี้'}</div> : (
        <div className="bills">{bills.map(b => <BillCard key={b.id} b={b} hl={cat} onEdit={editBill} />)}</div>
      )}
    </section>

    <section className="stack">
      <div className="section-title"><h2>ยอดเงินทดรองรายสัปดาห์</h2><span className="hint">ยอดคงค้างทบข้ามสัปดาห์ บิลที่ยังไม่อนุมัติจะยกไปสัปดาห์ถัดไปตอนปิดสัปดาห์</span></div>
      <div className="cards">
        {staffList.map(st => {
          const info = cashWeek(s, st.id, week);
          return (
            <div className="panel" key={st.id}>
              <div className="row between">
                <div><h3>{st.name}</h3><span className="hint">{st.position}</span></div>
                {info.closed ? <span className="pill ok">ปิดแล้ว</span> : <span className="pill">เปิดอยู่</span>}
              </div>
              <dl className="ledger">
                <dt>ยอดยกมา</dt><dd>{baht(info.opening)}</dd>
                {info.cashIn.map(c => (<React.Fragment key={c.id}>
                  <dt>{isAdvance(c) && <button className="linkbtn" title="ทำ PDF ใบเบิกสำรองจ่าย แล้วแชร์เข้า LINE" aria-label="ทำ PDF ใบเบิกสำรองจ่าย" disabled={!!(doc.pdf && doc.pdf.busy)}
                    onClick={() => doc.make('cash:' + c.id, cashPdfName(s, c), <CashVoucherDoc c={c} s={s} />, cashLineText(s, c))}>📄</button>}<button className="linkbtn" title="แชร์รายการนี้เข้า LINE" aria-label="แชร์รายการนี้เข้า LINE" onClick={() => openLineShare(cashLineText(s, c))}>💬</button>{CASH_LABEL[c.kind] || 'เงินทดรอง'} · {thDay(c.date)}{c.no ? ` · ${c.no}` : ''}</dt><dd>{cashSign(c) >= 0 ? '+' : ''}{baht(cashSign(c))}</dd>
                </React.Fragment>))}
                <dt>บิลที่เคลียร์แล้ว {info.approved.length} ใบ</dt><dd>{baht(-info.approvedSum)}</dd>
                <dt className="tot">ยอดคงค้าง</dt><dd className="tot">{baht(info.closing)}</dd>
              </dl>
              <p className="hint">{info.closing > 0 ? 'พนักงานถือเงินบริษัทอยู่' : info.closing < 0 ? 'บริษัทต้องจ่ายคืนพนักงาน' : 'เคลียร์ครบ'} · สัปดาห์ {weekLabel(week)}</p>
              {doc.pdf && info.cashIn.some(c => doc.pdf.key === 'cash:' + c.id) && (doc.pdf.busy ? <p className="hint">กำลังสร้าง PDF…</p> : <PdfShareBox pdf={doc.pdf} onClose={doc.close} />)}
              {info.pending.length > 0 && <p className="hint warn">รออนุมัติ {info.pending.length} ใบ {baht(sum(info.pending, b => billTotals(s, b).cash))} ยังไม่หักจากยอด</p>}
              {info.closed && <p className="hint">ปิดเมื่อ {thDate(info.closed.closedAt.slice(0, 10))} · {info.closed.settle ? 'เคลียร์เป็นเงินสด' : 'ยกยอดไปสัปดาห์ถัดไป'}{info.closed.moved ? ` · ย้ายบิล ${info.closed.moved} ใบ` : ''}</p>}
              {!info.closed && isManager(s) && week <= now && (
                <div style={{ marginTop: 12 }}><button className="btn btn-sm" onClick={() => closeWeek(st, info)}>ปิดสัปดาห์นี้</button></div>
              )}
            </div>
          );
        })}
      </div>
    </section>
    {doc.host}
  </>);
}

/* ส่งบิลแล้ว: บอกว่ารอใคร และส่งข้อความแจ้งผู้อนุมัติเข้า LINE ได้ในคลิกเดียว */
const appLink = () => { try { return location.origin + location.pathname + '#cash'; } catch (e) { return ''; } };
function SentBox({ b, onClose }) {
  const { s } = useApp();
  const t = billTotals(s, b);
  const step = nextStep(b);
  const text = [`📨 ขออนุมัติ${billDocTitle(b)} ${b.no || ''}`.trim(), `ผู้เบิก: ${staffName(s, b.staffId)}`, `ร้าน: ${b.vendor} (${thDate(b.date)})`,
    `ยอด: ${baht(t.cash)} · ${projLabel(s, b.projectId)}`, step ? `รอ${ROLE_SHORT[step]}อนุมัติ` : '', `เปิดแอป: ${appLink()}`].filter(Boolean).join('\n');
  return (
    <section className="panel" style={{ borderColor: 'var(--ok)' }} role="status">
      <div className="row between">
        <div><b style={{ color: 'var(--ok)' }}>✓ ส่ง {b.no} แล้ว</b><p className="hint">{b.vendor} · {baht(t.cash)} · {b.status === 'pending' ? `รอ${ROLE_SHORT[step]}อนุมัติ · แจ้งเตือนในแอปแล้ว` : billState(b)[1]}</p></div>
        <div className="row">
          {b.status === 'pending' && <button className="btn btn-primary" onClick={() => openLineShare(text)}>💬 แจ้ง{ROLE_SHORT[step]}ทาง LINE</button>}
          <button className="btn btn-ghost" onClick={onClose}>ปิด</button>
        </div>
      </div>
    </section>
  );
}

/* จับคู่ใบเบิกสำรองจ่ายกับบิลที่นำมาเคลียร์ */
function ReconPanel({ staffList, onClose }) {
  const { s, me, mut } = useApp();
  const office = isOffice(me);
  const [all, setAll] = useState(false);
  const T = todayISO();
  const ids = new Set(staffList.map(x => x.id));
  const loose = s.bills.filter(b => ids.has(b.staffId) && b.claimType === 'advance' && b.status !== 'rejected' && !(b.advId && s.cash.some(c => c.id === b.advId)));
  const autoMatch = () => mut(d => {
    let n = 0;
    d.bills.filter(b => ids.has(b.staffId) && b.claimType === 'advance' && b.status !== 'rejected' && !(b.advId && d.cash.some(c => c.id === b.advId)))
      .sort((a, b) => a.date.localeCompare(b.date))
      .forEach(b => {
        const id = suggestAdv(d, { id: b.id, staffId: b.staffId, projectId: b.projectId, date: b.date, lines: b.lines, amount: billTotals(d, b).cash });
        if (id) { b.advId = id; n++; }
      });
    if (!n) return 'ไม่มีใบเบิกที่เหลือเงินพอจะจับคู่ให้บิลเหล่านี้';
  }, 'จับคู่บิลกับใบเบิกแล้ว ตรวจผลในตารางด้านล่าง');
  const tone = a => a.left < -0.009 ? ['bad', `เกิน ${baht(-a.left)}`] : a.pending > 0 ? ['warn', 'มีบิลรออนุมัติ'] : a.left <= 0.009 ? ['ok', 'เคลียร์ครบ']
    : a.c.date < addDays(T, -7) ? ['warn', 'ค้างเกิน 7 วัน'] : ['gold', 'รอเคลียร์'];

  return (
    <section className="panel formpanel">
      <div className="panel-head"><h2>🔗 จับคู่ใบเบิกสำรองจ่ายกับบิลที่เคลียร์</h2>
        <div className="row"><label className="check small"><input type="checkbox" checked={all} onChange={e => setAll(e.target.checked)} />แสดงใบเบิกที่เคลียร์ครบแล้ว</label>
          <button className="btn btn-sm btn-ghost" onClick={onClose}>ปิด</button></div></div>
      <p className="hint" style={{ marginBottom: 10 }}>ตอนส่งบิล ระบบจับคู่กับใบเบิกที่ยังเหลือเงินให้อัตโนมัติ (โครงการตรง → ประเภทค่าใช้จ่ายตรง → ยอดพอ → เบิกก่อน) แก้ได้ในฟอร์มบิล</p>
      {loose.length > 0 && (
        <div className="subbox row between" style={{ marginBottom: 12 }}>
          <span className="small">⚠️ บิลเคลียร์สำรองจ่ายที่ยังไม่ระบุใบเบิก {loose.length} ใบ · {baht(sum(loose, b => billTotals(s, b).cash))} <span className="muted">({loose.map(b => b.no).join(', ')})</span></span>
          {office && <button className="btn btn-sm btn-primary" onClick={autoMatch}>จับคู่อัตโนมัติ</button>}
        </div>
      )}
      {staffList.map(st => {
        const list = advances(s, st.id).filter(a => all || a.left > 0.009 || a.left < -0.009 || a.pending > 0);
        if (!list.length) return null;
        return (
          <div key={st.id} style={{ marginTop: 10 }}>
            <h3 style={{ marginBottom: 6 }}>{st.name} <span className="hint">คงเหลือรวม {baht(sum(list, a => a.left))}</span></h3>
            <div className="tbl-wrap"><table className="tbl recon">
              <thead><tr><th>ใบเบิก</th><th>ประเภท / โครงการ</th><th className="r">เบิก</th><th className="r">เคลียร์แล้ว</th><th className="r">รออนุมัติ</th><th className="r">คงเหลือ</th><th>สถานะ</th><th>บิลที่ใช้เคลียร์</th></tr></thead>
              <tbody>{list.map(a => {
                const [tn, tl] = tone(a);
                return (
                  <tr key={a.c.id}>
                    <td className="nowrap"><b className="num">{a.c.no || '—'}</b><span className="sub">{thDate(a.c.date)}</span></td>
                    <td>{CASH_LABEL[a.c.kind] || '—'}<span className="sub">{a.c.projectId ? projLabel(s, a.c.projectId) : 'ไม่ระบุโครงการ'}</span></td>
                    <td className="r num">{num(a.c.amount)}</td>
                    <td className="r num">{num(a.cleared)}</td>
                    <td className="r num">{a.pending ? num(a.pending) : '—'}</td>
                    <td className="r num"><b>{num(a.left)}</b></td>
                    <td><span className={'pill ' + tn}>{tl}</span></td>
                    <td>{a.bills.length ? a.bills.map(b => <span key={b.id} className={'pill plain ' + (b.status === 'pending' ? 'warn' : '')} title={`${b.vendor} ${baht(billTotals(s, b).cash)}`}>{b.no}</span>) : <span className="hint">ยังไม่มี</span>}</td>
                  </tr>
                );
              })}</tbody>
            </table></div>
          </div>
        );
      })}
      {staffList.every(st => !advances(s, st.id).some(a => all || a.left > 0.009 || a.left < -0.009 || a.pending > 0)) && <p className="empty">{all ? 'ยังไม่มีใบเบิกสำรองจ่าย' : 'ไม่มีใบเบิกที่ค้างเคลียร์ 🎉'}</p>}
    </section>
  );
}

/* รายงานค่าใช้จ่าย: สรุปตามพนักงาน / แผนก / โครงการ / หมวด แล้วส่งออก Excel หรือ CSV ให้บัญชี */
const monthStart = d => d.slice(0, 8) + '01';
const DEPT_NONE = 'ไม่ระบุแผนก';
const DEPTS = ['หน้างาน', 'จัดซื้อ', 'บัญชี / การเงิน', 'สำนักงาน', 'ขนส่ง'];
const staffDept = (s, id) => (s.staff.find(x => x.id === id) || {}).dept || DEPT_NONE;
const GROUPS = [['staff', 'พนักงาน'], ['dept', 'แผนก'], ['project', 'โครงการ'], ['cat', 'หมวดค่าใช้จ่าย']];
function billExportRow(s, b) {
  const t = billTotals(s, b);
  const adv = b.advId && s.cash.find(c => c.id === b.advId);
  return { 'เลขที่': b.no || '', 'วันที่': b.date, 'พนักงาน': staffName(s, b.staffId), 'แผนก': staffDept(s, b.staffId), 'โครงการ': projName(s, b.projectId),
    'ร้าน': b.vendor, 'เลขผู้เสียภาษีร้าน': b.taxId || '', 'เลขที่ใบเสร็จ': b.receiptNo || '', 'ชนิดเอกสาร': DOC_TYPE[b.docType] || '',
    'ประเภท': CLAIM[b.claimType], 'หมวด': [...new Set(b.lines.map(l => l.kind === 'stock' ? 'ซื้อเข้าสต๊อก' : (CAT[l.cat] || CAT.misc).label))].join(', '),
    'รายการ': b.lines.map(l => l.descr).filter(Boolean).join(', '), 'ก่อน VAT': t.net, 'VAT': t.vat, 'หัก ณ ที่จ่าย': t.wht, 'ยอดสุทธิ': t.cash,
    'สถานะ': billState(b)[1], 'ใบเบิก': adv ? adv.no || '' : '', 'AI อ่าน': b.ai ? 'ใช่' : '', 'หมายเหตุบิลซ้ำ': b.dupNote || '' };
}
function ExpenseReport({ onClose }) {
  const { s } = useApp();
  const T = todayISO();
  const [f, setF] = useState({ from: monthStart(T), to: T, status: 'done', group: 'project' });
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const bills = s.bills.filter(b => b.date >= f.from && b.date <= f.to && b.status !== 'rejected' && (f.status === 'all' || billDone(b)))
    .sort((a, b) => a.date.localeCompare(b.date) || String(a.no).localeCompare(String(b.no)));
  const groups = new Map();
  const add = (key, label, b, net, vat, wht) => {
    const g = groups.get(key) || { label, ids: new Set(), net: 0, vat: 0, wht: 0 };
    g.ids.add(b.id); g.net += net; g.vat += vat; g.wht += wht; groups.set(key, g);
  };
  bills.forEach(b => {
    const t = billTotals(s, b);
    if (f.group === 'cat') {
      // แบ่ง VAT / หัก ณ ที่จ่าย ตามสัดส่วนยอดของแต่ละบรรทัด
      b.lines.forEach(l => { const k = lineCat(l), p = t.net ? +l.amount / t.net : 0; add(k, k === 'stock' ? 'ซื้อเข้าสต๊อก' : CAT[k].label, b, +l.amount, t.vat * p, t.wht * p); });
    } else if (f.group === 'staff') add(b.staffId, staffName(s, b.staffId), b, t.net, t.vat, t.wht);
    else if (f.group === 'dept') { const d = staffDept(s, b.staffId); add(d, d, b, t.net, t.vat, t.wht); }
    else add(b.projectId, projName(s, b.projectId), b, t.net, t.vat, t.wht);
  });
  const rows = [...groups.values()].map(g => ({ ...g, n: g.ids.size, total: r2(g.net + g.vat - g.wht) })).sort((a, b) => b.total - a.total);
  const tot = { n: bills.length, net: sum(bills, b => billTotals(s, b).net), vat: sum(bills, b => billTotals(s, b).vat), wht: sum(bills, b => billTotals(s, b).wht) };
  tot.total = r2(tot.net + tot.vat - tot.wht);
  const top = rows[0] ? rows[0].total : 0;
  const gName = (GROUPS.find(g => g[0] === f.group) || [])[1];
  const fname = `รายงานค่าใช้จ่าย-${f.from}-ถึง-${f.to}`;
  const summaryRows = () => rows.map(r => ({ [gName]: r.label, 'จำนวนบิล': r.n, 'ก่อน VAT': r2(r.net), 'VAT': r2(r.vat), 'หัก ณ ที่จ่าย': r2(r.wht), 'ยอดสุทธิ': r.total }));
  const lineRows = () => bills.flatMap(b => b.lines.map(l => {
    const acc = l.kind === 'stock' ? '1150' : (CAT[l.cat] || CAT.misc).acc;
    return { 'เลขที่': b.no || '', 'วันที่': b.date, 'พนักงาน': staffName(s, b.staffId), 'แผนก': staffDept(s, b.staffId), 'โครงการ': projName(s, b.projectId),
      'ร้าน': b.vendor, 'หมวด': l.kind === 'stock' ? 'ซื้อเข้าสต๊อก' : (CAT[l.cat] || CAT.misc).label, 'รหัสบัญชี': acc, 'ชื่อบัญชี': ACCOUNTS[acc] || '', 'รายละเอียด': l.descr, 'ก่อน VAT': +l.amount };
  }));

  return (
    <section className="panel formpanel">
      <div className="panel-head"><h2>📊 รายงานค่าใช้จ่าย</h2><button className="btn btn-sm btn-ghost" onClick={onClose}>ปิด</button></div>
      <div className="form">
        <label className="field"><span>ตั้งแต่วันที่</span><input id="rp-from" type="date" value={f.from} max={f.to} onChange={e => set('from', e.target.value)} /></label>
        <label className="field"><span>ถึงวันที่</span><input id="rp-to" type="date" value={f.to} min={f.from} onChange={e => set('to', e.target.value)} /></label>
        <label className="field"><span>บิลที่นับ</span><select id="rp-st" value={f.status} onChange={e => set('status', e.target.value)}><option value="done">อนุมัติแล้ว / จ่ายแล้ว</option><option value="all">รวมที่รออนุมัติ</option></select></label>
        <label className="field"><span>สรุปตาม</span><select id="rp-g" value={f.group} onChange={e => set('group', e.target.value)}>{GROUPS.map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></label>
      </div>
      <div className="row" style={{ margin: '10px 0' }}>
        {[['เดือนนี้', monthStart(T), T], ['เดือนก่อน', monthStart(addDays(monthStart(T), -1)), addDays(monthStart(T), -1)], ['30 วัน', addDays(T, -29), T]].map(([l, a, b]) =>
          <button key={l} className={'chip ' + (f.from === a && f.to === b ? 'now' : '')} onClick={() => setF(p => ({ ...p, from: a, to: b }))}>{l}</button>)}
      </div>
      <div className="kpis" style={{ marginBottom: 12 }}>
        <div className="kpi total"><span className="label">ยอดสุทธิ</span><span className="value">{baht(tot.total)}</span><span className="hint">{tot.n} บิล · {thDate(f.from)} – {thDate(f.to)}</span></div>
        <div className="kpi"><span className="label">ก่อน VAT</span><span className="value">{baht(tot.net)}</span></div>
        <div className="kpi"><span className="label">VAT (ภาษีซื้อ)</span><span className="value">{baht(tot.vat)}</span></div>
        <div className="kpi"><span className="label">หัก ณ ที่จ่าย</span><span className="value">{baht(tot.wht)}</span></div>
      </div>
      {rows.length === 0 ? <p className="empty">ไม่มีบิลในช่วงวันที่นี้</p> : (
        <div className="tbl-wrap"><table className="tbl">
          <thead><tr><th>{gName}</th><th className="r">บิล</th><th className="r">ก่อน VAT</th><th className="r">VAT</th><th className="r">หัก ณ ที่จ่าย</th><th className="r">ยอดสุทธิ</th><th>สัดส่วน</th></tr></thead>
          <tbody>{rows.map(r => (
            <tr key={r.label}>
              <td>{r.label}</td><td className="r num">{r.n}</td><td className="r num">{num(r.net)}</td><td className="r num">{num(r.vat)}</td><td className="r num">{num(r.wht)}</td>
              <td className="r num"><b>{num(r.total)}</b></td>
              <td style={{ minWidth: 110 }}><div className="row" style={{ flexWrap: 'nowrap' }}><div className="bars" style={{ flex: 1 }}><i style={{ width: (top ? r.total / top * 100 : 0) + '%' }} /></div><span className="small num">{tot.total ? Math.round(r.total / tot.total * 100) : 0}%</span></div></td>
            </tr>
          ))}</tbody>
          <tfoot><tr><td>รวม</td><td className="r num">{tot.n}</td><td className="r num">{num(tot.net)}</td><td className="r num">{num(tot.vat)}</td><td className="r num">{num(tot.wht)}</td><td className="r num">{num(tot.total)}</td><td /></tr></tfoot>
        </table></div>
      )}
      <div className="actions" style={{ marginTop: 12 }}>
        <button className="btn btn-primary" disabled={!bills.length} onClick={() => exportBook([[`สรุปตาม${gName}`, summaryRows()], ['รายละเอียดบิล', bills.map(b => billExportRow(s, b))], ['รายการแยกบัญชี', lineRows()]], fname)}>📥 Excel (3 ชีต)</button>
        <button className="btn" disabled={!bills.length} onClick={() => exportCsv(bills.map(b => billExportRow(s, b)), fname)}>CSV รายละเอียดบิล</button>
        <span className="hint">Excel มีชีตสรุป รายละเอียดบิล (เลขผู้เสียภาษี เลขที่ใบเสร็จ ใบเบิก) และรายการแยกรหัสบัญชี</span>
      </div>
    </section>
  );
}

            )}

            <button className="btn btn-sm btn-primary" disabled={!why.trim()} onClick={() => mut(d => rejectBill(d, b.id, s.role, why.trim()), 'ตีกลับแล้ว แจ้งพนักงานแล้ว') && setMode(null)}>ยืนยันตีกลับ</button>
            <button className="btn btn-sm btn-ghost" onClick={() => setMode(null)}>ยกเลิก</button>

              {Object.entries(PAY_METHOD).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
            </select>
            <input id={'pd-' + b.id} type="date" aria-label="วันที่จ่าย" value={pay.date} onChange={e => setPay({ ...pay, date: e.target.value })} style={{ width: 'auto' }} />
            <input id={'pr-' + b.id} placeholder="เลขอ้างอิงการโอน" value={pay.ref} onChange={e => setPay({ ...pay, ref: e.target.value })} style={{ flex: 1, minWidth: 150 }} />
            <button className="btn btn-sm btn-primary" onClick={() => mut(d => payBill(d, b.id, { ...pay, ref: pay.ref.trim() }), `บันทึกจ่ายเงิน ${baht(t.cash)} แล้ว`) && setMode(null)}>ยืนยันจ่าย {baht(t.cash)}</button>
            <button className="btn btn-sm btn-ghost" onClick={() => setMode(null)}>ยกเลิก</button>
          </div>
        )}
        {doc.pdf && doc.pdf.file && <div style={{ marginTop: 10 }}><PdfShareBox pdf={doc.pdf} onClose={doc.close} /></div>}
      </div>
      {doc.host}
    </article>
  );
}

/* AI อ่านรูป: เชื่อม Google Sheets อยู่ → ส่งไปที่ Gemini ผ่าน Cloudflare Worker (ถ้าตั้งไว้) หรือผ่าน Apps Script
   key อยู่ฝั่งเซิร์ฟเวอร์ทั้งสองทาง · เปิดผ่าน claude.ai → ใช้ AI ของ claude.ai
   ทุกแบบเรียกด้วย ai.json(prompt, { images: blob }) เหมือนกัน */
const AI_TICKET_KEY = 'subancc.aiticket';
let aiTicketJob = null;
// ขอ ticket จาก Apps Script (ช้าได้) ครั้งเดียวต่อ 12 ชม. แล้วส่งรูปไป Worker ตรง ๆ
function aiTicket(remote, fresh) {
  const c = loadJSON(AI_TICKET_KEY, null);
  if (!fresh && c && c.tok === remote.token && c.exp - Date.now() > 10 * 60 * 1000) return Promise.resolve(c);
  if (!aiTicketJob) aiTicketJob = callSheet(remote.url, 'aiTicket', { token: remote.token })
    .then(r => { const t = { tok: remote.token, url: r.url || '', ticket: r.ticket || '', exp: r.exp || Date.now() + 3600 * 1000 }; saveJSON(AI_TICKET_KEY, t); return t; })
    .finally(() => { aiTicketJob = null; });
  return aiTicketJob;
}
async function workerAI(t, body) {
  const res = await fetch(t.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ticket: t.ticket, ...body }) });
  const j = await res.json();
  if (j && j.error) throw Object.assign(new Error(j.msg || j.error), { code: j.error });
  return j;
}
const sheetAI = remote => ({
  via: 'gemini',
  json: async (prompt, opt = {}) => {
    const blob = opt.images;
    const body = { prompt, image: await blobToB64(blob), mime: blob.type || 'image/jpeg' };
    let t = await aiTicket(remote).catch(() => null);
    if (t && t.url) {
      // ticket/ตั้งค่าบน Worker ไม่ครบ หรือ Worker ติดต่อไม่ได้ → ใช้ทาง Apps Script แทน
      // AI ตอบว่าอ่านไม่ได้/ไม่ว่าง → แจ้งเลย ทาง Apps Script ก็ใช้ Gemini เดียวกัน
      const workerOff = e => !e.code || e.code === 'ticket' || e.code === 'ai_config';
      try {
        return (await workerAI(t, body)).json;
      } catch (e) {
        if (!workerOff(e)) throw e;
        if (e.code === 'ticket') {
          t = await aiTicket(remote, true).catch(() => null);
          try { if (t && t.url) return (await workerAI(t, body)).json; }
          catch (e2) { if (!workerOff(e2)) throw e2; }
        }
      }
    }
    const sb = { token: remote.token, ...body };
    // Google ส่งหน้า HTML แทนผลเป็นครั้งคราวเมื่อสคริปต์ทำงานนาน ลองใหม่เองหนึ่งครั้ง
    const res = await callSheet(remote.url, 'ai', sb).catch(e => { if (e.code === 'server') return callSheet(remote.url, 'ai', sb); throw e; });
    return res.json;
  },
});
function useReceiptAI() {
  const { rs } = useApp() || {};
  const remote = rs && rs.remote && rs.remote.token ? rs.remote : null;
  const [ai, setAi] = useState(null);
  useEffect(() => {
    if (remote) { setAi(() => sheetAI(remote)); aiTicket(remote).catch(() => {}); return; }
    let alive = true;
    (async () => {
      try {
        if (!window.claude || !window.claude.use) return;
        const sm = await window.claude.use('sample');
        if (!sm || !alive) return;
        const lim = await sm.limits().catch(() => null);
        if (alive && lim && lim.images) setAi(() => sm);
      } catch (e) { /* ไม่มี AI ก็กรอกเองได้ */ }
    })();
    return () => { alive = false; };
  }, [remote && remote.url, remote && remote.token]);
  return [ai, setAi];
}
// ค่าจาก AI บางครั้งเป็นข้อความ "1,250.00" หรือปี พ.ศ.
const aiNum = v => { const n = +String(v == null ? '' : v).replace(/[,\s฿]|บาท/g, ''); return n > 0 ? n : 0; };
const aiDate = v => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || '').trim());
  if (!m) return '';
  const y = +m[1] > 2400 ? +m[1] - 543 : +m[1];
  return `${y}-${m[2]}-${m[3]}`;
};
// ข้อความผิดพลาดของ AI ที่ผู้ใช้เข้าใจได้ · ปิดปุ่ม AI เมื่อใช้ไม่ได้ถาวร (ยังไม่ตั้ง key / ไม่ได้อนุญาต)
const AI_OFF = ['not_granted', 'capability_disabled', 'capability_removed', 'unavailable', 'no_key'];
function aiErrorText(e, what = 'ใบเสร็จ') {
  const code = e && e.code;
  if (code === 'not_granted') return `ไม่ได้อนุญาตให้ใช้ AI อ่าน${what} กรอกข้อมูลเองได้ตามปกติ`;
  if (code === 'invalid_json') return `AI อ่าน${what}นี้ไม่ออก ลองถ่ายให้ตรงและชัดขึ้น หรือกรอกเอง`;
  if (code === 'rate_limited' && !(e.message || '').match(/[ก-๙]/)) return 'ใช้งาน AI ถี่เกินไป รอสักครู่แล้วลองใหม่';
  if (e && e.message && /[ก-๙]/.test(e.message)) return e.message;   // ข้อความภาษาไทยจากเซิร์ฟเวอร์
  return `อ่าน${what}ไม่สำเร็จ กรอกข้อมูลเองได้ตามปกติ`;
}

/* แปลงบิลที่ส่งไปแล้วกลับเป็นค่าในฟอร์ม เพื่อแก้ไขก่อนอนุมัติ */
function billToForm(b) {
  const net = sum(b.lines, l => l.amount);
  const pct = net && b.wht ? Math.round(b.wht / net * 100) : 0;
  const photos = b.photos && b.photos.length ? b.photos : b.photo ? [b.photo] : [];
  return {
    claimType: b.claimType, staffId: b.staffId, projectId: b.projectId, date: b.date, vendor: b.vendor,
    taxId: b.taxId || '', receiptNo: b.receiptNo || '', docType: b.docType || '',
    // VAT ที่เท่ากับ 7% อยู่แล้วให้เว้นว่าง จะได้คำนวณใหม่อัตโนมัติเมื่อแก้ยอด
    vatOn: b.vat > 0, vat: b.vat > 0 && Math.abs(b.vat - r2(net * 0.07)) > 0.01 ? String(b.vat) : '', whtPct: [1, 3, 5].includes(pct) ? String(pct) : '0',
    photos, hashes: (b.photoHashes || []).slice(0, photos.length), aiBlobs: [], ai: !!b.ai, aiTotal: b.aiTotal || 0, aiNote: '',
    advId: b.advId || '', advAuto: !b.advId, dupAck: !!b.dupNote,
    lines: b.lines.map(l => ({ id: l.id, cat: l.kind === 'stock' ? 'stock' : l.cat, descr: l.descr || '', itemId: l.itemId || '', qty: l.qty === '' || l.qty == null ? '' : String(l.qty), amount: String(l.amount) })),
  };
}

const DOC_TYPE = { tax: 'ใบกำกับภาษี', receipt: 'ใบเสร็จรับเงิน', cash: 'บิลเงินสด', other: 'อื่น ๆ' };
const receiptPrompt = () => `รูปที่แนบคือใบเสร็จ บิลเงินสด หรือใบกำกับภาษีจากร้านค้าในประเทศไทย ของบริษัทรับเหมาก่อสร้าง
อ่านแล้วตอบเป็น JSON อย่างเดียว ตามรูปแบบนี้:
{"docType":"tax","date":"YYYY-MM-DD","vendor":"ชื่อร้าน","taxId":"เลข 13 หลักของผู้ขาย","receiptNo":"เลขที่เอกสาร","vat":0,"total":0,"items":[{"descr":"รายการ","amount":0,"category":"mat"}],"note":"สิ่งที่อ่านไม่ชัดหรือควรตรวจ"}

- vat คือภาษีมูลค่าเพิ่มทั้งใบ ถ้าไม่มีให้เป็น 0
