<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUBAN CC หน้างาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F0E8;--surface:#FFFFFF;--surface-2:#FAF6EF;--line:#E6DDCF;--line-2:#D4CCC0;
  --ink:#3D352C;--ink-2:#6F6356;--ink-3:#9C8F80;
  --gold:#D4A761;--gold-strong:#B8893E;--gold-ink:#86611F;--on-gold:#2B2012;--logo:#B89968;--gold-soft:#F6EBD6;
  --ok:#2E7A48;--ok-bg:#E2F0E5;--warn:#945E00;--warn-bg:#FBEDD0;--bad:#B0362B;--bad-bg:#F8E0DB;
  --c-exp:#B8893E;--c-lab:#6E8C6A;--c-mat:#7C8FA8;
  --shadow:0 1px 2px rgba(74,66,56,.05),0 6px 18px rgba(74,66,56,.06);
  --font:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1B1814;--surface:#25211C;--surface-2:#2C2721;--line:#3A332B;--line-2:#4A4137;
    --ink:#EFE8DC;--ink-2:#BCAF9E;--ink-3:#8C8072;
    --gold:#D9AE6A;--gold-strong:#E2BC7E;--gold-ink:#E6C48C;--on-gold:#2B2012;--logo:#B89968;--gold-soft:#3A2F1E;
    --ok:#74C48F;--ok-bg:#1E3325;--warn:#E9B454;--warn-bg:#3A2E15;--bad:#F08A7E;--bad-bg:#3E221E;
    --c-exp:#D9AE6A;--c-lab:#93B38E;--c-mat:#9DB0C9;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B1814;--surface:#25211C;--surface-2:#2C2721;--line:#3A332B;--line-2:#4A4137;
  --ink:#EFE8DC;--ink-2:#BCAF9E;--ink-3:#8C8072;
  --gold:#D9AE6A;--gold-strong:#E2BC7E;--gold-ink:#E6C48C;--on-gold:#2B2012;--logo:#B89968;--gold-soft:#3A2F1E;
  --ok:#74C48F;--ok-bg:#1E3325;--warn:#E9B454;--warn-bg:#3A2E15;--bad:#F08A7E;--bad-bg:#3E221E;
  --c-exp:#D9AE6A;--c-lab:#93B38E;--c-mat:#9DB0C9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
table{font:inherit;color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.1rem;font-weight:600}
h3{font-size:.98rem;font-weight:600}
p{margin:0}
.num,.r{font-variant-numeric:tabular-nums}
.r{text-align:right}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.boot{padding:40px 16px;color:var(--ink-2)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line-2)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:38px;height:38px;border-radius:9px;background:var(--logo);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;letter-spacing:.02em}
.brand b{display:block;font-size:1.02rem;letter-spacing:.04em}
.brand small{display:block;color:var(--ink-2);font-size:.75rem;margin-top:-2px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;order:3;width:100%;margin-inline:-4px;padding-bottom:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--ink-2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;font-weight:500}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{color:var(--gold-ink);background:var(--gold-soft);font-weight:600}
.tab .count{background:var(--gold);color:var(--on-gold);border-radius:10px;font-size:.72rem;padding:0 7px;line-height:1.5;font-weight:600}
.role{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--ink-2)}
.role select{padding:6px 8px}
@media (min-width:980px){.tabs{order:0;width:auto;margin:0;padding:0}}
@media (max-width:560px){.top-in{gap:6px 10px;min-height:56px}.brand small{display:none}.role .lbltxt{display:none}.role select{max-width:132px;font-size:.82rem}.logo{width:32px;height:32px;font-size:16px}}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.pagehead .sub{color:var(--ink-2);font-size:.9rem;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cols{display:grid;gap:20px;grid-template-columns:1fr}
.cols>*,.cards>*,.kpis>*{min-width:0}
@media (min-width:980px){.cols{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.hint{font-size:.84rem;color:var(--ink-2)}
.hint.warn{color:var(--warn)}
.hint.bad{color:var(--bad)}

/* buttons */
.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--gold-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.thumb:focus-visible{outline:2px solid var(--gold-strong);outline-offset:2px}
.btn-primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.btn-primary:hover:not(:disabled){background:var(--gold-strong);border-color:var(--gold-strong)}
.btn-ok{color:var(--ok);border-color:currentColor;background:var(--ok-bg)}
.btn-bad{color:var(--bad);border-color:transparent;background:transparent}
.btn-bad:hover:not(:disabled){background:var(--bad-bg);border-color:transparent}
.btn-sm{padding:4px 10px;font-size:.84rem;border-radius:7px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover:not(:disabled){background:var(--surface-2);border-color:transparent;color:var(--ink)}
.iconbtn{width:34px;height:34px;justify-content:center;padding:0}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:1px solid var(--line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.gold{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.pill.plain::before{display:none}

/* forms */
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;color:var(--ink-2);font-weight:500}
.field.wide{grid-column:1/-1}
input,select,textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:110px;line-height:1.6}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold-strong);padding:0}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.formpanel{border-color:var(--gold);box-shadow:var(--shadow)}
.formfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.errors{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:.88rem}

/* tables */
.tbl-wrap{overflow-x:auto;margin-inline:-18px;padding-inline:18px}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{font-size:.76rem;font-weight:600;color:var(--ink-2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;letter-spacing:.02em}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th.r,.tbl td.r{text-align:right}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--line-2)}
.tbl .sub{display:block;font-size:.78rem;color:var(--ink-2);font-weight:400}
.nowrap{white-space:nowrap}

/* KPI */
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .label{font-size:.8rem;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.kpi .value{font-size:1.55rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi.total{background:var(--gold-soft);border-color:transparent}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.stackbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);gap:2px}
.stackbar i{display:block;height:100%}
.meter{height:7px;border-radius:4px;background:var(--line);overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;border-radius:4px}

/* attention list */
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.todo .body{flex:1;min-width:0}
.todo .body b{display:block;font-weight:600;font-size:.92rem}
.todo .body span{font-size:.84rem;color:var(--ink-2)}
.sev{width:4px;align-self:stretch;border-radius:2px;flex:none}

/* week picker */
.week{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.week .lbl{padding:0 8px;font-weight:600;font-size:.9rem;min-width:170px;text-align:center}

/* ledger */
.ledger{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:12px 0;font-size:.9rem}
.ledger dt{color:var(--ink-2)}
.ledger dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.ledger .tot{font-weight:700;color:var(--ink);border-top:1px solid var(--line-2);padding-top:8px}

/* bills */
.bills{display:flex;flex-direction:column;gap:12px}
.bill{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;overflow:hidden}
.bill::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line-2)}
.bill.pending::before{background:var(--warn)}
.bill.approved::before{background:var(--ok)}
.bill.rejected::before{background:var(--bad)}
.thumb{width:76px;height:96px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);overflow:hidden;padding:0;cursor:zoom-in;display:grid;place-items:center;color:var(--ink-3);font-size:.72rem;text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.empty{cursor:default;border-style:dashed}
.meta{font-size:.82rem;color:var(--ink-2)}
.lines{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.lines li{display:flex;gap:8px;align-items:baseline}
.lines li .d{flex:1;min-width:0}
.kind{font-size:.7rem;font-weight:600;padding:1px 7px;border-radius:5px;white-space:nowrap}
.kind.expense{background:var(--gold-soft);color:var(--gold-ink)}
.kind.stock{background:var(--surface-2);color:var(--c-mat);border:1px solid var(--line)}
.billfoot{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;font-size:.84rem;color:var(--ink-2);border-top:1px dashed var(--line-2);padding-top:8px}
.billfoot b{color:var(--ink);font-size:.95rem}
@media (max-width:480px){.bill{grid-template-columns:56px minmax(0,1fr)}.thumb{width:56px;height:72px}}

/* line editor */
.lineed{display:grid;gap:8px;grid-template-columns:150px minmax(0,1fr) 90px 120px 34px;align-items:center}
.lineed.head{font-size:.76rem;color:var(--ink-2);font-weight:600}
@media (max-width:720px){.lineed{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--line);border-radius:10px}.lineed.head{display:none}.lineed .span2{grid-column:1/-1}}
.totals{display:grid;grid-template-columns:auto auto;gap:4px 18px;justify-content:end;font-size:.9rem}
.totals dt{color:var(--ink-2);text-align:right}
.totals dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.totals .big{font-weight:700;font-size:1.05rem;color:var(--ink)}

/* stock */
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.item .strip{height:5px}
.item .in{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.item .qty{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.item .qty small{font-size:.85rem;font-weight:500;color:var(--ink-2);margin-left:4px}
.item dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:.82rem}
.item dt{color:var(--ink-2)}
.item dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

/* import rows */
.issue{font-size:.78rem;display:block;margin-top:3px}
.issue.bad{color:var(--bad)}
.issue.warn{color:var(--warn)}
.linkbtn{background:none;border:0;padding:0;color:var(--gold-ink);text-decoration:underline;cursor:pointer;font-size:inherit}
.ledger .linkbtn{text-decoration:none;margin-right:6px}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(20,16,12,.55);z-index:50;display:grid;place-items:center;padding:16px}
.dialog{background:var(--surface);border-radius:14px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px}
.photo{max-width:min(92vw,720px);max-height:86vh;border-radius:10px;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;box-shadow:var(--shadow);font-size:.9rem;max-width:calc(100vw - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.section-title{display:flex;align-items:baseline;gap:10px;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.now{background:var(--gold-soft);border-color:transparent;color:var(--gold-ink);font-weight:600}
.empty{padding:28px 12px;text-align:center;color:var(--ink-2);font-size:.9rem}
/* notifications */
.bellwrap{position:relative}
.bell{position:relative;color:var(--ink-2)}
.dotcount{position:absolute;top:1px;right:0;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1}
.notif{position:absolute;right:0;top:calc(100% + 6px);width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);z-index:30;max-height:70vh;overflow:auto}
.notif ul{list-style:none;margin:0;padding:0 6px 6px}
.notif li button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--ink-2);font-size:.88rem}
.notif li button:hover{background:var(--surface-2)}
.notif li button.unread{color:var(--ink);font-weight:500}
.notif li button.unread span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold-strong);margin-right:7px;vertical-align:middle}
.notif small{color:var(--ink-3);font-size:.74rem}
/* เข้าระบบ / บัญชีผู้ใช้ */
.authwrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.authcard{width:100%;max-width:400px;box-shadow:var(--shadow)}
.pwbox{position:relative;display:flex}
.pwbox input{padding-right:64px}
.pwbox .btn{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.userbtn{padding:4px 8px 4px 4px;gap:8px;max-width:190px;text-align:left}
.userbtn .uname{overflow:hidden;text-overflow:ellipsis;font-size:.86rem;line-height:1.2;color:var(--ink)}
.userbtn .uname small{display:block;font-size:.72rem;color:var(--ink-3)}
.bellwrap+.bellwrap{margin-left:-8px}
.syncchip{padding:4px 8px;font-size:.8rem;gap:5px;color:var(--ink-3)}
.syncchip.offline,.syncchip.error{color:var(--warn);background:var(--warn-bg)}
.syncchip+.bellwrap{margin-left:-12px}
@media (max-width:1199px){.syncchip .lbl{display:none}.syncchip{width:34px;padding:0;justify-content:center}}
@media (min-width:980px) and (max-width:1199px){.userbtn .uname{display:none}.userbtn{padding:4px}.top-in{column-gap:14px}.tab{padding:8px 10px}}
.avatar-s{width:28px;height:28px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.usermenu{width:min(300px,calc(100vw - 32px))}
.utbl .tbl select{min-width:140px}.utbl .tbl td:first-child{min-width:140px}
@media (max-width:560px){.userbtn .uname{display:none}.userbtn{padding:4px}}
/* segmented */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;border-radius:7px;padding:6px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:.88rem}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
/* approval steps */
.steps{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px}
.step{font-size:.74rem;padding:2px 9px;border-radius:6px;border:1px dashed var(--line-2);color:var(--ink-3)}
.step.done{border-style:solid;border-color:transparent;background:var(--ok-bg);color:var(--ok)}
.step.now{border-style:solid;border-color:transparent;background:var(--warn-bg);color:var(--warn);font-weight:600}
/* receipt + AI */
.photo-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.photo-row .field{flex:1 1 220px}
.preview{height:96px;width:auto;border-radius:8px;border:1px solid var(--line)}
.aibox{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
/* เคลียร์สำรองจ่าย: ถ่ายรูป → AI สรุป → ยืนยันครั้งเดียว */
.shoot{display:flex;align-items:center;gap:14px;padding:16px 18px;border:2px dashed var(--gold);border-radius:12px;background:var(--gold-soft);color:var(--gold-ink);cursor:pointer}
.shoot>span:first-child{font-size:1.9rem;line-height:1}
.shoot b{display:block;font-size:1.05rem}
.shoot small{display:block;color:var(--ink-2);font-size:.82rem}
.shoot.small{padding:10px 14px}.shoot.small>span:first-child{font-size:1.4rem}
.shoot:focus-within{outline:2px solid var(--gold-strong);outline-offset:2px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}

const pad = n => String(n).padStart(2, '0');

const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

};

const FIELD_TABS = ['cash'];

const sha256 = (() => {
  const K = [], H0 = [];
  for (let n = 2, c = 0; c < 64; n++) {
    let p = true;
    for (let i = 2; i * i <= n; i++) if (n % i === 0) { p = false; break; }
    if (!p) continue;
    if (c < 8) H0[c] = (Math.pow(n, 1 / 2) * 4294967296) | 0;

const RPEND_KEY = 'subancc.remote.pending';  // รายการที่แก้แล้วแต่ยังส่งไม่สำเร็จ (เช่น ไม่มีเน็ต)
const SYNC_SKIP = ['role', 'users', 'version'];
const byId = x => x && x.id;
const SYNC_REC = {
  projects: byId, staff: byId, cash: byId, bills: byId, sheets: byId, moves: byId, journal: byId, notes: byId, meetings: byId,
  workers: byId, items: byId, time: byId, laborAdj: byId,
  cashWeeks: x => x.staffId + '|' + x.weekStart, rates: x => x.workerId + '|' + x.from, laborWeeks: x => String(x),
};
const SHEET_URL_RE = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+\/)?macros\/s\/[\w-]+\/exec$/;
function skeleton() {
  const s = { version: 3, role: 'staff', seq: {}, lineMap: {}, settings: { vatRegistered: true, minWage: 400, breakMin: 60, breakAfter: 5, limits: { staff: 0, lead: 5000, manager: 20000 } } };
  Object.keys(SYNC_REC).forEach(k => { s[k] = []; });
  return s;
}
const rkey = (k, id) => k + '\u0001' + id;
function explode(state) {
  const m = new Map();
  Object.keys(state).forEach(k => {
    const v = state[k];
    if (SYNC_SKIP.includes(k) || v === undefined) return;
    if (SYNC_REC[k] && Array.isArray(v)) v.forEach((x, i) => { const id = String(SYNC_REC[k](x) ?? ''); if (id) m.set(rkey(k, id), { k, id, v: x, o: i }); });
    else m.set(rkey(k, ''), { k, id: '', v, o: 0 });
  });
  return m;
}
function implode(recs, role) {
  const s = skeleton(), lists = {};
  recs.forEach(r => { if (!r.id) s[r.k] = r.v; else if (SYNC_REC[r.k]) (lists[r.k] = lists[r.k] || []).push(r); });
  Object.keys(lists).forEach(k => { s[k] = lists[k].sort((a, b) => a.o - b.o || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)).map(r => r.v); });
  s.role = role || 'staff';
  return s;
}
const recJson = r => r.j !== undefined ? r.j : (r.j = JSON.stringify(r.v));
function diffRecs(base, work) {
  const out = [], maxO = {}, blank = skeleton();
  base.forEach(r => { if (r.o > (maxO[r.k] ?? -1)) maxO[r.k] = r.o; });
  work.forEach((r, key) => {
    const b = base.get(key);
    if (b && recJson(b) === JSON.stringify(r.v)) return;
    // ค่าเริ่มต้นว่างที่ชีตไม่เคยมี (เช่น lineMap ของพนักงานทั่วไป) ไม่ใช่การแก้ไข
    if (!b && !r.id && r.k in blank && JSON.stringify(r.v) === JSON.stringify(blank[r.k])) return;
    out.push({ k: r.k, id: r.id, v: r.v, o: b ? b.o : (maxO[r.k] = (maxO[r.k] ?? -1) + 1) });
  });
  base.forEach((r, key) => { if (!work.has(key)) out.push({ k: r.k, id: r.id, v: null }); });
  return out;
}
function applyRecs(base, recs) {
  (recs || []).forEach(r => {
    const key = rkey(r.k, r.id);
    if (r.v === null || r.v === undefined) base.delete(key);
    else base.set(key, { k: r.k, id: r.id, v: r.v, o: r.o ?? (base.get(key) || {}).o ?? 0 });
  });
  return base;
}
function applyChangesTo(state, changes) { return implode(applyRecs(explode(state), changes), state.role); }

const loadJSON = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? def : v; } catch (e) { return def; } };
const saveJSON = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
function loadRemote() {
  let r = loadJSON(REMOTE_KEY, null);
  if (r && !SHEET_URL_RE.test(r.url || '')) r = null;
  // ลิงก์ที่ Staff office ส่งให้พนักงาน: index.html?sheet=<Web app URL>
  try {
    const q = new URLSearchParams(location.search), url = (q.get('sheet') || '').trim();
    if (url) {
      q.delete('sheet');
      history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash);
      if (SHEET_URL_RE.test(url) && (!r || r.url !== url)) { r = { url }; clearRemoteCache(); saveJSON(REMOTE_KEY, r); }
    }
  } catch (e) { /* เปิดจากไฟล์ในเครื่อง */ }
  return r;
}
function loadBase(r) {
  const c = r && r.me && loadJSON(RBASE_KEY, null);
  if (!c || c.uid !== r.me.id || c.url !== r.url || !Array.isArray(c.recs)) return null;
  return { since: c.since, base: new Map(c.recs.map(x => [rkey(x.k, x.id), x])), pend: loadJSON(RPEND_KEY, []) };
}
function saveBase(r, E) {
  if (!r || !r.me || !E.base) return;
  const ok = saveJSON(RBASE_KEY, { uid: r.me.id, url: r.url, since: E.since, recs: [...E.base.values()].map(({ k, id, v, o }) => ({ k, id, v, o })) });
  if (!ok) saveJSON(RBASE_KEY, null); // เครื่องเต็ม: ครั้งหน้าโหลดจากชีตใหม่ทั้งหมดแทน
}
function clearRemoteCache() { saveJSON(RBASE_KEY, null); saveJSON(RPEND_KEY, null); }
async function callSheet(url, op, body = {}) {
  let res;
  try {
    res = await fetch(url + (url.includes('?') ? '&' : '?') + 'app=1', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ op, ...body }) });
  } catch (e) { throw Object.assign(new Error('เชื่อมต่อ Google Sheets ไม่ได้ ตรวจสอบอินเทอร์เน็ต'), { code: 'offline' }); }
  let j;
  try { j = await res.json(); } catch (e) {
    // ตอนเชื่อมครั้งแรก = URL ผิด · หลังเชื่อมแล้ว = สคริปต์ล้ม/หมดเวลา Google ส่งหน้า HTML กลับมา
    throw op === 'ping'
      ? Object.assign(new Error('URL นี้ไม่ใช่ Web app ของ SUBAN CC หรือยังไม่ได้ Deploy แบบ Anyone'), { code: 'bad_url' })
      : Object.assign(new Error('Google Sheets ตอบกลับผิดปกติ ลองใหม่อีกครั้งในอีกสักครู่'), { code: 'server' });
  }
  if (j && j.error) throw Object.assign(new Error(j.msg || j.error), { code: j.error });
  return j;
}
const roleOf = u => isOffice(u) ? (u.role || 'owner') : 'staff';
const sheetLabel = url => { const m = /\/s\/([\w-]+)\/exec/.exec(url || ''); return m ? `…${m[1].slice(-8)}/exec` : url; };

/* ---------- ผังบัญชีและประเภทค่าใช้จ่าย ---------- */

  { key: 'mat', label: 'ค่าวัสดุก่อสร้างหน้างาน', acc: '5110' },

const CAT = Object.fromEntries(CATS.map(c => [c.key, c]));
const CLAIM = { advance: 'เคลียร์สำรองจ่าย', reimburse: 'เบิกคืนสำรองจ่าย' };
const PAY_METHOD = { transfer: 'โอนเงิน', cash: 'เงินสด' };
const STOCK_CATEGORIES = [
  'โครงสร้าง', 'สถาปัตยกรรม/ตกแต่ง', 'ไฟฟ้า', 'ประปา/ท่อ', 'ฮาร์ดแวร์', 'เครื่องมือ', 'วัสดุก่อสร้าง', 'อื่น ๆ'
];

/* ---------- กติกาธุรกิจ ---------- */
function billTotals(s, b) {
  const net = sum(b.lines, l => l.amount);
  const vat = +b.vat || 0, wht = +b.wht || 0;
  // จดทะเบียน VAT → ขอคืนภาษีซื้อได้ ต้นทุนใช้ยอดก่อน VAT; ไม่ได้จด → VAT เป็นต้นทุน
  const vatFactor = s.settings.vatRegistered || net === 0 ? 1 : (net + vat) / net;
  return {
    net, vat, wht, cash: r2(net + vat - wht), vatFactor,
    expense: sum(b.lines.filter(l => l.kind === 'expense'), l => l.amount) * vatFactor,
  };
}
const billDone = b => b.status === 'approved' || b.status === 'paid';

function nextSeq(d, key, prefix) {
  d.seq[key] = (d.seq[key] || 0) + 1;
  return `${prefix}-${String(d.seq[key]).padStart(4, '0')}`;
}
function post(d, date, desc, lines, ref = '') {
  lines = lines.filter(l => r2(l.dr) || r2(l.cr)).map(l => ({ ...l, dr: r2(l.dr), cr: r2(l.cr) }));
  // ปัดเศษให้เดบิตเท่ากับเครดิต
  const diff = r2(sum(lines, l => l.cr) - sum(lines, l => l.dr));
  if (diff) { const big = lines.filter(l => l.dr).sort((a, b) => b.dr - a.dr)[0]; if (big) big.dr = r2(big.dr + diff); }
  d.journal.push({ id: nextSeq(d, 'jv', 'JV'), date, desc, ref, lines });
}
function note(d, to, text, billId) {
  d.notes.push({ id: uid(), to, text, billId: billId || '', at: new Date().toISOString(), read: false });
}

function stockStatus(it) {
  if (it.qty <= it.min * 0.5) return 'bad';
  if (it.qty <= it.min) return 'warn';
  return 'ok';
}
const STOCK_LABEL = { ok: 'ปกติ', warn: 'ต่ำ', bad: 'ต่ำมาก' };

function stockIn(d, itemId, qty, unitCost, date, extra = {}) {
  const it = d.items.find(i => i.id === itemId);
  if (!it) return 'ไม่พบสินค้า';
  const q = it.qty + qty;
  it.avg = q > 0 ? (it.qty * it.avg + qty * unitCost) / q : unitCost;
  it.qty = r2(q);
  d.moves.push({ id: uid(), itemId, date, kind: 'in', qty, unitCost, ...extra });
}
function stockOut(d, itemId, qty, projectId, date, note = '', photo = null) {
  const it = d.items.find(i => i.id === itemId);
  if (!it) return 'ไม่พบสินค้า';
  if (qty > it.qty) return `เบิกเกินยอดคงเหลือ (${it.name} เหลือ ${num(it.qty)} ${it.unit})`;
  const p = d.projects.find(x => x.id === projectId);
  if (!p) return 'ต้องระบุโครงการที่เบิกไปใช้';
  if (p.status !== 'active') return `โครงการ ${p.code} ปิดงานแล้ว เบิกเพิ่มไม่ได้`;
  d.moves.push({ id: uid(), itemId, date, kind: 'out', qty, unitCost: it.avg, projectId, note, photo });
  it.qty = r2(it.qty - qty);
  const v = qty * it.avg;
  post(d, date, `เบิก${it.name} ${num(qty)} ${it.unit} ไป ${p.code}`, [{ acc: '5110', dr: v, projectId }, { acc: '1150', cr: v }]);
}
function stockCount(d, itemId, newQty, date, note = '', photo = null) {
  const it = d.items.find(i => i.id === itemId);
  if (!it) return 'ไม่พบสินค้า';
  const diff = r2(newQty - it.qty);
  if (diff === 0) return 'ยอดนับตรงกับในระบบอยู่แล้ว';
  d.moves.push({ id: uid(), itemId, date, kind: 'adjust', qty: diff, unitCost: it.avg, note: note || 'ปรับยอดตามนับจริง', photo });
  it.qty = r2(newQty);
  const v = Math.abs(diff) * it.avg;
  post(d, date, `ปรับยอด${it.name} ตามตรวจนับ ${diff > 0 ? '+' : ''}${num(diff)} ${it.unit}`,
    diff < 0 ? [{ acc: '5295', dr: v }, { acc: '1150', cr: v }] : [{ acc: '1150', dr: v }, { acc: '5295', cr: v }]);
}

/* สายอนุมัติตามยอดเงิน: หัวหน้าชุด → ผู้จัดการ → ผู้บริหาร เท่าที่วงเงินต้องการ */
function chainFor(s, cash) {
  const lim = s.settings.limits;
  const top = cash <= lim.lead ? 'lead' : cash <= lim.manager ? 'manager' : 'owner';
  return ['lead', 'manager', 'owner'].slice(0, RANK[top]);
}
const nextStep = b => b.status === 'pending' ? b.chain[b.approvals.length] : null;
const canApprove = (s, b) => b.status === 'pending' && RANK[s.role] >= RANK[nextStep(b)] && s.role !== 'staff';

function submitBill(d, b) {
  const t = billTotals(d, b);
  b.no = b.no || nextSeq(d, 'bill', 'EXP');
  b.status = 'pending'; b.approvals = []; b.chain = chainFor(d, t.cash); b.carried = false;
  b.submittedAt = new Date().toISOString();
  note(d, b.chain[0], `${b.no} ${b.vendor} ${baht(t.cash)} รอคุณอนุมัติ (${staffName(d, b.staffId)})`, b.id);
}
function approveBill(d, id, role) {
  const b = d.bills.find(x => x.id === id);
  if (!b || b.status !== 'pending') return 'บิลนี้ไม่ได้อยู่ในสถานะรออนุมัติ';
  if (RANK[role] < RANK[nextStep(b)]) return `ขั้นนี้ต้องให้${ROLE_SHORT[nextStep(b)]}อนุมัติ`;
  const at = new Date().toISOString();
  // ผู้อนุมัติที่สูงกว่าครอบคลุมขั้นที่ต่ำกว่าที่ยังค้าง
  while (b.approvals.length < b.chain.length && RANK[b.chain[b.approvals.length]] <= RANK[role]) {
    b.approvals.push({ step: b.chain[b.approvals.length], by: role, at });
  }
  const t = billTotals(d, b);
  if (b.approvals.length < b.chain.length) {
    note(d, nextStep(b), `${b.no} ${b.vendor} ${baht(t.cash)} ผ่าน${ROLE_SHORT[role]}แล้ว รอคุณอนุมัติ`, b.id);
    return;
  }
  b.status = 'approved'; b.approvedAt = at;
  // บรรทัดซื้อเข้าสต๊อก → รับเข้าคลัง ไม่ลงเป็นค่าใช้จ่ายโครงการ (กันนับซ้ำ)
  for (const l of b.lines.filter(l => l.kind === 'stock')) {
    stockIn(d, l.itemId, +l.qty, (+l.amount * t.vatFactor) / +l.qty, b.date, { billId: b.id, note: `${b.no} ${b.vendor}` });
  }
  const lines = b.lines.map(l => ({ acc: l.kind === 'stock' ? '1150' : CAT[l.cat || 'misc'].acc, dr: +l.amount * t.vatFactor, projectId: l.kind === 'stock' ? '' : b.projectId }));
  if (d.settings.vatRegistered && t.vat) lines.push({ acc: '1160', dr: t.vat });
  if (t.wht) lines.push({ acc: '2130', cr: t.wht });
  lines.push({ acc: b.claimType === 'advance' ? '1140' : '2110', cr: t.cash });
  post(d, b.date, `${CLAIM[b.claimType]} ${staffName(d, b.staffId)} · ${b.vendor}`, lines, b.no);
  note(d, 'staff', `${b.no} ${b.vendor} อนุมัติแล้ว${b.claimType === 'reimburse' ? ' รอจ่ายเงิน' : ''}`, b.id);
  if (b.claimType === 'reimburse') note(d, 'owner', `${b.no} รอจ่ายเงินคืน ${staffName(d, b.staffId)} ${baht(t.cash)}`, b.id);
}
function rejectBill(d, id, role, why) {
  const b = d.bills.find(x => x.id === id);
  if (!b || b.status !== 'pending') return 'บิลนี้ไม่ได้อยู่ในสถานะรออนุมัติ';
  b.status = 'rejected'; b.rejectNote = why; b.rejectedBy = role;
  note(d, 'staff', `${b.no} ${b.vendor} ถูกตีกลับ: ${why}`, b.id);
}
function payBill(d, id, pay) {
  const b = d.bills.find(x => x.id === id);
  if (!b || b.status !== 'approved' || b.claimType !== 'reimburse') return 'บิลนี้ไม่ได้อยู่ในสถานะรอจ่ายเงิน';
  const t = billTotals(d, b);
  b.status = 'paid'; b.payment = pay;
  post(d, pay.date, `จ่ายเงินคืน ${staffName(d, b.staffId)} (${PAY_METHOD[pay.method]}${pay.ref ? ' ' + pay.ref : ''})`,
    [{ acc: '2110', dr: t.cash }, { acc: pay.method === 'cash' ? '1110' : '1120', cr: t.cash }], b.no);
  note(d, 'staff', `${b.no} จ่ายเงินคืน ${baht(t.cash)} แล้ว (${PAY_METHOD[pay.method]})`, b.id);
}

// ยอดคงค้าง = เงินบริษัทที่พนักงานถืออยู่: เบิกสำรองจ่าย/บริษัทจ่ายคืน = บวก, พนักงานคืนเงิน = ลบ, บิลที่เคลียร์แล้ว = ลบ
const cashSign = c => c.kind === 'return' ? -c.amount : c.amount;
const isAdvance = c => c.kind === 'advance' || c.kind === 'fuel' || c.kind === 'material' || c.kind === 'other';
const cashClosed = (s, staffId, w) => s.cashWeeks.some(c => c.staffId === staffId && c.weekStart === w);
function openWeekFor(s, staffId, w) { while (cashClosed(s, staffId, w)) w = addDays(w, 7); return w; }
function addCash(d, c) {
  const e = { id: uid(), note: '', ...c };
  if (!e.no && CASH_KIND[e.kind]) e.no = nextSeq(d, 'adv', 'ADV');
  d.cash.push(e);
  const who = staffName(d, e.staffId);
  const [dr, cr, desc] = isAdvance(e) ? ['1140', '1120', CASH_KIND[e.kind] ? `เบิกสำรองจ่าย (${CASH_KIND[e.kind]})` : 'จ่ายเงินทดรอง']
    : e.kind === 'return' ? ['1110', '1140', 'รับคืนเงินทดรอง'] : ['1140', '1110', 'จ่ายคืนส่วนเกินเงินทดรอง'];
  post(d, e.date, `${desc} ${who}${e.note ? ' · ' + e.note : ''}`, [{ acc: dr, dr: e.amount }, { acc: cr, cr: e.amount }]);
}

function cashWeek(s, staffId, w) {
  const end = addDays(w, 7);
  const mine = s.cash.filter(c => c.staffId === staffId);
  const bills = s.bills.filter(b => b.staffId === staffId && b.claimType === 'advance');
  const opening = sum(mine.filter(c => c.date < w), cashSign)
    - sum(bills.filter(b => billDone(b) && b.weekStart < w), b => billTotals(s, b).cash);
  const cashIn = mine.filter(c => c.date >= w && c.date < end).sort((a, b) => a.date.localeCompare(b.date));
  const inWeek = bills.filter(b => b.weekStart === w);
  const approved = inWeek.filter(billDone);
  const approvedSum = sum(approved, b => billTotals(s, b).cash);
  const closing = r2(opening + sum(cashIn, cashSign) - approvedSum);
  return {
    opening: r2(opening), cashIn, approved, approvedSum, closing,
    pending: inWeek.filter(b => b.status === 'pending'),
    closed: s.cashWeeks.find(c => c.staffId === staffId && c.weekStart === w),
  };
}
const staffBalance = (s, staffId) => r2(sum(s.cash.filter(c => c.staffId === staffId), cashSign)
  - sum(s.bills.filter(b => b.staffId === staffId && b.claimType === 'advance' && billDone(b)), b => billTotals(s, b).cash));

function closeCashWeek(d, staffId, w, settle) {
  if (cashClosed(d, staffId, w)) return 'สัปดาห์นี้ปิดไปแล้ว';
  const info = cashWeek(d, staffId, w);
  for (const b of info.pending) { b.weekStart = addDays(w, 7); b.carried = true; }
  let bal = info.closing;
  if (settle && bal !== 0) {
    addCash(d, { staffId, date: addDays(w, 6), kind: bal > 0 ? 'return' : 'reimburse', amount: Math.abs(bal),
      note: bal > 0 ? 'คืนเงินทดรองที่เหลือตอนปิดสัปดาห์' : 'บริษัทจ่ายคืนตอนปิดสัปดาห์' });
    bal = 0;
  }
  d.cashWeeks.push({ staffId, weekStart: w, opening: info.opening, closing: bal, settle: !!settle, moved: info.pending.length, closedAt: new Date().toISOString() });
}

function rateRec(s, workerId, date) {
  const rs = s.rates.filter(r => r.workerId === workerId && r.from <= date).sort((a, b) => b.from.localeCompare(a.from));
  return rs.length ? rs[0] : null;
}
function rateFor(s, workerId, date) {
  const r = rateRec(s, workerId, date);
  return r ? r.daily : null;
}
// เรท OT ต่อชั่วโมง: ตั้งรายคนได้ ถ้าไม่ตั้งคิด ค่าแรง÷8×1.5
const otRateOf = r => r ? (+r.ot > 0 ? +r.ot : r.daily / 8 * 1.5) : null;
function calcPay(s, e) {
  let span = toMin(e.tout) - toMin(e.tin);
  const overnight = span <= 0;
  if (overnight) span += 1440;
  let hours = span / 60;
  if (hours > s.settings.breakAfter) hours -= s.settings.breakMin / 60;
  hours = Math.max(0, hours);
  // ผู้ดูแลกำหนดชั่วโมง OT เองได้ (เช่น บัตรตอกมีช่อง OT แยก) ไม่งั้นนับส่วนที่เกิน 8 ชม.
  const ot = e.otH != null ? Math.min(hours, Math.max(0, +e.otH || 0)) : Math.max(0, hours - 8);
  const reg = Math.min(8, hours - ot);
  const rr = rateRec(s, e.workerId, e.date);
  const rate = e.lockedRate != null ? e.lockedRate : rr ? rr.daily : null;
  const otRate = e.lockedOt != null ? e.lockedOt : e.lockedRate != null ? r2(e.lockedRate / 8 * 1.5) : otRateOf(rr);
  const k = e.holiday ? 2 : 1;
  const regPay = rate == null ? 0 : r2(rate / 8 * k * reg);
  let otPay = rate == null ? 0 : r2(otRate * k * ot);
  const pay = e.lockedPay != null ? e.lockedPay : r2(regPay + otPay);
  if (e.lockedPay != null) otPay = r2(pay - regPay);
  return { hours, reg, ot, rate, otRate, regPay, otPay, pay, overnight, locked: e.lockedPay != null };
}
function closeLaborWeek(d, w) {
  if (d.laborWeeks.includes(w)) return 'งวดนี้ปิดไปแล้ว';
  const es = d.time.filter(e => weekOf(e.date) === w);
  const missing = es.filter(e => rateFor(d, e.workerId, e.date) == null);
  if (missing.length) return `ยังมี ${missing.length} รายการที่ช่างไม่มีเรทค่าแรง ณ วันที่ทำงาน`;
  for (const e of es) { const c = calcPay(d, e); e.lockedRate = c.rate; e.lockedOt = c.otRate; e.lockedPay = c.pay; }
  d.laborWeeks.push(w);
}

function projectCosts(s) {
  const m = {};
  s.projects.forEach(p => { m[p.id] = { expense: 0, labor: 0, material: 0 }; });
  s.bills.filter(billDone).forEach(b => { if (m[b.projectId]) m[b.projectId].expense += billTotals(s, b).expense; });
  s.time.forEach(e => { if (m[e.projectId]) m[e.projectId].labor += calcPay(s, e).pay; });
  s.moves.filter(x => x.kind === 'out').forEach(x => { if (m[x.projectId]) m[x.projectId].material += x.qty * x.unitCost; });
  return m;
}

function lev(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return dp[a.length][b.length];
}

   รับได้ 3 แบบ: ไฟล์ "ส่งออกประวัติแชท" (เวลา<Tab>ชื่อ<Tab>ข้อความ ใต้บรรทัดวันที่),

   และข้อความที่พิมพ์เวลา ชื่อ ข้อความ คั่นด้วยช่องว่าง */
const LINE_MEDIA = /^\[(รูป|รูปภาพ|photo|image|อัลบั้ม|album)\]$/i;
const LINE_TAG = /^(?:\[[^\]\n]*(?:เบิก|สำรองจ่าย|เคลียร์|ทดรอง)[^\]\n]*\]|#?(?:เบิกค่าใช้จ่าย|เบิกเงินคืน|เบิกเงิน|เบิก|สำรองจ่าย|เคลียร์เงินทดรอง|เคลียร์ทดรอง|เคลียร์บิล|เคลียร์))/;
const dropMention = t => t.replace(/^\s*(?:@\S+\s+)*/, '');
const isClaimMsg = t => LINE_TAG.test(dropMention(t).trim());
const lineKey = m => { let h = 5381; for (const ch of `${m.date}|${m.time}|${m.sender}|${m.text}`) h = (h * 33 + ch.codePointAt(0)) >>> 0; return h.toString(36); };

function lineDate(str) {
  const m = str.match(/(\d{1,4})[./-](\d{1,2})[./-](\d{2,4})/);
  if (!m) return '';
  const a = +m[1], b = +m[2], c = +m[3];
  let y, mo, d;
  if (m[1].length === 4) [y, mo, d] = [a, b, c];
  else if (a > 12) [d, mo, y] = [a, b, c];
  else if (b > 12) [mo, d, y] = [a, b, c];
  else if (/^[\s,]*[A-Za-z]/.test(str)) [mo, d, y] = [a, b, c]; // แอป LINE ภาษาอังกฤษเรียง เดือน/วัน/ปี
  else [d, mo, y] = [a, b, c];
  if (y < 100) y += 2000;
  if (y > 2400) y -= 543;
  if (!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return '';
  return `${y}-${pad(mo)}-${pad(d)}`;
}
function lineTime(t, ap) {
  let [h, m] = t.split(':').map(Number);
  if (ap) { ap = ap.toUpperCase(); if (ap === 'PM' && h < 12) h += 12; if (ap === 'AM' && h === 12) h = 0; }
  return `${pad(h)}:${pad(m)}`;
}

function parseLineChat(src, names = []) {
  const msgs = [];
  const known = names.filter(Boolean).sort((a, b) => b.length - a.length);
  let date = '', last = null, open = false;
  const push = (d, time, sender, text, link = '') => {
    last = { date: d, time, sender: sender.trim(), text, link };
    msgs.push(last);
    open = text.startsWith('"') && !(text.length > 1 && text.endsWith('"'));
  };
  src.replace(/\r/g, '').replace(/[​﻿]/g, '').split('\n').forEach(line => {
    if (open) { last.text += '\n' + line; if (line.trimEnd().endsWith('"')) open = false; return; }
    if (!line.trim() || /^(บันทึกเมื่อ|saved on|\[line\])/i.test(line.trim())) return;
    let m = line.match(/^(\d{4}-\d{1,2}-\d{1,2}|\d{1,2}\/\d{1,2}\/\d{4})\t(\d{1,2}:\d{2})(?::\d{2})?\t([^\t]*)\t(.*)$/);
    if (m) {
      const cols = m[4].split('\t');
      const link = cols.slice(1).find(x => /^https?:\/\//.test(x.trim())) || '';
      return push(lineDate(m[1]), lineTime(m[2]), m[3], cols[0], link.trim().split(/\s+/)[0]);
    }
    m = line.match(/^(\d{1,2}:\d{2})\s*([AaPp][Mm])?\t([^\t]*)\t(.*)$/);
    if (m) return push(date, lineTime(m[1], m[2]), m[3], m[4]);
    m = line.match(/^(\d{1,2}:\d{2})\s*([AaPp][Mm])?\s+(.+)$/);
    if (m) {
      const body = m[3], name = known.find(n => body.startsWith(n + ' '));
      const sender = name || body.split(/\s+/)[0];
      return push(date, lineTime(m[1], m[2]), sender, body.slice(sender.length).trim());
    }
    if (!line.includes('\t') && line.length < 60 && lineDate(line)) { date = lineDate(line); last = null; return; }
    if (last) last.text += '\n' + line;
  });
  msgs.forEach(x => { x.text = x.text.replace(/^"([\s\S]*)"$/, '$1').replace(/""/g, '"').trim(); });
  return msgs;
}

/* ---------- แยกเรื่องเบิกจากข้อความ ----------
   แบบมีตัวคั่น: #เบิก P-2601 / ค่าขนส่งทราย / ร้านสมบูรณ์ทราย / 1,500 (คั่นด้วย / หรือขึ้นบรรทัดใหม่ สลับลำดับได้)

const CAT_WORDS = [
  ['fuel', /น้ำมัน|ดีเซล|เบนซิน|แก๊สโซฮอล์|โซล่า|ปตท|บางจาก/],
  ['travel', /เดินทาง|แท็กซี่|taxi|grab|แกร็บ|bolt|ที่พัก|โรงแรม|ทางด่วน|ค่าจอด|วินมอไซ/i],
  ['freight', /ขนส่ง|ค่ารถ|รถบรรทุก|ค่าส่ง|ค่าขน|lalamove|ลาลามูฟ|ไปรษณีย์/i],
  ['meal', /อาหาร|ข้าว|เบี้ยเลี้ยง|น้ำดื่ม|น้ำแข็ง|กาแฟ/],

  ['mat', /วัสดุ|ปูน|เหล็ก|ทราย|หิน|อิฐ|ท่อ|สายไฟ|สีทา|สีรองพื้น|กระเบื้อง|ไม้|ตะปู|น็อต|สกรู|ยิปซัม|กระจก|ก๊อก|สุขภัณฑ์|ข้อต่อ/],
];
const guessCat = t => (CAT_WORDS.find(([, re]) => re.test(t)) || ['misc'])[0];
const normTxt = x => String(x || '').toLowerCase().replace(/[\s\-_.()]/g, '');
const escRe = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const AMT = '((?:\\d{1,3}(?:,\\d{3})+|\\d+)(?:\\.\\d{1,2})?)';
const toAmt = x => r2(String(x).replace(/,/g, ''));

function matchProject(projects, str) {
  const n = normTxt(str).replace(/^(โครงการ|โปรเจกต์|โปรเจค|ไซต์|ไซท์|งาน)/, '');
  if (!n) return '';
  const byCode = projects.find(p => n.includes(normTxt(p.code)));
  if (byCode) return byCode.id;
  if (n.length < 3) return '';
  const hit = p => [p.name, p.client].map(normTxt).some(x => x.length >= 3 && (x.includes(n) || n.includes(x)));
  return (projects.find(hit) || {}).id || '';
}
function matchStaff(staff, str) {
  const n = normTxt(str);
  const st = staff.find(x => normTxt(x.name) === n || (n.length >= 2 && normTxt(x.name.split(/\s+/)[0]) === n));
  return st ? st.id : '';
}

function parseClaim(text, s) {
  const active = s.projects.filter(p => p.status === 'active');
  const body = dropMention(text).trim();
  const out = { claimType: /ทดรอง|เคลียร์/.test(body.slice(0, 40)) ? 'advance' : 'reimburse', amount: '', vat: '', projectId: '', projectHint: '', staffId: '', vendor: '', descr: '' };
  const rest = body.replace(LINE_TAG, '').replace(/^[\s:：\-–—\/|]+/, '').trim();
  const parts = rest.split(/\s*(?:\n|\/|\|)\s*/).map(x => x.trim()).filter(Boolean);
  const vatRe = /^(?:vat|ภาษี(?:มูลค่าเพิ่ม)?)\s*[:=]?\s*/i;
  const venPre = /^(?:ซื้อที่|ที่ร้าน|จากร้าน)\s*/;
  if (parts.length >= 2) {
    const desc = [];
    parts.forEach(p => {
      if (vatRe.test(p)) { const m = p.match(new RegExp(AMT)); if (m) out.vat = String(toAmt(m[1])); return; }
      const bare = p.replace(/บาท|บ\.|฿|thb|ยอดรวม|ยอด|รวม|จำนวนเงิน|[:=\s]/gi, '');
      if (/^(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d{1,2})?$/.test(bare)) { out.amount = String(toAmt(bare)); return; }
      if (!out.projectId) {
        const pid = matchProject(active, p);
        if (pid) { out.projectId = pid; return; }
        if (/^(โครงการ|โปรเจ|ไซต์|ไซท์)/.test(p)) { out.projectHint = p; return; }
      }
      if (!out.staffId) { const st = matchStaff(s.staff, p); if (st) { out.staffId = st; return; } }
      if (!out.vendor && (venPre.test(p) || /^(ร้าน|ปั๊ม|ห้าง|บจก|บริษัท|หจก)/.test(p))) { out.vendor = p.replace(venPre, ''); return; }
      desc.push(p);
    });
    out.descr = desc.join(' ');
  } else {
    let t = ' ' + rest + ' ';
    const take = (re, f) => { const m = t.match(re); if (m) { f(m); t = t.replace(m[0], ' '); } return m; };
    take(new RegExp(`(?:vat|ภาษี(?:มูลค่าเพิ่ม)?)\\s*[:=]?\\s*${AMT}`, 'i'), m => { out.vat = String(toAmt(m[1])); });
    const pj = t.match(/(?:โครงการ|โปรเจกต์|โปรเจค|ไซต์|ไซท์)\s*(\S+)/);
    if (pj) { out.projectId = matchProject(active, pj[1]); if (!out.projectId) out.projectHint = pj[1]; t = t.replace(pj[0], ' '); }
    if (!out.projectId) {
      const p = active.find(x => normTxt(t).includes(normTxt(x.code)));
      if (p) { out.projectId = p.id; t = t.replace(new RegExp(p.code.split(/[-\s.]+/).map(escRe).join('[-\\s.]?'), 'i'), ' '); }
    }
    for (const st of s.staff) if (!out.staffId && t.includes(st.name)) { out.staffId = st.id; t = t.replace(st.name, ' '); }
    take(/(?:ซื้อที่|ที่ร้าน|จากร้าน)\s*([^\s\d]+)/, m => { out.vendor = m[1]; }) || take(/((?:ร้าน|ปั๊ม|ห้าง)\s*[^\s\d]+)/, m => { out.vendor = m[1]; });
    const unit = t.match(new RegExp(`${AMT}\\s*(?:บาท|บ\\.|฿|thb)|฿\\s*${AMT}`, 'i'));
    if (unit) { out.amount = String(toAmt(unit[1] || unit[2])); t = t.replace(unit[0], ' '); }
    else {
      const all = [...t.matchAll(new RegExp(AMT, 'g'))].sort((a, b) => toAmt(b[1]) - toAmt(a[1]));
      if (all.length) { out.amount = String(toAmt(all[0][1])); t = t.replace(all[0][0], ' '); }
    }
    out.descr = t.replace(/บาท|บ\./g, ' ').replace(/\s+/g, ' ').replace(/^[\s,:;\-–]+|[\s,:;\-–]+$/g, '').trim();
  }
  out.cat = guessCat(`${out.descr} ${out.vendor}`);
  return out;
}

function readPhoto(file, max = 1024) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', 0.6);
        c.toBlob(blob => res({ url, blob }), 'image/jpeg', 0.8);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- เตรียมรูปใบเสร็จ ----------
   เก็บรูปต้นฉบับขนาดเล็กไว้เป็นหลักฐาน (ไม่ปรับแต่ง) และทำอีกชุดสำหรับส่ง AI:
   ตัดพื้นหลังรอบกระดาษออก ยืดความต่างสีให้ตัวหนังสือชัด (ช่วยรูปที่แสงจ้า / มืด / สะท้อน) */
const loadImage = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const fileToDataUrl = file => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
function drawScaled(img, max, box) {
  const b = box || { x: 0, y: 0, w: img.width, h: img.height };
  const k = Math.min(1, max / Math.max(b.w, b.h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(b.w * k)); c.height = Math.max(1, Math.round(b.h * k));
  c.getContext('2d').drawImage(img, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
  return c;
}
// หากรอบกระดาษ: กระดาษใบเสร็จสว่างกว่าพื้นหลัง ใช้เกณฑ์ Otsu แยกส่วนสว่าง แล้วหาแถว/คอลัมน์ที่เป็นกระดาษ
function findPaper(img) {
  const c = drawScaled(img, 240), w = c.width, h = c.height;
  const px = c.getContext('2d').getImageData(0, 0, w, h).data;
  const lum = new Uint8Array(w * h), hist = new Array(256).fill(0);
  for (let i = 0; i < w * h; i++) { const v = (px[i * 4] * 299 + px[i * 4 + 1] * 587 + px[i * 4 + 2] * 114) / 1000 | 0; lum[i] = v; hist[v]++; }
  let sum = 0; for (let t = 0; t < 256; t++) sum += t * hist[t];
  let sB = 0, wB = 0, best = 0, th = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue;
    const wF = w * h - wB; if (!wF) break;
    sB += t * hist[t];
    const between = wB * wF * (sB / wB - (sum - sB) / wF) ** 2;
    if (between > best) { best = between; th = t; }
  }
  const rows = new Array(h).fill(0), cols = new Array(w).fill(0);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (lum[y * w + x] > th) { rows[y]++; cols[x]++; }
  const span = (arr, need) => { let a = arr.findIndex(v => v > need), b = arr.length - 1 - [...arr].reverse().findIndex(v => v > need); return a < 0 ? null : [a, b]; };
  const ry = span(rows, w * 0.3), rx = span(cols, h * 0.3);
  if (!ry || !rx) return null;
  const area = (rx[1] - rx[0] + 1) * (ry[1] - ry[0] + 1) / (w * h);
  if (area < 0.2 || area > 0.96) return null;             // หาขอบไม่ชัด ใช้ทั้งรูปดีกว่าตัดผิด
  const s = img.width / w, m = 0.02;
  const x0 = Math.max(0, (rx[0] / w - m) * img.width), y0 = Math.max(0, (ry[0] / h - m) * img.height);
  const x1 = Math.min(img.width, ((rx[1] + 1) / w + m) * img.width), y1 = Math.min(img.height, ((ry[1] + 1) / h + m) * img.height);
  return s && { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
// ยืดช่วงสว่าง-มืดให้เต็ม (ตัดค่าสุดขั้ว 1%) เฉพาะรูปที่สีจางหรือมืด
function autoLevels(c) {
  const g = c.getContext('2d'), im = g.getImageData(0, 0, c.width, c.height), d = im.data, hist = new Array(256).fill(0), n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) hist[(d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000 | 0]++;
  let lo = 0, hi = 255, acc = 0;
  while (lo < 255 && (acc += hist[lo]) < n * 0.01) lo++;
  acc = 0; while (hi > 0 && (acc += hist[hi]) < n * 0.01) hi--;
  if (hi - lo < 30 || (lo < 12 && hi > 243)) return c;
  const k = 255 / (hi - lo);
  for (let i = 0; i < d.length; i += 4) for (let j = 0; j < 3; j++) d[i + j] = Math.max(0, Math.min(255, (d[i + j] - lo) * k));
  g.putImageData(im, 0, 0);
  return c;
}
// ลายนิ้วมือของรูป (average hash 16×16) ใช้จับรูปใบเสร็จเดียวกันที่ส่งซ้ำ แม้ถูกบีบอัดใหม่
function photoHash(img) {
  const c = document.createElement('canvas'); c.width = 16; c.height = 16;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, 16, 16);
  const d = g.getImageData(0, 0, 16, 16).data, v = [];
  for (let i = 0; i < d.length; i += 4) v.push(d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114);
  const avg = v.reduce((a, x) => a + x, 0) / v.length;
  let hex = '';
  for (let i = 0; i < v.length; i += 4) hex += ((v[i] > avg) << 3 | (v[i + 1] > avg) << 2 | (v[i + 2] > avg) << 1 | (v[i + 3] > avg)).toString(16);
  return hex;
}
async function prepReceipt(file) {
  const img = await loadImage(await fileToDataUrl(file));
  const url = drawScaled(img, 1024).toDataURL('image/jpeg', 0.6);
  const box = findPaper(img);
  const blob = await new Promise(r => autoLevels(drawScaled(img, 1600, box)).toBlob(r, 'image/jpeg', 0.85));
  return { url, aiBlob: blob, hash: photoHash(img), cropped: !!box };
}
const blobToB64 = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = rej; fr.readAsDataURL(blob); });

// เลขประจำตัวผู้เสียภาษี 13 หลัก ตรวจหลักสุดท้ายตามสูตรกรมสรรพากร
const cleanTaxId = x => String(x || '').replace(/\D/g, '');
function taxIdOk(x) {
  const d = cleanTaxId(x);
  if (d.length !== 13) return false;
  let s = 0; for (let i = 0; i < 12; i++) s += +d[i] * (13 - i);
  return (11 - s % 11) % 10 === +d[12];
}

// CSV แบบมี BOM ให้ Excel เปิดภาษาไทยได้ถูก
const exportCsv = (rows, filename) => {
  const head = Object.keys(rows[0] || {});
  const esc = v => { const t = v == null ? '' : String(v); return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const text = '﻿' + [head, ...rows.map(r => head.map(k => r[k]))].map(r => r.map(esc).join(',')).join('\r\n');
  downloadBlob(new Blob([text], { type: 'text/csv;charset=utf-8' }), `${filename}.csv`);
};

  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });

};

function LoginScreen({ onLogin, onRemoteLogin }) {
  const { s, rs } = useApp();
  const remote = rs.remote;
  const [f, setF] = useState({ user: '', pw: '' });
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const fails = useRef({ n: 0, until: 0 });
  const submit = async e => {
    e.preventDefault();
    if (remote) {
      setBusy(true); setErr('');
      try { await onRemoteLogin(f.user, f.pw); } catch (x) { setErr(x.message); setBusy(false); }
      return;
    }
    const now = Date.now();
    if (fails.current.until > now) { setErr(`ใส่รหัสผิดหลายครั้ง รออีก ${Math.ceil((fails.current.until - now) / 1000)} วินาที`); return; }
    const u = s.users.find(x => x.username === normUser(f.user));
    if (!u || !checkPw(u, f.pw)) {
      fails.current.n++;
      if (fails.current.n >= 5) { fails.current = { n: 0, until: now + 30000 }; setErr('ใส่รหัสผิด 5 ครั้ง ระบบพักการเข้า 30 วินาที'); }
      else setErr('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
      return;
    }
    if (u.active === false) { setErr('บัญชีนี้ถูกระงับ ติดต่อ Staff office'); return; }
    fails.current = { n: 0, until: 0 };
    onLogin(u);
  };
  return (
    <AuthShell title="เข้าสู่ระบบ" sub={remote ? 'ข้อมูลเก็บใน Google Sheets ของบริษัท · ใช้ชื่อผู้ใช้และรหัสจาก Staff office' : 'ใช้ชื่อผู้ใช้และรหัสผ่านที่ได้รับจาก Staff office'}>

  );
}
