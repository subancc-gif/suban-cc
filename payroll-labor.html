<style>
/* layout: แถบเมนูแบบเม็ดยาด้านบน + การ์ดเนื้อหา ใช้ชุดสีเดียวกับ AutoBOQ ของ SUBAN CC */
:root{
  --bg1:#EFEEEA;--bg2:#F4E9B4;--card:#FBF8EE;--card2:#F3EFE0;--ink:#262521;--muted:#7C776A;--line:#E7E1CF;

}

  --ok:#8CCB9B;--okbg:#1F3325;--warn:#F2C45A;--warnbg:#3A2F12;--bad:#F09A88;--badbg:#3D1F1A;--own:#C9C3B3;--ownbg:#34312A;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg1:#171613;--bg2:#29240F;--card:#211F1A;--card2:#2A2720;--ink:#EEEAE0;--muted:#A39E90;--line:#37332A;--dark:#0E0D0B;--pill:#211F1A;
  --ok:#8CCB9B;--okbg:#1F3325;--warn:#F2C45A;--warnbg:#3A2F12;--bad:#F09A88;--badbg:#3D1F1A;--own:#C9C3B3;--ownbg:#34312A;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}

  background:var(--bg1);background-image:linear-gradient(135deg,var(--bg1) 35%,var(--bg2) 100%);background-attachment:fixed;min-height:100vh}

.chk input{width:20px;height:20px;accent-color:var(--dark);flex:none}
.issues{display:flex;flex-direction:column;gap:6px}

.issue.bad{background:var(--badbg);color:var(--bad)}.issue.warn{background:var(--warnbg);color:var(--warn)}
.steps{display:flex;gap:4px;margin:12px 0 4px}
.steps span{flex:1;font-size:12.5px;text-align:center;padding:6px 2px 0;border-top:4px solid var(--line);color:var(--muted)}
.steps span.done{border-top-color:var(--ink);color:var(--ink)}
.steps span.cur{border-top-color:var(--yellow);color:var(--ink);font-weight:400}
dialog{border:0;border-radius:26px;background:var(--card);color:var(--ink);padding:0;width:min(960px,calc(100vw - 24px));max-height:calc(100vh - 24px)}

.dl-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 22px 0}

.cardimg{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--card2);display:block}
.login{max-width:400px;margin:8vh auto 0}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:var(--darkInk);padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:calc(100% - 32px);text-align:center}

#print{display:none}
.demo{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--dark);color:var(--darkInk);padding:10px 20px;font-size:13.5px}
.demo b{font-weight:500;color:var(--yellow);margin-right:6px}.demo label{display:flex;gap:8px;align-items:center;white-space:nowrap}.demo .sel{min-height:34px;padding:4px 8px;background:var(--pill);color:var(--ink)}
.slipview{overflow:auto;background:var(--card2);border-radius:14px;padding:12px}.slipview .slip{width:794px;margin:0 auto 12px}
@media (max-width:760px){.wrap{padding:10px 16px 48px}.nav{order:3;flex-basis:100%}.split{grid-template-columns:1fr}.me{margin-left:auto}}

.slip{font-family:var(--paper);font-weight:400;color:#1d1d1b;background:#fff;font-size:12.5px;line-height:1.45;padding:10mm 12mm;page-break-after:always;break-after:page}

.slip .sum{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}

  @page{size:A4;margin:0}
  body{background:#fff!important}

}
</style>
<div class="demo"><span><b>แอปทดลอง</b> ใช้โครงการ พนักงาน และคนงานชุดเดียวกับแอปสำรองจ่าย ไม่บันทึกจริง เปิดใหม่แล้วเริ่มต้นใหม่ · พิมพ์ PDF และดาวน์โหลด Excel ใช้ได้ในระบบจริงเท่านั้น</span><label>ลองดูในบทบาท <select id="demoRole" class="sel"><option value="admin">ผู้ดูแลระบบ</option><option value="hr">ฝ่ายบุคคล (HR)</option><option value="foreman">โฟร์แมน</option><option value="account">ฝ่ายบัญชี</option></select></label></div>

<script>
/* แอปทดลอง: จำลองเซิร์ฟเวอร์ในเบราว์เซอร์ ข้อมูลอยู่ในหน่วยความจำเท่านั้น */
window.DEMO = true;
window.confirm = () => true;
window.prompt = () => "ทดลองปลดล็อก";
(function () {
  const M = { docs: {}, audit: [], role: "admin", t: Date.now(),
    users: [{ id: "u1", username: "admin", name: "ผู้ทดลอง", role: "admin", active: 1, ext_id: "" }, { id: "u2", username: "foreman1", name: "โฟร์แมน ตัวอย่าง", role: "foreman", active: 1, ext_id: "" }, { id: "u3", username: "acc1", name: "บัญชี ตัวอย่าง", role: "account", active: 1, ext_id: "" }] };
  const SYNC = ["workers", "staff", "sites", "days", "advances", "periods", "settings", "cardrefs"];
  const WRITE = { workers: ["admin", "hr"], photos: ["admin", "hr"], sites: ["admin", "hr"], staff: ["admin", "hr"], settings: ["admin", "hr"], days: ["admin", "hr", "foreman"], cards: ["admin", "hr", "foreman"], cardrefs: ["admin", "hr", "foreman"], advances: ["admin", "hr", "foreman", "account"], periods: ["admin", "hr", "foreman", "account"] };
  const MOVE = { "open>submitted": ["admin", "hr", "foreman"], "submitted>open": ["admin", "hr"], "open>approved": ["admin", "hr"], "submitted>approved": ["admin", "hr"], "approved>paid": ["admin", "account"], "approved>open": ["admin"], "paid>open": ["admin"] };
  const NAME = { admin: "ผู้ทดลอง (ผู้ดูแลระบบ)", hr: "ผู้ทดลอง (HR)", foreman: "ผู้ทดลอง (โฟร์แมน)", account: "ผู้ทดลอง (บัญชี)" };
  const me = () => ({ id: "demo-" + M.role, username: "demo", name: NAME[M.role], role: M.role });
  const key = (c, i) => c + "/" + i;
  const set = (c, i, data) => { M.docs[key(c, i)] = { col: c, id: i, data, at: ++M.t }; };
  const pid = (d) => d.slice(0, 7) + (+d.slice(8) <= 15 ? "-A" : "-B");
  const lock = (d) => (M.docs[key("periods", pid(d))]?.data?.status) || "open";
  const res = (obj, status = 200) => new Response(JSON.stringify(obj), { status, headers: { "content-type": "application/json" } });
  const fail = (s, error, code) => res({ error, code: code || "error" }, s);

  /* ข้อมูลตัวอย่างสมมุติ */
  /* ข้อมูลชุดเดียวกับแอปสำรองจ่าย (SUBAN CC หน้างาน) ใช้รหัสเดียวกัน (pj*, st*, w*) นำเข้าไฟล์สำรองจริงแล้วจะอัปเดตทับรายการเดิมตามรหัส */
  set("sites", "pj1", { code: "P-2601", name: "บ้านพัก 2 ชั้น คุณวรรณา", client: "คุณวรรณา ทองดี", budget: 3200000, status: "active", from: "expense" });
  set("sites", "pj2", { code: "P-2602", name: "ต่อเติมโกดัง สยามพาเลท", client: "บจก. สยามพาเลท", budget: 1850000, status: "active", from: "expense" });
  set("sites", "pj3", { code: "P-2603", name: "รีโนเวทร้านกาแฟ ซอยอารีย์", client: "คุณธีระ วงศ์ใหญ่", budget: 640000, status: "active", from: "expense" });
  set("staff", "st1", { name: "สมพล ใจดี", position: "โฟร์แมน P-2601", site: "pj1" });
  set("staff", "st2", { name: "บุญชัย เจริญสิน", position: "ผู้คุมงาน P-2602", site: "pj2" });
  const W = [["w1", "W001", "วิทยา มั่นคง", "ช่างปูน", 520, true, "st1", "pj1"], ["w2", "W002", "บัญชา ช่างกล", "ช่างเหล็ก", 480, true, "st1", "pj1"], ["w3", "W003", "สมศรี แก้วใส", "กรรมกร", 380, false, "st2", "pj2"], ["w4", "W004", "ธนพล ศรีสุข", "ช่างไฟฟ้า", 650, false, "st2", "pj2"]];
  for (const [id, code, name, team, rate, sso, foreman, site] of W) set("workers", id, { code, name, pos: team, team, foreman, site, nation: "ไทย", wtype: "daily", rate, sso, start: "2026-01-01", status: "active", consent: "2026-08-01", hasPhoto: false, from: "expense", priv: { idNo: "", bank: "", bankNo: "", phone: "" } });
  const day = (w, d, st, i, o, site) => set("days", w + "_2026-10-" + d, { w, date: "2026-10-" + d, st, in: st === "work" ? i || "" : "", out: st === "work" ? o || "" : "", site: site || "" });
  for (const d of ["01", "02", "03", "05", "06"]) {
    day("w1", d, "work", "07:55", d === "02" ? "19:30" : "17:00", "pj1"); day("w2", d, "work", "08:00", d === "05" ? "20:00" : "17:00", "pj1");
    day("w3", d, d === "02" ? "absent" : "work", d === "03" ? "08:20" : "08:00", d === "05" ? "" : "17:00", "pj2");
    day("w4", d, d === "06" ? "sick" : "work", "08:00", "18:00", d === "03" ? "pj3" : "pj2");
  }
  day("w1", "04", "work", "08:00", "19:00", "pj1"); day("w2", "04", "work", "08:00", "17:00", "pj1");
  set("advances", "a1", { w: "w1", date: "2026-10-02", amt: 300, note: "ค่ารถ", consent: true, by: "โฟร์แมน ตัวอย่าง", at: Date.now() });
  set("advances", "a2", { w: "w3", date: "2026-10-05", amt: 2500, note: "เบิกฉุกเฉิน", consent: true, by: "โฟร์แมน ตัวอย่าง", at: Date.now() });

  function write(col, id, data) {
    const u = me();
    if (!WRITE[col]) return fail(400, "ไม่รู้จักชนิดข้อมูลนี้");
    if (!WRITE[col].includes(u.role)) return fail(403, "บัญชีของคุณไม่มีสิทธิ์แก้ไขส่วนนี้", "forbidden");
    const before = M.docs[key(col, id)]?.data || null;
    if (col === "days" || col === "advances") for (const d of [before?.date, data?.date]) { if (!d) continue; const st = lock(d);
      if (st === "approved" || st === "paid") return fail(423, "งวดนี้อนุมัติและล็อกแล้ว แก้ไขไม่ได้ ให้ผู้ดูแลระบบปลดล็อกก่อน", "locked");
      if (st === "submitted" && u.role === "foreman") return fail(423, "งวดนี้ส่งให้ HR ตรวจแล้ว ให้ HR ส่งกลับก่อนจึงจะแก้ไขได้", "locked"); }
    if (col === "periods") { const from = before?.status || "open", to = data.status || "open";
      if (from !== to) { const ok = MOVE[from + ">" + to]; if (!ok) return fail(400, "เปลี่ยนสถานะงวดแบบนี้ไม่ได้"); if (!ok.includes(u.role)) return fail(403, "บัญชีของคุณไม่มีสิทธิ์เปลี่ยนสถานะงวดขั้นนี้", "forbidden");
        data.hist = [...(before?.hist || []), { at: Date.now(), by: u.name, from, to, reason: data.reason || "" }]; } }
    if (col === "workers" && data && before?.priv && !data.priv) data.priv = before.priv;
    const slim = (o) => o == null ? null : JSON.stringify(col === "photos" || col === "cards" ? { ...o, img: "" } : col === "periods" ? { ...o, snap: undefined } : o);
    M.audit.unshift({ at: Date.now(), byname: u.name, col, doc: id, action: data == null ? "ลบ" : before ? "แก้ไข" : "เพิ่ม", before: slim(before), after: slim(data) });
    set(col, id, data); return res({ ok: true });
  }
  const real = window.fetch.bind(window);
  window.fetch = async (url, opt = {}) => {
    const u = new URL(String(url), "https://demo.local"); if (!u.pathname.startsWith("/api/")) return real(url, opt);
    const p = u.pathname, q = u.searchParams, method = opt.method || "GET", body = opt.body ? JSON.parse(opt.body) : {};
    if (p === "/api/state") return res({ setup: false, me: me(), ai: true });
    if (p === "/api/logout") return res({ ok: true });
    if (p === "/api/sync") { const since = +q.get("since") || 0; return res({ now: M.t, docs: Object.values(M.docs).filter(d => SYNC.includes(d.col) && d.at >= since).map(d => { let data = d.data && JSON.parse(JSON.stringify(d.data)); if (data && d.col === "workers" && M.role === "foreman") delete data.priv; return { ...d, data }; }) }); }
    if (p === "/api/doc") { const col = q.get("col"), id = q.get("id"); if (method === "GET") return res({ data: M.docs[key(col, id)]?.data || null }); return write(col, id, method === "DELETE" ? null : body.data); }
    if (p === "/api/audit") { if (!["admin", "hr"].includes(M.role)) return fail(403, "ดูบันทึกการแก้ไขได้เฉพาะ HR และผู้ดูแลระบบ"); const doc = q.get("doc"); return res({ rows: M.audit.filter(a => !doc || (a.col === q.get("col") && a.doc === doc)).slice(0, 200) }); }
    if (p === "/api/users") { if (M.role !== "admin") return fail(403, "จัดการผู้ใช้ได้เฉพาะผู้ดูแลระบบ"); if (method === "POST") { const x = M.users.find(z => z.id === body.id); if (x) Object.assign(x, { role: body.role, active: body.active === false ? 0 : 1, ext_id: body.ext_id || "" }); else M.users.push({ id: "u" + Date.now(), username: body.username, name: body.name, role: body.role, active: 1, ext_id: body.ext_id || "" }); } return res({ users: M.users }); }
    if (p === "/api/ai") { await new Promise(r => setTimeout(r, 900)); const from = +(/(\d{4}-\d{2}-(\d{2}))/.exec(body.hint || "") || [])[2] || 1;
      return res({ model: "ตัวอย่าง", result: { name: "", rows: [{ day: from, in: "07:58", out: "17:04", conf: 0.96 }, { day: from + 1, in: "08:01", out: "19:32", conf: 0.91 }, { day: from + 2, in: "08:15", out: "", conf: 0.35 }], note: "คำตอบจำลองของแอปทดลอง ไม่ได้อ่านจากรูปจริง" } }); }
    return fail(404, "ไม่พบคำสั่งนี้");
  };
  document.addEventListener("change", (e) => { if (e.target.id === "demoRole") { M.role = e.target.value; ME = null; USERS = null; AUDIT = null; view = M.role === "account" ? "period" : "time"; boot(); } });
})();
</script>
<script>
"use strict";
/* ===================== helpers ===================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const f2=n=>(Math.round((+n||0)*100)/100).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const f0=n=>Math.round(+n||0).toLocaleString("th-TH");
const fh=n=>{n=+n||0;return n?(+n.toFixed(2)).toLocaleString("th-TH"):"–";};
const r2=n=>Math.round((+n||0)*100)/100;
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const D=s=>new Date(s+"T00:00:00");
const today=()=>ymd(new Date());
const dTH=(s,o)=>s?D(s).toLocaleDateString("th-TH",o||{day:"numeric",month:"short",year:"2-digit"}):"";
const dShort=s=>D(s).toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"});
const tm=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||"");return m&&+m[1]<24&&+m[2]<60?+m[1]*60+ +m[2]:null;};
let toastT;function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),3600);}
const lsGet=k=>{return null;try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
const lsSet=(k,v)=>{return false;try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}};

/* ===================== settings & rules ===================== */
const DEF={company:"บริษัท สุบรรณ ซีซี จำกัด",stdStart:"08:00",stdEnd:"17:00",normalHours:8,breaks:[["12:00","13:00"]],graceLate:5,otStep:30,
  otMult:1.5,holMult:2,holOtMult:3,weeklyOff:[0],paidHoliday:true,sickPaid:true,daysPerWeek:6,ssoRate:5,ssoMin:1650,ssoMax:17500,minWage:400,
  holidays:[{d:"2026-10-13",name:"วันนวมินทรมหาราช"},{d:"2026-10-23",name:"วันปิยมหาราช"},{d:"2026-12-05",name:"วันพ่อแห่งชาติ"},{d:"2026-12-10",name:"วันรัฐธรรมนูญ"},{d:"2026-12-31",name:"วันสิ้นปี"}]};
let S={...DEF};
const ROLE_TH={admin:"ผู้ดูแลระบบ",hr:"ฝ่ายบุคคล (HR)",foreman:"โฟร์แมน",account:"ฝ่ายบัญชี"};
const ST_TH={work:"มาทำงาน",absent:"ขาดงาน",sick:"ลาป่วย",leave:"ลากิจ"};
const P_TH={open:"กำลังบันทึก",submitted:"รอ HR ตรวจ",approved:"อนุมัติและล็อกแล้ว",paid:"จ่ายแล้ว"};
const P_CHIP={open:"",submitted:"warn",approved:"ok",paid:"dk"};

/* ===================== period maths ===================== */
const pidOf=date=>date.slice(0,7)+(+date.slice(8)<=15?"-A":"-B");
function pRange(pid){const [y,m,h]=pid.split("-");const last=new Date(+y,+m,0).getDate();
  const from=`${y}-${m}-${h==="A"?"01":"16"}`,to=`${y}-${m}-${h==="A"?"15":pad(last)}`;
  const pay=h==="A"?`${y}-${m}-20`:ymd(new Date(+y,+m,5));
  return{from,to,pay,label:`${D(from).getDate()}–${dTH(to,{day:"numeric",month:"long",year:"numeric"})}`};}
function pShift(pid,n){let [y,m,h]=pid.split("-");y=+y;m=+m;let i=(y*12+(m-1))*2+(h==="B"?1:0)+n;const mm=Math.floor(i/2);return `${Math.floor(mm/12)}-${pad(mm%12+1)}-${i%2?"B":"A"}`;}
function datesOf(pid){const {from,to}=pRange(pid);const out=[];for(let d=D(from);ymd(d)<=to;d.setDate(d.getDate()+1))out.push(ymd(d));return out;}
function dayType(date){if(S.holidays.some(h=>h.d===date))return "hol";if(S.weeklyOff.includes(D(date).getDay()))return "off";return "norm";}
const rateDay=w=>w.wtype==="weekly"?(+w.rate||0)/(+S.daysPerWeek||6):(+w.rate||0);

/* คำนวณหนึ่งวันของคนงานหนึ่งคน */
function calcDay(w,date,d){
  const t=dayType(date),rd=rateDay(w),hr=rd/S.normalHours;
  const o={date,t,st:d?.st||"",in:d?.in||"",out:d?.out||"",site:d?.site||"",nh:0,ot:0,late:0,pay:0,otPay:0,flag:""};
  if((w.start&&date<w.start)||(w.end&&date>w.end)){o.st="na";return o;}
  if(!d||!d.st){if(t==="hol"&&S.paidHoliday){o.st="holpaid";o.pay=r2(rd);}else if(t==="norm")o.flag="nodata";return o;}
  if(d.st==="work"){
    const a=tm(d.in),b=tm(d.out);if(a==null||b==null){o.flag="missing";return o;}
    const e=b<=a?b+1440:b;let mins=e-a;
    for(const [x,y] of S.breaks){const bs=tm(x),be=tm(y);if(bs==null||be==null)continue;for(const k of [0,1440])mins-=Math.max(0,Math.min(e,be+k)-Math.max(a,bs+k));}
    if(mins>16*60)o.flag="long";
    const nm=Math.min(mins,S.normalHours*60);o.nh=r2(nm/60);
    o.ot=Math.floor(Math.max(0,mins-S.normalHours*60)/S.otStep)*S.otStep/60;
    const ss=tm(S.stdStart);if(t==="norm"&&ss!=null&&a-ss>S.graceLate&&a-ss<360)o.late=a-ss;
    if(t==="norm"){o.pay=r2(hr*nm/60);o.otPay=r2(hr*S.otMult*o.ot);}else{o.pay=r2(hr*S.holMult*nm/60);o.otPay=r2(hr*S.holOtMult*o.ot);}
  }else if(d.st==="sick"&&S.sickPaid)o.pay=r2(rd);
  return o;
}
const dayDoc=(wid,date)=>DB.days[wid+"_"+date];
function advOf(wid,pid){const {from,to}=pRange(pid);return Object.entries(DB.advances).filter(([,a])=>a.w===wid&&a.date>=from&&a.date<=to).map(([id,a])=>({id,...a}));}
function baseOnly(w,pid){const sn=DB.periods[pid]?.snap?.rows?.[w.id];if(sn)return{base:sn.base,sso:sn.sso};let b=0;for(const dt of datesOf(pid))b+=calcDay(w,dt,dayDoc(w.id,dt)).pay;return{base:r2(b),sso:null};}
const ssoAmt=b=>b>0?Math.round(Math.min(Math.max(b,S.ssoMin),S.ssoMax)*S.ssoRate/100):0;
/* ประกันสังคมคิดเป็นรายเดือนตามเดือนที่จ่าย: งวดที่จ่ายวันที่ 5 หักก่อน งวดวันที่ 20 หักส่วนที่เหลือของเดือน */
function ssoFor(w,pid,base){
  if(!w.sso)return 0;
  if(pid.endsWith("-B"))return ssoAmt(base);
  const prev=baseOnly(w,pShift(pid,-1));const s1=prev.sso!=null?prev.sso:ssoAmt(prev.base);
  return Math.max(0,ssoAmt(prev.base+base)-s1);
}
function calcPeriod(w,pid){
  const r={w:w.id,code:w.code||"",name:w.name||"",pos:w.pos||"",rate:+w.rate||0,wtype:w.wtype||"daily",days:[],nd:0,nh:0,ot:0,hd:0,hh:0,hot:0,lateN:0,lateMin:0,absent:0,sick:0,leave:0,holpaid:0,nodata:0,missing:0,
    payNorm:0,payHol:0,payLeave:0,otPay:0,hotPay:0,sites:{}};
  for(const dt of datesOf(pid)){const c=calcDay(w,dt,dayDoc(w.id,dt));r.days.push(c);
    if(c.flag==="nodata")r.nodata++;if(c.flag==="missing")r.missing++;
    if(c.st==="work"&&!c.flag||c.flag==="long"){if(c.t==="norm"){r.nd++;r.nh+=c.nh;r.ot+=c.ot;r.payNorm+=c.pay;r.otPay+=c.otPay;}else{r.hd++;r.hh+=c.nh;r.hot+=c.ot;r.payHol+=c.pay;r.hotPay+=c.otPay;}
      if(c.late){r.lateN++;r.lateMin+=c.late;}
      const k=c.site||"-";const s=r.sites[k]=r.sites[k]||{days:0,pay:0,ot:0};s.days++;s.pay=r2(s.pay+c.pay);s.ot=r2(s.ot+c.otPay);}
    else if(c.st==="absent")r.absent++;else if(c.st==="sick"){r.sick++;r.payLeave+=c.pay;}else if(c.st==="leave")r.leave++;else if(c.st==="holpaid"){r.holpaid++;r.payLeave+=c.pay;}
  }
  for(const k of ["nh","ot","hh","hot","payNorm","payHol","payLeave","otPay","hotPay"])r[k]=r2(r[k]);
  r.base=r2(r.payNorm+r.payHol+r.payLeave);r.gross=r2(r.base+r.otPay+r.hotPay);
  r.sso=ssoFor(w,pid,r.base);
  r.advList=advOf(w.id,pid).map(a=>({date:a.date,amt:+a.amt||0,note:a.note||""}));
  r.adv=r2(r.advList.reduce((a,x)=>a+x.amt,0));
  r.advDed=r2(Math.min(r.adv,Math.max(0,r.gross-r.sso)));r.carry=r2(r.adv-r.advDed);
  r.net=r2(r.gross-r.sso-r.advDed);
  return r;
}
function periodRows(pid){
  const p=DB.periods[pid];
  if(p?.snap&&(p.status==="approved"||p.status==="paid"))return Object.values(p.snap.rows).sort((a,b)=>(a.code||"").localeCompare(b.code||"",undefined,{numeric:true}));
  const {from,to}=pRange(pid);
  return workers().filter(w=>!(w.start&&w.start>to)&&!(w.end&&w.end<from)&&(w.status!=="left"||datesOf(pid).some(d=>dayDoc(w.id,d))||advOf(w.id,pid).length))
    .map(w=>calcPeriod(w,pid)).filter(r=>r.gross||r.adv||DB.workers[r.w].status!=="left");
}
const workers=()=>Object.entries(DB.workers).map(([id,w])=>({id,...w})).sort((a,b)=>(a.code||"").localeCompare(b.code||"",undefined,{numeric:true})||(a.name||"").localeCompare(b.name||"","th"));
const sites=()=>Object.entries(DB.sites).map(([id,s])=>({id,...s})).sort((a,b)=>(a.code||"").localeCompare(b.code||""));
const staffList=()=>Object.entries(DB.staff||{}).map(([id,s])=>({id,...s})).sort((a,b)=>(a.name||"").localeCompare(b.name||"","th"));
const openSites=()=>sites().filter(s=>s.status!=="closed");
const siteName=id=>id&&id!=="-"?(DB.sites[id]?`${DB.sites[id].code||""} ${DB.sites[id].name||""}`.trim():"(ไซต์ที่ลบแล้ว)"):"ไม่ระบุไซต์";

/* ===================== data layer: cache + offline outbox ===================== */
const COLS=["workers","staff","sites","days","advances","periods","settings","cardrefs"];
let ME=null,AI=false,DB=null,since=0,outbox=[],online=true,flushing=false;
const blank=()=>Object.fromEntries(COLS.map(c=>[c,{}]));
const ck=()=>"payroll.cache."+ME.id+"."+ME.role;
function saveCache(){lsSet(ck(),{DB,since});lsSet("payroll.outbox."+ME.id,outbox);}
async function call(path,opt){const r=await fetch(path,{credentials:"same-origin",...opt,headers:{"content-type":"application/json",...(opt?.headers||{})}});
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){const e=new Error(j?.error||"ระบบขัดข้อง");e.status=r.status;e.code=j?.code;throw e;}return j;}
function applySettings(){S={...DEF,...(DB.settings.main||{})};}
async function sync(){
  if(!ME)return;
  try{const j=await call("/api/sync?since="+Math.max(0,since-3000));online=true;let ch=false;
    for(const d of j.docs){if(outbox.some(o=>o.col===d.col&&o.id===d.id))continue;
      const cur=DB[d.col][d.id];if(d.data==null){if(cur){delete DB[d.col][d.id];ch=true;}}else if(JSON.stringify(cur)!==JSON.stringify(d.data)){DB[d.col][d.id]=d.data;ch=true;}}
    since=j.now;if(ch){applySettings();saveCache();if(!busyEditing())render();}
  }catch(e){if(e.status===401){ME=null;boot();return;}online=false;}
  status();
}
function put(col,id,data){if(DB[col]){if(data==null)delete DB[col][id];else DB[col][id]=data;}if(col==="settings")applySettings();
  const i=outbox.findIndex(o=>o.col===col&&o.id===id&&!o.sending);const job={col,id,data};if(i>=0)outbox[i]=job;else outbox.push(job);saveCache();status();return flush();}
async function flush(){
  if(flushing)return;flushing=true;
  while(outbox.length){const job=outbox[0];job.sending=true;
    try{await call(`/api/doc?col=${job.col}&id=${encodeURIComponent(job.id)}`,job.data==null?{method:"DELETE"}:{method:"PUT",body:JSON.stringify({data:job.data})});online=true;outbox.shift();}
    catch(e){job.sending=false;if(e.status){outbox.shift();toast(e.message);since=0;saveCache();flushing=false;status();await fullReload();return;}online=false;break;}
  }
  flushing=false;saveCache();status();
}
async function fullReload(){DB=blank();since=0;await sync();render();}
function status(){const el=$("syncst");if(!el)return;const n=outbox.length;
  el.className="chip "+(!online?"bad":n?"warn":"ok");el.textContent=!online?`ออฟไลน์${n?` · รอส่ง ${n} รายการ`:""}`:n?`กำลังบันทึก ${n} รายการ`:"บันทึกแล้ว";}
window.addEventListener("online",()=>{flush().then(sync);});
setInterval(()=>{if(ME&&!document.hidden){flush().then(sync);}},15000);
document.addEventListener("visibilitychange",()=>{if(ME&&!document.hidden)flush().then(sync);});
function busyEditing(){const a=document.activeElement;return $("dlg").open||!!(a&&a.matches&&a.matches("input,textarea,select")&&a.closest("#view"));}
const can=(...roles)=>ME&&(ME.role==="admin"||roles.includes(ME.role));
const pStatus=pid=>DB.periods[pid]?.status||"open";
function dateLocked(date){const st=pStatus(pidOf(date));return st==="approved"||st==="paid"||(st==="submitted"&&ME.role==="foreman");}

/* ===================== photos ===================== */
const phCache={};
async function photo(wid){if(wid in phCache)return phCache[wid];if(!DB.workers[wid]?.hasPhoto)return phCache[wid]=null;
  try{const j=await call(`/api/doc?col=photos&id=${wid}`);phCache[wid]=j.data?.img||null;}catch(e){return null;}return phCache[wid];}
const initials=n=>(n||"?").trim().slice(0,2);
const phHtml=(w,cls)=>`<span class="ph ${cls||""}" data-ph="${w.id||w.w}">${esc(initials(w.name))}</span>`;
function fillPhotos(root){(root||document).querySelectorAll("[data-ph]").forEach(async el=>{const src=await photo(el.dataset.ph);if(src&&el.isConnected)el.innerHTML=`<img src="${src}" alt="">`;});}
function shrink(file,max,q){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);res(c.toDataURL("image/jpeg",q));};im.onerror=()=>rej(new Error("เปิดรูปไม่ได้"));im.src=URL.createObjectURL(file);});}
async function sha(text){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,24);}

/* ===================== boot / login ===================== */
let view="time",curDate=today(),curPid=pidOf(today()),curSite="",wq="",wFilter="active";
async function boot(){
  let st;try{st=await call("/api/state");if(st.me)lsSet("payroll.me",{me:st.me,ai:st.ai});}catch(e){const c=lsGet("payroll.me");if(c&&!e.status){st={me:c.me,ai:c.ai};online=false;}else{$("app").innerHTML=`<div class="card login"><h2>เชื่อมต่อระบบไม่ได้</h2><p class="sub">${esc(e.message)}</p><button class="btn y" onclick="location.reload()">ลองใหม่</button></div>`;return;}}
  AI=st.ai;
  if(st.setup)return authScreen(true);
  if(!st.me)return authScreen(false);
  ME=st.me;const c=lsGet(ck());DB=c?.DB||blank();for(const k of COLS)DB[k]=DB[k]||{};since=c?.since||0;outbox=lsGet("payroll.outbox."+ME.id)||[];applySettings();
  if(ME.role==="account")view="period";
  shell();render();await flush();await sync();render();
  
}
function authScreen(setup){
  $("app").innerHTML=`<div class="card login"><div class="logo" style="width:max-content;margin-bottom:18px"><b>§</b><span>SUBAN CC</span></div>

/* ===================== view: ลงเวลา ===================== */
function dayNote(c){if(c.st==="na")return "";if(c.flag==="missing")return `<span class="chip bad">ลืมตอก</span>`;
  const a=[];if(c.st==="work"){a.push(`ปกติ ${fh(c.nh)} ชม.`);if(c.ot)a.push(`OT ${fh(c.ot)} ชม.`);if(c.late)a.push(`<span class="chip warn">สาย ${c.late} นาที</span>`);if(c.flag==="long")a.push(`<span class="chip bad">เกิน 16 ชม. ตรวจเวลา</span>`);}
  return a.join(" · ");}

  const pid=pidOf(curDate),st=pStatus(pid),lock=dateLocked(curDate)||!can("hr","foreman"),t=dayType(curDate);

    <td class="l"><select class="sel" id="st-${w.id}" data-k="st" aria-label="สถานะ" ${lock?"disabled":""}><option value="">–</option>${Object.entries(ST_TH).map(([k,v])=>`<option value="${k}" ${d.st===k?"selected":""}>${v}</option>`).join("")}</select></td>
    <td><input class="t-in ${d.conf!=null&&d.conf<.7&&!d.ok?"lo":""}" type="time" id="in-${w.id}" data-k="in" value="${esc(d.in||"")}" aria-label="เวลาเข้า" ${lock||d.st&&d.st!=="work"?"disabled":""}></td>
    <td><input class="t-in ${d.conf!=null&&d.conf<.7&&!d.ok?"lo":""}" type="time" id="out-${w.id}" data-k="out" value="${esc(d.out||"")}" aria-label="เวลาออก" ${lock||d.st&&d.st!=="work"?"disabled":""}></td>
    <td class="l"><select class="sel" id="si-${w.id}" data-k="site" aria-label="ไซต์งาน" ${lock?"disabled":""}><option value="">ไม่ระบุ</option>${sites().filter(s=>s.status!=="closed"||d.site===s.id).map(s=>`<option value="${s.id}" ${d.site===s.id?"selected":""}>${esc(s.code||s.name)}</option>`).join("")}</select></td>
    <td class="l wrap-ok" data-note>${dayNote(c)}${d.src==="card"?` <span class="chip">จากบัตรตอก</span>`:""}</td>

  $("view").innerHTML=`<h1>ลงเวลา ${esc(dShort(curDate))}</h1>
   <div class="sub">${t==="hol"?`<span class="chip warn">วันหยุดประเพณี: ${esc(hol?.name||"")}</span> ทำงานวันนี้ได้ ${S.holMult} เท่า ล่วงเวลา ${S.holOtMult} เท่า`:t==="off"?`<span class="chip warn">วันหยุดประจำสัปดาห์</span> ทำงานวันนี้ได้ ${S.holMult} เท่า ล่วงเวลา ${S.holOtMult} เท่า`:`วันทำงานปกติ ${S.stdStart}–${S.stdEnd} พัก ${S.breaks.map(b=>b.join("–")).join(", ")} ล่วงเวลา ${S.otMult} เท่า`}
     · งวด ${esc(pRange(pid).label)} <span class="chip ${P_CHIP[st]}">${P_TH[st]}</span></div>
   <div class="stats"><div class="stat"><div class="n">${n.work}</div><div class="l">มาทำงาน</div></div><div class="stat"><div class="n">${n.absent}</div><div class="l">ขาด</div></div>

     <div class="tbl-wrap"><table id="timeTb"><thead><tr><th class="l">คนงาน</th><th class="l">สถานะ</th><th>เข้า</th><th>ออก</th><th class="l">ไซต์งาน</th><th class="l">ผลคำนวณ</th><th class="l">บัตรตอก</th></tr></thead>
     <tbody>${rows||`<tr><td colspan="7" class="empty">ยังไม่มีคนงานในทะเบียน ${can("hr")?"เพิ่มได้ที่เมนูทะเบียนคนงาน":"ให้ HR เพิ่มในทะเบียนก่อน"}</td></tr>`}</tbody></table></div></div>`;
}
function saveDay(wid,date,patch){
  const id=wid+"_"+date,old=DB.days[id]||{w:wid,date,st:"",in:"",out:"",site:curSite||DB.workers[wid]?.site||""};
  const d={...old,...patch,w:wid,date};
  if(("in" in patch||"out" in patch)&&!d.st)d.st="work";
  if(d.st&&d.st!=="work"){d.in="";d.out="";}
  if(("in" in patch||"out" in patch)&&d.src==="card")d.ok=true;
  if(!d.st&&!d.in&&!d.out){if(DB.days[id])return put("days",id,null);return;}
  return put("days",id,d);
}
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="curDate"&&t.value){curDate=t.value;render();return;}
  if(t.id==="curSite"){curSite=t.value;return;}
  const tr=t.closest("#timeTb tr[data-w]");
  if(tr&&t.dataset.k){const wid=tr.dataset.w;saveDay(wid,curDate,{[t.dataset.k]:t.value});
    const d=dayDoc(wid,curDate)||{};for(const k of ["in","out"]){const el=$(k+"-"+wid);el.disabled=!!(d.st&&d.st!=="work");el.value=d[k]||"";el.classList.remove("lo");}
    $("st-"+wid).value=d.st||"";tr.querySelector("[data-note]").innerHTML=dayNote(calcDay({id:wid,...DB.workers[wid]},curDate,d));}
});

/* ===================== บัตรตอก + AI ===================== */
let cardJob=null;
const cardCache={};
const cardRefs=(wid,pid)=>DB.cardrefs[wid+"_"+pid]?.list||[];
async function cardImg(id){if(cardCache[id])return cardCache[id];try{const j=await call(`/api/doc?col=cards&id=${id}`);if(j.data?.img)cardCache[id]=j.data.img;}catch(e){}return cardCache[id]||null;}
function fillCards(root){root.querySelectorAll("[data-cimg]").forEach(async el=>{const s=await cardImg(el.dataset.cimg);if(el.isConnected)el.innerHTML=s?`<img src="${s}" alt="รูปบัตรตอก">`:"เปิดรูปไม่ได้";});}
function addCardRef(wid,pid,cid){const list=cardRefs(wid,pid);if(list.some(x=>x.id===cid))return;put("cardrefs",wid+"_"+pid,{w:wid,pid,list:[...list,{id:cid,at:Date.now(),by:ME.name||ME.username}]});}
function storeCard(){const j=cardJob,cid=j.hash;put("cards",cid,{w:j.wid,pid:j.pid,img:j.img,at:Date.now(),by:ME.name||ME.username,gps:j.gps,model:j.model||""});cardCache[cid]=j.img;addCardRef(j.wid,j.pid,cid);return cid;}
function openCard(wid){
  cardJob={pid:pidOf(curDate),wid:wid||"",img:"",rows:null,note:"",gps:null,showId:"",showImg:""};
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{if(cardJob)cardJob.gps=[+p.coords.latitude.toFixed(5),+p.coords.longitude.toFixed(5)];},()=>{},{timeout:8000});
  drawCard();$("dlg").showModal();
}
function drawCard(){
  const j=cardJob,r=pRange(j.pid),lock=["approved","paid"].includes(pStatus(j.pid));
  const ws=workers().filter(w=>w.status!=="left"),refs=j.wid?cardRefs(j.wid,j.pid):[],big=j.img||j.showImg;
  const rows=j.wid?datesOf(j.pid).map(dt=>{const ex=dayDoc(j.wid,dt),a=j.rows?.[dt];const v=a||{in:ex?.in||"",out:ex?.out||""};const lo=a&&(a.conf<.7||!tm(a.in)||!tm(a.out));const t=dayType(dt);
    return `<tr data-d="${dt}" class="${t!=="norm"?"off":""}"><td class="l">${esc(dShort(dt))}${t==="hol"?` <span class="chip warn">หยุด</span>`:""}</td>
      <td><input class="t-in ${lo?"lo":""}" type="time" id="c-in-${dt}" data-ck="in" value="${esc(v.in)}" aria-label="เข้า"></td><td><input class="t-in ${lo?"lo":""}" type="time" id="c-out-${dt}" data-ck="out" value="${esc(v.out)}" aria-label="ออก"></td>
      <td class="l">${a?`<span class="chip ${a.conf>=.85?"ok":a.conf>=.7?"":"warn"}">AI ${Math.round(a.conf*100)}%</span>`:""}${ex&&ex.st==="work"&&a?` <span class="chip">ทับของเดิม ${esc(ex.in)}–${esc(ex.out)}</span>`:ex&&ex.st&&ex.st!=="work"?` <span class="chip">${ST_TH[ex.st]}</span>`:""}</td></tr>`;}).join(""):"";
  $("dlg").innerHTML=`<div class="dl-h"><h2 style="margin:0">บัตรตอกเวลา</h2><button class="btn sm" data-act="close">ปิด</button></div><div class="dl-b">
   <div class="form"><div class="fld"><label for="cd-w">คนงาน</label><select class="sel" id="cd-w"><option value="">เลือกคนงาน</option>${ws.map(w=>`<option value="${w.id}" ${j.wid===w.id?"selected":""}>${esc((w.code?w.code+" ":"")+w.name)}</option>`).join("")}</select></div>
     <div class="fld"><label>งวด</label><div class="inp" style="display:flex;align-items:center;gap:8px;justify-content:space-between"><button class="btn sm" data-act="cprev" aria-label="งวดก่อน">←</button><span>${esc(r.label)}</span><button class="btn sm" data-act="cnext" aria-label="งวดถัดไป">→</button></div></div>
     <div class="fld"><label for="cd-f">${refs.length?"แนบรูปเพิ่ม":"รูปบัตรตอก"}</label><input class="inp" id="cd-f" type="file" accept="image/*" capture="environment" ${j.wid?"":"disabled"}></div></div>
   ${refs.length?`<div class="cthumbs">${refs.map(x=>`<div class="cthumb ${!j.img&&j.showId===x.id?"on":""}"><button class="pic" data-act="cardView" data-id="${x.id}" data-cimg="${x.id}" aria-label="ดูรูปบัตรนี้">กำลังโหลด</button>${lock?"":`<button class="cx" data-act="cardDel" data-id="${x.id}" aria-label="ลบรูปนี้">×</button>`}<small>${new Date(x.at).toLocaleDateString("th-TH",{day:"numeric",month:"short"})}<br>${esc(x.by||"")}</small></div>`).join("")}</div>`:""}
   ${lock?`<div class="issue bad" style="margin-top:12px">งวดนี้ล็อกแล้ว บันทึกเพิ่มไม่ได้</div>`:""}
   ${j.dup?`<div class="issue warn" style="margin-top:12px">รูปนี้เคยบันทึกแล้วเมื่อ ${esc(j.dup)} ตรวจให้แน่ใจว่าไม่ได้ลงซ้ำ</div>`:""}
   <div class="split" style="margin-top:16px"><div>${big?`<img class="cardimg" src="${big}" alt="รูปบัตรตอก">${j.img?`<div class="sub" style="margin-top:6px">รูปใหม่ ยังไม่ได้แนบ</div>`:""}<div class="dl-f" style="justify-content:flex-start;margin-top:10px"><button class="btn d" data-act="aiRead" ${j.wid&&AI&&!j.busy?"":"disabled"}>${j.busy?"AI กำลังอ่าน…":"ให้ AI อ่านเวลา"}</button></div>
       ${AI?"":`<div class="sub" style="margin-top:8px">ยังไม่ได้ตั้งค่า AI บนเซิร์ฟเวอร์ ดูรูปแล้วกรอกเวลาเองทางขวาได้</div>`}${j.note?`<div class="issue warn" style="margin-top:10px">AI แจ้ง: ${esc(j.note)}</div>`:""}`:`<div class="empty card" style="background:var(--card2)">${refs.length?"กดรูปเล็กด้านบนเพื่อดูบัตรที่แนบไว้ หรือถ่ายรูปใหม่เพื่อแนบเพิ่ม":"เลือกคนงานแล้วถ่ายหรือเลือกรูปบัตรตอก รูปจะถูกเก็บไว้กับคนงานคนนี้ในงวดนี้ แนบได้หลายรูป"}</div>`}</div>
     <div>${j.wid?`<div class="sub" style="margin-bottom:8px">ตรวจทุกแถวเทียบกับรูปก่อนบันทึก ช่องสีเหลืองคือช่องที่ AI ไม่มั่นใจหรืออ่านไม่ออก แถวที่เว้นว่างทั้งคู่จะไม่ถูกบันทึก</div>
       <div class="tbl-wrap"><table id="cardTb"><thead><tr><th class="l">วันที่</th><th>เข้า</th><th>ออก</th><th class="l"></th></tr></thead><tbody>${rows}</tbody></table></div>`:""}</div></div>
   <div class="dl-f"><button class="btn" data-act="close">ปิด</button><button class="btn d" data-act="cardAttach" ${j.wid&&j.img&&!lock?"":"disabled"}>แนบรูปอย่างเดียว</button><button class="btn y" data-act="cardSave" ${j.wid&&!lock?"":"disabled"}>ตรวจแล้ว บันทึกเวลา${j.img?"และแนบรูป":""}</button></div></div>`;
  fillCards($("dlg"));
}
function cardAttach(){const j=cardJob;if(!j.wid||!j.img)return;cardCollect();j.showId=storeCard();j.showImg=j.img;j.img="";j.dup="";drawCard();render();toast("แนบรูปบัตรแล้ว");}
async function cardView(id){const j=cardJob;if(j.img){toast("มีรูปใหม่ที่ยังไม่ได้แนบ กด “แนบรูปอย่างเดียว” ก่อน");return;}cardCollect();j.showId=id;j.showImg=await cardImg(id)||"";if(cardJob===j)drawCard();}
function cardDel(id){const j=cardJob;if(!confirm("ลบรูปบัตรนี้ออกจากคนงานคนนี้?"))return;cardCollect();put("cardrefs",j.wid+"_"+j.pid,{w:j.wid,pid:j.pid,list:cardRefs(j.wid,j.pid).filter(x=>x.id!==id)});put("cards",id,null);delete cardCache[id];if(j.showId===id){j.showId="";j.showImg="";}drawCard();render();toast("ลบรูปแล้ว");}
function cardCollect(){const j=cardJob;if(!j.wid)return;j.rows=j.rows||{};document.querySelectorAll("#cardTb tr[data-d]").forEach(tr=>{const dt=tr.dataset.d,i=$("c-in-"+dt).value,o=$("c-out-"+dt).value,old=j.rows[dt];
  if(old){if(old.in!==i||old.out!==o){old.in=i;old.out=o;old.conf=1;old.edited=true;}}else{const ex=dayDoc(j.wid,dt);if((i||o)&&(i!==(ex?.in||"")||o!==(ex?.out||"")))j.rows[dt]={in:i,out:o,conf:1,edited:true};}});}
document.addEventListener("change",async e=>{
  if(!cardJob)return;const t=e.target;
  if(t.id==="cd-w"){cardJob.wid=t.value;cardJob.rows=null;cardJob.showId="";cardJob.showImg="";drawCard();}
  if(t.id==="cd-f"&&t.files[0]){try{cardCollect();cardJob.img=await shrink(t.files[0],1600,.82);cardJob.hash=await sha(cardJob.img);
    cardJob.dup="";try{const ex=await call(`/api/doc?col=cards&id=${cardJob.hash}`);if(ex.data)cardJob.dup=new Date(ex.data.at).toLocaleString("th-TH");}catch(er){}drawCard();}catch(er){toast(er.message);}}
});
async function aiRead(){
  const j=cardJob,r=pRange(j.pid);cardCollect();j.busy=true;drawCard();
  try{const res=await call("/api/ai",{method:"POST",body:JSON.stringify({image:(j.img||j.showImg).split(",")[1],mime:"image/jpeg",hint:`บัตรนี้เป็นของงวดวันที่ ${r.from} ถึง ${r.to}`})});
    const out={},days=datesOf(j.pid);
    for(const x of res.result.rows||[]){const dt=days.find(d=>+d.slice(8)===+x.day);if(!dt)continue;const fix=s=>{const m=/^(\d{1,2})[:.](\d{2})$/.exec(String(s||"").trim());return m?pad(m[1])+":"+m[2]:"";};
      const a=fix(x.in),b=fix(x.out);let conf=Math.max(0,Math.min(1,+x.conf||0));const ta=tm(a),tb=tm(b);
      if(ta==null||tb==null)conf=Math.min(conf,.3);else if(ta>11*60||ta<4*60||tb===ta)conf=Math.min(conf,.6);
      out[dt]={in:a,out:b,conf};}
    j.rows=out;j.note=[res.result.name?`ชื่อบนบัตร “${res.result.name}”`:"",res.result.note||""].filter(Boolean).join(" · ");j.model=res.model;
    if(!Object.keys(out).length)toast("AI ไม่พบเวลาในงวดนี้ ตรวจว่าเลือกงวดถูกหรือกรอกเอง");
  }catch(e){toast(e.message);}
  j.busy=false;drawCard();
}
async function cardSave(){
  const j=cardJob;cardCollect();const todo=Object.entries(j.rows||{}).filter(([,v])=>v.in||v.out);

  const cid=j.img?storeCard():j.showId||"";

function issuesOf(pid,rows){
  const {pay}=pRange(pid),out=[];
  for(const r of rows){const w=DB.workers[r.w]||{};
    if(r.missing)out.push({lv:"bad",t:`${r.name}: ลืมตอกบัตร ${r.missing} วัน ต้องใส่เวลาให้ครบก่อนอนุมัติ`,w:r.w});
    if(!r.rate)out.push({lv:"bad",t:`${r.name}: ยังไม่ได้กำหนดอัตราค่าแรง`,w:r.w});
    if(r.days?.some(c=>c.flag==="long"))out.push({lv:"warn",t:`${r.name}: มีวันที่ทำงานเกิน 16 ชั่วโมง ตรวจเวลาเข้า–ออก`,w:r.w});
    if(r.nodata)out.push({lv:"warn",t:`${r.name}: วันทำงานปกติ ${r.nodata} วันยังไม่มีข้อมูล (จะไม่ได้ค่าแรงวันนั้น)`,w:r.w});
    if(r.rate&&rateDay({rate:r.rate,wtype:r.wtype})<S.minWage)out.push({lv:"warn",t:`${r.name}: ค่าแรง ${f0(rateDay({rate:r.rate,wtype:r.wtype}))} บาท/วัน ต่ำกว่าค่าแรงขั้นต่ำที่ตั้งไว้ ${f0(S.minWage)} บาท`,w:r.w});
    if(w.permitExp&&w.permitExp<pay)out.push({lv:"warn",t:`${r.name}: ใบอนุญาตทำงานหมดอายุ ${dTH(w.permitExp)}`,w:r.w});
    if(r.carry>0)out.push({lv:"warn",t:`${r.name}: เงินเบิกเกินรายได้ ${f2(r.carry)} บาท จะยกไปหักงวดถัดไป`,w:r.w});
  }
  return out;
}

function setPeriod(pid,status,extra){const old=DB.periods[pid]||{};const data={...old,...extra,status};if(status==="open"){delete data.snap;}return put("periods",pid,data);}
async function pApprove(){
  const pid=curPid,rows=periodRows(pid);
  if(issuesOf(pid,rows).some(i=>i.lv==="bad")){toast("ยังมีรายการที่ต้องแก้ก่อนอนุมัติ");return;}
  if(!confirm(`อนุมัติและล็อกงวด ${pRange(pid).label}\nยอดจ่ายสุทธิ ${f2(rows.reduce((a,x)=>a+x.net,0))} บาท ${rows.length} คน\nหลังอนุมัติจะแก้ไขเวลาและเงินเบิกของงวดนี้ไม่ได้`))return;
  const snap={at:Date.now(),by:ME.name||ME.username,rules:{otMult:S.otMult,holMult:S.holMult,holOtMult:S.holOtMult,ssoRate:S.ssoRate,ssoMax:S.ssoMax},rows:Object.fromEntries(rows.map(x=>[x.w,x]))};
  const next=pRange(pShift(pid,1)).from;
  for(const x of rows)if(x.carry>0)put("advances",`carry_${pid}_${x.w}`,{w:x.w,date:next,amt:x.carry,note:`ยกมาจากงวด ${pRange(pid).label}`,carry:pid,consent:true,by:ME.name||ME.username,at:Date.now()});
  await setPeriod(pid,"approved",{snap,reason:""});render();toast("อนุมัติและล็อกงวดแล้ว");
}
async function pUnlock(){
  const reason=prompt("เหตุผลที่ปลดล็อกงวดนี้ (จะถูกบันทึกในประวัติ)");if(!reason||!reason.trim())return;
  const pid=curPid;await setPeriod(pid,"open",{reason:reason.trim()});
  for(const id of Object.keys(DB.advances))if(DB.advances[id].carry===pid)put("advances",id,null);
  render();toast("ปลดล็อกแล้ว");
}

  if(can("hr","account")){const s3=[["รหัส","ชื่อ–สกุล","ธนาคาร","เลขบัญชี","ยอดโอน"],...rows.filter(x=>x.net>0).map(x=>{const p=DB.workers[x.w]?.priv||{};return [x.code,x.name,p.bank||"",p.bankNo||"",x.net];})];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s3),"รายการโอน");}
  const bs=siteTotals(rows);XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["ไซต์งาน","แรงงาน (คน-วัน)","ค่าแรง","ค่าล่วงเวลา","รวม"],...bs.map(s=>[siteName(s.id),s.days,s.pay,s.ot,r2(s.pay+s.ot)])]),"ตามไซต์งาน");
  XLSX.writeFile(wb,`ค่าแรง_${pid}.xlsx`);
}
function siteTotals(rows){const m={};for(const x of rows)for(const [k,v] of Object.entries(x.sites||{})){const s=m[k]=m[k]||{id:k,days:0,pay:0,ot:0};s.days+=v.days;s.pay=r2(s.pay+v.pay);s.ot=r2(s.ot+v.ot);}return Object.values(m).sort((a,b)=>b.pay+b.ot-a.pay-a.ot);}

/* ค่าแรงที่ลงโครงการนี้สะสมจากทุกงวดตั้งแต่ต้นปีของงวดที่เลือกจนถึงงวดนั้น (ค่าแรง + OT ก่อนหักประกันสังคม/เงินเบิก) */
function cumLabor(site,pid){let t=0,p=pShift(pid,0);const y=pid.slice(0,4);
  while(p.slice(0,4)===y){for(const x of periodRows(p)){const s=x.sites?.[site];if(s)t+=s.pay+s.ot;}p=pShift(p,-1);}return t;}

function auditWhat(a){let b=null,c=null;try{b=JSON.parse(a.before||"null");c=JSON.parse(a.after||"null");}catch(e){}
  if(a.col==="days"){const x=c||b||{};const n=DB.workers[x.w]?.name||"";const s=o=>o?(o.st==="work"?`${o.in||"?"}–${o.out||"?"}`:ST_TH[o.st]||"–"):"ไม่มี";return `${n} ${dTH(x.date)}: ${s(b)} → ${s(c)}`;}
  if(a.col==="advances"){const x=c||b||{};return `${DB.workers[x.w]?.name||""} ${f2(x.amt)} บาท (${dTH(x.date)})`;}
  if(a.col==="periods")return `${a.doc}: ${P_TH[b?.status||"open"]} → ${P_TH[c?.status||"open"]}${c?.reason?" · "+c.reason:""}`;
  if(a.col==="workers"){const ch=[];if(b&&c)for(const k of ["name","rate","wtype","status","sso","permitExp"])if(b[k]!==c[k])ch.push(`${k==="rate"?"ค่าแรง":k==="name"?"ชื่อ":k==="status"?"สถานะ":k==="sso"?"ประกันสังคม":k==="wtype"?"แบบค่าแรง":"ใบอนุญาต"} ${b[k]??"–"} → ${c[k]??"–"}`);return `${(c||b)?.name||""}${ch.length?": "+ch.join(", "):""}`;}
  if(a.col==="cardrefs"){const x=c||b||{};return `${DB.workers[x.w]?.name||""}: ${(b?.list||[]).length} → ${(c?.list||[]).length} รูป`;}
  if(a.col==="users")return a.doc;return "";}
function auditHtml(rows){if(!rows)return `<div class="empty">กำลังโหลด…</div>`;if(!rows.length)return `<div class="empty">ยังไม่มีการแก้ไข</div>`;
  return `<div class="tbl-wrap"><table><thead><tr><th class="l">เวลา</th><th class="l">ผู้ทำ</th><th class="l">ส่วน</th><th class="l">การกระทำ</th><th class="l">รายละเอียด</th></tr></thead><tbody>${rows.map(a=>`<tr><td class="l">${new Date(a.at).toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</td><td class="l">${esc(a.byname||"")}</td><td class="l">${COL_TH[a.col]||esc(a.col)}</td><td class="l">${esc(a.action)}</td><td class="l wrap-ok">${esc(auditWhat(a))}</td></tr>`).join("")}</tbody></table></div>`;}

let impJob=null;
function planImport(data){
  const t=today(),rateOf=wid=>{const rs=(data.rates||[]).filter(r=>r.workerId===wid&&+r.daily>0).sort((a,b)=>(a.from||"").localeCompare(b.from||""));
    const cur=rs.filter(r=>(r.from||"")<=t);return +(cur.length?cur[cur.length-1]:rs[0])?.daily||0;};
  const projects=data.projects.filter(p=>p&&p.id).map(p=>({id:String(p.id),data:{code:p.code||"",name:p.name||"",client:p.client||"",budget:+p.budget||0,status:p.status==="active"||!p.status?"active":"closed",from:"expense"},isNew:!DB.sites[p.id]}));
  const siteByCode=c=>projects.find(p=>p.data.code&&c.includes(p.data.code))?.id||"";
  const staff=(data.staff||[]).filter(s=>s&&s.id).map(s=>({id:String(s.id),data:{name:s.name||"",position:s.position||"",site:siteByCode(String(s.position||""))},isNew:!DB.staff[s.id]}));
  const workersP=(data.workers||[]).filter(w=>w&&w.id).map(w=>({id:String(w.id),src:w,rate:rateOf(w.id),isNew:!DB.workers[w.id]}));
  return{projects,staff,workers:workersP};
}
function openImport(){
  const j=impJob,pl=j.plan,n=a=>a.filter(x=>x.isNew).length;
  $("dlg").innerHTML=`<div class="dl-h"><h2 style="margin:0">นำเข้าจากแอปสำรองจ่าย</h2><button class="btn sm" data-act="close">ปิด</button></div><div class="dl-b">

   <div class="stats"><div class="stat"><div class="n">${pl.projects.length}</div><div class="l">โครงการ (ใหม่ ${n(pl.projects)})</div></div><div class="stat"><div class="n">${pl.staff.length}</div><div class="l">พนักงาน (ใหม่ ${n(pl.staff)})</div></div><div class="stat"><div class="n">${pl.workers.length}</div><div class="l">คนงาน (ใหม่ ${n(pl.workers)})</div></div></div>
   ${pl.workers.some(w=>!w.rate)?`<div class="issue warn" style="margin-bottom:10px">คนงาน ${pl.workers.filter(w=>!w.rate).length} คนไม่มีอัตราค่าแรงในไฟล์ ต้องกรอกในทะเบียนคนงานเอง</div>`:""}
   <div class="tbl-wrap"><table><thead><tr><th class="l">คนงาน</th><th class="l">ชุดงาน</th><th>ค่าแรง/วัน</th><th class="l">สถานะ</th></tr></thead><tbody>${pl.workers.map(w=>`<tr><td class="l">${esc(w.src.name)}</td><td class="l">${esc(w.src.team||"")}</td><td>${w.rate?f0(w.rate):"–"}</td><td class="l"><span class="chip ${w.isNew?"ok":""}">${w.isNew?"เพิ่มใหม่":"อัปเดต"}</span></td></tr>`).join("")||`<tr><td colspan="4" class="empty">ไม่มีคนงานในไฟล์</td></tr>`}</tbody></table></div>
   <div class="dl-f"><button class="btn" data-act="close">ยกเลิก</button><button class="btn y" data-act="impGo">นำเข้า</button></div></div>`;
  if(!$("dlg").open)$("dlg").showModal();
}
function applyImport(){
  const pl=impJob.plan;
  for(const p of pl.projects)put("sites",p.id,{...(DB.sites[p.id]||{}),...p.data});
  for(const s of pl.staff)put("staff",s.id,{...(DB.staff[s.id]||{}),...s.data});
  for(const w of pl.workers){const old=DB.workers[w.id];
    const foreman=old?.foreman||staffList().find(s=>s.site&&s.site===(old?.site||""))?.id||"";
    if(old)put("workers",w.id,{...old,name:w.src.name||old.name,team:w.src.team||old.team,...(w.rate?{rate:w.rate}:{}),from:"expense"});
    else put("workers",w.id,{code:nextCode(),name:w.src.name||"",pos:w.src.team||"",team:w.src.team||"",foreman,site:"",nation:"",wtype:"daily",rate:w.rate,sso:false,start:"",status:"active",consent:"",hasPhoto:false,priv:{},from:"expense"});}
  const c=pl.projects.length+pl.staff.length+pl.workers.length;impJob=null;$("dlg").close();render();toast(`นำเข้าจากแอปสำรองจ่าย ${c} รายการแล้ว`);
}

});

  else if(a==="close"){cardJob=null;wEdit=null;$("dlg").close();}
  else if(a==="dprev")shiftDay(-1);else if(a==="dnext")shiftDay(1);
  else if(a==="pprev"){curPid=pShift(curPid,-1);render();}else if(a==="pnext"){curPid=pShift(curPid,1);render();}
  else if(a==="fillStd"){let n=0;for(const w of workers())if(w.status!=="left"&&!(w.start&&w.start>curDate)&&!(w.end&&w.end<curDate)&&!dayDoc(w.id,curDate)?.st){saveDay(w.id,curDate,{st:"work",in:S.stdStart,out:S.stdEnd,site:curSite||w.site||""});n++;}render();toast(n?`ใส่เวลาให้ ${n} คนแล้ว`:"ทุกคนลงเวลาแล้ว");}
  else if(a==="card")openCard();
  else if(a==="cprev"||a==="cnext"){cardCollect();cardJob.pid=pShift(cardJob.pid,a==="cprev"?-1:1);cardJob.rows=null;cardJob.showId="";cardJob.showImg="";drawCard();}
  else if(a==="cardW")openCard(b.dataset.w);else if(a==="cardAttach")cardAttach();else if(a==="cardView")cardView(b.dataset.id);else if(a==="cardDel")cardDel(b.dataset.id);
  else if(a==="aiRead")aiRead();else if(a==="cardSave")cardSave();
  else if(a==="pSubmit"){await setPeriod(curPid,"submitted",{reason:""});render();toast("ส่งให้ HR ตรวจแล้ว");}
  else if(a==="pReturn"){await setPeriod(curPid,"open",{reason:""});render();toast("ส่งกลับให้แก้ไขแล้ว");}
  else if(a==="pApprove")pApprove();
  else if(a==="pPaid"){if(confirm("บันทึกว่างวดนี้จ่ายเงินครบแล้ว?")){await setPeriod(curPid,"paid",{paidAt:Date.now(),reason:""});render();toast("บันทึกการจ่ายแล้ว");}}
  else if(a==="pUnlock")pUnlock();
  else if(a==="slipAll")printSlips(periodRows(curPid));
  else if(a==="slipOne")printSlips(periodRows(curPid).filter(x=>x.w===b.dataset.w));
  else if(a==="xlsx")exportXlsx();
  else if(a==="auditW"){const box=$("auditBox");box.innerHTML=`<div class="empty">กำลังโหลด…</div>`;const out=[];for(const d of datesOf(curPid)){try{out.push(...(await call(`/api/audit?col=days&doc=${b.dataset.w}_${d}`)).rows);}catch(er){}}box.innerHTML=`<h3 style="margin-top:16px">ประวัติการแก้ไขเวลาในงวดนี้</h3>`+auditHtml(out.sort((x,y)=>y.at-x.at));}
  else if(a==="impGo")applyImport();
  else if(a==="wNew")openWorker(null);else if(a==="wSave")wSave();
  else if(a==="advDel"){if(confirm("ลบรายการเงินเบิกนี้?")){put("advances",b.dataset.id,null);render();}}
  else if(a==="holDel"){saveSet({holidays:S.holidays.filter(h=>h.d!==b.dataset.d)});render();}
  else if(a==="siteDel"){if(confirm("ลบไซต์งานนี้? เวลาที่เคยลงไว้จะแสดงเป็น “ไซต์ที่ลบแล้ว”")){put("sites",b.dataset.id,null);render();}}
  else if(a==="auditLoad"){AUDIT=null;$("auditAll").innerHTML=auditHtml(null);loadAudit();}
  else if(a==="uPass"||a==="uToggle"){const id=b.closest("tr").dataset.u,u=USERS.find(x=>x.id===id);const body={id,name:u.name,role:u.role,active:!!u.active,ext_id:u.ext_id||""};
    if(a==="uPass"){const p=prompt(`รหัสผ่านใหม่ของ ${u.username} (อย่างน้อย 8 ตัว)`);if(!p)return;body.password=p;}else body.active=!u.active;saveUser(body);}
});
$("dlg").addEventListener("close",()=>{cardJob=null;wEdit=null;});
boot();
</script>

</body></html>
