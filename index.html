function UsersPanel() {
  const { s, me, ask, notify, ua, rs } = useApp();
  const users = ua.list;
  const blank = { name: '', username: '', pw: '', access: 'field', role: 'owner', staffId: 'new', position: '', mustChange: true };
  const [f, setF] = useState(blank);
  const [reset, setReset] = useState(null);
  const [busy, setBusy] = useState(false);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const linkedTo = (staffId, exceptId) => users.find(u => u.staffId && u.staffId === staffId && u.id !== exceptId);
  const lastSeen = u => u.lastLogin ? new Date(u.lastLogin).toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'ยังไม่เคยเข้า';
  useEffect(() => { ua.refresh(); }, [rs.remote && rs.remote.url]);
  const run = async job => { setBusy(true); try { return await job(); } finally { setBusy(false); } };
  // ห้ามลดสิทธิ์ตัวเอง และต้องเหลือ Staff office ที่ใช้งานได้อย่างน้อย 1 คน (ตรวจซ้ำที่เซิร์ฟเวอร์ด้วย)
  const edit = (id, patch, msg) => run(() => ua.update(id, patch, msg));
  const add = () => run(async () => {
    const p = pwProblem(f.pw); if (p) return notify(p, 'bad');
    if (await ua.add(f, `เพิ่มผู้ใช้ ${f.name.trim()} แล้ว ส่งชื่อผู้ใช้และรหัสให้พนักงานได้เลย`)) setF(blank);
  });
  const doReset = () => run(async () => { if (await ua.setPw(reset.id, reset.pw, reset.must)) setReset(null); });
  const remove = u => ask({
    title: `ลบผู้ใช้ ${u.name}?`,
    body: 'บัญชีนี้จะเข้าระบบไม่ได้อีก บิลและประวัติที่เคยบันทึกไว้ยังอยู่ครบ ถ้าอาจกลับมาใช้อีกให้กด "ระงับ" แทน',
    ok: 'ลบผู้ใช้', danger: true,
    onOk: () => run(() => ua.remove(u)),
  });

  return (
    <section className="panel utbl" id="users">
      <div className="panel-head"><h2>ผู้ใช้งานและสิทธิ์เข้าถึง</h2><span className="hint">{users.length} บัญชี · ใช้งานอยู่ {users.filter(u => u.active !== false).length}</span></div>
      <div className="chips" style={{ marginBottom: 12 }}>
        {Object.keys(ACCESS).map(k => <span key={k} className={'pill plain ' + (k === 'office' ? 'gold' : '')} style={{ whiteSpace: 'normal' }}>{ACCESS[k]}: {ACCESS_HINT[k]}</span>)}
      </div>
      <div className="tbl-wrap"><table className="tbl">
        <thead><tr><th>ชื่อ</th><th>ชื่อผู้ใช้</th><th>สิทธิ์เข้าถึง</th><th>ผูกกับผู้เบิก / บทบาทอนุมัติ</th><th>สถานะ</th><th></th></tr></thead>
        <tbody>{users.map(u => (<React.Fragment key={u.id}>
          <tr>
            <td><b>{u.name}</b>{u.id === me.id && <span className="pill plain gold" style={{ marginLeft: 6 }}>คุณ</span>}<span className="sub">เข้าล่าสุด {lastSeen(u)}</span></td>
            <td className="num">@{u.username}</td>
            <td><select aria-label={`สิทธิ์ของ ${u.name}`} value={u.access} onChange={e => { const v = e.target.value; edit(u.id, { access: v }, `เปลี่ยน ${u.name} เป็น${ACCESS[v]}แล้ว`); }}>
              {Object.entries(ACCESS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></td>
            <td>{isOffice(u)
              ? <select aria-label={`บทบาทอนุมัติของ ${u.name}`} value={u.role || 'owner'} onChange={e => { const v = e.target.value; edit(u.id, { role: v }, `ตั้งบทบาทเริ่มต้นของ ${u.name} เป็น${ROLES[v]}แล้ว`); }}>
                  {OFFICE_ROLES.map(k => <option key={k} value={k}>{ROLES[k]}</option>)}</select>
              : <select aria-label={`ผู้เบิกของ ${u.name}`} value={u.staffId || ''} onChange={e => { const v = e.target.value; edit(u.id, { staffId: v }, v ? `ผูก ${u.name} กับ ${staffName(s, v)} แล้ว` : 'ยกเลิกการผูกแล้ว'); }}>
                  <option value="">— ยังไม่ผูก —</option>
                  {s.staff.map(x => { const o = linkedTo(x.id, u.id); return <option key={x.id} value={x.id} disabled={!!o}>{x.name}{o ? ` (ผูกกับ @${o.username})` : ''}</option>; })}</select>}</td>
            <td>{u.active === false ? <span className="pill bad">ระงับ</span> : u.mustChange ? <span className="pill warn">รอตั้งรหัสเอง</span> : <span className="pill ok">ใช้งาน</span>}</td>
            <td><div className="actions" style={{ justifyContent: 'flex-end', flexWrap: 'nowrap' }}>
              <button className="btn btn-sm" onClick={() => setReset(reset && reset.id === u.id ? null : { id: u.id, pw: '', must: true })}>ตั้งรหัสใหม่</button>
              {u.id !== me.id && <button className="btn btn-sm" onClick={() => edit(u.id, { active: u.active === false }, u.active === false ? `เปิดใช้ ${u.name} แล้ว` : `ระงับ ${u.name} แล้ว`)}>{u.active === false ? 'เปิดใช้' : 'ระงับ'}</button>}
              {u.id !== me.id && <button className="btn btn-sm btn-bad" onClick={() => remove(u)}>ลบ</button>}
            </div></td>
          </tr>
          {reset && reset.id === u.id && (
            <tr><td colSpan={6} style={{ background: 'var(--surface-2)' }}>
              <div className="form">
                <PwInput id="rs-pw" label={`รหัสใหม่ของ ${u.name}`} value={reset.pw} autoComplete="new-password" autoFocus onChange={v => setReset({ ...reset, pw: v })} />
                <label className="check" style={{ alignSelf: 'end', paddingBottom: 8 }}><input type="checkbox" checked={reset.must} onChange={e => setReset({ ...reset, must: e.target.checked })} />ให้เปลี่ยนเองเมื่อเข้าครั้งถัดไป</label>
                <div className="field" style={{ justifyContent: 'flex-end', flexDirection: 'row', gap: 8, alignItems: 'flex-end' }}>
                  <button className="btn btn-ghost" onClick={() => setReset(null)}>ยกเลิก</button>
                  <button className="btn btn-primary" disabled={busy} onClick={doReset}>บันทึกรหัส</button>
                </div>
              </div>
            </td></tr>
          )}
        </React.Fragment>))}</tbody>
      </table></div>

      <h3 style={{ margin: '16px 0 8px' }}>เพิ่มผู้ใช้</h3>
      <div className="form">
        <label className="field"><span>ชื่อ-สกุล</span><input id="us-name" value={f.name} onChange={e => set('name', e.target.value)} /></label>
        <label className="field"><span>ชื่อผู้ใช้ (ภาษาอังกฤษ)</span><input id="us-user" value={f.username} autoCapitalize="none" autoComplete="off" placeholder="เช่น sompol" onChange={e => set('username', e.target.value)} /></label>
        <PwInput id="us-pw" label={`รหัสผ่านเริ่มต้น (อย่างน้อย ${MIN_PW} ตัว)`} value={f.pw} autoComplete="new-password" onChange={v => set('pw', v)} />
        <label className="field"><span>สิทธิ์เข้าถึง</span><select id="us-acc" value={f.access} onChange={e => set('access', e.target.value)}>
          {Object.entries(ACCESS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></label>
        {f.access === 'field' ? (<>
          <label className="field"><span>ผูกกับชื่อผู้เบิก</span><select id="us-staff" value={f.staffId} onChange={e => set('staffId', e.target.value)}>
            <option value="new">+ เพิ่มชื่อใหม่ในรายชื่อผู้เบิก</option>
            {s.staff.map(x => { const o = linkedTo(x.id); return <option key={x.id} value={x.id} disabled={!!o}>{x.name}{o ? ` (ผูกกับ @${o.username})` : ''}</option>; })}</select></label>
          {f.staffId === 'new' && <label className="field"><span>ตำแหน่ง</span><input id="us-pos" placeholder="เช่น โฟร์แมน P-2601" value={f.position} onChange={e => set('position', e.target.value)} /></label>}
        </>) : (
          <label className="field"><span>บทบาทอนุมัติเริ่มต้น</span><select id="us-role" value={f.role} onChange={e => set('role', e.target.value)}>
            {OFFICE_ROLES.map(k => <option key={k} value={k}>{ROLES[k]}</option>)}</select></label>
        )}
        <label className="check" style={{ alignSelf: 'end', paddingBottom: 8 }}><input id="us-must" type="checkbox" checked={f.mustChange} onChange={e => set('mustChange', e.target.checked)} />ให้ตั้งรหัสเองเมื่อเข้าครั้งแรก</label>
        <div className="field" style={{ justifyContent: 'flex-end' }}><button className="btn btn-primary" disabled={busy} onClick={add}>{busy ? 'กำลังบันทึก…' : 'เพิ่มผู้ใช้'}</button></div>
      </div>
      <p className="hint" style={{ marginTop: 10 }}>{ACCESS.field}: เห็นเฉพาะหน้าเบิก & เคลียร์บิล และเห็นเฉพาะบิล/ยอดเงินทดรองของชื่อที่ผูกไว้ · {ACCESS.office}: เข้าได้ทุกหน้าและจัดการผู้ใช้ได้ · พนักงานทุกคนเปลี่ยนรหัสของตัวเองได้จากปุ่มชื่อมุมขวาบน · ระบบเก็บเฉพาะค่าแฮชของรหัส Staff office ก็ดูรหัสเดิมไม่ได้ ถ้าลืมให้ตั้งรหัสใหม่</p>
    </section>
  );
}

function SheetsPanel() {
  const { s, me, rs, ask, notify } = useApp();
  const [url, setUrl] = useState('');
  const [step, setStep] = useState(null); // null | { ready } หลังตรวจ URL
  const [code, setCode] = useState('');
  const [upload, setUpload] = useState(true);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const r = rs.remote;
  const staffLink = r ? location.origin + location.pathname + '?sheet=' + encodeURIComponent(r.url) : '';
  const copy = async () => {
    try { await navigator.clipboard.writeText(staffLink); notify('คัดลอกลิงก์แล้ว ส่งให้พนักงานใน LINE ได้เลย'); }
    catch (e) { window.prompt('คัดลอกลิงก์นี้', staffLink); }
  };
  const check = async () => {
    const u = url.trim();
    if (!SHEET_URL_RE.test(u)) return setMsg('วาง Web app URL ที่ขึ้นต้นด้วย https://script.google.com/ และลงท้ายด้วย /exec');
    setBusy(true); setMsg('');
    try { const res = await callSheet(u, 'ping'); setStep({ ready: !!res.ready }); }
    catch (e) { setMsg(e.message); }
    setBusy(false);
  };
  const connect = async () => {
    if (!/^\d{6}$/.test(code.trim())) return setMsg('กรอกรหัสตั้งค่า 6 หลักจาก Execution log ของ setupApp');
    setBusy(true); setMsg('');
    try { await rs.connectSheet(url.trim(), code.trim(), upload); notify('เชื่อมต่อ Google Sheets แล้ว ข้อมูลทั้งหมดอยู่ในชีต'); }
    catch (e) { setMsg(e.message); setBusy(false); }
  };
  if (r) return (
    <section className="panel">
      <div className="panel-head"><h2>Google Sheets</h2><span className={'pill ' + (rs.sync.st === 'ok' ? 'ok' : 'warn')}>{rs.sync.st === 'ok' ? (rs.pendingCount ? 'รอส่ง' : 'ซิงก์แล้ว') : rs.sync.st === 'saving' ? 'กำลังบันทึก' : 'ยังซิงก์ไม่ได้'}</span></div>
      <p className="hint">ข้อมูลเก็บที่ Web app <span className="num">{sheetLabel(r.url)}</span> · รุ่นข้อมูล {rs.since}{rs.lastOk ? ` · ซิงก์ล่าสุด ${new Date(rs.lastOk).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}` : ''}{rs.sync.msg ? ` · ${rs.sync.msg}` : ''}</p>
      <p className="hint" style={{ marginTop: 6 }}>ทุกเครื่องที่เข้าระบบเห็นข้อมูลชุดเดียวกัน แอปดึงของใหม่ทุก 20 วินาที · พนักงานทั่วไปได้รับเฉพาะบิลของตัวเองจากเซิร์ฟเวอร์ · รายงานในชีตอัปเดตทุก 30 นาที</p>
      <h3 style={{ margin: '14px 0 6px' }}>ลิงก์สำหรับพนักงาน</h3>
      <div className="row"><input readOnly value={staffLink} onFocus={e => e.target.select()} style={{ flex: '1 1 260px' }} aria-label="ลิงก์สำหรับพนักงาน" /><button className="btn" onClick={copy}>คัดลอก</button></div>
      <p className="hint" style={{ marginTop: 6 }}>{location.protocol === 'file:' ? '⚠️ ตอนนี้เปิดแอปจากไฟล์ในเครื่อง ลิงก์นี้ใช้ได้เฉพาะเครื่องนี้ ต้องนำไฟล์ index.html ขึ้นเว็บก่อน (ดูคู่มือติดตั้ง) แล้วเปิดจากที่นั่นเพื่อได้ลิงก์ที่ส่งให้คนอื่นได้' : 'พนักงานเปิดลิงก์นี้ครั้งแรก แอปจะเชื่อมกับชีตให้เอง แล้วเข้าสู่ระบบด้วยชื่อผู้ใช้ของตัวเอง'}</p>
      <div className="actions" style={{ marginTop: 12 }}>
        <button className="btn" onClick={rs.syncNow}>ซิงก์ตอนนี้</button>
        <button className="btn btn-bad" onClick={() => ask({ title: 'เลิกใช้ Google Sheets บนเครื่องนี้?', body: 'เครื่องนี้จะกลับไปใช้ข้อมูลเดิมที่เก็บในเครื่อง ข้อมูลในชีตยังอยู่ครบ เครื่องอื่นยังใช้ชีตได้ตามปกติ', ok: 'เลิกเชื่อมต่อ', danger: true, onOk: rs.disconnect })}>เลิกเชื่อมต่อบนเครื่องนี้</button>
      </div>
    </section>
  );
  return (
    <section className="panel">
      <div className="panel-head"><h2>เก็บข้อมูลใน Google Sheets</h2><span className="pill">ยังไม่เชื่อมต่อ</span></div>
      <p className="hint">ตอนนี้ข้อมูลอยู่ในเครื่องนี้เครื่องเดียว เชื่อมต่อ Google Sheets แล้วทุกคนเข้าระบบจากมือถือของตัวเองและเห็นข้อมูลชุดเดียวกัน ติดตั้งสคริปต์ในชีตตาม line-bot/คู่มือติดตั้ง.md หัวข้อ "ฐานข้อมูลกลางของแอป" ก่อน</p>
      <div className="form" style={{ marginTop: 12 }}>
        <label className="field wide"><span>Web app URL (ลงท้ายด้วย /exec)</span><input id="sp-url" value={url} placeholder="https://script.google.com/macros/s/…/exec" onChange={e => { setUrl(e.target.value); setStep(null); setMsg(''); }} /></label>
      </div>
      {!step && <div className="actions" style={{ marginTop: 10 }}><button className="btn btn-primary" disabled={busy || !url.trim()} onClick={check}>{busy ? 'กำลังตรวจ…' : 'ตรวจการเชื่อมต่อ'}</button></div>}
      {step && !step.ready && (<div className="stack" style={{ marginTop: 12 }}>
        <p className="hint" style={{ color: 'var(--ok)' }}>✓ เจอสคริปต์ SUBAN CC แล้ว ชีตนี้ยังว่าง</p>
        <div className="form">
          <label className="field"><span>รหัสตั้งค่า 6 หลัก</span><input id="sp-code" inputMode="numeric" value={code} onChange={e => setCode(e.target.value)} placeholder="จาก Execution log ของ setupApp" /></label>
          <div className="field wide"><span>ข้อมูลเริ่มต้นในชีต</span>
            <label className="check"><input type="radio" name="sp-up" checked={upload} onChange={() => setUpload(true)} />ส่งข้อมูลในเครื่องนี้ขึ้นชีต ({s.projects.length} โครงการ · {s.bills.length} บิล · {s.staff.length} ผู้เบิก)</label>
            <label className="check"><input type="radio" name="sp-up" checked={!upload} onChange={() => setUpload(false)} />เริ่มจากข้อมูลว่าง (ข้อมูลในเครื่องนี้ยังเก็บไว้ในเครื่อง)</label>
          </div>
        </div>
        <p className="hint">บัญชีผู้ใช้ทั้ง {(s.users || []).length} บัญชีในเครื่องนี้จะย้ายขึ้นชีตด้วย ทุกคนใช้รหัสเดิมได้ คุณ (@{me.username}) จะเข้าระบบต่อได้ทันที</p>
        <div className="actions"><button className="btn btn-primary" disabled={busy} onClick={connect}>{busy ? 'กำลังส่งข้อมูล…' : 'เชื่อมต่อและเริ่มใช้ชีตนี้'}</button><button className="btn btn-ghost" onClick={() => setStep(null)}>ยกเลิก</button></div>
      </div>)}
      {step && step.ready && (<div className="stack" style={{ marginTop: 12 }}>
        <p className="hint" style={{ color: 'var(--ok)' }}>✓ ชีตนี้มีผู้ใช้และข้อมูลอยู่แล้ว</p>
        <p className="hint">สลับเครื่องนี้ไปใช้ข้อมูลในชีต แล้วเข้าสู่ระบบด้วยบัญชีที่อยู่ในชีต ข้อมูลเดิมในเครื่องนี้ไม่ถูกส่งขึ้นไป แต่ยังเก็บอยู่ในเครื่อง (สำรองเป็นไฟล์ไว้ก่อนได้ที่ด้านล่าง)</p>
        <div className="actions"><button className="btn btn-primary" onClick={() => rs.useSheet(url.trim())}>ใช้ข้อมูลในชีตนี้</button><button className="btn btn-ghost" onClick={() => setStep(null)}>ยกเลิก</button></div>
      </div>)}
      {msg && <p className="hint bad" role="alert" style={{ marginTop: 8 }}>{msg}</p>}
    </section>
  );
}

function SetupView() {
  const { s, me, mut, ask, notify, replaceAll, ua, rs } = useApp();
  const cloud = !!rs.remote;
  const can = isManager(s), owner = s.role === 'owner';
  const T = todayISO();
  const [pj, setPj] = useState({ code: '', name: '', client: '', budget: '', openingCost: '' });
  const [wk, setWk] = useState({ name: '', team: '', daily: '', from: T });
  const [rt, setRt] = useState({ workerId: '', daily: '', from: T });
  const [st, setSt] = useState({ name: '', position: '', dept: '' });
  const [dp, setDp] = useState({ staffId: '', dept: '' });
  const depts = [...new Set([...DEPTS, ...s.staff.map(x => x.dept).filter(Boolean)])];
  const fileRef = useRef(null);

  const addProject = () => mut(d => {
    if (!pj.code.trim() || !pj.name.trim()) return 'กรอกรหัสและชื่อโครงการ';
    if (d.projects.some(p => p.code === pj.code.trim())) return 'รหัสโครงการนี้มีแล้ว';
    d.projects.push({ id: uid(), code: pj.code.trim(), name: pj.name.trim(), client: pj.client.trim(), budget: +pj.budget || 0, openingCost: +pj.openingCost || 0, status: 'active' });
  }, 'เพิ่มโครงการแล้ว') && setPj({ code: '', name: '', client: '', budget: '', openingCost: '' });
  const addWorker = () => mut(d => {
    if (!wk.name.trim()) return 'กรอกชื่อช่าง';
    if (d.workers.some(w => w.name === wk.name.trim())) return 'มีชื่อนี้ในทะเบียนแล้ว';
    if (!(+wk.daily > 0)) return 'กรอกเรทค่าแรงต่อวัน';
    const id = uid();
    d.workers.push({ id, name: wk.name.trim(), team: wk.team.trim() });
    d.rates.push({ workerId: id, from: wk.from, daily: +wk.daily });
  }, 'เพิ่มช่างแล้ว') && setWk({ name: '', team: '', daily: '', from: T });
  const addRate = () => {
    const doIt = () => mut(d => {
      if (!rt.workerId || !(+rt.daily > 0)) return 'เลือกช่างและกรอกเรทใหม่';
      d.rates = d.rates.filter(r => !(r.workerId === rt.workerId && r.from === rt.from));
      d.rates.push({ workerId: rt.workerId, from: rt.from, daily: +rt.daily });
    }, 'บันทึกเรทใหม่แล้ว') && setRt({ workerId: '', daily: '', from: T });
    const hitsClosed = s.laborWeeks.some(w => addDays(w, 6) >= rt.from);
    if (hitsClosed) ask({ title: 'วันที่มีผลย้อนเข้าไปในงวดที่ปิดแล้ว', body: 'งวดที่ปิดแล้วยังใช้ยอดที่ล็อกไว้เหมือนเดิม เรทใหม่มีผลเฉพาะรายการที่ยังไม่ปิดงวด', ok: 'บันทึกเรท', onOk: doIt });
    else doIt();
  };
  const addStaff = () => mut(d => {
    if (!st.name.trim()) return 'กรอกชื่อพนักงาน';
    d.staff.push({ id: uid(), name: st.name.trim(), position: st.position.trim(), dept: st.dept.trim() });
  }, 'เพิ่มพนักงานแล้ว') && setSt({ name: '', position: '', dept: '' });
  const setDept = () => mut(d => {
    const x = d.staff.find(y => y.id === dp.staffId);
    if (!x) return 'เลือกพนักงาน';
    x.dept = dp.dept.trim();
  }, 'บันทึกแผนกแล้ว') && setDp({ staffId: '', dept: '' });

  const exportJSON = async () => {
    const text = JSON.stringify(s);
    const filename = `subancc-backup-${T}.json`;
    try {
      if (window.claude && window.claude.use) {
        const dl = await window.claude.use('downloads');
        if (dl) { await dl.save({ filename, data: text }); notify('ส่งไฟล์สำรองให้บันทึกแล้ว'); return; }
      }
    } catch (e) { if (e && e.code === 'declined') return; }
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      notify('ดาวน์โหลดไฟล์สำรองแล้ว');
    } catch (e) { notify('ดาวน์โหลดไม่สำเร็จในหน้านี้ ลองเปิดไฟล์ index.html บนเครื่อง', 'bad'); }
  };
  const importJSON = e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const data = JSON.parse(fr.result);
        if (!data || data.version !== 3 || !Array.isArray(data.bills)) throw new Error('bad');
        // ไฟล์สำรองเก่าที่ยังไม่มีผู้ใช้ ให้คงบัญชีผู้ใช้ปัจจุบันไว้ จะได้ไม่ล็อกตัวเองออก
        if (cloud) delete data.users; // บัญชีผู้ใช้ในชีตไม่เปลี่ยน
        else if (!Array.isArray(data.users) || !data.users.length) data.users = s.users;
        const keepMe = cloud || data.users.some(u => u.id === me.id && u.active !== false);
        ask({ title: 'นำเข้าข้อมูลสำรอง?', body: cloud ? 'ข้อมูลใน Google Sheets จะถูกแทนที่ทั้งหมด ทุกคนจะเห็นข้อมูลชุดนี้ (บัญชีผู้ใช้ไม่เปลี่ยน)' : `ข้อมูลปัจจุบันในเครื่องนี้จะถูกแทนที่ทั้งหมด${keepMe ? '' : ' · ไฟล์นี้ไม่มีบัญชีของคุณ ระบบจะพากลับไปหน้าเข้าสู่ระบบ'}`, ok: 'นำเข้า', danger: true, onOk: () => { replaceAll(data); notify('นำเข้าข้อมูลแล้ว'); } });
      } catch (err) { notify('ไฟล์นี้ไม่ใช่ไฟล์สำรองของ SUBAN CC', 'bad'); }
    };
    fr.readAsText(file);
  };

  return (<>
    <div className="pagehead">
      <div><h1>ตั้งค่าข้อมูลหลัก</h1><p className="sub">{can ? 'แก้ไขได้ในบทบาทนี้' : 'ดูได้อย่างเดียว เปลี่ยนเป็นบทบาทผู้จัดการหรือผู้บริหารเพื่อแก้ไข'}</p></div>
    </div>

    {isOffice(me) && <UsersPanel />}
    {isOffice(me) && <SheetsPanel />}

    <section className="panel">
      <div className="panel-head"><h2>โครงการ</h2></div>
      <div className="tbl-wrap"><table className="tbl">
        <thead><tr><th>รหัส</th><th>ชื่อโครงการ</th><th>ลูกค้า</th><th className="r">งบประมาณ</th><th className="r">ต้นทุนยกมา</th><th>สถานะ</th></tr></thead>
        <tbody>{s.projects.map(p => (
          <tr key={p.id}>
            <td><b>{p.code}</b></td><td>{p.name}</td><td>{p.client}</td>
            <td className="r num">{num(p.budget, 0)}</td><td className="r num">{num(p.openingCost, 0)}</td>
            <td>{can ? <button className="btn btn-sm" onClick={() => mut(d => { const x = d.projects.find(y => y.id === p.id); x.status = x.status === 'active' ? 'closed' : 'active'; }, p.status === 'active' ? `ปิดงาน ${p.code} แล้ว` : `เปิด ${p.code} อีกครั้งแล้ว`)}>{p.status === 'active' ? 'ปิดงาน' : 'เปิดใหม่'}</button>
              : <span className={'pill ' + (p.status === 'active' ? 'ok' : '')}>{p.status === 'active' ? 'ดำเนินการ' : 'ปิดงาน'}</span>}</td>
          </tr>
        ))}</tbody>
      </table></div>
      {can && <div className="form" style={{ marginTop: 14 }}>
        <label className="field"><span>รหัส</span><input id="pj-code" placeholder="P-2604" value={pj.code} onChange={e => setPj({ ...pj, code: e.target.value })} /></label>
        <label className="field"><span>ชื่อโครงการ</span><input id="pj-name" value={pj.name} onChange={e => setPj({ ...pj, name: e.target.value })} /></label>
        <label className="field"><span>ลูกค้า</span><input id="pj-client" value={pj.client} onChange={e => setPj({ ...pj, client: e.target.value })} /></label>
        <label className="field"><span>งบประมาณ (บาท)</span><input id="pj-budget" type="number" value={pj.budget} onChange={e => setPj({ ...pj, budget: e.target.value })} /></label>
        <label className="field"><span>ต้นทุนก่อนใช้ระบบ (บาท)</span><input id="pj-open" type="number" value={pj.openingCost} onChange={e => setPj({ ...pj, openingCost: e.target.value })} /></label>
        <div className="field" style={{ justifyContent: 'flex-end' }}><button className="btn btn-primary" onClick={addProject}>เพิ่มโครงการ</button></div>
      </div>}
    </section>

    <section className="panel">
      <div className="panel-head"><h2>ช่างและเรทค่าแรงรายวัน</h2><span className="hint">เรทใหม่มีผลตั้งแต่วันที่กำหนด ไม่เปลี่ยนงวดที่ปิดแล้ว</span></div>
      <div className="tbl-wrap"><table className="tbl">
        <thead><tr><th>ช่าง</th><th className="r">เรทวันนี้</th><th>ประวัติเรท</th></tr></thead>
        <tbody>{s.workers.map(w => {
          const now = rateFor(s, w.id, T);
          const hist = s.rates.filter(r => r.workerId === w.id).sort((a, b) => a.from.localeCompare(b.from));
          const cur = hist.filter(r => r.from <= T).pop();
          return (
            <tr key={w.id}>
              <td><b>{w.name}</b><span className="sub">{w.team}</span></td>
              <td className="r num">{now != null ? baht(now) : '—'}{now != null && now < s.settings.minWage && <span className="sub" style={{ color: 'var(--bad)' }}>ต่ำกว่าขั้นต่ำ</span>}</td>
              <td><div className="chips">{hist.map(r => <span key={r.from} className={'chip num' + (r === cur ? ' now' : '')}>{num(r.daily)} ตั้งแต่ {thDate(r.from)}</span>)}</div></td>
            </tr>
          );
        })}</tbody>
      </table></div>
      {owner ? (<>
        <h3 style={{ margin: '16px 0 8px' }}>เปลี่ยนเรท</h3>
        <div className="form">
          <label className="field"><span>ช่าง</span><select id="rt-w" value={rt.workerId} onChange={e => setRt({ ...rt, workerId: e.target.value })}><option value="">เลือกช่าง</option>{s.workers.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}</select></label>
          <label className="field"><span>เรทใหม่ (บาท/วัน)</span><input id="rt-d" type="number" value={rt.daily} onChange={e => setRt({ ...rt, daily: e.target.value })} /></label>
          <label className="field"><span>มีผลตั้งแต่</span><input id="rt-f" type="date" value={rt.from} onChange={e => setRt({ ...rt, from: e.target.value })} /></label>
          <div className="field" style={{ justifyContent: 'flex-end' }}><button className="btn btn-primary" onClick={addRate}>บันทึกเรท</button></div>
        </div>
        <h3 style={{ margin: '16px 0 8px' }}>เพิ่มช่าง</h3>
        <div className="form">
          <label className="field"><span>ชื่อ-สกุล</span><input id="wk-n" value={wk.name} onChange={e => setWk({ ...wk, name: e.target.value })} /></label>
          <label className="field"><span>ประเภทช่าง</span><input id="wk-t" placeholder="ช่างปูน, ช่างไม้" value={wk.team} onChange={e => setWk({ ...wk, team: e.target.value })} /></label>
          <label className="field"><span>เรท (บาท/วัน)</span><input id="wk-d" type="number" value={wk.daily} onChange={e => setWk({ ...wk, daily: e.target.value })} /></label>
          <label className="field"><span>มีผลตั้งแต่</span><input id="wk-f" type="date" value={wk.from} onChange={e => setWk({ ...wk, from: e.target.value })} /></label>
          <div className="field" style={{ justifyContent: 'flex-end' }}><button className="btn btn-primary" onClick={addWorker}>เพิ่มช่าง</button></div>
        </div>
      </>) : <p className="hint" style={{ marginTop: 10 }}>เปลี่ยนเรทและเพิ่มช่างได้ในบทบาทผู้บริหาร / บัญชี</p>}
    </section>

    <div className="cols" style={{ gridTemplateColumns: 'repeat(auto-fit,minmax(300px,1fr))' }}>
      <section className="panel">
        <div className="panel-head"><h2>พนักงานที่เบิกเงินทดรอง</h2></div>
        <div className="chips" style={{ marginBottom: 12 }}>{s.staff.map(x => {
          const used = s.bills.some(b => b.staffId === x.id) || s.cash.some(c => c.staffId === x.id);
          const acct = ua.list.find(u => u.staffId === x.id);
          return (<span className="chip" key={x.id}>{x.name}{x.position ? ` · ${x.position}` : ''}{x.dept ? ` · แผนก${x.dept}` : ''}{acct ? ` · @${acct.username}` : ''}
            {can && <button className="linkbtn" style={{ marginLeft: 6 }} aria-label={`ลบ ${x.name}`} title={used ? 'มีบิลหรือเงินทดรองอยู่ ลบไม่ได้ ระงับบัญชีผู้ใช้แทน' : cloud && acct ? `ผูกกับบัญชี @${acct.username} อยู่ ยกเลิกการผูกที่ตารางผู้ใช้ก่อน` : 'ลบชื่อนี้'} disabled={used || (cloud && !!acct)}
              onClick={() => ask({ title: `ลบ ${x.name} ออกจากรายชื่อผู้เบิก?`, body: acct ? `บัญชี @${acct.username} จะถูกยกเลิกการผูกด้วย` : 'ยังไม่มีบิลหรือเงินทดรองของชื่อนี้', ok: 'ลบ', danger: true,
                onOk: () => mut(d => { d.staff = d.staff.filter(y => y.id !== x.id); (d.users || []).forEach(u => { if (u.staffId === x.id) u.staffId = ''; }); Object.keys(d.lineMap || {}).forEach(k => { if (d.lineMap[k] === x.id) delete d.lineMap[k]; }); }, `ลบ ${x.name} แล้ว`) })}>ลบ</button>}
          </span>);
        })}</div>
        {Object.keys(s.lineMap || {}).length > 0 && (<>
          <h3 style={{ margin: '4px 0 6px' }}>ชื่อใน LINE ที่จับคู่แล้ว</h3>
          <div className="chips" style={{ marginBottom: 12 }}>{Object.entries(s.lineMap).map(([k, v]) => (
            <span className="chip" key={k}>{k} → {staffName(s, v)}
              {can && <button className="linkbtn" style={{ marginLeft: 6 }} aria-label={`ยกเลิกการจับคู่ ${k}`} onClick={() => mut(d => { delete d.lineMap[k]; }, `ยกเลิกการจับคู่ ${k} แล้ว`)}>ยกเลิก</button>}</span>
          ))}</div>
        </>)}
        {can && <div className="form">
          <label className="field"><span>ชื่อ</span><input id="st-n" value={st.name} onChange={e => setSt({ ...st, name: e.target.value })} /></label>
          <label className="field"><span>ตำแหน่ง</span><input id="st-p" value={st.position} onChange={e => setSt({ ...st, position: e.target.value })} /></label>
          <label className="field"><span>แผนก</span><input id="st-d" list="dept-list" placeholder="เช่น หน้างาน, จัดซื้อ" value={st.dept} onChange={e => setSt({ ...st, dept: e.target.value })} /></label>
          <div className="field" style={{ justifyContent: 'flex-end' }}><button className="btn btn-primary" onClick={addStaff}>เพิ่ม</button></div>
        </div>}
        {can && s.staff.length > 0 && <>
          <h3 style={{ margin: '16px 0 6px' }}>กำหนดแผนก <span className="hint">ใช้แยกรายงานค่าใช้จ่ายตามแผนก</span></h3>
          <div className="form">
            <label className="field"><span>พนักงาน</span><select id="dp-s" value={dp.staffId} onChange={e => { const x = s.staff.find(y => y.id === e.target.value); setDp({ staffId: e.target.value, dept: (x && x.dept) || '' }); }}>
              <option value="">เลือกพนักงาน</option>{s.staff.map(x => <option key={x.id} value={x.id}>{x.name}{x.dept ? ` (${x.dept})` : ''}</option>)}</select></label>
            <label className="field"><span>แผนก</span><input id="dp-d" list="dept-list" value={dp.dept} onChange={e => setDp({ ...dp, dept: e.target.value })} /></label>
            <div className="field" style={{ justifyContent: 'flex-end' }}><button className="btn" disabled={!dp.staffId} onClick={setDept}>บันทึกแผนก</button></div>
          </div>
        </>}
        <datalist id="dept-list">{depts.map(x => <option key={x} value={x} />)}</datalist>
      </section>
    </div>

    <section className="panel">
      <div className="panel-head"><h2>กติกาและวงเงิน</h2>{!owner && <span className="hint">แก้ได้ในบทบาทผู้บริหาร / บัญชี</span>}</div>
      <fieldset disabled={!owner} style={{ border: 0, padding: 0, margin: 0 }}>
        <div className="form">
          <label className="check" style={{ alignSelf: 'end', paddingBottom: 8 }}><input id="set-vat" type="checkbox" checked={s.settings.vatRegistered} onChange={e => mut(d => { d.settings.vatRegistered = e.target.checked; })} />บริษัทจดทะเบียน VAT</label>
          <label className="field"><span>ค่าแรงขั้นต่ำ (บาท/วัน)</span><input id="set-min" type="number" value={s.settings.minWage} onChange={e => mut(d => { d.settings.minWage = +e.target.value || 0; })} /></label>
          <label className="field"><span>พักเที่ยง (นาที)</span><input id="set-brk" type="number" value={s.settings.breakMin} onChange={e => mut(d => { d.settings.breakMin = +e.target.value || 0; })} /></label>
          <label className="field"><span>หักพักเมื่ออยู่เกิน (ชม.)</span><input id="set-brka" type="number" value={s.settings.breakAfter} onChange={e => mut(d => { d.settings.breakAfter = +e.target.value || 0; })} /></label>
          <label className="field"><span>วงเงินอนุมัติ หัวหน้าชุด</span><input id="set-l1" type="number" value={s.settings.limits.lead} onChange={e => mut(d => { d.settings.limits.lead = +e.target.value || 0; })} /></label>
          <label className="field"><span>วงเงินอนุมัติ ผู้จัดการ</span><input id="set-l2" type="number" value={s.settings.limits.manager} onChange={e => mut(d => { d.settings.limits.manager = +e.target.value || 0; })} /></label>
        </div>
      </fieldset>
      <p className="hint" style={{ marginTop: 10 }}>สายอนุมัติ: ยอดไม่เกินวงเงินหัวหน้าชุด หัวหน้าชุดอนุมัติจบ · ไม่เกินวงเงินผู้จัดการ หัวหน้าชุด → ผู้จัดการ · เกินกว่านั้น หัวหน้าชุด → ผู้จัดการ → ผู้บริหาร · ผู้อนุมัติที่สูงกว่าอนุมัติแทนขั้นที่ต่ำกว่าได้ · เรื่องที่ส่งแล้วใช้สายเดิมแม้แก้วงเงินภายหลัง</p>
      <p className="hint" style={{ marginTop: 6 }}>ค่าแรงขั้นต่ำแตกต่างตามจังหวัด ตรวจอัตราปัจจุบันของจังหวัดที่ตั้งไซต์ก่อนใช้งานจริง</p>
    </section>

    <section className="panel">
      <div className="panel-head"><h2>สำรองข้อมูล</h2></div>
      <p className="hint" style={{ marginBottom: 12 }}>{cloud ? 'ข้อมูลเก็บใน Google Sheets ของบริษัทแล้ว ไฟล์สำรองใช้เก็บไว้เผื่อฉุกเฉิน (ไม่มีรหัสผ่านของผู้ใช้อยู่ในไฟล์)' : 'ตอนนี้เก็บข้อมูลไว้ในเบราว์เซอร์ของเครื่องนี้เท่านั้น ควรสำรองเป็นไฟล์ทุกสัปดาห์ หรือเชื่อมต่อ Google Sheets ด้านบนให้ทุกคนใช้ข้อมูลชุดเดียวกัน'}</p>
      <div className="actions">
        <button className="btn" onClick={exportJSON}>สำรองเป็นไฟล์</button>
        <button className="btn" onClick={() => fileRef.current && fileRef.current.click()}>นำเข้าจากไฟล์</button>
        <input ref={fileRef} id="imp" type="file" accept="application/json,.json" hidden onChange={importJSON} />
        <button className="btn btn-bad" onClick={() => ask({ title: 'ล้างข้อมูลและเริ่มจากข้อมูลตัวอย่าง?', body: cloud ? 'ข้อมูลทั้งหมดใน Google Sheets จะถูกแทนที่ด้วยข้อมูลตัวอย่าง ทุกคนจะเห็นข้อมูลตัวอย่างนี้ (บัญชีผู้ใช้ไม่เปลี่ยน)' : 'ข้อมูลทั้งหมดในเครื่องนี้จะถูกแทนที่ด้วยข้อมูลตัวอย่าง (บัญชีผู้ใช้ Staff office ยังอยู่)', ok: 'ล้างข้อมูล', danger: true, onOk: () => { replaceAll(cloud ? seed() : { ...seed(), users: (s.users || []).filter(isOffice).map(u => ({ ...u })) }); notify('รีเซ็ตเป็นข้อมูลตัวอย่างแล้ว'); } })}>รีเซ็ตเป็นข้อมูลตัวอย่าง</button>
      </div>
    </section>
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
