/* ---------- ค่าแรง ---------- */
const PERIODS = [['day', 'รายวัน'], ['week', 'รายสัปดาห์'], ['2week', '2 สัปดาห์']];
const periodName = mode => (PERIODS.find(p => p[0] === mode) || PERIODS[1])[1];
const PAY_EPOCH = '2024-01-01'; // วันจันทร์ ใช้ตั้งรอบจ่าย 2 สัปดาห์ให้ตรงกันทุกเครื่อง
function periodOf(mode, date) {
  if (mode === 'day') return { from: date, to: date };
  let w = weekOf(date);
  if (mode === '2week') {
    const k = Math.round((parseD(w) - parseD(PAY_EPOCH)) / 864e5 / 7);
    if (((k % 2) + 2) % 2) w = addDays(w, -7);
  }
  return { from: w, to: addDays(w, mode === '2week' ? 13 : 6) };
}
const clampDate = (d, from, to) => d < from ? from : d > to ? to : d;
const periodText = (mode, from, to) => `งวด${mode === '2week' ? ' ' : ''}${periodName(mode)} ${from === to ? thDate(from) : `${thDate(from)} – ${thDate(to)}`}`;

function slipData(s, workerId, from, to) {
  const rows = s.time.filter(e => e.workerId === workerId && e.date >= from && e.date <= to)
    .sort((a, b) => a.date.localeCompare(b.date)).map(e => ({ e, c: calcPay(s, e) }));
  const adj = (s.laborAdj || []).filter(a => a.workerId === workerId && a.date >= from && a.date <= to).sort((a, b) => a.date.localeCompare(b.date));
  const gross = r2(sum(rows, r => r.c.pay));
  const add = r2(sum(adj.filter(a => a.kind === 'add'), a => a.amount));
  const ded = r2(sum(adj.filter(a => a.kind === 'deduct'), a => a.amount));
  return {
    rows, adj, gross, add, ded, net: r2(gross + add - ded),
    days: new Set(rows.map(r => r.e.date)).size,
    reg: sum(rows, r => r.c.reg), ot: sum(rows, r => r.c.ot),
    regPay: r2(sum(rows, r => r.c.regPay)), otPay: r2(sum(rows, r => r.c.otPay)),
    missing: rows.filter(r => r.c.rate == null).length,
  };
}
const slipPdfName = (w, from) => `สลิปค่าแรง-${safeFile(w.name)}-${from}.pdf`;
const slipLineText = (w, d, mode, from, to) => [`💵 สลิปค่าแรง ${w.name}${w.nick ? ` (${w.nick})` : ''}`, periodText(mode, from, to),
  `ทำงาน ${d.days} วัน · ปกติ ${num(d.reg, 1)} ชม. · OT ${num(d.ot, 1)} ชม.`, `ค่าแรงปกติ ${baht(d.regPay)}`, `ค่า OT ${baht(d.otPay)}`,
  ...d.adj.map(a => `${a.kind === 'add' ? '+ ' : '− '}${a.note} ${baht(a.amount)}`), `รับสุทธิ ${baht(d.net)}`, w.bank ? `โอนเข้า: ${w.bank}` : ''].filter(Boolean).join('\n');

const Avatar = ({ w, size = 40 }) => w && w.photo
  ? <img className="ava" src={w.photo} alt="" style={{ width: size, height: size }} />
  : <span className="ava ph" aria-hidden="true" style={{ width: size, height: size, fontSize: Math.round(size * 0.42) }}>{((w && w.name) || '?').replace(/^[เแโใไ]/, '').trim().charAt(0) || '?'}</span>;

  const [panel, setPanel] = useState(null);
  const panelRef = useRef(null);
  const doc = useDocPdf();
  const { from, to } = periodOf(mode, anchor);
  const cur = periodOf(mode, T);
  const step = mode === 'day' ? 1 : mode === 'week' ? 7 : 14;
  const now = weekOf(T);
  const weeks = mode === '2week' ? [from, addDays(from, 7)] : [weekOf(from)];
  const closedAll = weeks.every(w => s.laborWeeks.includes(w));
  const closedSome = weeks.some(w => s.laborWeeks.includes(w));
  const toClose = weeks.filter(w => !s.laborWeeks.includes(w) && w <= now);
  const defDate = clampDate(T, from, to);
  const rows = s.time.filter(e => e.date >= from && e.date <= to)
    .map(e => ({ e, c: calcPay(s, e) }))

  const ids = [...new Set([...rows.map(r => r.e.workerId), ...(s.laborAdj || []).filter(a => a.date >= from && a.date <= to).map(a => a.workerId)])];
  const slips = ids.map(id => ({ id, w: s.workers.find(x => x.id === id) || { id, name: '—' }, d: slipData(s, id, from, to) }))
    .sort((a, b) => a.w.name.localeCompare(b.w.name, 'th'));

      <div className="actions">

        </table></div>
      </section>
    )}
    {doc.host}
  </>);

/* ---------- ข้อมูลคนงาน + ค่าแรง / OT ---------- */
function WorkerForm({ edit, doc, onClose }) {
  const { s, mut, ask, notify } = useApp();
  const T = todayISO();
  const cur = edit ? rateRec(s, edit.id, T) : null;
  const [f, setF] = useState(() => ({
    name: edit ? edit.name : '', nick: (edit && edit.nick) || '', team: (edit && edit.team) || '', phone: (edit && edit.phone) || '',
    start: (edit && edit.start) || '', bank: (edit && edit.bank) || '', note: (edit && edit.note) || '', photo: (edit && edit.photo) || '',
    daily: cur ? String(cur.daily) : '', ot: cur && +cur.ot > 0 ? String(cur.ot) : '', from: weekOf(T),
  }));
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const canRate = !edit || isManager(s);
  const autoOt = +f.daily > 0 ? r2(+f.daily / 8 * 1.5) : 0;
  const rateChanged = !!edit && (+f.daily !== (cur ? +cur.daily : 0) || (+f.ot || 0) !== (cur && +cur.ot > 0 ? +cur.ot : 0));
  const hist = edit ? s.rates.filter(r => r.workerId === edit.id).sort((a, b) => a.from.localeCompare(b.from)) : [];
  const used = edit && (s.time.some(e => e.workerId === edit.id) || (s.laborAdj || []).some(a => a.workerId === edit.id));
  const teams = [...new Set(s.workers.map(w => w.team).filter(Boolean))];

  const onPhoto = async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try { const p = await readPhoto(file, 360); set('photo', p.url); } catch (err) { notify('อ่านรูปไม่สำเร็จ', 'bad'); }
  };
  const save = () => {
    const doIt = () => mut(d => {
      const name = f.name.trim();
      if (!name) return 'กรอกชื่อคนงาน';
      if (d.workers.some(w => w.name === name && (!edit || w.id !== edit.id))) return 'มีชื่อนี้ในทะเบียนแล้ว';
      if (canRate && !(+f.daily > 0)) return 'กรอกค่าแรงต่อวัน';
      if (canRate && f.ot !== '' && !(+f.ot >= 0)) return 'ค่า OT ต่อชั่วโมงไม่ถูกต้อง';
      const info = { name, team: f.team.trim(), nick: f.nick.trim(), phone: f.phone.trim(), start: f.start, bank: f.bank.trim(), note: f.note.trim(), photo: f.photo };
      let id;
      if (edit) { const w = d.workers.find(x => x.id === edit.id); if (!w) return 'ไม่พบคนงาน'; Object.assign(w, info); id = w.id; }
      else { id = uid(); d.workers.push({ id, ...info }); }
      if (!edit || (canRate && rateChanged)) {
        // คนงานใหม่: เรทมีผลตั้งแต่วันเริ่มงาน ถ้าไม่ระบุให้ครอบคลุมวันที่ผ่านมาทั้งหมด (แนบบัตรตอกย้อนหลังได้)
        const from = edit ? f.from : (f.start || '2000-01-01');
        const rec = { workerId: id, from, daily: +f.daily };
        if (+f.ot > 0) rec.ot = +f.ot;
        d.rates = d.rates.filter(r => !(r.workerId === id && r.from === from));
        d.rates.push(rec);
      }
    }, edit ? 'บันทึกข้อมูลคนงานแล้ว' : 'เพิ่มคนงานแล้ว') && onClose();
    if (rateChanged && s.laborWeeks.some(w => addDays(w, 6) >= f.from)) ask({ title: 'วันที่มีผลย้อนเข้าไปในงวดที่ปิดแล้ว', body: 'งวดที่ปิดแล้วยังใช้ยอดที่ล็อกไว้เหมือนเดิม ค่าแรงใหม่มีผลเฉพาะรายการที่ยังไม่ปิดงวด', ok: 'บันทึก', onOk: doIt });
    else doIt();
  };
  const remove = () => ask({ title: `ลบ ${edit.name} ออกจากทะเบียน?`, body: 'ลบข้อมูลส่วนตัวและเรทค่าแรงของคนงานนี้', ok: 'ลบ', danger: true,
    onOk: () => mut(d => { d.workers = d.workers.filter(w => w.id !== edit.id); d.rates = d.rates.filter(r => r.workerId !== edit.id); }, 'ลบคนงานแล้ว') && onClose() });
  const pdfKey = edit ? 'prof:' + edit.id : '';

  return (
    <section className="panel formpanel">
      <div className="panel-head"><h2>{edit ? `ข้อมูลคนงาน · ${edit.name}` : 'เพิ่มคนงานใหม่'}</h2><button className="btn btn-sm btn-ghost" onClick={onClose}>ปิด</button></div>
      <div className="avapick">
        <Avatar w={{ name: f.name, photo: f.photo }} size={84} />
        <div className="row">
          <label className="btn btn-sm filebtn">📷 {f.photo ? 'เปลี่ยนรูป' : 'ถ่าย / เลือกรูปคนงาน'}<input id="wf-photo" type="file" accept="image/*" onChange={onPhoto} /></label>
          {f.photo && <button className="btn btn-sm btn-ghost" onClick={() => set('photo', '')}>ลบรูป</button>}
        </div>
      </div>
      <h3 style={{ margin: '0 0 8px' }}>ข้อมูลส่วนตัว</h3>
      <div className="form">
        <label className="field"><span>ชื่อ-สกุล *</span><input id="wf-name" value={f.name} onChange={e => set('name', e.target.value)} /></label>
        <label className="field"><span>ชื่อเล่น</span><input id="wf-nick" value={f.nick} onChange={e => set('nick', e.target.value)} /></label>
        <label className="field"><span>ประเภทช่าง</span><input id="wf-team" list="wf-teams" placeholder="ช่างปูน, กรรมกร" value={f.team} onChange={e => set('team', e.target.value)} /></label>
        <label className="field"><span>เบอร์โทร</span><input id="wf-phone" type="tel" inputMode="tel" value={f.phone} onChange={e => set('phone', e.target.value)} /></label>
        <label className="field"><span>วันเริ่มงาน</span><input id="wf-start" type="date" value={f.start} onChange={e => set('start', e.target.value)} /></label>
        <label className="field"><span>บัญชีรับค่าแรง (ธนาคาร / เลขบัญชี)</span><input id="wf-bank" placeholder="กสิกร 123-4-56789-0" value={f.bank} onChange={e => set('bank', e.target.value)} /></label>
        <label className="field wide"><span>หมายเหตุ</span><input id="wf-note" placeholder="ที่พัก, ผู้ติดต่อฉุกเฉิน, ทักษะพิเศษ" value={f.note} onChange={e => set('note', e.target.value)} /></label>
      </div>
      <datalist id="wf-teams">{teams.map(t => <option key={t} value={t} />)}</datalist>

      <h3 style={{ margin: '18px 0 8px' }}>ค่าแรงและ OT</h3>
      {canRate ? (<>
        <div className="form">
          <label className="field"><span>ค่าแรง (บาท / วัน) *</span><input id="wf-daily" type="number" inputMode="decimal" value={f.daily} onChange={e => set('daily', e.target.value)} /></label>
          <label className="field"><span>ค่า OT (บาท / ชม.)</span><input id="wf-ot" type="number" inputMode="decimal" placeholder={autoOt ? `อัตโนมัติ ${num(autoOt)}` : 'อัตโนมัติ'} value={f.ot} onChange={e => set('ot', e.target.value)} /></label>
          {edit && <label className="field"><span>มีผลตั้งแต่</span><input id="wf-from" type="date" value={f.from} onChange={e => set('from', e.target.value)} /></label>}
        </div>
        <p className="hint" style={{ marginTop: 6 }}>ค่า OT ว่างไว้ = ค่าแรง ÷ 8 × 1.5 ต่อชั่วโมง · ทำงานวันหยุดคิด ×2 ทั้งค่าแรงและ OT{!edit && ' · คนงานใหม่: ค่าแรงมีผลตั้งแต่วันเริ่มงาน (ไม่ระบุ = ทุกวันที่ผ่านมา)'}</p>
        {+f.daily > 0 && +f.daily < s.settings.minWage && <p className="hint bad">ต่ำกว่าค่าแรงขั้นต่ำที่ตั้งไว้ {baht(s.settings.minWage)}</p>}
      </>) : <p className="hint">ค่าแรงปัจจุบัน {cur ? `${baht(cur.daily)} / วัน · OT ${baht(otRateOf(cur))} / ชม.` : '—'} · เปลี่ยนค่าแรงได้ในบทบาทผู้จัดการขึ้นไป</p>}
      {hist.length > 0 && <div className="chips" style={{ marginTop: 10 }}>{hist.map(r => <span key={r.from} className={'chip num' + (r === cur ? ' now' : '')}>{num(r.daily)}/วัน{+r.ot > 0 ? ` · OT ${num(r.ot)}` : ''} ตั้งแต่ {r.from <= '2000-01-01' ? 'เริ่มต้น' : thDate(r.from)}</span>)}</div>}

      <div className="formfoot">
        <div className="row">
          {edit && !used && isManager(s) && <button className="btn btn-sm btn-bad" onClick={remove}>ลบคนงาน</button>}
          {edit && <button className="btn btn-sm" disabled={!!(doc.pdf && doc.pdf.busy)} onClick={() => doc.make(pdfKey, `ข้อมูลคนงาน-${safeFile(edit.name)}.pdf`, <WorkerProfileDoc s={s} w={edit} />, [`👷 ${edit.name}${edit.nick ? ` (${edit.nick})` : ''}`, edit.team, edit.phone ? `โทร ${edit.phone}` : '', cur ? `ค่าแรง ${baht(cur.daily)}/วัน · OT ${baht(otRateOf(cur))}/ชม.` : ''].filter(Boolean).join('\n'))}>📄 PDF ข้อมูลคนงาน</button>}
        </div>
        <div className="actions">
          <button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button>
          <button className="btn btn-primary" onClick={save}>{edit ? 'บันทึก' : 'เพิ่มคนงาน'}</button>
        </div>
      </div>
      {doc.pdf && doc.pdf.key === pdfKey && pdfKey && (doc.pdf.busy ? <p className="hint" style={{ marginTop: 10 }}>กำลังสร้าง PDF…</p> : <div style={{ marginTop: 10 }}><PdfShareBox pdf={doc.pdf} onClose={doc.close} /></div>)}
    </section>
  );
}

/* ---------- สลิปค่าแรงรายคน ---------- */
function SlipPanel({ workerId, mode, from, to, doc, onClose, onEdit }) {
  const { s, mut } = useApp();
  const T = todayISO();
  const w = s.workers.find(x => x.id === workerId) || { id: workerId, name: '—' };
  const d = slipData(s, workerId, from, to);
  const rr = rateRec(s, workerId, to);
  const [adj, setAdj] = useState({ kind: 'deduct', amount: '', note: '', date: clampDate(T, from, to) });
  const lockedDay = date => s.laborWeeks.includes(weekOf(date));
  const addAdj = () => mut(x => {
    if (!(+adj.amount > 0)) return 'กรอกจำนวนเงิน';
    if (!adj.note.trim()) return 'ระบุรายการ เช่น เบิกล่วงหน้า ค่าเดินทาง';
    if (adj.date < from || adj.date > to) return 'วันที่ต้องอยู่ในงวดนี้';
    if (lockedDay(adj.date)) return 'งวดของวันนี้ปิดแล้ว';
    x.laborAdj = x.laborAdj || [];
    x.laborAdj.push({ id: uid(), workerId, date: adj.date, kind: adj.kind, amount: r2(adj.amount), note: adj.note.trim() });
  }, 'เพิ่มรายการในสลิปแล้ว') && setAdj(a => ({ ...a, amount: '', note: '' }));
  const key = 'slip:' + workerId;

  return (
    <section className="panel formpanel">
      <div className="panel-head"><h2>สลิปค่าแรง</h2><button className="btn btn-sm btn-ghost" onClick={onClose}>ปิด</button></div>
      <div className="slip">
        <div className="row between">
          <div className="who"><Avatar w={w} size={56} /><div><b style={{ fontSize: '1.05rem' }}>{w.name}{w.nick ? ` (${w.nick})` : ''}</b><div className="muted small">{w.team || '—'}{rr ? ` · ${baht(rr.daily)}/วัน · OT ${baht(otRateOf(rr))}/ชม.` : ''}</div></div></div>
          <span className="pill gold plain">{periodText(mode, from, to)}</span>
        </div>
        {d.rows.length === 0 ? <p className="empty" style={{ padding: 12 }}>ไม่มีบันทึกเวลาในงวดนี้</p> : (
          <div className="tbl-wrap" style={{ marginInline: 0, paddingInline: 0 }}><table className="tbl">
            <thead><tr><th>วันที่</th><th>โครงการ</th><th>เข้า–ออก</th><th className="r">ชม.</th><th className="r">OT</th><th className="r">ค่าแรง</th><th className="r">ค่า OT</th><th className="r">รวม</th></tr></thead>
            <tbody>{d.rows.map(({ e, c }) => (
              <tr key={e.id}>
                <td className="nowrap">{thDay(e.date)}{e.holiday && <span className="sub">วันหยุด</span>}</td>
                <td>{projLabel(s, e.projectId)}</td>
                <td className="num nowrap">{e.tin}–{e.tout}</td>
                <td className="r num">{num(c.reg, 1)}</td><td className="r num">{c.ot ? num(c.ot, 1) : '—'}</td>
                <td className="r num">{c.rate != null ? num(c.regPay) : <span style={{ color: 'var(--bad)' }}>ไม่มีเรท</span>}</td>
                <td className="r num">{c.otPay ? num(c.otPay) : '—'}</td><td className="r num"><b>{num(c.pay)}</b></td>
              </tr>
            ))}</tbody>
          </table></div>
        )}
        <dl className="ledger">
          <dt>ค่าแรงปกติ ({d.days} วัน · {num(d.reg, 1)} ชม.)</dt><dd>{baht(d.regPay)}</dd>
          <dt>ค่าล่วงเวลา OT ({num(d.ot, 1)} ชม.)</dt><dd>{baht(d.otPay)}</dd>
          {d.adj.map(a => (<React.Fragment key={a.id}>
            <dt>{a.kind === 'add' ? '＋' : '－'} {a.note} <span className="muted small">({thDate(a.date)})</span>
              {isManager(s) && !lockedDay(a.date) && <button className="linkbtn small" style={{ marginLeft: 6 }} onClick={() => mut(x => { x.laborAdj = (x.laborAdj || []).filter(y => y.id !== a.id); }, 'ลบรายการแล้ว')}>ลบ</button>}</dt>
            <dd style={{ color: a.kind === 'add' ? 'var(--ok)' : 'var(--bad)' }}>{a.kind === 'add' ? '+' : '−'}{baht(a.amount)}</dd>
          </React.Fragment>))}
          <dt className="tot">รับสุทธิ</dt><dd className="tot">{baht(d.net)}</dd>
        </dl>
        {w.bank && <p className="small muted">โอนเข้า: {w.bank}</p>}
      </div>

      {isManager(s) && (<>
        <h3 style={{ margin: '16px 0 8px' }}>เพิ่ม / หัก ในสลิป</h3>
        <div className="form">
          <label className="field"><span>ประเภท</span><select id="sa-kind" value={adj.kind} onChange={e => setAdj({ ...adj, kind: e.target.value })}><option value="deduct">หัก (เบิกล่วงหน้า ฯลฯ)</option><option value="add">เพิ่ม (เบี้ยเลี้ยง โบนัส ฯลฯ)</option></select></label>
          <label className="field"><span>รายการ</span><input id="sa-note" placeholder="เบิกล่วงหน้า" value={adj.note} onChange={e => setAdj({ ...adj, note: e.target.value })} /></label>
          <label className="field"><span>จำนวนเงิน (บาท)</span><input id="sa-amt" type="number" inputMode="decimal" value={adj.amount} onChange={e => setAdj({ ...adj, amount: e.target.value })} /></label>
          <label className="field"><span>วันที่</span><input id="sa-date" type="date" min={from} max={to} value={adj.date} onChange={e => setAdj({ ...adj, date: e.target.value })} /></label>
          <div className="field" style={{ justifyContent: 'flex-end' }}><button className="btn" onClick={addAdj}>เพิ่มในสลิป</button></div>
        </div>
      </>)}

      <div className="actions" style={{ justifyContent: 'flex-end', marginTop: 14 }}>
        {isLead(s) && <button className="btn" onClick={onEdit}>แก้ค่าแรง / OT</button>}
        <button className="btn btn-primary" disabled={!!(doc.pdf && doc.pdf.busy)} onClick={() => doc.make(key, slipPdfName(w, from), <PaySlipDoc s={s} w={w} d={d} mode={mode} from={from} to={to} />, slipLineText(w, d, mode, from, to))}>{doc.pdf && doc.pdf.busy && doc.pdf.key === key ? 'กำลังสร้าง PDF…' : '📄 PDF / ส่ง LINE'}</button>
      </div>
      {doc.pdf && doc.pdf.key === key && doc.pdf.file && <div style={{ marginTop: 10 }}><PdfShareBox pdf={doc.pdf} onClose={doc.close} /></div>}
    </section>
  );
}

}

function WorkerProfileDoc({ s, w }) {
  const T = todayISO();
  const hist = s.rates.filter(r => r.workerId === w.id).sort((a, b) => a.from.localeCompare(b.from));
  const since = addDays(T, -29);
  const d = slipData(s, w.id, since, T);
  return (
    <div className="mdoc">
      <DocHead title="ข้อมูลคนงาน" sub={`ณ วันที่ ${thDate(T)}`} />
      <div className="mdoc-who">

function entryIssues(s, e, batch = []) {
  const out = [];
  if (!validTime(e.tin) || !validTime(e.tout)) { out.push(['bad', 'รูปแบบเวลาต้องเป็น ชม:นาที เช่น 07:30']); return out; }
  if (e.tin === e.tout) out.push(['bad', 'เวลาเข้าและออกเท่ากัน']);
  if (s.laborWeeks.includes(weekOf(e.date))) out.push(['bad', 'งวดของวันนี้ปิดแล้ว']);
  if (e.workerId) {
    if (s.time.some(x => x.id !== e.id && x.workerId === e.workerId && x.date === e.date)) out.push(['bad', 'ช่างคนนี้มีบันทึกของวันนี้แล้ว']);
    if (batch.filter(x => x.workerId === e.workerId).length > 1) out.push(['bad', 'ชื่อซ้ำในใบลงเวลาเดียวกัน']);
    const rate = rateFor(s, e.workerId, e.date);
    if (rate == null) out.push(['bad', 'ช่างคนนี้ยังไม่มีเรท ณ วันที่ทำงาน']);
    else if (rate < s.settings.minWage) out.push(['warn', `เรท ${num(rate)} ต่ำกว่าค่าแรงขั้นต่ำ ${num(s.settings.minWage)}`]);
  }
  const c = calcPay(s, { ...e, workerId: e.workerId || '' });
  if (e.otH != null && (!(+e.otH >= 0) || +e.otH > c.hours)) out.push(['bad', `ชม. OT ต้องอยู่ระหว่าง 0–${num(c.hours, 1)}`]);
  if (c.hours > 12) out.push(['warn', `ทำงาน ${num(c.hours, 1)} ชม. เกิน 12 ชม. ตรวจเวลาอีกครั้ง`]);
  if (c.overnight) out.push(['warn', 'เวลาออกน้อยกว่าเวลาเข้า นับเป็นกะข้ามเที่ยงคืน']);
  return out;
}

function TimeForm({ defDate, edit, workerId, onClose }) {
  const { s, mut } = useApp();
  const active = s.projects.filter(p => p.status === 'active' || (edit && p.id === edit.projectId));
  const [f, setF] = useState(() => edit
    ? { workerId: edit.workerId, projectId: edit.projectId, date: edit.date, tin: edit.tin, tout: edit.tout, holiday: !!edit.holiday, otH: edit.otH != null ? String(edit.otH) : '' }
    : { workerId: workerId || (s.workers[0] ? s.workers[0].id : ''), projectId: active[0] ? active[0].id : '', date: defDate, tin: '07:00', tout: '17:00', holiday: false, otH: '' });
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const e = { ...f, id: edit && edit.id, otH: f.otH === '' ? undefined : +f.otH };
  const issues = entryIssues(s, e);
  const bad = issues.some(i => i[0] === 'bad');
  const c = validTime(f.tin) && validTime(f.tout) ? calcPay(s, e) : null;
  const submit = () => {
    if (bad) return;
    const rec = { workerId: f.workerId, projectId: f.projectId, date: f.date, tin: f.tin, tout: f.tout, holiday: f.holiday };
    if (f.otH !== '') rec.otH = +f.otH;
    const ok = mut(d => {
      if (!edit) { d.time.push({ id: uid(), ...rec }); return; }
      const x = d.time.find(y => y.id === edit.id);
      if (!x) return 'ไม่พบรายการนี้แล้ว';
      if (x.lockedPay != null) return 'รายการนี้ปิดงวดแล้ว';
      delete x.otH;
      Object.assign(x, rec);
    }, edit ? 'แก้ไขเวลาแล้ว' : 'บันทึกเวลาแล้ว');
    if (ok) onClose();
  };
  return (
    <section className="panel formpanel">
      <div className="panel-head"><h2>{edit ? `แก้ไขเวลา · ${workerName(s, edit.workerId)}` : 'บันทึกเวลาทำงาน'}</h2><button className="btn btn-sm btn-ghost" onClick={onClose}>ปิด</button></div>
      <div className="form">
        <label className="field"><span>ช่าง</span><select id="tf-w" value={f.workerId} onChange={e => set('workerId', e.target.value)}>{s.workers.map(w => <option key={w.id} value={w.id}>{w.name}{w.team ? ` (${w.team})` : ''}</option>)}</select></label>
        <label className="field"><span>โครงการ</span><select id="tf-p" value={f.projectId} onChange={e => set('projectId', e.target.value)}>{active.map(p => <option key={p.id} value={p.id}>{p.code} {p.name}</option>)}</select></label>
        <label className="field"><span>วันที่</span><input id="tf-d" type="date" value={f.date} onChange={e => set('date', e.target.value)} /></label>
        <label className="field"><span>เวลาเข้า</span><input id="tf-in" type="time" value={f.tin} onChange={e => set('tin', e.target.value)} /></label>
        <label className="field"><span>เวลาออก</span><input id="tf-out" type="time" value={f.tout} onChange={e => set('tout', e.target.value)} /></label>
        <label className="field"><span>ชม. OT (ว่าง = คิดอัตโนมัติ)</span><input id="tf-ot" type="number" inputMode="decimal" step="0.5" min="0" placeholder="อัตโนมัติ" value={f.otH} onChange={e => set('otH', e.target.value)} /></label>
        <label className="check" style={{ alignSelf: 'end', paddingBottom: 8 }}><input id="tf-h" type="checkbox" checked={f.holiday} onChange={e => set('holiday', e.target.checked)} />ทำงานวันหยุด</label>
      </div>
      <div className="formfoot">
        <div>{issues.map((i, k) => <span key={k} className={'issue ' + i[0]}>{i[1]}</span>)}</div>
        {c && <span className="num">ปกติ {num(c.reg, 1)} ชม. · OT {num(c.ot, 1)} ชม. · <b>{c.rate != null ? baht(c.pay) : 'ไม่มีเรท'}</b></span>}
      </div>
      <div className="actions" style={{ justifyContent: 'flex-end', marginTop: 12 }}>
        <button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button>
        <button className="btn btn-primary" disabled={bad} onClick={submit}>{edit ? 'บันทึกการแก้ไข' : 'บันทึก'}</button>
      </div>
    </section>
  );
}

/* ---------- แนบบัตรตอก: AI อ่านเวลาเข้า-ออกทั้งงวดของคนงาน 1 คน ---------- */
const normTime = x => {
  const m = String(x == null ? '' : x).match(/(\d{1,2})\s*[:.]\s*(\d{2})/);
  if (!m) return '';
  const h = +m[1], mi = +m[2];
  return h < 24 && mi < 60 ? `${pad(h)}:${pad(mi)}` : '';
};
const CARD_PROMPT = `รูปที่แนบคือบัตรตอกเวลา (time card) ของคนงานก่อสร้าง 1 คน ในประเทศไทย
อ่านทุกแถววันที่ที่มีการตอกเวลา แล้วตอบเป็น JSON อย่างเดียว ตามรูปแบบนี้:
{"name":"ชื่อบนบัตร หรือ null","month":"YYYY-MM หรือ null","days":[{"day":1,"tin":"HH:MM","tout":"HH:MM","unclear":false,"note":""}]}
กติกา:
- day คือวันที่ของเดือน (1-31) ตามแถวบนบัตร
- tin = เวลาตอกเข้าครั้งแรกของวัน, tout = เวลาตอกออกครั้งสุดท้ายของวัน (รวมช่วงล่วงเวลาแล้ว) ในรูปแบบ 24 ชม.
- month เป็นปี ค.ศ. ถ้าบัตรเป็นปี พ.ศ. ให้ลบ 543
- ตัวเลขที่เลือน ซ้อนทับ หรือไม่แน่ใจ ให้ใส่ค่าที่น่าจะเป็นที่สุด ตั้ง unclear=true และเขียน note สั้น ๆ ว่าไม่แน่ใจตรงไหน
- ช่องที่อ่านไม่ได้เลยให้เป็น null, วันที่ไม่มีการตอกบัตรไม่ต้องใส่`;

function PunchCardImport({ workerId: presetId, defDate, onClose }) {
  const { s, mut, notify, showPhoto } = useApp();
  const T = todayISO();
  const active = s.projects.filter(p => p.status === 'active');
  const [meta, setMeta] = useState({ workerId: presetId || '', projectId: active[0] ? active[0].id : '', month: defDate.slice(0, 7), photos: [] });
  const [rows, setRows] = useState([]);
  const [cardName, setCardName] = useState('');
  const [quick, setQuick] = useState(null);
  const [checked, setChecked] = useState(false);
  const [ai, setAi] = useReceiptAI();
  const [aiState, setAiState] = useState({ busy: false, msg: '', tone: '' });
  const setM = (k, v) => { setChecked(false); setMeta(p => ({ ...p, [k]: v })); };
  // ผู้ดูแลแก้ช่องไหนถือว่าตรวจแถวนั้นแล้ว เลิกเตือน "AI ไม่แน่ใจ"
  const setRow = (id, k, v) => { setChecked(false); setRows(rs => rs.map(r => r.id === id ? { ...r, [k]: v, ...(k === 'on' ? {} : { unclear: false }) } : r)); };
  const newRow = date => ({ id: uid(), on: true, date, tin: '07:00', tout: '17:00', otH: '', holiday: false, unclear: false, note: '' });
  const addRow = () => { setChecked(false); setRows(rs => [...rs, newRow(rs.length ? addDays(rs[rs.length - 1].date, 1) : defDate)]); };

  const onPhoto = async e => {
    const files = [...(e.target.files || [])];
    e.target.value = '';
    if (!files.length) return;
    try {
      const add = [];
      for (const file of files) {
        const big = await readPhoto(file, 1600); // ส่งให้ AI อ่านตัวเลขเล็ก ๆ
        const keep = await readPhoto(file, 900); // เก็บเป็นหลักฐาน ประหยัดพื้นที่
        add.push({ id: uid(), blob: big.blob, url: keep.url });
      }
      setMeta(p => ({ ...p, photos: [...p.photos, ...add] }));
      setAiState({ busy: false, msg: '', tone: '' });
    } catch (err) { notify('อ่านรูปไม่สำเร็จ', 'bad'); }
  };

  const readCard = async () => {
    if (!ai || !meta.photos.length || aiState.busy) return;
    setAiState({ busy: true, msg: `AI กำลังอ่านบัตรตอก ${meta.photos.length} รูป…`, tone: '' });
    try {
      const byDay = {};
      let name = '', month = '';
      for (const p of meta.photos) {
        const r = await ai.json(CARD_PROMPT, { images: p.blob });
        if (!r) continue;
        if (r.name && !name) name = String(r.name).trim().slice(0, 60);
        if (/^\d{4}-\d{2}$/.test(r.month || '') && !month) month = r.month;
        (Array.isArray(r.days) ? r.days : []).forEach(x => {
          const day = parseInt(x && x.day, 10);
          if (!(day >= 1 && day <= 31)) return;
          const tin = normTime(x.tin), tout = normTime(x.tout), prev = byDay[day] || {};
          if (!tin && !tout) return;
          byDay[day] = { day, tin: tin || prev.tin || '', tout: tout || prev.tout || '', unclear: !!x.unclear || !tin || !tout, note: String(x.note || prev.note || '').slice(0, 80) };
        });
      }
      const mon = month && month <= T.slice(0, 7) ? month : meta.month;
      const out = Object.values(byDay).sort((a, b) => a.day - b.day)
        .map(x => ({ ...newRow(`${mon}-${pad(x.day)}`), tin: x.tin, tout: x.tout, unclear: x.unclear, note: x.note }))
        .filter(r => iso(parseD(r.date)) === r.date);
      if (!out.length) { setAiState({ busy: false, tone: 'bad', msg: 'ไม่พบเวลาในรูป ถ่ายให้ตรง เห็นตัวเลขชัด หรือกด "+ เพิ่มวัน" แล้วกรอกเอง' }); return; }
      let wid = meta.workerId;
      if (!wid && name) {
        const best = s.workers.map(w => ({ w, d: lev(name, w.name) })).sort((a, b) => a.d - b.d)[0];
        if (best && best.d <= Math.max(2, best.w.name.length * 0.35)) wid = best.w.id;
      }
      setCardName(name);
      setMeta(p => ({ ...p, month: mon, workerId: wid }));
      setRows(out); setChecked(false);
      const unclear = out.filter(r => r.unclear).length;
      setAiState({ busy: false, tone: 'ok', msg: `✓ อ่านได้ ${out.length} วัน${unclear ? ` · ⚠️ ไม่ชัด ${unclear} วัน (แถวสีเหลือง) ตรวจกับรูปแล้วแก้ได้เลย` : ''} ตรวจทุกช่องก่อนบันทึก` });
    } catch (e) {
      const code = e && e.code;
      if (AI_OFF.includes(code)) setAi(null);
      setAiState({ busy: false, tone: 'bad', msg: aiErrorText(e, 'บัตรตอก') });
    }
  };

  const addQuickWorker = () => {
    const id = uid();
    const ok = mut(d => {
      const name = quick.name.trim();
      if (!name) return 'กรอกชื่อคนงาน';
      if (d.workers.some(w => w.name === name)) return 'มีชื่อนี้ในทะเบียนแล้ว';
      if (!(+quick.daily > 0)) return 'กรอกค่าแรงต่อวัน';
      d.workers.push({ id, name, team: quick.team.trim() });
      d.rates.push({ workerId: id, from: '2000-01-01', daily: +quick.daily });
    }, 'เพิ่มคนงานแล้ว');
    if (ok) { setQuick(null); setM('workerId', id); }
  };

  const checks = rows.map(r => {
    const e = { workerId: meta.workerId, projectId: meta.projectId, date: r.date, tin: r.tin, tout: r.tout, holiday: r.holiday, otH: r.otH === '' ? undefined : +r.otH };
    let iss = [];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(r.date || '')) iss.push(['bad', 'ใส่วันที่']);
    else {
      iss = entryIssues(s, e);
      if (rows.filter(x => x.on && x.date === r.date).length > 1) iss.push(['bad', 'วันที่ซ้ำในบัตรนี้']);
      if (r.date > T) iss.push(['warn', 'เป็นวันในอนาคต']);
    }
    if (r.unclear) iss.unshift(['warn', `AI ไม่แน่ใจ${r.note ? ': ' + r.note : ''} — ตรวจกับรูป`]);
    const c = iss.some(i => i[1].startsWith('รูปแบบเวลา') || i[1] === 'ใส่วันที่') ? null : calcPay(s, e);
    return { r, iss, c, bad: iss.some(i => i[0] === 'bad'), warn: iss.some(i => i[0] === 'warn') };
  });
  const on = checks.filter(x => x.r.on);
  const badCount = on.filter(x => x.bad).length;
  const totalPay = r2(sum(on, x => x.c ? x.c.pay : 0));
  const canSave = meta.workerId && meta.projectId && checked && on.length > 0 && badCount === 0;
  const w = s.workers.find(x => x.id === meta.workerId);

  const save = () => {
    const ok = mut(d => {
      const sheetId = uid();
      d.sheets.push({ id: sheetId, kind: 'card', workerId: meta.workerId, projectId: meta.projectId, date: on[0].r.date, photo: meta.photos[0] ? meta.photos[0].url : null, raw: cardName, verifiedBy: d.role, verifiedAt: new Date().toISOString(), count: on.length });
      on.forEach(({ r }) => {
        const x = { id: uid(), workerId: meta.workerId, projectId: meta.projectId, date: r.date, tin: r.tin, tout: r.tout, holiday: r.holiday, sheetId };
        if (r.otH !== '') x.otH = +r.otH;
        d.time.push(x);
      });
    }, `บันทึกบัตรตอกของ ${w ? w.name : ''} ${on.length} วันแล้ว`);
    if (ok) onClose();
  };

  return (
    <section className="panel formpanel">
      <div className="panel-head"><h2>แนบบัตรตอก · AI บันทึกเวลารายคน</h2><button className="btn btn-sm btn-ghost" onClick={onClose}>ปิด</button></div>
      <div className="form">
        <label className="field"><span>คนงาน</span><select id="pc-w" value={meta.workerId} onChange={e => setM('workerId', e.target.value)}><option value="">— ให้ AI อ่านชื่อจากบัตร —</option>{s.workers.map(x => <option key={x.id} value={x.id}>{x.name}{x.nick ? ` (${x.nick})` : ''}</option>)}</select></label>
        <label className="field"><span>โครงการ</span><select id="pc-p" value={meta.projectId} onChange={e => setM('projectId', e.target.value)}>{active.map(p => <option key={p.id} value={p.id}>{p.code} {p.name}</option>)}</select></label>
        <label className="field"><span>เดือนบนบัตร</span><input id="pc-m" type="month" value={meta.month} onChange={e => { const m = e.target.value; if (!m) return; setM('month', m); setRows(rs => rs.map(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date) ? { ...r, date: m + r.date.slice(7) } : r)); }} /></label>
        <label className="field"><span>📷 รูปบัตรตอก (หน้า-หลังได้)</span><input id="pc-photo" type="file" accept="image/*" multiple onChange={onPhoto} /></label>
      </div>
      {meta.photos.length > 0 && <div className="photogrid">{meta.photos.map((p, i) => (
        <div key={p.id}><img src={p.url} alt={`บัตรตอกรูปที่ ${i + 1}`} onClick={() => showPhoto(p.url)} />
          <button className="btn btn-sm iconbtn" aria-label="ลบรูป" onClick={() => setMeta(x => ({ ...x, photos: x.photos.filter(y => y.id !== p.id) }))}>✕</button></div>
      ))}</div>}
      {meta.photos.length > 0 && ai && <div className="aibox" style={{ marginBottom: 10 }}>
        <button className="btn btn-primary" disabled={aiState.busy} onClick={readCard}>{aiState.busy ? 'กำลังอ่าน…' : `🤖 ให้ AI อ่านบัตรตอก ${meta.photos.length} รูป`}</button>
        <span className="hint">ถอดวันที่ เวลาเข้า-ออก ทุกวันบนบัตร วางบัตรบนพื้นเรียบ ถ่ายตรง ๆ ให้เห็นตัวเลขชัด</span>
      </div>}
      {meta.photos.length > 0 && !ai && <p className="hint" style={{ marginBottom: 10 }}>💡 AI อ่านบัตรยังไม่พร้อม (ต้องเชื่อม Google Sheets และตั้งค่า AI ในชีต) ตอนนี้กด "+ เพิ่มวัน" แล้วกรอกเองได้ (รูปจะเก็บเป็นหลักฐาน)</p>}
      {aiState.msg && <p className={'hint ' + (aiState.tone === 'bad' ? 'bad' : '')} style={{ margin: '4px 0 10px', color: aiState.tone === 'ok' ? 'var(--ok)' : undefined }} role="status">{aiState.msg}</p>}
      {cardName && <div className="subbox" style={{ marginBottom: 10 }}>
        <span className="small">ชื่อบนบัตร: <b>{cardName}</b> {w ? <>→ จับคู่กับ <b>{w.name}</b> (เปลี่ยนได้ที่ช่องคนงาน)</> : <span style={{ color: 'var(--bad)' }}>ไม่พบในทะเบียน</span>}</span>
        {!w && !quick && isLead(s) && <button className="btn btn-sm" style={{ marginLeft: 8 }} onClick={() => setQuick({ name: cardName, team: '', daily: '' })}>+ เพิ่มเป็นคนงานใหม่</button>}
      </div>}
      {quick && <div className="subbox" style={{ marginBottom: 10 }}>
        <div className="form">
          <label className="field"><span>ชื่อ-สกุล</span><input id="pc-qn" value={quick.name} onChange={e => setQuick({ ...quick, name: e.target.value })} /></label>
          <label className="field"><span>ประเภทช่าง</span><input id="pc-qt" value={quick.team} onChange={e => setQuick({ ...quick, team: e.target.value })} /></label>
          <label className="field"><span>ค่าแรง (บาท / วัน)</span><input id="pc-qd" type="number" inputMode="decimal" value={quick.daily} onChange={e => setQuick({ ...quick, daily: e.target.value })} /></label>
          <div className="field" style={{ justifyContent: 'flex-end' }}><div className="row"><button className="btn btn-primary" onClick={addQuickWorker}>เพิ่ม</button><button className="btn btn-ghost" onClick={() => setQuick(null)}>ยกเลิก</button></div></div>
        </div>
        <p className="hint" style={{ marginTop: 6 }}>รูปและข้อมูลส่วนตัวเพิ่มทีหลังได้ที่ปุ่ม "แก้ไข" บนการ์ดคนงาน</p>
      </div>}

      <div className="row between" style={{ margin: '14px 0 6px' }}>
        <h3>ตรวจก่อนบันทึก {rows.length > 0 && <span className="muted small">({on.length} วัน)</span>}</h3>
        <button className="btn btn-sm" onClick={addRow}>+ เพิ่มวัน</button>
      </div>
      {rows.length === 0 ? <p className="hint">แนบรูปบัตรตอกแล้วให้ AI อ่าน หรือกด "+ เพิ่มวัน" เพื่อกรอกเอง</p> : (<>
        <p className="hint" style={{ marginBottom: 8 }}>แก้ได้ทุกช่อง · แถวสีเหลือง = AI ไม่แน่ใจ · แถวสีแดงต้องแก้หรือเอาเครื่องหมายถูกออกก่อนบันทึก</p>
        <div className="tbl-wrap"><table className="tbl">
          <thead><tr><th>ใช้</th><th>วันที่</th><th>เข้า</th><th>ออก</th><th>OT ชม.</th><th>หยุด</th><th className="r">ชม.</th><th className="r">ค่าแรง</th><th>ผลตรวจ</th><th /></tr></thead>
          <tbody>{checks.map(({ r, iss, c, bad, warn }) => (
            <tr key={r.id} className={!r.on ? 'off' : bad ? 'badrow' : warn ? 'warnrow' : ''}>
              <td><input type="checkbox" aria-label="ใช้แถวนี้" checked={r.on} onChange={e => setRow(r.id, 'on', e.target.checked)} /></td>
              <td style={{ minWidth: 150 }}><input type="date" aria-label="วันที่" value={r.date} onChange={e => setRow(r.id, 'date', e.target.value)} /></td>
              <td style={{ minWidth: 104 }}><input type="time" aria-label="เวลาเข้า" value={r.tin} onChange={e => setRow(r.id, 'tin', e.target.value)} /></td>
              <td style={{ minWidth: 104 }}><input type="time" aria-label="เวลาออก" value={r.tout} onChange={e => setRow(r.id, 'tout', e.target.value)} /></td>
              <td style={{ minWidth: 80 }}><input type="number" aria-label="ชั่วโมง OT" inputMode="decimal" step="0.5" min="0" placeholder="อัตโนมัติ" value={r.otH} onChange={e => setRow(r.id, 'otH', e.target.value)} /></td>
              <td><input type="checkbox" aria-label="วันหยุด" checked={r.holiday} onChange={e => setRow(r.id, 'holiday', e.target.checked)} /></td>
              <td className="r num">{c ? num(c.hours, 1) : '—'}{c && c.ot > 0 && <span className="sub">OT {num(c.ot, 1)}</span>}</td>
              <td className="r num">{c && c.rate != null ? baht(c.pay) : '—'}</td>
              <td style={{ minWidth: 190 }}>
                {iss.length === 0 && <span className="issue" style={{ color: 'var(--ok)' }}>ผ่าน</span>}
                {iss.map((i, k) => <span key={k} className={'issue ' + i[0]}>{i[1]}</span>)}
              </td>
              <td><button className="btn btn-ghost iconbtn" aria-label="ลบแถว" onClick={() => setRows(rs => rs.filter(x => x.id !== r.id))}>✕</button></td>
            </tr>
          ))}</tbody>
          <tfoot><tr><td colSpan="7">รวม {on.length} วัน</td><td className="r num">{baht(totalPay)}</td><td colSpan="2" /></tr></tfoot>
        </table></div>
        <div className="formfoot">
          <label className="check"><input id="pc-ok" type="checkbox" checked={checked} onChange={e => setChecked(e.target.checked)} />ฉันตรวจวันที่และเวลาเทียบกับบัตรตอกจริงแล้ว ({ROLES[s.role]})</label>
          <div className="actions">
            {!meta.workerId && <span className="hint bad">เลือกคนงาน</span>}
            {badCount > 0 && <span className="hint bad">ต้องแก้อีก {badCount} แถว</span>}
            <button className="btn btn-primary" disabled={!canSave} onClick={save}>บันทึก {on.length} วัน</button>
          </div>
        </div>
      </>)}
    </section>
  );
}

const SAMPLE_SHEET = 'วิทยา มั่นคง 07:00 17:00\nบัญชา ช่างกล 07.30 18.00\nสมศรี แกวใส 08:00 17:00\nธนพล ศรีสุข 08:00 21:30';

function TimesheetImport({ defDate, onClose }) {
  const { s, mut, notify, showPhoto } = useApp();
  const active = s.projects.filter(p => p.status === 'active');
  const T = todayISO();
  const [meta, setMeta] = useState({ projectId: active[0] ? active[0].id : '', date: defDate, holiday: false, photo: null, photos: [] });
  const [text, setText] = useState('');
  const [rows, setRows] = useState([]);
  const [checked, setChecked] = useState(false);
  const [ai, setAi] = useReceiptAI();
  const [aiState, setAiState] = useState({ busy: false, msg: '', tone: '' });
  const setM = (k, v) => setMeta(p => ({ ...p, [k]: v }));
  const setRow = (id, k, v) => { setChecked(false); setRows(rs => rs.map(r => r.id === id ? { ...r, [k]: v } : r)); };

  const parse = src => {
    const out = [];
    src.split(/\n+/).forEach(line => {
      const times = [...line.matchAll(/(\d{1,2})[:.](\d{2})/g)];
      if (times.length < 2) return;
      const name = line.slice(0, times[0].index).replace(/^[\s\d.)\-]+/, '').trim();
      const t = m => `${pad(+m[1])}:${m[2]}`;
      out.push({ id: uid(), name, tin: t(times[0]), tout: t(times[1]) });
    });
    if (!out.length) { notify('ไม่พบบรรทัดที่มีชื่อและเวลา 2 ช่วง เช่น "วิทยา 07:00 17:00"', 'bad'); return; }
    setRows(out); setChecked(false);
  };
  const onPhoto = async e => {
    const files = e.target.files;
    if (!files || files.length === 0) return;
    try {
      const newPhotos = [];
      for (let file of files) {
        const p = await readPhoto(file, 1000);
        newPhotos.push(p.url);
      }
      setM('photos', [...meta.photos, ...newPhotos]);
      if (!meta.photo && newPhotos.length > 0) setM('photo', newPhotos[0]);
      setAiState({ busy: false, msg: '', tone: '' });
    } catch (err) { notify('อ่านรูปไม่สำเร็จ', 'bad'); }
  };
  const removePhoto = (idx) => {
    const newPhotos = meta.photos.filter((_, i) => i !== idx);
    setM('photos', newPhotos);
    if (meta.photo === meta.photos[idx] && newPhotos.length > 0) setM('photo', newPhotos[0]);
  };

  const readTimecard = async () => {
    if (!ai || meta.photos.length === 0) return;
    setAiState({ busy: true, msg: `AI กำลังอ่านบิลบัตรตอก ${meta.photos.length} ใบ…`, tone: '' });
    const prompt = `รูปที่แนบคือบิลบัตรตอก (timecard) หรือใบลงเวลา ของคนงาน
อ่านแล้วตอบเป็น JSON อย่างเดียว ตามรูปแบบนี้:
{"workers":[{"name":"ชื่อคนงาน","tin":"HH:MM","tout":"HH:MM"}]}
กติกา:
- ต่อบรรทัดต่อหนึ่งคนงาน ชื่อ ตามด้วยเวลาเข้า เวลาออก
- เวลาอยู่ในรูป HH:MM (24 ชม.)
- หากมี column หรือ field สำหรับวันที่ หรือ OT ให้เพิ่มในผลลัพธ์
- ช่องที่อ่านไม่ได้ให้เป็น null`;
    try {
      let allText = '';
      for (const photoUrl of meta.photos) {
        const blob = await fetch(photoUrl).then(r => r.blob());
        const r = await ai.json(prompt, { images: blob });
        if (r && Array.isArray(r.workers)) {
          r.workers.forEach(w => {
            if (w.name && w.tin && w.tout) allText += `${w.name} ${w.tin} ${w.tout}\n`;
          });
        }
      }
      if (allText.trim()) {
        setText(allText);
        parse(allText);
        setAiState({ busy: false, tone: 'ok', msg: `✓ อ่านรูป ${meta.photos.length} ใบแล้ว พบ ${rows.length} รายการ` });
      } else {
        setAiState({ busy: false, tone: 'bad', msg: 'ไม่พบข้อมูลเวลา โปรดตรวจสอบรูปหรือพิมพ์เอง' });
      }
    } catch (e) {
      const code = e && e.code;
      if (AI_OFF.includes(code)) setAi(null);
      setAiState({ busy: false, tone: 'bad', msg: aiErrorText(e, 'บัตรตอก') });
    }
  };

  const resolved = rows.map(r => {
    const w = s.workers.find(x => x.name === r.name.trim());
    return { ...r, workerId: w ? w.id : '' };
  });
  const withIssues = resolved.map(r => {
    const e = { workerId: r.workerId, projectId: meta.projectId, date: meta.date, tin: r.tin, tout: r.tout, holiday: meta.holiday };
    const iss = entryIssues(s, e, resolved);
    let suggest = null;
    if (!r.workerId) {
      const best = s.workers.map(w => ({ w, d: lev(r.name.trim(), w.name) })).sort((a, b) => a.d - b.d)[0];
      if (best && best.d <= Math.max(3, best.w.name.length * 0.4)) suggest = best.w.name;
      iss.unshift(['bad', 'ไม่พบชื่อนี้ในทะเบียนช่าง']);
    }
    const c = validTime(r.tin) && validTime(r.tout) ? calcPay(s, e) : null;
    return { r, e, iss, suggest, c };
  });
  const badCount = withIssues.filter(x => x.iss.some(i => i[0] === 'bad')).length;
  const canSave = rows.length > 0 && checked && badCount === 0 && meta.projectId;

  const save = () => {
    const ok = mut(d => {
      const sheetId = uid();
      d.sheets.push({ id: sheetId, projectId: meta.projectId, date: meta.date, photo: meta.photo, raw: text, verifiedBy: d.role, verifiedAt: new Date().toISOString(), count: rows.length });
      withIssues.forEach(({ e }) => d.time.push({ id: uid(), ...e, sheetId }));
    }, `นำเข้าใบลงเวลา ${rows.length} รายการแล้ว`);
    if (ok) onClose();
  };

  return (
    <section className="panel formpanel">
      <div className="panel-head"><h2>นำเข้าใบลงเวลา / บัตรตอก</h2><button className="btn btn-sm btn-ghost" onClick={onClose}>ปิด</button></div>
      <div className="form">
        <label className="field"><span>โครงการ</span><select id="ts-p" value={meta.projectId} onChange={e => setM('projectId', e.target.value)}>{active.map(p => <option key={p.id} value={p.id}>{p.code} {p.name}</option>)}</select></label>
        <label className="field"><span>วันที่ทำงาน</span><input id="ts-d" type="date" value={meta.date} onChange={e => { setM('date', e.target.value); setChecked(false); }} /></label>
        <label className="field"><span>📷 รูปใบลงเวลา / บัตรตอก (หลายใบได้ เก็บเป็นหลักฐาน)</span><input id="ts-photo" type="file" accept="image/*" capture="environment" multiple onChange={onPhoto} /></label>
        <label className="check" style={{ alignSelf: 'end', paddingBottom: 8 }}><input id="ts-h" type="checkbox" checked={meta.holiday} onChange={e => setM('holiday', e.target.checked)} />วันหยุด</label>
      </div>
      {meta.photos.length > 0 && <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(100px, 1fr))', gap: 8, marginTop: 12, marginBottom: 12 }}>
        {meta.photos.map((p, i) => <div key={i} style={{ position: 'relative', width: '100%', paddingBottom: '100%', backgroundColor: '#f0f0f0', borderRadius: 4, overflow: 'hidden' }}>
          <img src={p} alt={`รูปที่ ${i + 1}`} style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', objectFit: 'cover' }} />
          <button className="btn btn-sm iconbtn" style={{ position: 'absolute', top: 4, right: 4, padding: 4, borderRadius: '50%' }} onClick={() => removePhoto(i)}>✕</button>
        </div>)}
      </div>}
      {meta.photos.length > 0 && ai && <div className="aibox" style={{ marginBottom: 12 }}>
        <button className="btn btn-primary" disabled={aiState.busy} onClick={readTimecard}>{aiState.busy ? 'กำลังอ่าน…' : `ให้ AI อ่านรูป ${meta.photos.length} ใบ`}</button>
        <span className="hint">ถอดชื่อ เวลาเข้า-ออก อัตโนมัติ จากบัตรตอก ถ่ายให้ตรงและชัดขึ้น</span>
      </div>}
      {meta.photos.length > 0 && !ai && <p className="hint" style={{ marginBottom: 12 }}>💡 AI อ่านบัตรยังไม่พร้อม (ต้องเชื่อม Google Sheets และตั้งค่า AI ในชีต) ตอนนี้พิมพ์เองได้</p>}
      {aiState.msg && <p className={'hint ' + (aiState.tone === 'bad' ? 'bad' : '')} style={{ margin: '8px 0 12px', color: aiState.tone === 'ok' ? 'var(--ok)' : undefined }} role="status">{aiState.msg}</p>}

      <div className="cols" style={{ marginTop: 14, gridTemplateColumns: '1fr' }}>
        <label className="field">
          <span>ข้อความจากใบลงเวลา: หนึ่งบรรทัดต่อหนึ่งคน ชื่อ ตามด้วยเวลาเข้าและเวลาออก (พิมพ์เอง วางจาก LINE หรือผล OCR)</span>
          <textarea id="ts-text" value={text} onChange={e => setText(e.target.value)} placeholder={SAMPLE_SHEET} />
        </label>
      </div>
      <div className="actions" style={{ marginTop: 10 }}>
        <button className="btn" onClick={() => parse(text)} disabled={!text.trim()}>แยกชื่อและเวลา</button>
        <button className="btn btn-ghost btn-sm" onClick={() => { setText(SAMPLE_SHEET); parse(SAMPLE_SHEET); }}>ลองด้วยข้อความตัวอย่าง</button>
      </div>

      {rows.length > 0 && (<>
        <h3 style={{ margin: '18px 0 6px' }}>ตรวจก่อนบันทึก</h3>
        <p className="hint" style={{ marginBottom: 8 }}>แก้ชื่อหรือเวลาในตารางได้เลย แถวสีแดงต้องแก้ก่อนบันทึก</p>
        <datalist id="worker-names">{s.workers.map(w => <option key={w.id} value={w.name} />)}</datalist>
        <div className="tbl-wrap"><table className="tbl">
          <thead><tr><th>ชื่อช่าง</th><th>เข้า</th><th>ออก</th><th className="r">ชม.</th><th className="r">ค่าแรง</th><th>ผลตรวจ</th><th /></tr></thead>
          <tbody>{withIssues.map(({ r, iss, suggest, c }) => (
            <tr key={r.id}>
              <td style={{ minWidth: 170 }}><input id={'tn-' + r.id} list="worker-names" value={r.name} onChange={e => setRow(r.id, 'name', e.target.value)} /></td>
              <td style={{ minWidth: 90 }}><input id={'ti-' + r.id} value={r.tin} onChange={e => setRow(r.id, 'tin', e.target.value)} /></td>
              <td style={{ minWidth: 90 }}><input id={'to-' + r.id} value={r.tout} onChange={e => setRow(r.id, 'tout', e.target.value)} /></td>
              <td className="r num">{c ? num(c.hours, 1) : '—'}</td>
              <td className="r num">{c && c.rate != null ? baht(c.pay) : '—'}</td>
              <td style={{ minWidth: 200 }}>
                {iss.length === 0 && <span className="issue" style={{ color: 'var(--ok)' }}>ผ่าน</span>}
                {iss.map((i, k) => <span key={k} className={'issue ' + i[0]}>{i[1]}</span>)}
                {suggest && <span className="issue">หมายถึง <button className="linkbtn" onClick={() => setRow(r.id, 'name', suggest)}>{suggest}</button> ใช่ไหม</span>}
              </td>
              <td><button className="btn btn-ghost iconbtn" aria-label="ลบแถว" onClick={() => setRows(rs => rs.filter(x => x.id !== r.id))}>✕</button></td>
            </tr>
          ))}</tbody>
        </table></div>
        <div className="formfoot">
          <label className="check"><input id="ts-ok" type="checkbox" checked={checked} onChange={e => setChecked(e.target.checked)} />ฉันตรวจชื่อและเวลาเทียบกับใบลงเวลาจริงแล้ว ({ROLES[s.role]})</label>
          <div className="actions">
            {badCount > 0 && <span className="hint bad">ต้องแก้อีก {badCount} แถว</span>}
            <button className="btn btn-primary" disabled={!canSave} onClick={save}>บันทึก {rows.length} รายการ</button>
          </div>
        </div>
      </>)}
    </section>
  );
}

const MOVE_KIND = { in: 'รับเข้า', out: 'เบิกออก', adjust: 'ปรับยอด' };

function StockView() {
  const { s, mut, notify, showPhoto } = useApp();
  const [mode, setMode] = useState(null);
  const [filter, setFilter] = useState('');
  const [catFilter, setCatFilter] = useState('');
  const [q, setQ] = useState('');
  const shown = s.items.filter(i => (!catFilter || i.category === catFilter) && (!q.trim() || (i.name + ' ' + (i.category || '')).toLowerCase().includes(q.trim().toLowerCase())));
  const attachPhoto = async (id, e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try { const p = await readPhoto(file, 800); mut(d => { const x = d.items.find(i => i.id === id); if (x) x.photo = p.url; }, 'แนบรูปวัสดุแล้ว'); } catch (err) { notify('อ่านรูปไม่สำเร็จ ลองเลือกไฟล์ภาพ JPG หรือ PNG', 'bad'); }
  };
  const stripe = { ok: 'var(--ok)', warn: 'var(--warn)', bad: 'var(--bad)' };
  const moves = s.moves.filter(m => (!filter || m.itemId === filter) && (!catFilter || s.items.find(i => i.id === m.itemId)?.category === catFilter)).slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 40);
  const value = sum(s.items, i => i.qty * i.avg);
  const categories = [...new Set(s.items.map(i => i.category || 'อื่น ๆ'))].sort();
  const catIcons = {
    'โครงสร้าง': '🏗️', 'สถาปัตยกรรม/ตกแต่ง': '🎨', 'ไฟฟ้า': '⚡', 'ประปา/ท่อ': '💧',
    'ฮาร์ดแวร์': '🔨', 'เครื่องมือ': '🔧', 'วัสดุก่อสร้าง': '🧱', 'อื่น ๆ': '📦'
  };
  const itemsByCategory = categories.reduce((acc, cat) => {
    acc[cat] = s.items.filter(i => i.category === cat);

      {isLead(s) && <div className="actions">
        {isManager(s) && <button className="btn" onClick={() => setMode(mode === 'new' ? null : 'new')}>＋ วัสดุใหม่</button>}
        <button className="btn" onClick={() => setMode(mode === 'count' ? null : 'count')}>ตรวจนับ</button>
        <button className="btn" onClick={() => setMode(mode === 'in' ? null : 'in')}>+ รับเข้า</button>
        <button className="btn btn-primary" onClick={() => setMode(mode === 'out' ? null : 'out')}>− เบิกออก</button>
        {isAllowed(s, 'export-data') && <button className="btn btn-sm" onClick={() => exportToExcel(prepareStockExportData(s, s.items), 'Stock')}>📥 Excel</button>}
        {isAllowed(s, 'export-data') && <button className="btn btn-sm" onClick={() => { const el = document.querySelector('.cards'); el && exportToPDF(el, 'Stock'); }}>📄 PDF</button>}
      </div>}
    </div>
    {mode === 'new' && <NewItemForm onClose={() => setMode(null)} />}
    {mode && mode !== 'new' && <StockForm key={mode} mode={mode} onClose={() => setMode(null)} />}

    <section className="panel" style={{ paddingBottom: 12 }}>
      <label className="field" style={{ marginBottom: 12 }}><span>🔍 ค้นหาวัสดุ</span><input id="st-q" type="search" placeholder="พิมพ์ชื่อวัสดุ เช่น ปูน, ท่อ PVC" value={q} onChange={e => setQ(e.target.value)} /></label>
      <div className="section-title"><h3>กรองตามประเภท</h3></div>
      <div className="chips">

              : isManager(s) && <label className="thumb empty attach" style={{ width: '100%', height: 80, borderRadius: 0, border: 0, borderBottom: '1px dashed var(--line-2)' }}>📷 แนบรูปวัสดุ<input type="file" accept="image/*" capture="environment" hidden onChange={e => attachPhoto(i.id, e)} /></label>}
            <div className="in">
              <div className="row between" style={{ alignItems: 'flex-start', flexWrap: 'nowrap' }}><h3>{i.name}</h3><span className={'pill ' + st}>{STOCK_LABEL[st]}</span></div>
              {i.category && <p className="muted small">{i.category}</p>}
              <div className="qty">{num(i.qty)}<small>{i.unit}</small></div>
              <dl>
                <dt>จุดสั่งซื้อ</dt><dd>{num(i.min)} {i.unit}</dd>

                <dt>มูลค่าคงคลัง</dt><dd>{baht(i.qty * i.avg)}</dd>
              </dl>
              {!i.photo && latestPhoto && <p className="hint small" style={{ marginTop: 8 }}>📷 อัปเดต {thDate(latestPhoto.date)}</p>}
              {i.photo && isManager(s) && <label className="btn btn-sm btn-ghost" style={{ marginTop: 8 }}>เปลี่ยนรูป<input type="file" accept="image/*" capture="environment" hidden onChange={e => attachPhoto(i.id, e)} /></label>}
            </div>

        );
      })}

    <section className="panel">
      <div className="panel-head">
        <h2>ความเคลื่อนไหวล่าสุด</h2>

            <option value="">ทุกสินค้า</option>{s.items.map(i => <option key={i.id} value={i.id}>{i.name}</option>)}
          </select>
          <select id="mv-cat" aria-label="กรองตามหมวดหมู่" value={catFilter} onChange={e => setCatFilter(e.target.value)} style={{ width: 'auto' }}>
            <option value="">ทุกหมวดหมู่</option>{categories.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      </div>
      <div className="tbl-wrap"><table className="tbl">
        <thead><tr><th>วันที่</th><th>ประเภท</th><th>สินค้า</th><th>รายการ</th><th className="r">จำนวน</th><th className="r">ต้นทุน</th><th>โครงการ</th><th style={{ width: 60 }}>รูป</th></tr></thead>
        <tbody>{moves.map(m => {
          const it = s.items.find(i => i.id === m.itemId) || {};
          const q = m.kind === 'out' ? -m.qty : m.qty;
          return (
            <tr key={m.id}>
              <td className="nowrap">{thDate(m.date)}</td>
              <td><span className="small"><b>{it.category}</b></span></td>
              <td><span><b>{it.name}</b></span></td>
              <td><span className={'pill plain ' + (m.kind === 'out' ? 'gold' : m.kind === 'in' ? 'ok' : '')}>{MOVE_KIND[m.kind]}</span></td>
              <td className="r num nowrap">{q > 0 ? '+' : ''}{num(q)} {it.unit}</td>
              <td className="r num">{num(Math.abs(q) * m.unitCost)}</td>
              <td className="small">{m.projectId ? projName(s, m.projectId) : '—'}</td>
              <td>{m.photo && <button className="thumb" onClick={() => showPhoto(m.photo)} style={{ width: 50, height: 50, padding: 0, cursor: 'pointer' }} aria-label={`ดูรูป ${it.name}`}><img src={m.photo} alt={it.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} /></button>}</td>
            </tr>
          );
        })}</tbody>
      </table></div>
    </section>
  </>);
}

function StockForm({ mode, onClose }) {
  const { s, mut, notify } = useApp();
  const active = s.projects.filter(p => p.status === 'active');
  const [f, setF] = useState({ itemId: s.items[0] ? s.items[0].id : '', qty: '', cost: '', projectId: active[0] ? active[0].id : '', date: todayISO(), note: '', photo: null });
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const [cat, setCat] = useState('');
  const pickable = s.items.filter(i => !cat || i.category === cat);
  const pickCat = c => { setCat(c); const first = s.items.find(i => !c || i.category === c); set('itemId', first ? first.id : ''); };
  const it = s.items.find(i => i.id === f.itemId);
  const titles = { in: 'รับวัสดุเข้าคลัง', out: 'เบิกวัสดุไปใช้ที่โครงการ', count: 'ตรวจนับและปรับยอด' };
  const onPhoto = async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try { const p = await readPhoto(file, 800); setF(x => ({ ...x, photo: p.url })); } catch (err) { notify('อ่านรูปไม่สำเร็จ ลองเลือกไฟล์ภาพ JPG หรือ PNG', 'bad'); }
  };
  const submit = () => {
    const q = +f.qty;
    const ok = mut(d => {
      if (!it) return 'เลือกสินค้า';
      if (mode === 'count') { if (!(q >= 0) || f.qty === '') return 'กรอกยอดที่นับได้จริง'; return stockCount(d, f.itemId, q, f.date, f.note, f.photo); }
      if (!(q > 0)) return 'กรอกจำนวนมากกว่า 0';
      if (mode === 'in') { const c = f.cost === '' ? it.avg : +f.cost; if (!(c >= 0)) return 'กรอกราคาต่อหน่วย'; const err = stockIn(d, f.itemId, q, c, f.date, { note: f.note || 'รับเข้าจากผู้ขาย (เครดิต)', photo: f.photo }); if (err) return err; post(d, f.date, `รับ${it.name} ${num(q)} ${it.unit} เข้าคลัง`, [{ acc: '1150', dr: q * c }, { acc: '2120', cr: q * c }]); return; }
      return stockOut(d, f.itemId, q, f.projectId, f.date, f.note, f.photo);
    }, mode === 'in' ? 'รับเข้าแล้ว' : mode === 'out' ? 'บันทึกการเบิกแล้ว' : 'ปรับยอดแล้ว');
    if (ok) onClose();
  };
  return (
    <section className="panel formpanel">
      <div className="panel-head"><h2>{titles[mode]}</h2><button className="btn btn-sm btn-ghost" onClick={onClose}>ปิด</button></div>
      <div className="photo-row">
        <label className="field"><span>📷 ถ่ายรูปหรือเลือกไฟล์ (ข้อมูลวัสดุ/QR)</span><input id="sf-photo" type="file" accept="image/*" capture="environment" onChange={onPhoto} /></label>
        {f.photo && <img src={f.photo} alt="รูปวัสดุ" className="preview" />}
      </div>
      <div className="form" style={{ marginTop: 10 }}>
        <label className="field"><span>ประเภทวัสดุ</span><select id="sf-cat" value={cat} onChange={e => pickCat(e.target.value)}><option value="">ทุกประเภท</option>{STOCK_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}</select></label>
        <label className="field"><span>สินค้า</span><select id="sf-item" value={f.itemId} onChange={e => set('itemId', e.target.value)}>{pickable.length === 0 && <option value="">ไม่มีวัสดุในประเภทนี้</option>}{pickable.map(i => <option key={i.id} value={i.id}>{i.name} (เหลือ {num(i.qty)} {i.unit})</option>)}</select></label>
        <label className="field"><span>{mode === 'count' ? 'ยอดที่นับได้จริง' : 'จำนวน'} {it ? `(${it.unit})` : ''}</span><input id="sf-qty" type="number" min="0" step="any" value={f.qty} onChange={e => set('qty', e.target.value)} /></label>
        {(mode === 'in' || mode === 'out') && <label className="field"><span>{mode === 'in' ? 'โครงการที่รับเข้า' : 'เบิกไปโครงการ'}</span><select id="sf-proj" value={f.projectId} onChange={e => set('projectId', e.target.value)}>{active.map(p => <option key={p.id} value={p.id}>{p.code} {p.name}</option>)}</select></label>}
        {mode === 'in' && <label className="field"><span>ราคาต่อหน่วย (บาท)</span><input id="sf-cost" type="number" min="0" step="0.01" placeholder={it ? num(it.avg) : ''} value={f.cost} onChange={e => set('cost', e.target.value)} /></label>}
        <label className="field"><span>วันที่</span><input id="sf-date" type="date" value={f.date} onChange={e => set('date', e.target.value)} /></label>
        <label className="field"><span>หมายเหตุ</span><input id="sf-note" value={f.note} onChange={e => set('note', e.target.value)} /></label>
      </div>
      {it && mode === 'out' && +f.qty > 0 && <p className="hint" style={{ marginTop: 10 }}>ต้นทุนที่จะลงโครงการ {baht(+f.qty * it.avg)} ({num(f.qty)} × {baht(it.avg)})</p>}
      {it && mode === 'count' && f.qty !== '' && <p className="hint" style={{ marginTop: 10 }}>ส่วนต่าง {num(+f.qty - it.qty)} {it.unit} จากยอดในระบบ {num(it.qty)} ไม่ลงเป็นต้นทุนโครงการ</p>}
      <div className="actions" style={{ justifyContent: 'flex-end', marginTop: 12 }}>
        <button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={submit}>บันทึก</button>
      </div>
    </section>
  );
}

function NewItemForm({ onClose }) {
  const { s, mut, notify } = useApp();
  const [f, setF] = useState({ name: '', unit: '', min: '', category: '', photo: null });
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const onPhoto = async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try { const p = await readPhoto(file, 800); set('photo', p.url); } catch (err) { notify('อ่านรูปไม่สำเร็จ ลองเลือกไฟล์ภาพ JPG หรือ PNG', 'bad'); }
  };
  const submit = () => mut(d => {
    if (!f.name.trim() || !f.unit.trim()) return 'กรอกชื่อวัสดุและหน่วยนับ';
    if (!f.category) return 'เลือกประเภทวัสดุ';
    if (d.items.some(i => i.name === f.name.trim())) return 'มีวัสดุชื่อนี้ในคลังแล้ว';
    d.items.push({ id: uid(), name: f.name.trim(), unit: f.unit.trim(), min: +f.min || 0, qty: 0, avg: 0, category: f.category, photo: f.photo });
  }, 'เพิ่มวัสดุแล้ว') && onClose();
  return (
    <section className="panel formpanel">
      <div className="panel-head"><h2>เพิ่มวัสดุใหม่</h2><button className="btn btn-sm btn-ghost" onClick={onClose}>ปิด</button></div>
      <div className="photo-row">
        <label className="field"><span>📷 รูปวัสดุ (ถ่ายหรือเลือกไฟล์)</span><input id="ni-photo" type="file" accept="image/*" capture="environment" onChange={onPhoto} /></label>
        {f.photo && <img src={f.photo} alt="รูปวัสดุ" className="preview" />}
      </div>
      <div className="form" style={{ marginTop: 10 }}>
        <label className="field"><span>ชื่อวัสดุ</span><input id="ni-name" value={f.name} onChange={e => set('name', e.target.value)} /></label>
        <label className="field"><span>ประเภทวัสดุ</span><select id="ni-cat" value={f.category} onChange={e => set('category', e.target.value)}><option value="">เลือกประเภท</option>{STOCK_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}</select></label>
        <label className="field"><span>หน่วยนับ</span><input id="ni-unit" placeholder="ถุง, เส้น, คิว" value={f.unit} onChange={e => set('unit', e.target.value)} /></label>
        <label className="field"><span>จุดสั่งซื้อ</span><input id="ni-min" type="number" min="0" value={f.min} onChange={e => set('min', e.target.value)} /></label>
      </div>
      <p className="hint" style={{ marginTop: 10 }}>วัสดุใหม่เริ่มที่ยอด 0 · บันทึกของเข้าคลังด้วยปุ่ม “+ รับเข้า”</p>
      <div className="actions" style={{ justifyContent: 'flex-end', marginTop: 12 }}>
        <button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={submit}>เพิ่มวัสดุ</button>
      </div>
    </section>
  );
}
