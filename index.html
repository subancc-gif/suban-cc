// ผลตรวจก่อนส่ง: [ระดับ, ข้อความ] ระดับ ok / info / warn / bad (bad = ต้องแก้หรือยืนยันก่อนส่ง)
function billChecks(s, f, { gross, cash, dups, edit }) {
  const out = [];
  if (f.ai && f.aiTotal > 0) out.push(Math.abs(gross - f.aiTotal) <= 1
    ? ['ok', `ยอดรวมตรงกับใบเสร็จ ${baht(f.aiTotal)}`]
    : ['bad', `ยอดรวมในใบเสร็จ ${baht(f.aiTotal)} ไม่ตรงกับยอดในฟอร์ม ${baht(gross)} ตรวจรายการหรือ VAT`]);
  const tid = cleanTaxId(f.taxId);
  if (tid) out.push(taxIdOk(tid) ? ['ok', `เลขผู้เสียภาษีร้านถูกต้อง ${tid}`] : ['warn', `เลขผู้เสียภาษี ${tid} ไม่ถูกต้อง (ต้องมี 13 หลักและหลักสุดท้ายต้องตรงสูตร) ตรวจกับใบเสร็จอีกครั้ง`]);
  else if (f.vatOn && (+f.vat > 0 || f.vat === '')) out.push(['info', 'มี VAT แต่ยังไม่มีเลขผู้เสียภาษีของร้าน ใบกำกับภาษีเต็มรูปต้องมีเลขนี้ถึงจะใช้ขอคืน VAT ได้']);
  if (f.date > todayISO()) out.push(['bad', 'วันที่ในใบเสร็จเป็นวันในอนาคต']);
  else if (f.date && f.date < addDays(todayISO(), -60)) out.push(['warn', `ใบเสร็จเก่ากว่า 60 วัน (${thDate(f.date)})`]);
  dups.forEach(d => out.push(['bad', `อาจเป็นบิลซ้ำกับ ${d.no || 'บิลอื่น'}${d.staffId ? ` ของ${staffName(s, d.staffId)}` : ''}: ${d.why}`]));
  if (f.claimType === 'advance' && f.staffId) {
    const list = advances(s, f.staffId);
    const a = list.find(x => x.c.id === f.advId);
    if (a) {
      const own = edit && a.bills.find(b => b.id === edit.id);
      const left = r2(a.left + (own ? billTotals(s, own).cash : 0) - cash);
      out.push(left >= -0.009 ? ['ok', `หักจาก ${a.c.no || 'ใบเบิก'} แล้วเหลือ ${baht(left)}`] : ['warn', `ยอดบิลเกินเงินที่เหลือใน ${a.c.no || 'ใบเบิก'} ${baht(-left)} ส่วนเกินบริษัทต้องจ่ายคืนพนักงาน`]);
    } else if (!list.some(x => x.left > 0.009)) out.push(['warn', 'ไม่มีใบเบิกสำรองจ่ายที่ยังเหลือเงิน ถ้าออกเงินเองไปก่อนให้เลือก "เบิกคืนสำรองจ่าย"']);
  }
  return out;
}

function Checks({ list }) {
  if (!list.length) return null;
  const icon = { ok: '✓', info: 'ℹ️', warn: '⚠️', bad: '⛔' };
  return <ul className="chks">{list.map(([lv, t], i) => <li key={i} className={'chk ' + lv}><span aria-hidden="true">{icon[lv]}</span><span>{t}</span></li>)}</ul>;
}

function BillForm({ onClose, edit }) {
  const { s, me, rs, mut, notify } = useApp();
  const own = !isOffice(me);
  const remote = rs && rs.remote && rs.remote.token ? rs.remote : null;
  const staffOpts = own ? s.staff.filter(x => x.id === me.staffId) : s.staff;
  const active = s.projects.filter(p => p.status === 'active' || (edit && p.id === edit.projectId));
  const [f, setF] = useState(() => edit ? billToForm(edit) : {
    claimType: 'advance', staffId: own ? (me.staffId || '') : s.staff[0] ? s.staff[0].id : '', projectId: active[0] ? active[0].id : '', date: todayISO(),
    vendor: '', taxId: '', receiptNo: '', docType: '', vatOn: true, vat: '', whtPct: '0', photos: [], hashes: [], aiBlobs: [], ai: false, aiTotal: 0, aiNote: '',
    advId: '', advAuto: true, dupAck: false, lines: [newLine()],
  });
  const [errs, setErrs] = useState([]);
  const [ai, setAi] = useReceiptAI();
  const [aiState, setAiState] = useState({ busy: false, msg: '', tone: '' });
  const [showForm, setShowForm] = useState(!!edit);
  const [srvDups, setSrvDups] = useState([]);
  const [sending, setSending] = useState(false);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const setLine = (id, k, v) => setF(p => ({ ...p, lines: p.lines.map(l => l.id === id ? { ...l, [k]: v } : l) }));
  const net = r2(sum(f.lines, l => l.amount));
  const vat = f.vatOn ? (f.vat !== '' ? r2(f.vat) : r2(net * 0.07)) : 0;
  const wht = r2(net * (+f.whtPct) / 100);
  const cash = r2(net + vat - wht);
  const gross = r2(net + vat);
  const bal = f.staffId ? staffBalance(s, f.staffId) : 0;
  const advList = f.claimType === 'advance' && f.staffId ? advances(s, f.staffId) : [];

  // บิลซ้ำ: ตรวจจากข้อมูลในเครื่อง + ถามเซิร์ฟเวอร์ (พนักงานทั่วไปมองไม่เห็นบิลของคนอื่น)
  const dupKey = { id: edit ? edit.id : '', taxId: cleanTaxId(f.taxId), receiptNo: f.receiptNo.trim(), vendor: f.vendor.trim(), date: f.date, total: gross, photoHashes: f.hashes };
  const dupSig = JSON.stringify(dupKey);
  const localDups = (f.vendor.trim() || f.hashes.length) ? findDupBills(s, dupKey) : [];
  useEffect(() => {
    if (!remote || !(f.vendor.trim() || f.hashes.length)) { setSrvDups([]); return; }
    let alive = true;
    const t = setTimeout(() => callSheet(remote.url, 'dupCheck', { token: remote.token, bill: dupKey })
      .then(r => { if (alive) setSrvDups(r.dups || []); }).catch(() => {}), 900);
    return () => { alive = false; clearTimeout(t); };
  }, [dupSig, remote && remote.token]);
  const dups = [...localDups, ...srvDups.filter(d => !localDups.some(x => x.id === d.id))];

  // เลือกใบเบิกที่บิลนี้เคลียร์ให้อัตโนมัติ จนกว่าผู้ใช้จะเลือกเอง
  const catsSig = f.lines.map(l => l.cat).join();
  useEffect(() => {
    if (f.claimType !== 'advance' || !f.advAuto) return;
    const id = suggestAdv(s, { id: edit && edit.id, staffId: f.staffId, projectId: f.projectId, date: f.date, lines: f.lines, amount: cash });
    if (id !== f.advId) setF(p => ({ ...p, advId: id }));
  }, [f.claimType, f.advAuto, f.staffId, f.projectId, f.date, catsSig, cash, s.cash.length]);

  const checks = billChecks(s, f, { gross, cash, dups, edit });
  const blocking = checks.filter(c => c[0] === 'bad' && !(f.dupAck && /บิลซ้ำ/.test(c[1])));

  const onPhoto = async e => {
    const files = [...(e.target.files || [])];
    e.target.value = '';
    if (!files.length) return;
    try {
      const got = [];
      for (const file of files) got.push(await prepReceipt(file));
      const photos = [...f.photos, ...got.map(g => g.url)];
      const hashes = [...f.hashes, ...got.map(g => g.hash)];
      const aiBlobs = [...f.aiBlobs, ...got.map(g => g.aiBlob)];
      setF(x => ({ ...x, photos, hashes, aiBlobs, dupAck: false }));
      setAiState({ busy: false, msg: '', tone: '' });
      // ถ่ายรูปแล้วให้ AI อ่านต่อทันที ไม่ต้องกดปุ่มเพิ่ม
      if (ai) readReceipt(photos, aiBlobs);
    } catch (err) { notify('อ่านรูปไม่สำเร็จ ลองเลือกไฟล์ภาพ JPG หรือ PNG', 'bad'); }
  };
  const removePhoto = idx => setF(x => ({ ...x, photos: x.photos.filter((_, i) => i !== idx), hashes: x.hashes.filter((_, i) => i !== idx), aiBlobs: x.aiBlobs.filter((_, i) => i !== idx) }));

  const readReceipt = async (photos = f.photos, blobs = f.aiBlobs) => {
    if (!ai || photos.length === 0 || aiState.busy) return;
    setAiState({ busy: true, msg: `AI กำลังอ่านใบเสร็จ ${photos.length} ใบ…`, tone: '' });
    const prompt = receiptPrompt();
    try {
      const items = [], notes = [];
      let totalVat = 0, grand = 0;
      const first = {};
      for (let i = 0; i < photos.length; i++) {
        const blob = blobs[i] || await fetch(photos[i]).then(r => r.blob());
        let r = await ai.json(prompt, { images: blob }) || {};
        if (Array.isArray(r)) r = r[0] || {};
        items.push(...(Array.isArray(r.items) ? r.items.map(x => x && { ...x, amount: aiNum(x.amount) }).filter(x => x && x.amount > 0) : []));
        ['vendor', 'date', 'taxId', 'receiptNo', 'docType'].forEach(k => { if (r[k] && !first[k]) first[k] = String(r[k]); });
        totalVat += aiNum(r.vat);
        grand += aiNum(r.total);
        if (r.note) notes.push(String(r.note));
      }
      const tid = cleanTaxId(first.taxId);
      const date = aiDate(first.date);
      setF(p => ({
        ...p, ai: true, aiTotal: r2(grand), aiNote: notes.join(' · ').slice(0, 200),
        date: date && date <= todayISO() ? date : p.date,
        vendor: first.vendor ? first.vendor.slice(0, 80) : p.vendor,
        taxId: tid.length === 13 ? tid : p.taxId,
        receiptNo: first.receiptNo ? first.receiptNo.slice(0, 40) : p.receiptNo,
        docType: DOC_TYPE[first.docType] ? first.docType : p.docType,
        vatOn: totalVat > 0, vat: totalVat > 0 ? String(r2(totalVat)) : '',
        lines: items.length ? items.slice(0, 12).map(x => ({ ...newLine(CAT[x.category] ? x.category : 'misc'), descr: String(x.descr || '').slice(0, 80), amount: String(r2(x.amount)) })) : p.lines,
        dupAck: false,
      }));
      setAiState({ busy: false, tone: 'ok', msg: items.length ? '' : 'AI ไม่พบรายการสินค้าในรูป กรอกรายการเองในฟอร์ม' });
      if (!items.length) setShowForm(true);
    } catch (e) {
      if (AI_OFF.includes(e && e.code)) setAi(null);
      setAiState({ busy: false, tone: 'bad', msg: aiErrorText(e) });
      setShowForm(true);
    }
  };

  const submit = async () => {
    const e = [];
    if (!f.staffId) e.push('เลือกพนักงานที่เบิก');
    if (!f.projectId) e.push('เลือกโครงการ');
    if (!f.vendor.trim()) e.push('กรอกชื่อร้านค้า');
    const lines = f.lines.filter(l => +l.amount > 0);
    if (!lines.length) e.push('ใส่รายการอย่างน้อย 1 บรรทัดที่มียอดเงิน');
    lines.forEach((l, i) => {
      if (l.cat !== 'stock' && !l.descr.trim()) e.push(`บรรทัดที่ ${i + 1}: ใส่รายละเอียด`);
      if (l.cat === 'stock' && (!l.itemId || !(+l.qty > 0))) e.push(`บรรทัดที่ ${i + 1}: เลือกสินค้าและจำนวนที่ซื้อเข้าสต๊อก`);
    });
    if (!edit && f.photos.length === 0) e.push('แนบรูปใบเสร็จหรือบิลเงินสด อย่างน้อย 1 ใบ');
    if (dups.length && !f.dupAck) e.push('พบบิลที่อาจซ้ำ ตรวจแล้วติ๊ก "ยืนยันว่าไม่ใช่บิลซ้ำ" หรือยกเลิกบิลนี้');
    if (f.date > todayISO()) e.push('วันที่ในใบเสร็จต้องไม่เกินวันนี้');
    setErrs(e);
    if (e.length) { setShowForm(true); return; }
    // ตรวจซ้ำกับเซิร์ฟเวอร์อีกครั้งก่อนส่งจริง (กันกรณีกดเร็วก่อนผลตรวจกลับมา)
    if (remote && !f.dupAck) {
      setSending(true);
      try {
        const r = await callSheet(remote.url, 'dupCheck', { token: remote.token, bill: dupKey });
        setSending(false);
        if ((r.dups || []).length) { setSrvDups(r.dups); setErrs(['พบบิลที่อาจซ้ำ ตรวจแล้วติ๊ก "ยืนยันว่าไม่ใช่บิลซ้ำ" หรือยกเลิกบิลนี้']); setShowForm(true); return; }
      } catch (err) { setSending(false); /* ตรวจไม่ได้ (ออฟไลน์) ส่งต่อได้ ผู้อนุมัติยังเห็นคำเตือนบิลซ้ำ */ }
    }
    const newId = edit ? edit.id : uid();
    const adv = f.claimType === 'advance' ? f.advId : '';
    const ok = mut(d => {
      const fields = {
        claimType: f.claimType, staffId: f.staffId, projectId: f.projectId, date: f.date, vendor: f.vendor.trim(), vat, wht,
        taxId: cleanTaxId(f.taxId), receiptNo: f.receiptNo.trim(), docType: f.docType, advId: adv, aiTotal: f.ai ? f.aiTotal : 0,
        photoHashes: f.hashes, dupNote: dups.length && f.dupAck ? `ผู้ส่งยืนยันว่าไม่ซ้ำกับ ${dups.map(x => x.no).filter(Boolean).join(', ')}` : '',
        weekStart: f.claimType === 'advance' ? openWeekFor(d, f.staffId, weekOf(f.date)) : weekOf(f.date), photo: f.photos[0] || null, photos: f.photos, ai: f.ai,
        lines: lines.map(l => ({ id: l.id, kind: l.cat === 'stock' ? 'stock' : 'expense', cat: l.cat, descr: l.cat === 'stock' ? (d.items.find(i => i.id === l.itemId) || {}).name : l.descr.trim(), amount: r2(l.amount), itemId: l.cat === 'stock' ? l.itemId : '', qty: l.cat === 'stock' ? +l.qty : '' })),
      };
      if (edit) {
        const x = d.bills.find(y => y.id === edit.id);
        if (!x || (x.status !== 'pending' && x.status !== 'rejected')) return 'บิลนี้อนุมัติไปแล้ว แก้ไขไม่ได้';
        Object.assign(x, fields, { rejectNote: '', rejectedBy: '', editedAt: new Date().toISOString() });
        submitBill(d, x);  // แก้แล้วเริ่มสายอนุมัติใหม่
        return;
      }
      const b = { id: newId, ...fields };
      d.bills.push(b);
      submitBill(d, b);
    }, edit ? `บันทึกการแก้ไข ${edit.no} แล้ว ส่งกลับเข้าสายอนุมัติ` : `ส่งอนุมัติแล้ว แจ้งเตือนไปที่${ROLE_SHORT[chainFor(s, cash)[0]]}`);
    if (ok) onClose(newId);
  };

  const summary = f.ai && !aiState.busy && f.photos.length > 0;
  const catNames = [...new Set(f.lines.filter(l => +l.amount > 0).map(l => l.cat === 'stock' ? 'ซื้อเข้าสต๊อก' : (CAT[l.cat] || CAT.misc).label))];

  return (
    <section className="panel formpanel">
      <div className="panel-head"><h2>{edit ? `แก้ไข ${edit.no} · ${edit.vendor}` : 'เคลียร์สำรองจ่าย'}</h2><button className="btn btn-sm btn-ghost" onClick={() => onClose()}>ปิด</button></div>
      {edit && <p className="hint" style={{ marginBottom: 12 }}>แก้ไขได้จนกว่าจะอนุมัติครบ · บันทึกแล้วบิลจะกลับไปเริ่มสายอนุมัติใหม่{edit.rejectNote ? ` · เหตุที่ตีกลับ: ${edit.rejectNote}` : ''}</p>}
      <div className="seg" role="radiogroup" aria-label="ประเภทเรื่อง" style={{ marginBottom: 10 }}>
        {Object.entries(CLAIM).map(([k, v]) => <button key={k} role="radio" aria-checked={f.claimType === k} aria-selected={f.claimType === k} onClick={() => set('claimType', k)}>{v}</button>)}
      </div>
      <p className="hint" style={{ marginBottom: 12 }}>{f.claimType === 'advance'
        ? `หักจากสำรองจ่ายที่ถืออยู่ ยอดคงค้างตอนนี้ ${baht(bal)}`
        : 'พนักงานออกเงินเองไปก่อน อนุมัติแล้วฝ่ายบัญชีจะโอนหรือจ่ายเงินสดคืน'}</p>

      {/* ขั้นที่ 1 ถ่ายรูป */}
      <label className={'shoot' + (f.photos.length ? ' small' : '')}>
        <span aria-hidden="true">📷</span>
        <span><b>{f.photos.length ? 'ถ่าย / เพิ่มรูปใบเสร็จ' : 'ถ่ายรูปใบเสร็จ'}</b><small>{ai ? 'AI อ่านวันที่ ร้าน เลขผู้เสียภาษี หมวด และยอดเงินให้อัตโนมัติ' : 'รูปละ 1 ใบเสร็จ เลือกได้หลายรูป'}</small></span>
        <input id="bf-photo" type="file" accept="image/*" capture="environment" multiple hidden onChange={onPhoto} />
      </label>
      {f.photos.length > 0 && <div className="shots">
        {f.photos.map((p, i) => <div key={i} className="shot">
          <img src={p} alt={`รูปใบเสร็จที่ ${i + 1}`} />
          <button className="btn btn-sm iconbtn" aria-label={`ลบรูปที่ ${i + 1}`} onClick={() => removePhoto(i)}>✕</button>
        </div>)}
      </div>}
      {f.photos.length > 0 && !ai && <p className="hint" style={{ marginTop: 8 }}>💡 AI อ่านใบเสร็จยังไม่พร้อม{remote ? ' (Staff office ตั้งค่าได้ที่ชีต → เมนู SUBAN CC → ตั้งค่า AI อ่านใบเสร็จ)' : ' เพราะแอปในเครื่องนี้ยังไม่ได้เชื่อม Google Sheets ให้เปิดแอปจากลิงก์ที่ Staff office ส่งให้'} กรอกข้อมูลเองได้ตามปกติ</p>}
      {aiState.busy && <p className="hint aibusy" role="status">⏳ {aiState.msg}</p>}
      {!aiState.busy && aiState.msg && <p className={'hint ' + (aiState.tone === 'bad' ? 'bad' : '')} style={{ marginTop: 8 }} role="status">{aiState.msg}</p>}
      {ai && !f.ai && !aiState.busy && f.photos.length > 0 && <button className="btn btn-sm" style={{ marginTop: 8 }} onClick={() => readReceipt()}>🤖 ให้ AI อ่านอีกครั้ง</button>}

      {/* ขั้นที่ 2 ตรวจผลที่ AI อ่าน แล้วยืนยันครั้งเดียว */}
      {summary && (
        <div className="aisum">
          <div className="row between"><b>🤖 AI อ่านใบเสร็จแล้ว ตรวจความถูกต้อง</b>
            {ai && <button className="btn btn-sm btn-ghost" onClick={() => readReceipt()}>อ่านใหม่</button>}</div>
          <dl>
            <dt>ร้าน</dt><dd>{f.vendor || '—'}</dd>
            <dt>เลขผู้เสียภาษี</dt><dd className="num">{cleanTaxId(f.taxId) || '—'}</dd>
            <dt>เลขที่ใบเสร็จ</dt><dd className="num">{f.receiptNo || '—'}{f.docType ? ` · ${DOC_TYPE[f.docType]}` : ''}</dd>
            <dt>วันที่</dt><dd>{f.date ? thDate(f.date) : '—'}</dd>
            <dt>หมวด</dt><dd>{catNames.join(', ') || '—'}</dd>
            <dt>ยอดรวม</dt><dd className="num"><b>{baht(gross)}</b>{vat ? ` (VAT ${baht(vat)})` : ''}{wht ? ` · หัก ณ ที่จ่าย ${baht(wht)}` : ''}</dd>
            {f.claimType === 'advance' && <><dt>เคลียร์ใบเบิก</dt><dd>{f.advId ? advLabel((advList.find(a => a.c.id === f.advId) || {}).c || {}) : 'ไม่ระบุ'}</dd></>}
          </dl>
          {f.aiNote && <p className="hint warn" style={{ marginBottom: 6 }}>AI แจ้ง: {f.aiNote}</p>}
          <Checks list={checks} />
          {dups.length > 0 && <label className="check" style={{ marginTop: 8 }}><input id="bf-dupok" type="checkbox" checked={f.dupAck} onChange={e => set('dupAck', e.target.checked)} />ยืนยันว่าไม่ใช่บิลซ้ำ (ผู้อนุมัติจะเห็นหมายเหตุนี้)</label>}
          <div className="actions" style={{ marginTop: 12 }}>
            <button className="btn btn-primary bigbtn" disabled={blocking.length > 0 || sending} onClick={submit}>{sending ? 'กำลังตรวจบิลซ้ำ…' : `✓ ข้อมูลถูกต้อง ส่งอนุมัติ ${baht(cash)}`}</button>
            <button className="btn" onClick={() => setShowForm(v => !v)} aria-expanded={showForm}>{showForm ? 'ซ่อนรายละเอียด' : '✏️ แก้ไขรายละเอียด'}</button>
          </div>
          {blocking.length > 0 && <p className="hint bad" style={{ marginTop: 6 }}>แก้ข้อที่มีเครื่องหมาย ⛔ ก่อน จึงจะส่งได้</p>}
          {errs.length > 0 && !showForm && <div className="errors" style={{ marginTop: 10 }}>{errs.map((e, i) => <div key={i}>{e}</div>)}</div>}
        </div>
      )}

      {/* รายละเอียดทั้งหมด แก้ไขได้ทุกช่อง */}
      {(showForm || !summary) && (<>
        <div className="form" style={{ marginTop: 14 }}>
          <label className="field"><span>พนักงานที่เบิก</span>
            <select id="bf-staff" value={f.staffId} disabled={own} onChange={e => set('staffId', e.target.value)}>{staffOpts.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}</select></label>
          <label className="field"><span>โครงการ</span>
            <select id="bf-proj" value={f.projectId} onChange={e => set('projectId', e.target.value)}>{active.map(p => <option key={p.id} value={p.id}>{p.code} {p.name}</option>)}</select></label>
          <label className="field"><span>วันที่ในใบเสร็จ</span><input id="bf-date" type="date" value={f.date} max={todayISO()} onChange={e => set('date', e.target.value)} /></label>
          <label className="field"><span>ร้านค้า</span><input id="bf-vendor" placeholder="เช่น ไทวัสดุ บางนา" value={f.vendor} onChange={e => set('vendor', e.target.value)} /></label>
          <label className="field"><span>เลขผู้เสียภาษีของร้าน</span><input id="bf-tax" inputMode="numeric" placeholder="13 หลัก (ถ้ามี)" value={f.taxId} onChange={e => set('taxId', e.target.value)} /></label>
          <label className="field"><span>เลขที่ใบเสร็จ</span><input id="bf-rno" placeholder="เช่น INV-00123" value={f.receiptNo} onChange={e => set('receiptNo', e.target.value)} /></label>
          <label className="field"><span>ชนิดเอกสาร</span><select id="bf-doc" value={f.docType} onChange={e => set('docType', e.target.value)}><option value="">ไม่ระบุ</option>{Object.entries(DOC_TYPE).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></label>
          {f.claimType === 'advance' && <label className="field"><span>เคลียร์ใบเบิก {f.advAuto && f.advId ? '(ระบบจับคู่ให้)' : ''}</span>
            <select id="bf-adv" value={f.advId} onChange={e => setF(p => ({ ...p, advId: e.target.value, advAuto: false }))}>
              <option value="">ไม่ระบุ</option>
              {advList.filter(a => a.left > 0.009 || a.c.id === f.advId).map(a => <option key={a.c.id} value={a.c.id}>{advLabel(a.c)} · เหลือ {baht(a.left)}</option>)}
            </select></label>}
        </div>

        <h3 style={{ margin: '18px 0 8px' }}>รายการค่าใช้จ่าย</h3>
        <div className="stack" style={{ gap: 8 }}>
          <div className="lineed head"><span>ประเภทค่าใช้จ่าย</span><span>รายละเอียด / สินค้า</span><span>จำนวน</span><span className="r">ยอดก่อน VAT</span><span /></div>
          {f.lines.map(l => {
            const it = s.items.find(i => i.id === l.itemId);
            return (
              <div className="lineed" key={l.id}>
                <select id={'lk-' + l.id} aria-label="ประเภทค่าใช้จ่าย" value={l.cat} onChange={e => setLine(l.id, 'cat', e.target.value)}>
                  {CATS.map(c => <option key={c.key} value={c.key}>{c.label}</option>)}
                  <option value="stock">ซื้อเข้าสต๊อก</option>
                </select>
                {l.cat !== 'stock'
                  ? <input id={'ld-' + l.id} className="span2" aria-label="รายละเอียด" placeholder="เช่น ค่าขนส่ง, น้ำมันรถกระบะ" value={l.descr} onChange={e => setLine(l.id, 'descr', e.target.value)} />
                  : <select id={'li-' + l.id} className="span2" aria-label="สินค้า" value={l.itemId} onChange={e => setLine(l.id, 'itemId', e.target.value)}>
                      <option value="">เลือกสินค้า</option>{s.items.map(i => <option key={i.id} value={i.id}>{i.name}</option>)}
                    </select>}
                {l.cat === 'stock'
                  ? <input id={'lq-' + l.id} type="number" min="0" step="any" aria-label="จำนวน" placeholder={it ? it.unit : 'จำนวน'} value={l.qty} onChange={e => setLine(l.id, 'qty', e.target.value)} />
                  : <span className="hint">—</span>}
                <input id={'la-' + l.id} type="number" min="0" step="0.01" aria-label="ยอดก่อน VAT" placeholder="0.00" className="r" value={l.amount} onChange={e => setLine(l.id, 'amount', e.target.value)} />
                <button className="btn btn-ghost iconbtn" aria-label="ลบบรรทัด" disabled={f.lines.length === 1} onClick={() => setF(p => ({ ...p, lines: p.lines.filter(x => x.id !== l.id) }))}>✕</button>
              </div>
            );
          })}
          <div><button className="btn btn-sm" onClick={() => setF(p => ({ ...p, lines: [...p.lines, newLine('misc')] }))}>+ เพิ่มบรรทัด</button></div>
        </div>
        <p className="hint" style={{ marginTop: 8 }}>ซื้อเข้าสต๊อก = เก็บเข้าคลังก่อน จะเป็นต้นทุนโครงการตอนเบิกออก · ประเภทอื่นเป็นต้นทุนโครงการทันทีที่อนุมัติ</p>

        <div className="formfoot">
          <div className="row" style={{ gap: 16 }}>
            <label className="check"><input id="bf-vaton" type="checkbox" checked={f.vatOn} onChange={e => set('vatOn', e.target.checked)} />มี VAT</label>
            {f.vatOn && <label className="field" style={{ width: 120 }}><span>VAT (ว่าง = 7%)</span><input id="bf-vat" type="number" step="0.01" placeholder={num(net * 0.07)} value={f.vat} onChange={e => set('vat', e.target.value)} /></label>}
            <label className="field" style={{ width: 150 }}><span>หัก ณ ที่จ่าย</span>

/* ---------- เอกสาร PDF (ใบเบิก / ใบเคลียร์) + แชร์เข้า LINE ---------- */
function bahtText(n) {
  const D = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'], P = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
  const say = x => {
    if (x.length > 6) return say(x.slice(0, -6)) + 'ล้าน' + say(x.slice(-6));
    let out = '';
    for (let i = 0; i < x.length; i++) {
      const d = +x[i], p = x.length - i - 1;
      if (!d) continue;
      out += p === 1 && d === 1 ? 'สิบ' : p === 1 && d === 2 ? 'ยี่สิบ' : p === 0 && d === 1 && x.length > 1 ? 'เอ็ด' : D[d] + P[p];
    }
    return out;
  };
  const [i, f] = (Math.round((+n || 0) * 100) / 100).toFixed(2).split('.');
  return (+i ? say(String(+i)) : 'ศูนย์') + 'บาท' + (+f ? say(String(+f)) + 'สตางค์' : 'ถ้วน');
}

function useDocPdf() {
  const { notify } = useApp();
  const ref = useRef(null);
  const [pdf, setPdf] = useState(null);
  const make = (key, name, el, text) => { if (!(pdf && pdf.busy)) setPdf({ key, name, el, text, busy: true }); };
  // วาดเอกสารนอกจอก่อน แล้วค่อยแปลงเป็น PDF
  useEffect(() => {
    if (!pdf || !pdf.busy || !ref.current) return;
    let alive = true;
    const { key, name, text } = pdf;
    html2pdf().set({
      margin: [12, 12, 14, 12], filename: name, image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, backgroundColor: '#ffffff' }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', '.mdoc-sign', '.mdoc-photo'] },
    }).from(ref.current).outputPdf('blob')
      .then(blob => { if (alive) setPdf({ key, name, text, busy: false, file: new File([blob], name, { type: 'application/pdf' }) }); })
      .catch(() => { if (alive) { setPdf(null); notify('สร้าง PDF ไม่สำเร็จ ลองใหม่อีกครั้ง', 'bad'); } });
    return () => { alive = false; };
  }, [pdf && pdf.busy, pdf && pdf.key]);
  const host = pdf && pdf.busy ? <div className="mdoc-host" aria-hidden="true"><div ref={ref}>{pdf.el}</div></div> : null;
  return { pdf, make, close: () => setPdf(null), host };
}

function PdfShareBox({ pdf, onClose, closeLabel = 'ปิด' }) {
  const { notify } = useApp();
  // บน claude.ai ใช้ downloads (แอปมือถือเปิดหน้าแชร์ให้เลือก LINE ได้) แทน navigator.share ที่มักถูกบล็อกในกรอบหน้าเว็บ
  const [dl, setDl] = useState(null);
  useEffect(() => { let on = true; getDownloads().then(x => { if (on) setDl(x); }); return () => { on = false; }; }, []);
  const canShare = !dl && !!(navigator.canShare && navigator.canShare({ files: [pdf.file] }));
  const share = async () => {
    try { await navigator.share({ files: [pdf.file], title: pdf.name.replace(/\.pdf$/, ''), text: pdf.text }); }
    catch (e) { if (e.name !== 'AbortError') notify('แชร์ไฟล์ไม่สำเร็จ ดาวน์โหลด PDF แล้วแนบในกลุ่ม LINE แทน', 'bad'); }
  };
  return (
    <div className="subbox">
      <p className="small"><b>📄 PDF พร้อมแล้ว</b> <span className="muted">{pdf.name}</span></p>
      <div className="row" style={{ marginTop: 8 }}>
        {canShare && <button className="btn btn-sm btn-primary" onClick={share}>💬 แชร์ไฟล์ PDF เข้า LINE</button>}
        <button className={'btn btn-sm' + (canShare ? '' : ' btn-primary')} onClick={() => downloadBlob(pdf.file, pdf.name)}>{dl ? '📤 บันทึก / แชร์ PDF' : 'ดาวน์โหลด PDF'}</button>
        <button className="btn btn-sm" onClick={() => openLineShare(pdf.text)}>ส่งข้อความสรุปเข้า LINE</button>
        <button className="btn btn-sm btn-ghost" onClick={onClose}>{closeLabel}</button>
      </div>
      <p className="hint" style={{ marginTop: 6 }}>{dl ? 'แอป Claude บนมือถือ: กด "บันทึก / แชร์ PDF" แล้วเลือก LINE → กลุ่มบริษัท · บนคอมพิวเตอร์ไฟล์จะถูกดาวน์โหลด แล้วลากใส่แชทใน LINE PC' : canShare ? 'กดแชร์แล้วเลือกแอป LINE → เลือกกลุ่มบริษัท' : 'บนคอมพิวเตอร์: ดาวน์โหลด PDF แล้วลากไฟล์ใส่แชทกลุ่มใน LINE PC หรือกดส่งข้อความสรุปเข้า LINE'}</p>
    </div>
  );
}

      {b.approvals && b.approvals.length > 0 && <p style={{ marginTop: 8 }}>อนุมัติแล้ว: {b.approvals.map(a => `${ROLE_SHORT[a.step]}${a.by !== a.step ? ` (โดย${ROLE_SHORT[a.by]})` : ''} ${thDate(a.at.slice(0, 10))}`).join(' → ')}</p>}
      {photos.length > 0 && <>
        <h4>รูปใบเสร็จแนบ</h4>
        <div className="mdoc-photo" style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>{photos.map((p, i) => <img key={i} src={p} alt="" style={{ height: 220, maxWidth: 340, objectFit: 'contain', border: '1px solid #CFC6B8' }} />)}</div>
      </>}
      <div className="mdoc-sign">
        <div>ลงชื่อ ..............................<br />( {staffName(s, b.staffId)} )<br />ผู้เบิก</div>
        <div>ลงชื่อ ..............................<br />( .............................. )<br />ผู้ตรวจสอบ</div>
        <div>ลงชื่อ ..............................<br />( .............................. )<br />ผู้อนุมัติ</div>
      </div>
      <p className="mdoc-foot">จัดทำโดยระบบ SUBAN CC หน้างาน · พิมพ์เมื่อ {new Date().toLocaleString('th-TH')}</p>
    </div>
  );
}

/* ---------- นำเข้าเรื่องเบิกจาก LINE ---------- */
const LINE_TEMPLATE = '#เบิก P-2601 / ค่าขนส่งทราย / ร้านสมบูรณ์ทราย / 1500';
function sampleLineChat() {
  const T = todayISO(), Y = addDays(T, -1);
  const head = x => { const d = parseD(x); return `${d.toLocaleDateString('th-TH', { weekday: 'short' })} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
  return [
    '[LINE] ประวัติการแชทใน กลุ่มเบิกเงินหน้างาน SUBAN', `บันทึกเมื่อ: ${T.split('-').reverse().join('/')} 18:30`, '',
    head(Y),
    '08:12\tสมพล ใจดี\tเข้าไซต์แล้วครับ วันนี้เทพื้นชั้น 2',
    '09:15\tสมพล ใจดี\t#เบิก P-2601 / ค่าขนส่งทรายเข้าไซต์ / ร้านสมบูรณ์ทราย / 1,500',
    '09:16\tสมพล ใจดี\t[รูป]',
    '11:40\tBoonchai 🔧\tเบิกค่าน้ำมันรถกระบะ 800 บาท โครงการต่อเติมโกดัง ปั๊ม ปตท.',
    '11:41\tBoonchai 🔧\t[รูป]', '',
    head(T),
    '10:02\tสมพล ใจดี\t"[เคลียร์ทดรอง]', 'P-2603', 'ดอกสว่านและใบเลื่อยจิ๊กซอว์', 'ร้านอารีย์ฮาร์ดแวร์', 'VAT 44.80', '684.80"',
    '10:05\tSomchai K.\tเบิกค่าอาหารช่าง OT 420',
  ].join('\n');
}

function LineImport({ onClose }) {
  const { s, mut, notify, showPhoto } = useApp();
  const active = s.projects.filter(p => p.status === 'active');
  const T = todayISO();
  const [text, setText] = useState('');
  const [rows, setRows] = useState([]);
  const [info, setInfo] = useState(null);
  const [map, setMap] = useState(() => ({ ...(s.lineMap || {}) }));
  const [checked, setChecked] = useState(false);
  const fileRef = useRef(null);
  const done = useMemo(() => new Set(s.bills.filter(b => b.src).map(b => b.src.key)), [s.bills]);
  const setRow = (id, k, v) => { setChecked(false); setRows(rs => rs.map(r => r.id === id ? { ...r, [k]: v } : r)); };
  const setLink = (name, staffId) => { setChecked(false); setMap(m => ({ ...m, [name]: staffId })); };

  const parse = src => {
    const msgs = parseLineChat(src, [...Object.keys(map), ...s.staff.map(x => x.name)]);
    const media = msgs.filter(m => LINE_MEDIA.test(m.text));
    const out = msgs.filter(m => isClaimMsg(m.text)).map(m => {
      const c = parseClaim(m.text, s);
      const key = lineKey(m);
      // รูปที่คนเดียวกันส่งห่างไม่เกิน 30 นาที น่าจะเป็นใบเสร็จของเรื่องนี้
      const pic = media.filter(x => x.sender === m.sender && x.date === m.date)
        .map(x => ({ x, gap: Math.abs(toMin(x.time) - toMin(m.time)) })).filter(o => o.gap <= 30).sort((a, b) => a.gap - b.gap)[0];
      return { ...c, id: uid(), key, sender: m.sender || 'ไม่ทราบชื่อ', date: m.date || T, noDate: !m.date, time: m.time, text: m.text, link: m.link,
        photo: null, photoAt: pic ? pic.x.time : '', staffFromText: !!c.staffId, include: !done.has(key) && +c.amount > 0 };
    });
    setRows(out); setChecked(false);
    setInfo({ total: msgs.length, claims: out.length, other: msgs.length - out.length - media.length });
    if (!msgs.length) notify('ไม่พบข้อความในรูปแบบแชท LINE ลองวางทั้งไฟล์ที่ส่งออกมา', 'bad');
    else if (!out.length) notify('ไม่พบข้อความที่ขึ้นต้นด้วย #เบิก, [เบิก] หรือ เบิก…', 'bad');
  };
  const onFile = e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => { const t = String(fr.result || ''); setText(t); parse(t); };
    fr.onerror = () => notify('อ่านไฟล์ไม่สำเร็จ', 'bad');
    fr.readAsText(file, 'utf-8');
  };
  const onPhoto = async (id, e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try { const p = await readPhoto(file); setRow(id, 'photo', p.url); } catch (err) { notify('อ่านรูปไม่สำเร็จ ลองไฟล์ JPG หรือ PNG', 'bad'); }
  };
  const copyTemplate = async () => {
    try { await navigator.clipboard.writeText(LINE_TEMPLATE); notify('คัดลอกรูปแบบข้อความแล้ว'); }
    catch (e) { notify('คัดลอกไม่ได้ในหน้านี้ เลือกข้อความแล้วคัดลอกเอง', 'bad'); }
  };

  const view = rows.map(r => {
    const staffId = r.staffId || map[r.sender] || matchStaff(s.staff, r.sender);
    const iss = [];
    if (done.has(r.key)) iss.push(['bad', 'ข้อความนี้นำเข้าไปแล้ว']);
    if (!(+r.amount > 0)) iss.push(['bad', 'ไม่พบยอดเงิน ใส่ยอดที่จ่ายจริง']);
    if (+r.vat < 0 || (+r.vat > 0 && +r.vat >= +r.amount)) iss.push(['bad', 'VAT ต้องน้อยกว่ายอดรวม']);
    if (!staffId) iss.push(['bad', `ยังไม่ได้จับคู่ "${r.sender}" กับพนักงาน`]);
    if (!r.projectId) iss.push(['bad', r.projectHint ? `ไม่พบโครงการ "${r.projectHint}" เลือกจากรายการ` : 'ข้อความไม่ได้ระบุโครงการ']);
    if (!r.date || r.date > T) iss.push(['bad', 'วันที่ต้องไม่เกินวันนี้']);
    if (r.noDate) iss.push(['warn', 'ไม่พบวันที่ในแชท ใช้วันนี้แทน ตรวจอีกครั้ง']);
    if (!r.descr.trim()) iss.push(['warn', `ไม่มีรายละเอียด จะใช้ "${CAT[r.cat].label}"`]);
    if (!r.vendor.trim()) iss.push(['warn', 'ไม่ระบุร้านค้า จะบันทึกเป็น "ไม่ระบุร้าน"']);
    if (!r.photo) iss.push(['warn', r.link ? 'ยังไม่ได้แนบรูป · บอทเก็บรูปไว้ที่ลิงก์ด้านล่าง' : r.photoAt ? `ยังไม่ได้แนบรูป · ในแชทมีรูปจากคนนี้เวลา ${r.photoAt} น.` : 'ยังไม่ได้แนบรูปใบเสร็จ']);
    return { r, staffId, iss, bad: iss.some(i => i[0] === 'bad') };
  });
  const picked = view.filter(v => v.r.include);
  const badCount = picked.filter(v => v.bad).length;
  const canSave = picked.length > 0 && badCount === 0 && checked;
  const senders = [...new Set(rows.filter(r => !r.staffFromText).map(r => r.sender))];

  const save = () => {
    const ok = mut(d => {
      d.lineMap = Object.fromEntries(Object.entries({ ...(d.lineMap || {}), ...map }).filter(([, v]) => v));
      const seen = new Set(d.bills.filter(b => b.src).map(b => b.src.key));
      for (const { r, staffId } of picked) {
        if (seen.has(r.key)) continue;
        const vat = r2(r.vat), total = r2(r.amount);
        const b = {
          id: uid(), claimType: r.claimType, staffId, projectId: r.projectId, date: r.date, vendor: r.vendor.trim() || 'ไม่ระบุร้าน', vat, wht: 0,
          weekStart: r.claimType === 'advance' ? openWeekFor(d, staffId, weekOf(r.date)) : weekOf(r.date), photo: r.photo, ai: false,
          src: { via: 'line', key: r.key, sender: r.sender, at: `${r.date} ${r.time}`, text: r.text.slice(0, 500) },
          lines: [{ id: uid(), kind: 'expense', cat: r.cat, descr: r.descr.trim() || CAT[r.cat].label, amount: r2(total - vat), itemId: '', qty: '' }],
        };
        d.bills.push(b);
        submitBill(d, b);
      }
    }, `นำเข้า ${picked.length} เรื่องจาก LINE แล้ว ส่งเข้าสายอนุมัติตามยอดเงิน`);
    if (ok) onClose();
  };

  return (
    <section className="panel formpanel">
      <div className="panel-head"><h2>นำเข้าเรื่องเบิกจากแชท LINE</h2><button className="btn btn-sm btn-ghost" onClick={onClose}>ปิด</button></div>
      <div className="cols">
        <div className="stack" style={{ gap: 8 }}>
          <label className="field"><span>วางข้อความจากแชท LINE หรือแถวที่คัดลอกจาก Google Sheets ของบอท (คอลัมน์ วันที่ ถึง ลิงก์รูป)</span>
            <textarea id="li-text" style={{ minHeight: 170 }} value={text} onChange={e => setText(e.target.value)}
              placeholder={'พฤ. 24/09/2026\n09:15\tสมพล ใจดี\t#เบิก P-2601 / ค่าขนส่งทราย / ร้านสมบูรณ์ทราย / 1500'} /></label>
          <div className="actions">
            <button className="btn btn-primary" disabled={!text.trim()} onClick={() => parse(text)}>แยกเรื่องเบิก</button>
            <button className="btn" onClick={() => fileRef.current && fileRef.current.click()}>เลือกไฟล์แชท .txt</button>
            <input ref={fileRef} id="li-file" type="file" accept=".txt,.tsv,.csv,text/plain" hidden onChange={onFile} />
            <button className="btn btn-ghost btn-sm" onClick={() => { const t = sampleLineChat(); setText(t); parse(t); }}>ลองด้วยแชทตัวอย่าง</button>
          </div>
        </div>
        <div className="howto panel" style={{ background: 'var(--surface-2)', padding: 14 }}>
          <h3>ดึงแชทออกจาก LINE</h3>
          <ol>
            <li>เปิดกลุ่มเบิกเงิน → เมนู ≡ → การตั้งค่า → ส่งออกประวัติแชท (บนคอมพิวเตอร์ใช้ ⋮ → บันทึกแชท)</li>
            <li>ส่งไฟล์ .txt มาที่เครื่องนี้ แล้วกด "เลือกไฟล์แชท .txt"</li>
            <li>ไฟล์แชทไม่มีรูป บันทึกรูปใบเสร็จจาก LINE แล้วแนบในแต่ละรายการ</li>
          </ol>
          <h3 style={{ marginTop: 12 }}>ให้พนักงานพิมพ์แบบนี้</h3>
          <div className="row" style={{ marginTop: 6 }}><code className="code" style={{ flex: 1 }}>{LINE_TEMPLATE}</code><button className="btn btn-sm" onClick={copyTemplate}>คัดลอก</button></div>
          <p className="hint" style={{ marginTop: 6 }}>รหัสโครงการ / รายละเอียด / ร้าน / ยอดรวม สลับลำดับได้ ขึ้นบรรทัดใหม่แทน / ได้ · มีใบกำกับภาษีให้เพิ่ม VAT 105 · เคลียร์เงินทดรองให้ขึ้นต้นด้วย #เคลียร์</p>
        </div>
      </div>

      {info && <p className="hint" style={{ marginTop: 14 }}>พบ {info.claims} เรื่องเบิกจาก {info.total} ข้อความ · ข้ามข้อความคุยทั่วไป {info.other} ข้อความ ระบบไม่เก็บข้อความเหล่านี้</p>}

      {senders.length > 0 && (
        <div style={{ marginTop: 14 }}>
          <h3>จับคู่ชื่อใน LINE กับพนักงาน</h3>
          <p className="hint" style={{ margin: '2px 0 8px' }}>ชื่อใน LINE แต่ละคนตั้งเองได้ ต้องยืนยันว่าคือพนักงานคนไหน ระบบจำไว้ใช้ครั้งต่อไป</p>
          <div className="maprows">{senders.map(n => (
            <label className="field" key={n}><span>{n}</span>
              <select value={map[n] || matchStaff(s.staff, n) || ''} onChange={e => setLink(n, e.target.value)}>
                <option value="">ยังไม่จับคู่</option>{s.staff.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}
              </select></label>
          ))}</div>
        </div>
      )}

      {rows.length > 0 && (<>
        <h3 style={{ margin: '18px 0 6px' }}>ตรวจก่อนส่งอนุมัติ</h3>
        <p className="hint" style={{ marginBottom: 8 }}>ยอดรวมคือเงินที่จ่ายจริงรวม VAT แล้ว · แก้ได้ทุกช่อง · ติ๊กออกรายการที่ไม่ต้องการ</p>
        <div className="claims">{view.map(({ r, staffId, iss }) => (
          <article key={r.id} className={'claim' + (r.include ? '' : ' off')}>
            <div className="row between">
              <label className="check"><input id={'lc-' + r.id} type="checkbox" checked={r.include} onChange={e => setRow(r.id, 'include', e.target.checked)} /><b>{r.sender}</b><span className="hint">{r.date ? thDate(r.date) : ''} {r.time} น.</span></label>
              <div className="row">
                {r.photo && <button className="thumb" onClick={() => showPhoto(r.photo)} aria-label="ดูรูปใบเสร็จ"><img src={r.photo} alt="" /></button>}
                <label className="btn btn-sm">{r.photo ? 'เปลี่ยนรูป' : 'แนบรูปใบเสร็จ'}<input id={'lp-' + r.id} type="file" accept="image/*" hidden onChange={e => onPhoto(r.id, e)} /></label>
              </div>
            </div>
            <div className="src">{r.text}</div>
            <div className="form">
              <label className="field"><span>ประเภทเรื่อง</span><select id={'lt-' + r.id} value={r.claimType} onChange={e => setRow(r.id, 'claimType', e.target.value)}>{Object.entries(CLAIM).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></label>
              <label className="field"><span>พนักงาน</span><select id={'ls-' + r.id} value={staffId} onChange={e => r.staffFromText ? setRow(r.id, 'staffId', e.target.value) : setLink(r.sender, e.target.value)}>
                <option value="">เลือกพนักงาน</option>{s.staff.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}</select></label>
              <label className="field"><span>โครงการ</span><select id={'lj-' + r.id} value={r.projectId} onChange={e => setRow(r.id, 'projectId', e.target.value)}>
                <option value="">เลือกโครงการ</option>{active.map(p => <option key={p.id} value={p.id}>{p.code} {p.name}</option>)}</select></label>
              <label className="field"><span>วันที่จ่าย</span><input id={'lw-' + r.id} type="date" max={T} value={r.date} onChange={e => setRow(r.id, 'date', e.target.value)} /></label>
              <label className="field"><span>หมวดค่าใช้จ่าย</span><select id={'lk2-' + r.id} value={r.cat} onChange={e => setRow(r.id, 'cat', e.target.value)}>{CATS.map(c => <option key={c.key} value={c.key}>{c.label}</option>)}</select></label>
              <label className="field"><span>รายละเอียด</span><input id={'lr-' + r.id} value={r.descr} onChange={e => setRow(r.id, 'descr', e.target.value)} /></label>
              <label className="field"><span>ร้านค้า</span><input id={'lv-' + r.id} placeholder="ไม่ระบุร้าน" value={r.vendor} onChange={e => setRow(r.id, 'vendor', e.target.value)} /></label>
              <label className="field"><span>ยอดรวมที่จ่าย</span><input id={'lm-' + r.id} type="number" min="0" step="0.01" className="r" value={r.amount} onChange={e => setRow(r.id, 'amount', e.target.value)} /></label>
              <label className="field"><span>VAT ในยอดนี้</span><input id={'lx-' + r.id} type="number" min="0" step="0.01" className="r" placeholder="0" value={r.vat} onChange={e => setRow(r.id, 'vat', e.target.value)} /></label>
            </div>
            <div style={{ marginTop: 8 }}>
              {iss.length === 0 && <span className="issue" style={{ color: 'var(--ok)' }}>พร้อมส่งอนุมัติ</span>}
              {iss.map((i, k) => <span key={k} className={'issue ' + i[0]}>{i[1]}</span>)}
              {r.link && <a className="linkbtn small" href={r.link} target="_blank" rel="noopener noreferrer">เปิดรูปที่บอทเก็บไว้</a>}
            </div>
          </article>
        ))}</div>
        <div className="formfoot">
          <label className="check"><input id="li-ok" type="checkbox" checked={checked} onChange={e => setChecked(e.target.checked)} />ตรวจยอดเงิน พนักงาน และโครงการเทียบกับใบเสร็จแล้ว ({ROLES[s.role]})</label>
          <div className="actions">
            {badCount > 0 && <span className="hint bad">ต้องแก้อีก {badCount} รายการ หรือติ๊กออก</span>}
            <button className="btn btn-primary" disabled={!canSave} onClick={save}>ส่งอนุมัติ {picked.length} เรื่อง · {baht(sum(picked, v => v.r.amount))}</button>
          </div>
        </div>
      </>)}
    </section>
  );
}

/* ---------- สมุดรายวัน ---------- */
function JournalView() {
  const { s } = useApp();
  const [acc, setAcc] = useState('');
  const [q, setQ] = useState('');
  const tb = {};
  s.journal.forEach(j => j.lines.forEach(l => { const t = tb[l.acc] || (tb[l.acc] = { dr: 0, cr: 0 }); t.dr += l.dr || 0; t.cr += l.cr || 0; }));
  const accs = Object.keys(tb).sort();
  const list = s.journal
    .filter(j => (!acc || j.lines.some(l => l.acc === acc)) && (!q || (j.desc + ' ' + j.ref + ' ' + j.id).includes(q)))
    .slice().sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, 60);
  const totDr = sum(accs, a => tb[a].dr), totCr = sum(accs, a => tb[a].cr);

  return (<>
    <div className="pagehead">
      <div><h1>สมุดรายวัน</h1><p className="sub">ลงบัญชีอัตโนมัติเมื่ออนุมัติบิล จ่ายเงินคืน จ่ายหรือรับคืนเงินทดรอง และเบิกหรือปรับยอดวัสดุ</p></div>
      <div className="actions">
        <input id="jv-q" placeholder="ค้นหา เช่น EXP-0004, ไทวัสดุ" value={q} onChange={e => setQ(e.target.value)} style={{ width: 220 }} />
        <select id="jv-acc" aria-label="กรองตามบัญชี" value={acc} onChange={e => setAcc(e.target.value)} style={{ width: 'auto' }}>
          <option value="">ทุกบัญชี</option>{accs.map(a => <option key={a} value={a}>{a} {ACCOUNTS[a]}</option>)}
        </select>
      </div>
    </div>
    <div className="cols">
      <section className="panel">
        <div className="panel-head"><h2>รายการบันทึกบัญชี</h2><span className="hint">แสดง {list.length} จาก {s.journal.length} รายการ</span></div>
        <div className="tbl-wrap"><table className="tbl jv">
          <thead><tr><th>วันที่ / เลขที่</th><th>บัญชี</th><th className="r">เดบิต</th><th className="r">เครดิต</th></tr></thead>
          {list.map(j => (
            <tbody key={j.id}>
              <tr className="jhead"><td className="nowrap"><b className="num">{j.id}</b><span className="sub">{thDate(j.date)}</span></td><td colSpan="3">{j.desc}{j.ref && <span className="pill plain" style={{ marginLeft: 8 }}>{j.ref}</span>}</td></tr>
              {j.lines.map((l, i) => (
                <tr key={i} className={acc && l.acc === acc ? 'hit' : ''}>
                  <td />
                  <td style={{ paddingLeft: l.cr ? 34 : 10 }}><span className="num">{l.acc}</span> {ACCOUNTS[l.acc]}{l.projectId && <span className="sub">{projName(s, l.projectId)}</span>}</td>
                  <td className="r num">{l.dr ? num(l.dr) : ''}</td>
                  <td className="r num">{l.cr ? num(l.cr) : ''}</td>
                </tr>
              ))}
            </tbody>
          ))}
        </table></div>
        {list.length === 0 && <p className="empty">ไม่พบรายการ</p>}
      </section>
      <section className="panel">
        <div className="panel-head"><h2>ยอดรวมรายบัญชี</h2></div>
        <div className="tbl-wrap"><table className="tbl">
          <thead><tr><th>บัญชี</th><th className="r">เดบิต</th><th className="r">เครดิต</th></tr></thead>
          <tbody>{accs.map(a => (
            <tr key={a} className={acc === a ? 'hit' : ''} onClick={() => setAcc(acc === a ? '' : a)} style={{ cursor: 'pointer' }}>
              <td><span className="num">{a}</span> {ACCOUNTS[a]}</td>
              <td className="r num">{num(tb[a].dr, 0)}</td>
              <td className="r num">{num(tb[a].cr, 0)}</td>
            </tr>
          ))}</tbody>
          <tfoot><tr><td>รวม {Math.abs(totDr - totCr) < 0.01 ? '(สมดุล)' : '(ไม่สมดุล)'}</td><td className="r num">{num(totDr, 0)}</td><td className="r num">{num(totCr, 0)}</td></tr></tfoot>
        </table></div>
        <p className="hint" style={{ marginTop: 10 }}>ยอดยกมาของสต๊อกและต้นทุนก่อนใช้ระบบไม่ได้ลงบัญชีในต้นแบบนี้ ยอดรวมจึงเป็นเฉพาะรายการที่เกิดในระบบ</p>
      </section>
    </div>
  </>);
}

/* ---------- ระบบเลขาอัจฉริยะ ---------- */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const fmtClock = sec => `${pad(Math.floor(sec / 60))}:${pad(sec % 60)}`;
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const thLong = s => parseD(s).toLocaleDateString('th-TH', { dateStyle: 'long' });
const projFull = (s, id) => { const p = s.projects.find(x => x.id === id); return p ? `${p.code} ${p.name}` : ''; };
const normAction = a => typeof a === 'string' ? { text: a, owner: '', due: '', done: false } : { owner: '', due: '', done: false, ...a };
/* บน claude.ai ต้องบันทึกไฟล์ผ่านความสามารถ downloads (แอป Claude บน iPhone จะเปิดหน้าแชร์ให้ส่งเข้า LINE ได้)
   เปิดเป็นไฟล์ในเครื่องใช้ลิงก์ดาวน์โหลดปกติ */
let dlCap;
const getDownloads = () => {
  if (dlCap === undefined) dlCap = window.claude && window.claude.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  return dlCap;
};
const downloadBlob = async (blob, name) => {
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); return; }
    catch (e) { if (e && (e.code === 'declined' || e.code === 'rate_limited')) return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
const openLineShare = text => window.open('https://line.me/R/share?text=' + encodeURIComponent(text), '_blank', 'noopener');

/* สรุปอัตโนมัติจากข้อความถอดเสียง (กฎภาษาไทย ไม่ต้องใช้อินเทอร์เน็ต) */
const TH_NUM = { หนึ่ง: 1, สอง: 2, สาม: 3, สี่: 4, ห้า: 5, หก: 6, เจ็ด: 7, แปด: 8, เก้า: 9, สิบ: 10 };
const TH_WD = { อาทิตย์: 0, จันทร์: 1, อังคาร: 2, พุธ: 3, พฤหัส: 4, ศุกร์: 5, เสาร์: 6 };
const TH_MON = ['มกรา', 'กุมภา', 'มีนา', 'เมษา', 'พฤษภา', 'มิถุนา', 'กรกฎา', 'สิงหา', 'กันยา', 'ตุลา', 'พฤศจิกา', 'ธันวา'];
const RES_RE = /มติ|ตกลง|สรุปว่า|สรุปคือ|อนุมัติ|เห็นชอบ|ยืนยัน|เปลี่ยน|เพิ่มจำนวน|เพิ่มเป็น|ลดเหลือ|ยกเลิก|ใช้.+แทน|ไม่เอา|เอาเป็น|ใช้เป็น|กำหนดให้/;
const ACT_RE = /ต้อง|ฝาก|รับผิดชอบ|ดำเนินการ|ตรวจสอบ|เช็ค|เช็ก|ติดต่อ|สั่งซื้อ|สั่งของ|ส่งแบบ|ส่งราคา|ส่งให้|อัปเดต|อัพเดท|แก้แบบ|แก้ไข|เตรียม|ประสาน|ขอราคา|เสนอราคา|ภายใน|ก่อนวัน|โทรหา|ตามงาน/;
const TOPIC_RE = /หัวข้อ|วาระ|ประชุม(?:เรื่อง)?|หารือ/;
const OWNER_STOP = /(?:ต้อง|รับผิดชอบ|ช่วย|ไป|จะ|ให้|ดู|เช็ค|เช็ก|ตรวจ|ติดต่อ|สั่ง|ส่ง|ทำ|แก้|อัปเดต|อัพเดท|เตรียม|ประสาน|ดำเนินการ|คุย|โทร|บอก|ว่า|ก็|รับ).*$/;

const thNorm = t => t.replace(/[๐-๙]/g, c => '๐๑๒๓๔๕๖๗๘๙'.indexOf(c))
  .replace(/(หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|สิบ)\s*(?=วัน|สัปดาห์|อาทิตย์|โมง)/g, w => TH_NUM[w.trim()]);

function findDue(raw, base) {
  const t = thNorm(raw);
  let m;
  if ((m = t.match(/(?:ภายใน|อีก)\s*(\d+)\s*วัน/))) return addDays(base, +m[1]);
  if ((m = t.match(/(?:ภายใน|อีก)\s*(\d+)\s*(?:สัปดาห์|อาทิตย์)/))) return addDays(base, 7 * m[1]);
  if (/มะรืน/.test(t)) return addDays(base, 2);
  if (/พรุ่งนี้/.test(t)) return addDays(base, 1);
  if ((m = t.match(/(\d{1,2})\s*(?:เดือน)?\s*(มกรา|กุมภา|มีนา|เมษา|พฤษภา|มิถุนา|กรกฎา|สิงหา|กันยา|ตุลา|พฤศจิกา|ธันวา)/))) {
    const b = parseD(base), d = new Date(b.getFullYear(), TH_MON.indexOf(m[2]), +m[1]);
    if (d < b) d.setFullYear(d.getFullYear() + 1);
    return iso(d);
  }
  if ((m = t.match(/วัน(จันทร์|อังคาร|พุธ|พฤหัส|ศุกร์|เสาร์|อาทิตย์)/))) {
    const wd = TH_WD[m[1]];
    if (/(?:สัปดาห์|อาทิตย์)หน้า/.test(t)) return addDays(weekOf(base), 7 + (wd + 6) % 7);
    const diff = (wd - parseD(base).getDay() + 7) % 7 || 7;
    return addDays(base, diff);
  }
  if (/(?:สัปดาห์|อาทิตย์)หน้า/.test(t)) return addDays(base, 7);
  if (/สิ้นเดือน/.test(t)) { const b = parseD(base); return iso(new Date(b.getFullYear(), b.getMonth() + 1, 0)); }
  if ((m = t.match(/วันที่\s*(\d{1,2})(?!\s*(?:คน|ชิ้น|ตัว|จุด))/))) {
    const b = parseD(base), day = +m[1];
    const d = new Date(b.getFullYear(), b.getMonth() + (day < b.getDate() ? 1 : 0), day);
    return day >= 1 && day <= 31 && d.getDate() === day ? iso(d) : '';
  }
  if (/(?:ภายใน|ก่อน|เสร็จ)\s*วันนี้|วันนี้\s*(?:ให้เสร็จ|เลย)/.test(t)) return base;
  return '';
}

function findTime(raw) {
  const t = thNorm(raw);
  let m;
  if ((m = t.match(/(\d{1,2})[:.](\d{2})/))) return `${pad(+m[1])}:${m[2]}`;
  if (/บ่ายโมง/.test(t)) return '13:00';
  if ((m = t.match(/บ่าย\s*(\d{1,2})\s*โมง/))) return `${pad(+m[1] + 12)}:00`;
  if ((m = t.match(/(\d{1,2})\s*โมง/))) { const h = +m[1]; return `${pad(h < 6 ? h + 12 : h)}:00`; }
  if (/เที่ยง/.test(t)) return '12:00';
  return '';
}

function findOwner(t, people) {
  for (const n of people) {
    const first = n.split(' ')[0];
    if (t.includes(n) || (first.length > 1 && t.includes(first))) return n;
  }
  const m = t.match(/(คุณ|ช่าง|พี่|น้อง|หัวหน้า|โฟร์แมน)\s?([ก-๙A-Za-z]+)/);
  if (!m) return '';
  const name = m[2].replace(OWNER_STOP, '');
  return name.length >= 2 ? m[1] + name : '';
}

const cleanLine = l => l
  .replace(/(?:^|\s)(?:เอ่อ+|อ่า+|อืม+|แบบว่า)(?=\s|$)/g, ' ')
  .replace(/\s*(?:นะ)?(?:ครับ|คะ|ค่ะ|จ้า|จ้ะ)(?=\s|$)/g, '')
  .replace(/\s+/g, ' ').trim();

function summarize(text, s) {
  const base = todayISO();
  const people = [...(s.staff || []), ...(s.workers || [])].map(p => p.name).filter(Boolean);
  const lines = [...new Set(text.replace(/(ครับ|ค่ะ|คะ)(?=\s)/g, '$1\n').split(/\n|[.!?]/).map(cleanLine).filter(l => l.length >= 4))];
  const project = s.projects.find(p => text.includes(p.code) || (p.name && text.includes(p.name)));
  let topic = '', next = null;
  const resolutions = [], actions = [];
  lines.forEach(l => {
    if (!topic && TOPIC_RE.test(l) && !ACT_RE.test(l)) {
      topic = l.replace(/^(?:วันนี้\s*)?(?:หัวข้อ(?:การประชุม)?|วาระ(?:การประชุม)?)\s*(?:คือ|เรื่อง)?\s*[:：]?\s*/, '') || l;
      return;
    }
    const due = findDue(l, base), owner = findOwner(l, people);
    if (/นัด/.test(l) && due && !next) { next = { date: due, time: findTime(l) }; return; }
    if (ACT_RE.test(l) || (owner && due)) actions.push({ text: l, owner, due, done: false });
    else if (RES_RE.test(l)) resolutions.push(l);
  });
  if (!topic) topic = project ? `ประชุมหน้างาน ${project.code} ${project.name}` : 'ประชุมหน้างาน';
  return { topic, projectId: project ? project.id : '', resolutions, actions, next };
}

/* ปฏิทิน: ลิงก์ Google Calendar + ไฟล์ .ics พร้อมแจ้งเตือน */
function calItems(m) {
  const src = `จากการประชุม: ${m.topic} (${thDate(m.date)})`;
  const out = (m.actions || []).map(normAction).filter(a => a.due && !a.done)
    .map((a, i) => ({ uid: `${m.id}-a${i}`, title: a.owner ? `${a.text} (${a.owner})` : a.text, date: a.due, time: '', details: src }));
  if (m.next && m.next.date) out.push({ uid: `${m.id}-next`, title: `ประชุมติดตามงาน: ${m.topic}`, date: m.next.date, time: m.next.time || '', details: src });
  return out;
}
const ymd = d => d.replace(/-/g, '');
const endHM = t => { const [h, mi] = t.split(':').map(Number); return `${pad(Math.min(23, h + 1))}${pad(mi)}00`; };
const gcalUrl = it => {
  const dates = it.time ? `${ymd(it.date)}T${it.time.replace(':', '')}00/${ymd(it.date)}T${endHM(it.time)}` : `${ymd(it.date)}/${ymd(addDays(it.date, 1))}`;
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&ctz=Asia/Bangkok'
    + `&text=${encodeURIComponent(it.title)}&dates=${dates}&details=${encodeURIComponent(it.details)}`;
};
const icsEsc = t => String(t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
const icsFold = line => { const cs = Array.from(line), out = []; for (let i = 0; i < cs.length; i += 24) out.push(cs.slice(i, i + 24).join('')); return out.join('\r\n '); };
function buildIcs(items) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//SUBAN CC//Secretary//TH', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  items.forEach(it => {
    L.push('BEGIN:VEVENT', `UID:${it.uid}@subancc`, `DTSTAMP:${stamp}`);
    if (it.time) L.push(`DTSTART:${ymd(it.date)}T${it.time.replace(':', '')}00`, `DTEND:${ymd(it.date)}T${endHM(it.time)}`);
    else L.push(`DTSTART;VALUE=DATE:${ymd(it.date)}`, `DTEND;VALUE=DATE:${ymd(addDays(it.date, 1))}`);
    L.push(`SUMMARY:${icsEsc(it.title)}`, `DESCRIPTION:${icsEsc(it.details)}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(it.title)}`, `TRIGGER:${it.time ? '-PT1H' : '-PT15H'}`, 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n');
}

function minutesText(m, s) {
  const acts = (m.actions || []).map(normAction);
  const L = ['📋 รายงานการประชุม — บริษัท สุบรรณ ซีซี จำกัด', `เรื่อง: ${m.topic}`, `📅 ${thLong(m.date)}${m.time ? ` เวลา ${m.time} น.` : ''}`];
  if (m.projectId) L.push(`🏗 โครงการ: ${projFull(s, m.projectId)}`);
  if (m.attendees) L.push(`👥 ผู้เข้าประชุม: ${m.attendees}`);
  if ((m.resolutions || []).length) L.push('', '✅ มติที่ประชุม', ...m.resolutions.map((r, i) => `${i + 1}. ${r}`));
  if (acts.length) L.push('', '⚡ งานที่ต้องทำต่อ', ...acts.map((a, i) => `${i + 1}. ${a.done ? '[เสร็จแล้ว] ' : ''}${a.text}${a.owner ? ` — ${a.owner}` : ''}${a.due ? ` (กำหนด ${thDate(a.due)})` : ''}`));
  if (m.next && m.next.date) L.push('', `📌 นัดครั้งถัดไป: ${thLong(m.next.date)}${m.next.time ? ` ${m.next.time} น.` : ''}`);
  return L.join('\n');
}

/* บันทึกเสียง + ถอดความสด + นับเวลา + แถบระดับเสียง */
function useRecorder(cb) {
  const cbRef = useRef(cb); cbRef.current = cb;
  const [on, setOn] = useState(false);
  const [sec, setSec] = useState(0);
  const canvasRef = useRef(null);
  const x = useRef({});

  const halt = () => {
    const r = x.current;
    if (!r.active) return false;
    r.active = false;
    clearInterval(r.tick); cancelAnimationFrame(r.raf);
    try { r.sr && r.sr.stop(); } catch (e) { /* หยุดแล้ว */ }
    try { r.mr && r.mr.state !== 'inactive' && r.mr.stop(); } catch (e) { /* หยุดแล้ว */ }
    r.stream && r.stream.getTracks().forEach(t => t.stop());
    r.ctx && r.ctx.close().catch(() => {});
    r.wake && r.wake.release().catch(() => {});
    setOn(false);
    return true;
  };
  useEffect(() => () => { halt(); }, []);

  const stop = () => { if (halt()) { cbRef.current.onInterim(''); cbRef.current.onStop(); } };

  const start = async () => {
    if (x.current.active) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { cbRef.current.notify('เบราว์เซอร์นี้ใช้ไมโครโฟนไม่ได้ ต้องเปิดผ่าน https หรือไฟล์ในเครื่อง', 'bad'); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch (e) {
      cbRef.current.notify(e && e.name === 'NotAllowedError' ? 'ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน กดอนุญาตที่แถบที่อยู่ของเบราว์เซอร์' : 'เปิดไมโครโฟนไม่ได้', 'bad');
      return;
    }
    const r = x.current = { active: true, stream, chunks: [] };
    setOn(true); setSec(0);
    const t0 = Date.now();
    r.tick = setInterval(() => setSec(Math.floor((Date.now() - t0) / 1000)), 500);
    try { if (navigator.wakeLock) r.wake = await navigator.wakeLock.request('screen'); } catch (e) { /* ไม่รองรับ */ }

    if (window.MediaRecorder) {
      const type = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find(t => MediaRecorder.isTypeSupported(t));
      const mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
      mr.ondataavailable = e => { if (e.data.size) r.chunks.push(e.data); };
      mr.onstop = () => {
        const blob = new Blob(r.chunks, { type: mr.mimeType || 'audio/webm' });
        if (blob.size) cbRef.current.onAudio({ blob, url: URL.createObjectURL(blob), ext: /mp4/.test(blob.type) ? 'm4a' : 'webm' });
      };
      mr.start(1000); r.mr = mr;
    }

    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const an = ctx.createAnalyser(); an.fftSize = 512;
      ctx.createMediaStreamSource(stream).connect(an);
      const buf = new Uint8Array(an.fftSize), bars = new Array(48).fill(0);
      const color = canvasRef.current ? getComputedStyle(canvasRef.current).color : '#B0362B';
      let n = 0;
      const draw = () => {
        if (!r.active) return;
        an.getByteTimeDomainData(buf);
        let sq = 0; for (let i = 0; i < buf.length; i++) sq += (buf[i] - 128) ** 2;
        if (n++ % 3 === 0) { bars.shift(); bars.push(Math.min(1, Math.sqrt(sq / buf.length) / 36)); }
        const c = canvasRef.current;
        if (c) {
          const g = c.getContext('2d'), w = c.width, h = c.height, bw = w / bars.length;
          g.clearRect(0, 0, w, h); g.fillStyle = color;
          bars.forEach((v, i) => { const bh = Math.max(4, v * h); g.fillRect(i * bw + 2, (h - bh) / 2, bw - 4, bh); });
        }
        r.raf = requestAnimationFrame(draw);
      };
      r.ctx = ctx; draw();
    } catch (e) { /* ไม่มีแถบระดับเสียง */ }

    if (SpeechRec) {
      const sr = new SpeechRec();
      sr.lang = 'th-TH'; sr.continuous = true; sr.interimResults = true;
      sr.onresult = e => {
        let tmp = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const res = e.results[i];
          if (res.isFinal) { const t = res[0].transcript.trim(); if (t) cbRef.current.onText(t); }
          else tmp += res[0].transcript;
        }
        cbRef.current.onInterim(tmp);
      };
      sr.onerror = e => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'network') {
          r.noStt = true;
          cbRef.current.notify('ถอดเสียงอัตโนมัติไม่ได้ (ต้องต่ออินเทอร์เน็ต) ระบบยังอัดเสียงต่อ พิมพ์บันทึกเพิ่มเองได้', 'bad');
        }
      };
      sr.onend = () => { if (r.active && !r.noStt) { try { sr.start(); } catch (e) { /* เริ่มซ้ำไม่ได้ */ } } };
      try { sr.start(); r.sr = sr; } catch (e) { /* ไม่รองรับ */ }
    }
  };

  return { on, sec, start, stop, canvasRef };
}

const newDraft = () => ({ id: null, date: todayISO(), time: nowHM(), projectId: '', topic: '', attendees: '', transcript: '', resolutions: '', actions: [], nextDate: '', nextTime: '' });
const toDraft = m => ({
  id: m.id, date: m.date, time: m.time || '', projectId: m.projectId || '', topic: m.topic || '', attendees: m.attendees || '', transcript: m.transcript || '',
  resolutions: (m.resolutions || []).join('\n'), actions: (m.actions || []).map(normAction),
  nextDate: (m.next && m.next.date) || '', nextTime: (m.next && m.next.time) || '',
});
const applySummary = (d, r, force) => ({
  ...d,
  topic: force || !d.topic.trim() ? r.topic : d.topic,
  projectId: d.projectId || r.projectId,
  resolutions: force || !d.resolutions.trim() ? r.resolutions.join('\n') : d.resolutions,
  actions: force || !d.actions.length ? r.actions : d.actions,
  nextDate: d.nextDate || (r.next ? r.next.date : ''),
  nextTime: d.nextTime || (r.next ? r.next.time : ''),
});

function MicIcon() {
  return <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3" /><path d="M19 10a7 7 0 0 1-14 0" /><path d="M12 17v5" /></svg>;
}
function StopIcon() {
  return <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>;
}

function SecretaryView() {
  const { s, mut, notify, ask, rs } = useApp();
  const meetings = s.meetings || [];
  // Edge เก็บข้อมูลแยกจากเบราว์เซอร์นี้ ต้องแนบลิงก์ชีตไปด้วยถึงจะเห็นข้อมูลชุดเดียวกัน
  const edgeLink = /Windows/.test(navigator.userAgent) && location.protocol === 'https:'
    ? 'microsoft-edge:' + location.origin + location.pathname + (rs.remote ? '?sheet=' + encodeURIComponent(rs.remote.url) : '') + '#secretary' : '';
  const [draft, setDraft] = useState(null);
  const [interim, setInterim] = useState('');
  const [audio, setAudio] = useState(null);
  const [calFor, setCalFor] = useState(null);
  const [pdf, setPdf] = useState(null);
  const docRef = useRef(null);
  const liveRef = useRef(null);
  const draftRef = useRef(draft); draftRef.current = draft;
  const sRef = useRef(s); sRef.current = s;

  const rec = useRecorder({
    notify,
    onText: line => setDraft(d => { const b = d || newDraft(); return { ...b, transcript: b.transcript ? b.transcript + '\n' + line : line }; }),
    onInterim: setInterim,
    onAudio: a => setAudio(prev => { if (prev) URL.revokeObjectURL(prev.url); return a; }),
    onStop: () => setTimeout(() => {
      const d = draftRef.current;
      if (!d || !d.transcript.trim()) { notify('ไม่ได้ข้อความจากเสียง พิมพ์บันทึกหรือวางข้อความแล้วกดสรุปอัตโนมัติ', 'bad'); return; }
      const r = summarize(d.transcript, sRef.current);
      setDraft(cur => applySummary(cur || d, r, false));
      notify(`สรุปได้ ${r.resolutions.length} มติ · ${r.actions.length} งาน ตรวจแก้ก่อนบันทึก`);
    }, 1200),
  });

  useEffect(() => { if (liveRef.current) liveRef.current.scrollTop = liveRef.current.scrollHeight; }, [draft && draft.transcript, interim]);

  const people = [...new Set([...(s.staff || []), ...(s.workers || [])].map(p => p.name).filter(Boolean))];
  const set = (k, v) => setDraft(d => ({ ...d, [k]: v }));
  const setAct = (i, k, v) => setDraft(d => ({ ...d, actions: d.actions.map((a, j) => j === i ? { ...a, [k]: v } : a) }));

  const startRec = () => { if (!draft) setDraft(newDraft()); rec.start(); };
  const runSummary = () => {
    if (!draft.transcript.trim()) { notify('ยังไม่มีข้อความให้สรุป', 'bad'); return; }
    const go = () => { const r = summarize(draft.transcript, s); setDraft(d => applySummary(d, r, true)); notify(`สรุปได้ ${r.resolutions.length} มติ · ${r.actions.length} งาน`); };
    if (draft.resolutions.trim() || draft.actions.length) ask({ title: 'สรุปใหม่จากข้อความ?', body: 'หัวข้อ มติ และรายการงานที่แก้ไว้จะถูกแทนที่ด้วยผลสรุปใหม่', ok: 'สรุปใหม่', onOk: go });
    else go();
  };
  const cancelDraft = () => { rec.stop(); setDraft(null); };
  const save = () => {
    const d0 = draft;
    if (!d0.topic.trim()) { notify('กรุณากรอกหัวข้อการประชุม', 'bad'); return; }
    if (rec.on) rec.stop();
    const m = {
      id: d0.id || uid(), date: d0.date || todayISO(), time: d0.time, projectId: d0.projectId, topic: d0.topic.trim(),
      attendees: d0.attendees.trim(), transcript: d0.transcript.trim(),
      resolutions: d0.resolutions.split('\n').map(x => x.replace(/^\s*(?:\d+[.)]|[-•*])\s*/, '').trim()).filter(Boolean),
      actions: d0.actions.filter(a => a.text.trim()).map(a => ({ ...a, text: a.text.trim(), owner: (a.owner || '').trim() })),
      next: d0.nextDate ? { date: d0.nextDate, time: d0.nextTime } : null,
    };
    const ok = mut(d => {
      d.meetings = d.meetings || [];
      const i = d.meetings.findIndex(x => x.id === m.id);
      if (i >= 0) d.meetings[i] = { ...d.meetings[i], ...m };
      else d.meetings.push({ ...m, createdBy: d.role, createdAt: new Date().toISOString() });
    }, 'บันทึกรายงานการประชุมแล้ว');
    if (ok) setDraft(null);
  };
  const toggleDone = (id, i) => mut(d => {
    const m = d.meetings.find(x => x.id === id);
    m.actions = m.actions.map(normAction);
    m.actions[i].done = !m.actions[i].done;
  });
  const remove = m => ask({ title: 'ลบรายงานการประชุมนี้?', body: `"${m.topic}" (${thDate(m.date)}) จะถูกลบถาวร`, ok: 'ลบ', danger: true, onOk: () => mut(d => { d.meetings = d.meetings.filter(x => x.id !== m.id); }, 'ลบแล้ว') });
  const edit = m => { setDraft(toDraft(m)); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  const pdfName = m => `รายงานประชุม-${m.date}-${(m.topic.length > 40 ? m.topic.slice(0, 40).replace(/\s\S*$/, '') : m.topic).replace(/[\\/:*?"<>|]/g, '').trim()}.pdf`;
  const makePdf = async m => {
    if (pdf && pdf.busy) return;
    ReactDOM.flushSync(() => setPdf({ m, busy: true }));
    try {
      const blob = await html2pdf().set({
        margin: [12, 12, 14, 12], filename: pdfName(m), image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, backgroundColor: '#ffffff' }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', 'li', '.mdoc-sign'] },
      }).from(docRef.current).outputPdf('blob');
      setPdf({ m, busy: false, file: new File([blob], pdfName(m), { type: 'application/pdf' }) });
    } catch (e) { setPdf(null); notify('สร้าง PDF ไม่สำเร็จ ลองใหม่อีกครั้ง', 'bad'); }
  };

  const today = todayISO();
  const open = meetings.flatMap(m => (m.actions || []).map((a, i) => ({ a: normAction(a), i, m })))
    .filter(x => !x.a.done)
    .sort((p, q) => (p.a.due || '9999').localeCompare(q.a.due || '9999'));
  const dueTag = due => !due ? null
    : due < today ? <span className="pill bad">เลยกำหนด {thDate(due)}</span>
    : due === today ? <span className="pill warn">วันนี้</span>
    : <span className="pill">กำหนด {thDate(due)}</span>;
  const liveLines = draft ? draft.transcript.split('\n').slice(-8).join('\n') : '';

  return (<>
    <div className="pagehead">
      <div><h1>ระบบเลขาอัจฉริยะ</h1><p className="sub">บันทึกเสียงการประชุม → ถอดความและสรุปมติ/งานที่ต้องทำ → ลงปฏิทิน ทำ PDF และส่งเข้า LINE</p></div>
      <div className="actions">
        {!draft && <button className="btn" onClick={() => setDraft(newDraft())}>✍️ จดบันทึกเอง</button>}
      </div>
    </div>

    <section className="panel">
      <div className="rec">
        <button className={'recbtn' + (rec.on ? ' on' : '')} onClick={rec.on ? rec.stop : startRec} aria-label={rec.on ? 'หยุดบันทึก' : 'เริ่มบันทึกเสียง'}>
          {rec.on ? <StopIcon /> : <MicIcon />}
        </button>
        <div className={'rectime' + (rec.on ? ' on' : '')}>{fmtClock(rec.sec)}</div>
        <canvas ref={rec.canvasRef} className="recwave" width="720" height="80" hidden={!rec.on} aria-hidden="true" />
        <p className="hint">{rec.on ? 'กำลังบันทึก… แตะปุ่มอีกครั้งเพื่อหยุดและสรุปอัตโนมัติ'
          : draft && draft.transcript ? 'แตะเพื่อบันทึกเสียงต่อจากเดิม' : 'แตะเพื่อเริ่มบันทึกเสียงประชุมหน้างาน ประชุมทีม หรือคุยกับลูกค้า'}</p>
        {!SpeechRec && <p className="hint warn">เบราว์เซอร์นี้ (เช่น Firefox) ถอดเสียงเป็นข้อความไม่ได้ ยังอัดเสียงได้ตามปกติ · ถอดความอัตโนมัติได้ใน Microsoft Edge หรือ Chrome (คอมพิวเตอร์/Android) และ Safari (iPhone)</p>}
        {!SpeechRec && edgeLink && <a className="btn" href={edgeLink} style={{ textDecoration: 'none' }}>เปิดหน้านี้ใน Microsoft Edge</a>}
        {rec.on && <div className="live" ref={liveRef} aria-live="polite">{liveLines || (!interim && <span className="muted">รอฟังเสียงพูด…</span>)}{interim && <i>{liveLines ? '\n' : ''}{interim}</i>}</div>}
        {audio && !rec.on && (
          <div className="row" style={{ justifyContent: 'center' }}>
            <audio controls src={audio.url} />
            <button className="btn btn-sm" onClick={() => downloadBlob(audio.blob, `เสียงประชุม-${todayISO()}.${audio.ext}`)}>ดาวน์โหลดไฟล์เสียง</button>
          </div>
        )}
        {audio && !rec.on && <p className="hint">ไฟล์เสียงไม่ถูกเก็บในระบบ ดาวน์โหลดเก็บไว้หากต้องการใช้อ้างอิง</p>}
      </div>
    </section>

    {draft && (
      <section className="panel formpanel">
        <div className="panel-head"><h2>{draft.id ? 'แก้ไขรายงานการประชุม' : 'รายงานการประชุม (ร่าง)'}</h2><button className="btn btn-sm btn-ghost" onClick={cancelDraft}>ปิด</button></div>
        <div className="form">
          <label className="field wide"><span>หัวข้อหลัก / เรื่องที่หารือ</span><input value={draft.topic} onChange={e => set('topic', e.target.value)} placeholder="เช่น ประชุมสรุปงานระบบไฟฟ้า บ้านคุณวรรณา" /></label>
          <label className="field"><span>วันที่</span><input type="date" value={draft.date} onChange={e => set('date', e.target.value)} /></label>
          <label className="field"><span>เวลา</span><input type="time" value={draft.time} onChange={e => set('time', e.target.value)} /></label>
          <label className="field"><span>โครงการ</span>
            <select value={draft.projectId} onChange={e => set('projectId', e.target.value)}>
              <option value="">— ไม่ระบุ —</option>
              {s.projects.map(p => <option key={p.id} value={p.id}>{p.code} {p.name}</option>)}
            </select>
          </label>
          <label className="field"><span>ผู้เข้าประชุม</span><input value={draft.attendees} onChange={e => set('attendees', e.target.value)} placeholder="เช่น คุณไพศาล, คุณอภิวัฒน์" /></label>
          <label className="field wide"><span>ข้อความถอดเสียง (แก้ไขหรือวางข้อความเพิ่มได้)</span>
            <textarea value={draft.transcript} onChange={e => set('transcript', e.target.value)} style={{ minHeight: 120 }} placeholder="ข้อความจากการบันทึกเสียงจะแสดงที่นี่ หรือวางข้อความสรุปการคุยงานจาก LINE ได้" />
          </label>
          <div className="field wide"><div className="row"><button className="btn btn-sm" onClick={runSummary} disabled={!draft.transcript.trim()}>✨ สรุปอัตโนมัติจากข้อความ</button><span className="hint">แยกมติ งานที่ต้องทำ ผู้รับผิดชอบ และกำหนดเสร็จให้อัตโนมัติ ตรวจแก้ได้ก่อนบันทึก</span></div></div>
          <label className="field wide"><span>✅ มติที่ประชุม (บรรทัดละหนึ่งข้อ)</span>
            <textarea value={draft.resolutions} onChange={e => set('resolutions', e.target.value)} style={{ minHeight: 100 }} placeholder={'เช่น\nเพิ่มเซอร์กิตเบรกเกอร์ไลท์ติ้งเป็น 4 วงจร (ชั้น 1, ชั้น 2, โรงรถ, สระว่ายน้ำ)'} />
          </label>
          <div className="field wide"><span>⚡ งานที่ต้องทำต่อ (Action Items)</span>
            <div className="stack" style={{ gap: 8 }}>
              {draft.actions.length === 0 && <p className="hint">ยังไม่มีรายการงาน</p>}
              {draft.actions.map((a, i) => (
                <div className="actrow" key={i}>
                  <input className="span2" value={a.text} onChange={e => setAct(i, 'text', e.target.value)} placeholder="งานที่ต้องทำ" aria-label="งานที่ต้องทำ" />
                  <input list="sec-people" value={a.owner} onChange={e => setAct(i, 'owner', e.target.value)} placeholder="ผู้รับผิดชอบ" aria-label="ผู้รับผิดชอบ" />
                  <input type="date" value={a.due} onChange={e => setAct(i, 'due', e.target.value)} aria-label="กำหนดเสร็จ" />
                  <button className="btn btn-sm btn-bad" onClick={() => setDraft(d => ({ ...d, actions: d.actions.filter((_, j) => j !== i) }))} aria-label="ลบงาน">ลบ</button>
                </div>
              ))}
              <div><button className="btn btn-sm" onClick={() => setDraft(d => ({ ...d, actions: [...d.actions, { text: '', owner: '', due: '', done: false }] }))}>+ เพิ่มงาน</button></div>
            </div>
            <datalist id="sec-people">{people.map(n => <option key={n} value={n} />)}</datalist>
          </div>
          <label className="field"><span>📌 นัดประชุมครั้งถัดไป (วันที่)</span><input type="date" value={draft.nextDate} onChange={e => set('nextDate', e.target.value)} /></label>
          <label className="field"><span>เวลานัด</span><input type="time" value={draft.nextTime} onChange={e => set('nextTime', e.target.value)} disabled={!draft.nextDate} /></label>
        </div>
        <div className="formfoot">
          <span className="hint">บันทึกแล้วจึงทำ PDF ลงปฏิทิน และส่งเข้า LINE ได้</span>
          <div className="row"><button className="btn btn-ghost" onClick={cancelDraft}>ยกเลิก</button><button className="btn btn-primary" onClick={save}>💾 บันทึกรายงาน</button></div>
        </div>
      </section>
    )}

    {open.length > 0 && (
      <section className="panel">
        <div className="panel-head"><h2>⚡ งานที่ต้องติดตาม</h2><span className="hint">{open.length} งานค้าง</span></div>
        <ul className="checks">
          {open.slice(0, 8).map(({ a, i, m }) => (
            <li key={m.id + i}>
              <label>
                <input type="checkbox" checked={false} onChange={() => toggleDone(m.id, i)} aria-label="ทำเสร็จแล้ว" />
                <span>{a.text}{a.owner && <b> — {a.owner}</b>}<span className="sub muted small">จาก: {m.topic}</span></span>
              </label>
              {dueTag(a.due)}
            </li>
          ))}
        </ul>
        {open.length > 8 && <p className="hint" style={{ marginTop: 8 }}>และอีก {open.length - 8} งาน ดูในรายงานแต่ละครั้งด้านล่าง</p>}
      </section>
    )}

    <section className="panel">
      <div className="panel-head"><h2>📋 รายงานการประชุม</h2><span className="hint">{meetings.length} ครั้ง</span></div>
      {meetings.length === 0 ? <p className="empty">ยังไม่มีการประชุมที่บันทึกไว้ กดปุ่มไมโครโฟนด้านบนเพื่อเริ่ม</p> : (
        <div className="stack">
          {[...meetings].reverse().map(m => {
            const acts = (m.actions || []).map(normAction);
            const cal = calFor === m.id ? calItems(m) : null;
            const mine = pdf && pdf.m.id === m.id;
            return (
              <article key={m.id} className="mtg">
                <div className="row between" style={{ alignItems: 'flex-start' }}>
                  <div>
                    <h3>{m.topic || 'การประชุม'}</h3>
                    <p className="hint small">{thDate(m.date)}{m.time ? ` · ${m.time} น.` : ''}{m.projectId ? ` · ${projLabel(s, m.projectId)}` : ''}{m.attendees ? ` · ${m.attendees}` : ''}</p>
                  </div>
                  <div className="row">
                    <button className="btn btn-sm btn-ghost" onClick={() => edit(m)}>แก้ไข</button>
                    <button className="btn btn-sm btn-bad" onClick={() => remove(m)}>ลบ</button>
                  </div>
                </div>
                {(m.resolutions || []).length > 0 && <div><b className="small">✅ มติที่ประชุม</b><ol>{m.resolutions.map((r, i) => <li key={i}>{r}</li>)}</ol></div>}
                {acts.length > 0 && (
                  <div><b className="small">⚡ งานที่ต้องทำต่อ</b>
                    <ul className="checks">{acts.map((a, i) => (
                      <li key={i}>
                        <label>
                          <input type="checkbox" checked={a.done} onChange={() => toggleDone(m.id, i)} aria-label="ทำเสร็จแล้ว" />
                          <span className={a.done ? 'done' : ''}>{a.text}{a.owner && <b> — {a.owner}</b>}</span>
                        </label>
                        {!a.done && dueTag(a.due)}
                      </li>
                    ))}</ul>
                  </div>
                )}
                {m.next && m.next.date && <p className="small">📌 นัดครั้งถัดไป: {thLong(m.next.date)}{m.next.time ? ` ${m.next.time} น.` : ''}</p>}
                <div className="row mtg-foot">
                  <button className="btn btn-sm" onClick={() => setCalFor(calFor === m.id ? null : m.id)} aria-expanded={calFor === m.id}>📅 ลง Google Calendar</button>
                  <button className="btn btn-sm" onClick={() => makePdf(m)} disabled={pdf && pdf.busy}>{mine && pdf.busy ? 'กำลังสร้าง PDF…' : '📄 ทำ PDF รายงาน'}</button>
                  <button className="btn btn-sm" onClick={() => openLineShare(minutesText(m, s))}>💬 ส่งสรุปเข้า LINE</button>
                </div>
                {cal && (
                  <div className="subbox">
                    {cal.length === 0 ? <p className="hint">ยังไม่มีงานที่ระบุกำหนดเสร็จหรือวันนัด กด "แก้ไข" แล้วใส่วันที่ก่อน</p> : <>
                      <ul className="checks">{cal.map(it => (
                        <li key={it.uid}>
                          <span>{it.title}<span className="sub muted small">{thLong(it.date)}{it.time ? ` ${it.time} น.` : ' (ทั้งวัน)'}</span></span>
                          <a className="btn btn-sm" href={gcalUrl(it)} target="_blank" rel="noopener noreferrer">+ เพิ่ม</a>
                        </li>
                      ))}</ul>
                      <div className="row" style={{ marginTop: 10 }}>
                        <button className="btn btn-sm btn-primary" onClick={() => downloadBlob(new Blob([buildIcs(cal)], { type: 'text/calendar;charset=utf-8' }), `นัดหมาย-${m.date}.ics`)}>ดาวน์โหลดทั้งหมด (.ics)</button>
                        <span className="hint">ไฟล์ .ics ตั้งแจ้งเตือนล่วงหน้าให้แล้ว (งานทั้งวัน: 09:00 ของวันก่อนหน้า · นัดประชุม: 1 ชม. ก่อน)</span>
                      </div>
                    </>}
                  </div>
                )}
                {mine && pdf.file && <PdfShareBox pdf={{ file: pdf.file, name: pdf.file.name, text: minutesText(pdf.m, s) }} onClose={() => setPdf(null)} />}
              </article>
            );
          })}
        </div>
      )}
    </section>

    {pdf && pdf.busy && <div className="mdoc-host" aria-hidden="true"><div ref={docRef}><MinutesDoc m={pdf.m} s={s} /></div></div>}
  </>);
}

function MinutesDoc({ m, s }) {
  const acts = (m.actions || []).map(normAction);
  const res = m.resolutions || [];
  let n = 0;
  return (
    <div className="mdoc">
      <div className="mdoc-head">
        <div><b>บริษัท สุบรรณ ซีซี จำกัด</b><small>SUBAN CC CO., LTD.</small></div>
